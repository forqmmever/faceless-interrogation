}

// ============================================================
//  第四十轮 · 服装数值编辑器（暴露度 / 接受度）
//
//  改的是 `story.item_overrides`：只写「与代码内置值不同」的那几件。
//  游戏启动时 ScenarioData 读完 story.json 就调
//  OutfitData.apply_item_overrides() 原地覆盖，所以改完存盘、重启游戏即生效。
//
//  ★ 这里**只开放 exposure 与 acceptance_req 两个字段**。
//    槽位 / 标签 / 贴图改了会让贴图与门控对不上，不在编辑器里放开。
// ============================================================
// 「代码内置值」—— 用来标出「这件被改过」并支持一键还原。
//   ★ 兜底：老版本的 story.json 里没有 base_values 段，此时退回 catalog.items 里
//     那一件的当前值（那种文件里本来也还没有任何覆写，所以两者相等）。
function baseValueOf(id, f){
  const bv = ((story.catalog || {}).base_values || {})[id];
  if (bv && bv[f] !== undefined) return Number(bv[f]);
  const it = catalogItems().find(x => x.id === id);
  return it && it[f] !== undefined ? Number(it[f]) : null;
}
// 当前生效值：覆写写了就用它，否则用内置值
function effValueOf(id, f){
  const ov = ((story.item_overrides || {})[id] || {});
  if (ov[f] !== undefined && ov[f] !== null) return Number(ov[f]);
  const b = baseValueOf(id, f);
  return b === null ? 0 : b;
}
function catalogItems(){ return ((story.catalog || {}).items || []); }

function renderItemsEditor(main){
  main.append(h("h1", {text:"👕 服装数值"}));
  main.append(h("div", {class:"sub", text:"改每一件衣服的**暴露度**与**接受度门槛**。只写「跟代码内置值不同」的那几件 —— 没改过的不会在 story.json 里留痕。"}));

  main.append(h("div", {class:"sec"},
    h("div", {class:"sechead"}, h("span", {class:"t", text:"怎么读"})),
    h("div", {class:"secbody"}, h("div", {class:"help"},
      h("div", {}, "· ", h("b", {text:"暴露度"}), "：这身穿出去有多扎眼。它跟全套其它件的暴露值**相加**，跟「本关上限」比大小。允许 −1 ~ 12。"),
      h("div", {}, "· ", h("b", {text:"接受度"}), "：穿它需要多高的接受度门槛（接受度每关涨，跨局保留）。允许 0 ~ 99。"),
      h("div", {}, "· 灰字是**代码内置值**（scripts/OutfitData.gd 里的 ITEMS_BASE），改过的那一行会标黄，点 ", h("code", {text:"↺"}), " 单独还原。"),
      h("div", {}, "· 顶上的 ", h("code", {text:"↺ 全部还原"}), " 会清空这一页的全部改动。"),
      h("div", {}, "· 改完按 ", h("code", {text:"Ctrl+S"}), " 存盘，重启游戏生效 —— 不需要重烘贴图、不需要重编译。"),
      h("div", {}, "· 下架的槽位（外袍 / 耳饰 / 手套 / 头饰 / 穿环）也列出来，但灰色显示 —— 改了暂时看不出效果，等恢复那一栏就会生效。"),
    ))));

  const ov = story.item_overrides || (story.item_overrides = {});
  const n = overriddenItemCount();
  const bar = h("div", {class:"sec"},
    h("div", {class:"sechead"},
      h("span", {class:"t", text:"改动清单"}),
      h("span", {class:"cnt", text:n + " 件已改"})),
    h("div", {class:"secbody"},
      h("div", {class:"row"},
        h("input", {id:"itemSearch", class:"in", placeholder:"搜物品名 / id …",
          oninput:()=>{ itemFilter.q = $("itemSearch").value.trim().toLowerCase(); renderMain(); }}),
        h("label", {class:"chk"},
          h("input", {type:"checkbox", checked: itemFilter.onlyChanged ? "checked" : null,
            onchange:(e)=>{ itemFilter.onlyChanged = e.target.checked; renderMain(); }}),
          " 只看改过的"),
        n ? h("button", {class:"btn danger", onclick:()=>{
            if (!confirm("把 " + n + " 件服装的改动全部还原成代码内置值？")) return;
            story.item_overrides = {}; commit("items_reset_all"); markDirty(); renderAll();
            toast("已还原全部服装数值");
          }}, "↺ 全部还原") : null,
      )));
  main.append(bar);

  // 按槽位分组渲染
  const slots = ((story.catalog || {}).slots || []);
  const names = ((story.catalog || {}).slot_names || {});
  const disabled = ((story.catalog || {}).disabled_slots || []);
  const manual = ((story.catalog || {}).manual_slots || []);
  const bySlot = {};
  catalogItems().forEach(it => { (bySlot[it.slot] = bySlot[it.slot] || []).push(it); });

  let shown = 0;
  slots.forEach(slot => {
    let list = (bySlot[slot] || []);
    if (itemFilter.onlyChanged) list = list.filter(it => ov[it.id] && Object.keys(ov[it.id]).length);
    if (itemFilter.q){
      const q = itemFilter.q;
      list = list.filter(it => (String(it.name).toLowerCase().includes(q)) || (String(it.id).toLowerCase().includes(q)));
    }
    if (!list.length) return;
    shown += list.length;
    const offNote = disabled.includes(slot) ? " ← 已下架" : (manual.includes(slot) ? " ← 只能手动装备" : "");
    const body = h("div", {class:"secbody"});
    const head = h("div", {class:"irow items ihead"},
      h("span", {class:"iname", text:"物品"}),
      h("span", {class:"inum", text:"暴露度"}),
      h("span", {class:"inum", text:"接受度"}),
      h("span", {class:"iact", text:""}));
    body.append(head);
    list.forEach(it => body.append(itemRow(it, ov)));
    main.append(h("div", {class:"sec" + (disabled.includes(slot) ? " off" : "")},
      h("div", {class:"sechead"},
        h("span", {class:"t", text:(names[slot] || slot)}),
        h("span", {class:"cnt", text:list.length + " 件" + offNote})),
      body));
  });
  if (!shown) main.append(h("div", {class:"sub", text:"（没有匹配的物品）"}));
}

function itemRow(it, ov){
  const id = it.id;
  const changed = !!(ov[id] && Object.keys(ov[id]).length);
  const row = h("div", {class:"irow items" + (changed ? " changed" : "")});
  row.append(h("span", {class:"iname"},
    h("b", {text: it.name || id}),
    h("span", {class:"hint", text:" " + id})));
  ["exposure", "acceptance_req"].forEach(f => {
    const base = baseValueOf(id, f);
    const cur = effValueOf(id, f);
    const cell = h("span", {class:"inum"});
    const inp = h("input", {type:"number", class:"in num", value:String(cur),
      min: f === "exposure" ? "-1" : "0", max: f === "exposure" ? "12" : "99"});
    inp.addEventListener("change", () => {
      const v = parseInt(inp.value, 10);
      if (isNaN(v)) { toast("请输入整数"); renderMain(); return; }
      setItemOverride(id, f, v);
    });
    cell.append(inp);
    if (base !== null && cur !== base){
      cell.append(h("span", {class:"hint", title:"代码内置值 " + base, text:" ⟵ 内置 " + base}));
    }
    row.append(cell);
  });
  // 还原按钮：只在这一行真的改过时才画
  const act = h("span", {class:"iact"});
  if (changed){
    act.append(h("button", {class:"btn tiny", title:"把这一件还原成代码内置值", onclick:()=>{
      delete story.item_overrides[id];
      if (!Object.keys(story.item_overrides).length) story.item_overrides = {};
      commit("item_revert_" + id); markDirty(); renderAll();
    }}, "↺"));
  }
  row.append(act);
  return row;
}

// 写入一件物品的覆写。★ 与内置值相同就**删掉**这个字段 —— 保持 story.json 干净，
// 也保证「没改过的东西不在文件里留痕」这条语义成立。
function setItemOverride(id, field, val){
  const bv = baseValueOf(id, field);
  const ov = story.item_overrides || (story.item_overrides = {});
  const rec = ov[id] || (ov[id] = {});
  if (bv !== null && Number(bv) === Number(val)) delete rec[field];
  else rec[field] = val;
  if (!Object.keys(rec).length) delete ov[id];
  if (!Object.keys(ov).length) story.item_overrides = {};
  commit("item_" + id + "_" + field); markDirty(); renderMain(); renderStatus();
}

// ============================================================
//  第四十轮 · 原貌编辑器
//
//  两块，都写进 `story.true_presets`：
//    · pool     —— 随机池：开局从这几套**整套**里随机抽一套
//    · by_level —— 按关覆写：第 i 关强制换成这一套（没配的关 = 不覆写）
//
//  两块都空 = 完全走原来的「逐槽位从 TRUE_POOL 随机抽」逻辑（默认就是这样）。
//  ★ 一套里**只写几件也算数** —— 没写到的槽位继续按老逻辑随机抽。
//    所以「只想钉死上衣和下装」这种用法是允许的。
// ============================================================
var presetMode = "pool";      // "pool" | "by_level"
var presetSel = 0;            // 当前正在编辑第几套（by_level 模式下 = 第几轮）
// ★ 第四十一轮：原貌编辑器现在有两处入口 —— 全局那套、以及**每套背景**那一套。
//   切页时若 scope 变了就把选中项归零，免得「在背景 B 里选了第 3 套」带到全局页去。
var presetScope = "global";
var itemFilter = { q:"", onlyChanged:false };

function autoSlots(){
  const c = story.catalog || {};
  const dis = c.disabled_slots || [];
  const man = c.manual_slots || [];
  return (c.active_slots || []).filter(s => !man.includes(s) && !dis.includes(s));
}
// 某槽位在该套里可选的物品（下架的槽位没有候选）
function itemsOfSlot(slot, includeDisabled){
  const c = story.catalog || {};
  const dis = c.disabled_slots || [];
  if (!includeDisabled && dis.includes(slot)) return [];
  return catalogItems().filter(it => it.slot === slot);
}
// 这一件在不在「A 的原貌池」里（编辑器给个 ★ 标记）
function inTruePool(slot, id){
  const tp = (((story.catalog || {}).true_pool) || {})[slot] || [];
  return tp.includes(id);
}

function renderTrueAppEditor(main){
  main.append(h("h1", {text:"🎭 原貌"}));
    main.append(h("div", {class:"sec"},
      h("div", {class:"sechead"}, h("span", {class:"t", text:"★ 这是「默认值」—— 可以被单局覆写"})),
      h("div", {class:"secbody"}, h("div", {class:"help"},
        h("div", {}, "这一页配的是 ", h("b", {text:"四套背景共用的默认值"}), "。"
          + "开局会随机抽一套背景 —— 想让", h("b", {text:"某一套背景（也就是某一局）"}), "不一样，"
          + "就去「🎬 背景」页往下拉，在 ", h("b", {text:"⑦ 本局覆写"}), " 那一组里写。"),
        h("div", {}, "· 背景里写了", h("b", {text:"内容非空"}), " → 整份取代这里的默认值；", h("br"),
          "· 背景里没写 → 用这一页的。"),
      ))));

  main.append(h("div", {class:"sub", text:"A 长什么样 —— 也就是你这一局要伪装成的那个形象。原貌决定反差值怎么算（改动越少越危险），也决定情报台与相册说什么。"}));

  main.append(h("div", {class:"sec"},
    h("div", {class:"sechead"}, h("span", {class:"t", text:"两种用法"})),
    h("div", {class:"secbody"}, h("div", {class:"help"},
      h("div", {}, h("b", {text:"① 随机池"}), " —— 你手工设计 N 套原貌，开局从这几套里**整套**随机抽一套。",
        h("br"), "　", h("span", {class:"hint", text:"不改游戏机制，只是把「逐槽位乱抽」换成「从你设计的整套里抽」。适合让每一局都像样。"})),
      h("div", {}, h("b", {text:"② 按关覆写"}), " —— 指定第几关用哪一套。",
        h("br"), "　", h("span", {class:"hint", text:"同一局里，A 的样子会**逐关变化**（切关时原貌与情报一起换）。这是调试 / 做关卡设计的用法。"})),
      h("div", {}, "· 两种可以同时用：按关覆写**优先**，没配覆写的那一关走随机池（池子也空就退回原来的随机逻辑）。"),
      h("div", {}, "· 一套里", h("b", {text:"只写几件也算数"}), " —— 没写到的槽位继续按原逻辑随机抽。所以「只想钉死上衣和下装」是可以的。"),
      h("div", {}, "· 下拉里带 ", h("code", {text:"★"}), " 的是「本来就在原貌候选池里」的款 —— 选它更接近 A 会穿的东西（但不强制）。"),
      h("div", {}, "· 改完按 ", h("code", {text:"Ctrl+S"}), " 存盘，重启游戏生效。"),
    ))));

  presetEditor(main, story.true_presets || (story.true_presets = {}),

}

// ★ 第四十一轮：原貌编辑器的主体抽出来 —— 全局页与「每套背景」页共用它。
//   host      = {pool:[], by_level:[]} 那个对象（全局那份 / 某套背景那份）
//   levelCount= 要显示几轮（全局看关卡数；背景页看**本局几轮**）
//   scopeKey  = 用来区分「现在在编辑谁」，切页时把选中项归零
function presetEditor(main, host, levelCount, scopeKey){
  if (!host.pool) host.pool = [];
  if (!host.by_level) host.by_level = [];
  // 轮数变了就对齐（多了截掉、少了补 null）
  while (host.by_level.length < levelCount) host.by_level.push(null);
  if (host.by_level.length > levelCount) host.by_level.length = levelCount;
  if (presetScope !== scopeKey){ presetScope = scopeKey; presetSel = 0; }

  const pool = host.pool;
  const byLv = host.by_level;
  const configured = byLv.filter(x => x && x.slots && Object.keys(x.slots).length).length;

  main.append(h("div", {class:"sec"},
    h("div", {class:"sechead"}, h("span", {class:"t", text:"模式"})),
    h("div", {class:"secbody"},
      h("div", {class:"row"},
        h("button", {class:"btn" + (presetMode === "pool" ? " on" : ""),
          onclick:()=>{ presetMode = "pool"; presetSel = 0; renderMain(); }},
          "① 随机池（" + pool.length + " 套）"),
        h("button", {class:"btn" + (presetMode === "by_level" ? " on" : ""),
          onclick:()=>{ presetMode = "by_level"; presetSel = 0; renderMain(); }},
          "② 逐轮指定（" + configured + "/" + byLv.length + " 轮已配）"),
        h("span", {class:"hint", text: (presetSummaryOf(host) === "默认")
          ? "当前：完全走原来的随机抽法" : "当前：" + presetSummaryOf(host)}),
      ))));

  if (presetMode === "pool") renderPresetList(main, pool, "套", false);
  else renderPresetList(main, byLv, "轮", true);
}

// 一套预设的规模摘要（导航角标用全局那份；背景页里用 host 自己那份）
function presetSummaryOf(host){
  const pool = (host.pool || []).length;
  const lv = (host.by_level || []).filter(x => x && x.slots && Object.keys(x.slots).length).length;
  if (!pool && !lv) return "默认";
  const parts = [];
  if (pool) parts.push("池 " + pool + " 套");
  if (lv) parts.push("逐轮 " + lv + " 轮");
  return parts.join(" · ");
}

// 一列「套」：左边选，右边编辑选中的那一套
function renderPresetList(main, arr, unit, byLevel){
  const names = ((story.catalog || {}).slot_names || {});
  const listBox = h("div", {class:"secbody presetlist"});

  arr.forEach((e, i) => {
    const has = !!(e && e.slots && Object.keys(e.slots).length);
    const cnt = has ? Object.keys(e.slots).length : 0;
    const label = byLevel
      ? ("第 " + (i + 1) + " 轮" + (has ? "　" + (e.name || "") : ""))
      : ("套 " + (i + 1) + (e && e.name ? "　" + e.name : ""));
    listBox.append(h("div", {class:"navitem" + (presetSel === i ? " on" : "") + (has ? "" : " dim"),
      onclick:()=>{ presetSel = i; renderMain(); }},
      h("span", {text: label}),
      h("span", {class:"cnt", text: has ? (cnt + " 件") : "不覆写"})));
  });

  if (!byLevel){
    listBox.append(h("div", {class:"row"},
      h("button", {class:"btn", onclick:()=>{
        arr.push({name:"新的一套" + (arr.length + 1), slots:{}});
        presetSel = arr.length - 1; commit("preset_add"); markDirty(); renderAll();
      }}, "+ 加一套"),
      h("button", {class:"btn", onclick:()=>{
        if (!arr.length) { toast("还没有套可复制"); return; }
        const src = arr[presetSel] || {};
        arr.push({name:(src.name || "套") + " 副本", slots: JSON.parse(JSON.stringify(src.slots || {}))});
        presetSel = arr.length - 1; commit("preset_dup"); markDirty(); renderAll();
      }}, "复制当前这套"),
      h("button", {class:"btn danger", onclick:()=>{
        if (arr.length <= 1) { toast("至少留一套"); return; }
        if (!confirm("删掉「" + ((arr[presetSel] || {}).name || ("套 " + (presetSel + 1))) + "」？")) return;
        arr.splice(presetSel, 1); presetSel = Math.max(0, presetSel - 1);
        commit("preset_del"); markDirty(); renderAll();
      }}, "删掉这套"),
    ));
  } else {
    listBox.append(h("div", {class:"row"},
      h("button", {class:"btn", onclick:()=>{
        // 「关掉这一关的覆写」= 置回 null
        arr[presetSel] = null; commit("preset_level_clear"); markDirty(); renderAll();
        toast("第 " + (presetSel + 1) + " 轮改回「不覆写」");
      }}, "这一关改回「不覆写」"),
      h("button", {class:"btn", onclick:()=>{
        if (!arr[presetSel]) arr[presetSel] = {name:"第 " + (presetSel + 1) + " 轮", slots:{}};
        if (!arr[presetSel].slots) arr[presetSel].slots = {};
        // 一键塞满「原貌候选池里的第一件」—— 省得十几个槽位一个个点
        autoSlots().forEach(s => {
          const cand = (itemsOfSlot(s, false));
          const preferred = cand.filter(it => inTruePool(s, it.id));
          const pick = preferred[0] || cand[0];
          if (pick && !arr[presetSel].slots[s]) arr[presetSel].slots[s] = pick.id;
        });
        commit("preset_level_fill"); markDirty(); renderAll();
        toast("已按「原貌候选池」填满这一轮");
      }}, "按原貌池一键填满"),
    ));
  }

  main.append(h("div", {class:"sec"},
    h("div", {class:"sechead"},
      h("span", {class:"t", text: byLevel ? "哪一轮用哪一套" : "随机池里的套"}),
      h("span", {class:"cnt", text: arr.length + " " + unit})),
    listBox));

  // 右半：编辑选中的那一套
  const cur = arr[presetSel];
  if (!cur){
    main.append(h("div", {class:"sub", text: byLevel
      ? "第 " + (presetSel + 1) + " 轮目前是「不覆写」—— 它走随机池（池空则走原来的随机抽法）。点上面的按钮开始配。"
      : "这一套还没内容。"}));
    return;
  }
  if (!cur.slots) cur.slots = {};
  cur.name = cur.name || (byLevel ? ("第 " + (presetSel + 1) + " 关") : ("套 " + (presetSel + 1)));

  const card = h("div", {class:"sec"},
    h("div", {class:"sechead"},
      h("span", {class:"t", text:"名字"}),
      h("span", {class:"cnt", text: Object.keys(cur.slots).length + " / " + autoSlots().length + " 个槽位已指定"})),
    h("div", {class:"secbody"},
      h("div", {class:"row"},
        h("input", {class:"in", value: cur.name, placeholder:"给这一套起个名字（只影响编辑器显示）",
          onchange:(e)=>{ cur.name = e.target.value; commit("preset_name"); markDirty(); renderStatus(); }}),
        h("button", {class:"btn", onclick:()=>{ cur.slots = {}; commit("preset_clear"); markDirty(); renderAll(); }}, "清空这套"),
      )));
  main.append(card);

  const body = h("div", {class:"secbody"});
  body.append(h("div", {class:"irow picks ihead"},

function renderSection(spec, parentKey){
  const key = parentKey + "/" + spec.key;
  const folded = foldSet.has(key);
  const sec = h("div", {class:"sec" + (folded ? " fold" : "")});
  const body = h("div", {class:"secbody"});

  const count = () => {
    if (spec.kind === "object") return (spec.fields || []).length + " 项";
    if (spec.kind === "objlist") return (spec.arr() || []).length + " 条";
    if (spec.kind === "strlist") return (spec.arr() || []).length + " 条";
    if (spec.kind === "strmap" || spec.kind === "strarrmap") return Object.keys(spec.map() || {}).length + " 项";
    return "";
  };
  const head = h("div", {class:"sechead", onclick:()=>{
      if (foldSet.has(key)) foldSet.delete(key); else foldSet.add(key);
      sec.classList.toggle("fold");
    }},
    h("span", {class:"caret", text:"▾"}),
    h("span", {class:"t", text:spec.title}),
    h("span", {class:"n", text:count()}),
    h("span", {class:"sp"}),
  );
  sec.append(head, body);

  if (spec.kind === "object"){
    // spec.host 用来换「这一节挂在哪个对象上」——
    //   不写就是当前背景（bgOf()），写了就能编 story.rules / story.ui.title 这类旁支。
    //   结局文案挂在背景对象下的 endings 子对象上，靠字段里的 sub:"endings" 指过去。
    const host = spec.host ? spec.host() : bgOf();
    spec.fields.forEach(f => body.append(renderField(f, host, null, key)));
  } else if (spec.kind === "objlist"){
    body.append(renderObjList(spec, key, null));
  } else if (spec.kind === "strlist"){
    body.append(renderStrList(spec, key));
  } else if (spec.kind === "strmap"){
    body.append(renderStrMap(spec, key, false));
  } else if (spec.kind === "strarrmap"){
    body.append(renderStrMap(spec, key, true));
  }
  if (spec.hint) body.append(h("div", {class:"flabel"}, h("span", {class:"hint", text:spec.hint})));
  return sec;
}

// ---------- 字段 ----------
function renderField(spec, obj, itemPath, secKey){
  const wrap = h("div", {class:"field" + (spec.t === "area" ? "" : "")});
  if (spec.label){
    wrap.append(h("div", {class:"flabel"},
      h("span", {text:spec.label}),
      spec.k ? h("span", {class:"k", text:spec.k}) : null,
      spec.hint ? h("span", {class:"hint", text:spec.hint}) : null));
  }
  // spec.sub 用来编辑**嵌套对象**的字段（比如背景里的 companion.name）——
  // 没有它就只能把 companion 整块塞进顶层，结构会走样。
  // 注意：这里只**读**，不建空对象 —— 否则光是渲染就会给缺 companion 的背景
  // 塞一个空 {} 进去，一保存就把脏数据写回 story.json 了。
  const readHost = () => (spec.sub ? (obj && obj[spec.sub]) : obj) || null;
  const writeHost = () => {
    if (!spec.sub) return obj;
    if (!obj) return null;
    if (!obj[spec.sub]) obj[spec.sub] = {};
    return obj[spec.sub];
  };
  const host = readHost();
  const val = host ? host[spec.k] : undefined;

  if (spec.t === "text" || spec.t === "area"){
    const inp = spec.t === "area"
      ? h("textarea", {rows:spec.rows || 3})
      : h("input", {type:"text"});
    inp.value = val == null ? "" : String(val);
    if (spec.ro) { inp.readOnly = true; wrap.classList.add("ro"); }
    inp.addEventListener("input", () => {
      if (spec.ro) return;
      const w = writeHost();
      if (!w) return;
      if (w[spec.k] === inp.value) return;
      w[spec.k] = inp.value; commit("txt:" + (itemPath || "sec") + "." + (spec.sub ? spec.sub + "." : "") + spec.k); markDirty();
      if (spec.k === "name" && !spec.sub && view.kind === "bg") buildNav();
      if (itemPath && spec._onTitle) spec._onTitle();
    });
    wrap.append(inp);
  }
  else if (spec.t === "num"){
    const inp = h("input", {type:"number", step:spec.step || "0.5"});
    if (spec.min != null) inp.min = spec.min;
    // ★ `blankZero`：这个字段的 0 是「没写」的意思（比如反差值要求的「自动」），
    //   那就显示成空框 + 灰字提示，别让一个 0 看起来像「要求 0 分」。
    if (spec.blankDelete){
      // ★ 第四十一轮：`blankDelete` —— 空框 = 「这一项不覆写」（把这个键删掉）。
      //   与 `blankZero` 的区别：blankZero 是「0 就是没写」（比如反差要求的「自动」），
      //   而 blankDelete 是「**没有这个键**才算没写」—— 0 本身是一个有效值
      //   （比如最后一轮的 acceptance_gain 就可能是 0，那是「后面没关卡了」的意思）。
      inp.placeholder = spec.placeholder || "（不覆写 → 用全局）";
      inp.value = (val == null) ? "" : String(val);
    } else if (spec.blankZero){
      inp.placeholder = spec.placeholder || "自动";
      inp.value = (val == null || Number(val) === 0) ? "" : String(val);
    } else {
      inp.value = val == null ? "0" : String(val);
    }
    inp.addEventListener("input", () => {
      const w = writeHost();
      if (!w) return;
      if (spec.blankDelete && String(inp.value).trim() === ""){
        if (spec.k in w){
          delete w[spec.k];
          commit("num:" + (itemPath || "sec") + "." + spec.k); markDirty();
        }
        return;
      }
      w[spec.k] = num(inp.value, 0); commit("num:" + (itemPath || "sec") + "." + (spec.sub ? spec.sub + "." : "") + spec.k); markDirty();
    });
    wrap.append(inp);
  }
  else if (spec.t === "bool"){
    const lab = h("label", {class:"flabel"});
    const cb = h("input", {type:"checkbox"});
    cb.checked = !!val;
    cb.addEventListener("change", () => {
      const w = writeHost();
      if (!w) return;
      w[spec.k] = cb.checked; commit(); markDirty();
    });
    lab.append(cb, h("span", {text:"是"}));
    wrap.append(lab);
  }
  else if (spec.t === "strlist"){
    // 字段级字符串数组（比如 combo_keys / option_letters）——
    // 复用的还是 renderStrList，只是把「数组从哪来」换成 host[k]。
    const w = writeHost();
    const cur = w ? w[spec.k] : undefined;
    if (!Array.isArray(cur)){
      wrap.append(h("div", {class:"empty", text:"（还没有这个列表）"}));
      wrap.append(h("div", {class:"addrow"},
        h("button", {text:"＋ 建立列表", onclick:()=>{
          const ww = writeHost(); if (!ww) return;
          ww[spec.k] = spec.defaults ? spec.defaults.slice() : [""];
          commit(); markDirty(); renderAll();
        }})));
    } else {
      wrap.append(renderStrList({ arr:()=>cur, rows:spec.rows || 1, blank:spec.blank || "" },
        (itemPath || "sec") + "." + (spec.sub ? spec.sub + "." : "") + spec.k));
    }
  }
  else if (spec.t === "select"){
    const sel = h("select");
    const fill = () => {
      const opts = spec.opts ? spec.opts() : [];
      sel.innerHTML = "";
      let found = false;
      opts.forEach(o => {
        const op = h("option", {value:o.v, text:o.l});
        if (String(o.v) === String(val == null ? "" : val)) { op.selected = true; found = true; }
        sel.append(op);
      });
      if (!found && val !== undefined && val !== null){
        const op = h("option", {value:val, text:"⚠ " + val + "（已失效的引用）"});
        op.selected = true; sel.prepend(op);
      }
    };
    fill();
    sel.addEventListener("change", () => {
      const w = writeHost();
      if (!w) return;
      w[spec.k] = sel.value; commit(); markDirty();
      // 选项依赖别的字段（比如同行者选项的 value 依赖 fact）→ 重刷本条目
      if (itemPath && spec._refresh) spec._refresh();
    });
    wrap.append(sel);
  }
  else if (spec.t === "multiselect"){
    // 勾选组：值是**字符串数组**，选项从给好的池子里挑（衣物 id / 标签 / 槽位）。
    //   用它是因为「强制穿哪几件」「缺陷用哪些标签」这类字段手打 id 必错。
    const cur = Array.isArray(val) ? val.slice() : [];
    const write = () => {
      const w = writeHost();
      if (!w) return;
      w[spec.k] = cur.slice();
      commit("ms:" + (itemPath || "sec") + "." + spec.k); markDirty();
      if (itemPath && spec._refresh) spec._refresh();
    };
    const box = h("div", {class:"msbox"});
    const filter = h("input", {type:"text", placeholder:"筛选用（id / 名称）"});
    const list = h("div", {class:"mslist"});
    const opts = spec.opts ? spec.opts() : [];
    const render = () => {
      const q = (filter.value || "").trim().toLowerCase();
      list.innerHTML = "";
      let shown = 0;
      // 已经选中的永远显示（哪怕被筛掉了），否则改不回来
      const all = opts.slice();
      cur.forEach(v => { if (!all.some(o => String(o.v) === String(v))) all.push({v:v, l:"⚠ " + v + "（不在目录里）"}); });
      all.forEach(o => {
        const v = String(o.v);
        const on = cur.some(x => String(x) === v);
        const hay = (v + " " + (o.l || "")).toLowerCase();
        if (!on && q && !hay.includes(q)) return;
        shown++;
        const cb = h("input", {type:"checkbox"});
        cb.checked = on;
        cb.addEventListener("change", () => {
          const i = cur.findIndex(x => String(x) === v);
          if (cb.checked){ if (i < 0) cur.push(v); }
          else if (i >= 0) cur.splice(i, 1);
          write(); render();
        });
        list.append(h("label", {class:"msitem" + (on ? " on" : "")}, cb, h("span", {text:(o.l || v)})));
      });
      if (!shown) list.append(h("div", {class:"empty", text:"（没有匹配的）"}));
    };
    filter.addEventListener("input", render);
    render();
    if (opts.length > 14) box.append(filter);
    box.append(list);
    wrap.append(box);
  }
  else if (spec.t === "objlist"){
    // 嵌套清单：字段本身就是一张小清单（比如「强制穿着」每一关下面的若干条规则）。
    //   直接复用 renderObjList —— 所以嵌套的那一层照样能加 / 删 / 上下移。
    const w = writeHost();
    if (!w) return wrap;
    if (!Array.isArray(w[spec.k])) w[spec.k] = [];
    const arr = w[spec.k];
    wrap.append(renderObjList({
      arr: () => arr,
      fields: spec.fields || [],
      fieldsFor: spec.fieldsFor || null,
      titleOf: spec.titleOf || ((it, i) => "条目 " + (i + 1)),
    }, (itemPath || "sec") + "." + (spec.sub ? spec.sub + "." : "") + spec.k, null));
  }
  return wrap;
}

// ---------- objlist ----------
function renderObjList(spec, path, owner){
  const box = h("div");
  const arr = spec.arr ? spec.arr(owner) : [];
  if (!Array.isArray(arr)) return box;
  if (!arr.length) box.append(h("div", {class:"empty", text:"（空 —— 点下面加一条）"}));

  arr.forEach((item, i) => {
    const key = path + "/" + i;
    const fields = spec.fieldsFor ? spec.fieldsFor(item, i) : spec.fields;
    const itemNode = h("div", {class:"item" + (openSet.has(key) ? "" : " fold"), "data-k":key});

    const titleEl = h("span", {class:"it", text:spec.titleOf ? spec.titleOf(item, i) : ("条目 " + (i + 1))});
    const refreshTitle = () => { titleEl.textContent = spec.titleOf ? spec.titleOf(item, i) : ("条目 " + (i + 1)); };

    const ops = h("div", {class:"ops"});
    if (spec.preview){
      ops.append(h("button", {title:"预览", text:"👁", onclick:(e)=>{
        e.stopPropagation();
        const pv = itemNode.querySelector(".pvhost");
        if (pv.classList.contains("on")){ pv.classList.remove("on"); pv.innerHTML = ""; }
        else { pv.classList.add("on"); pv.innerHTML = ""; pv.append(spec.preview(item, i)); }
      }}));
    }
    ops.append(h("button", {title:"上移", text:"↑", onclick:(e)=>{ e.stopPropagation();
      if (i > 0){ arr.splice(i - 1, 0, arr.splice(i, 1)[0]); commit(); markDirty(); renderAll(); } }}));
    ops.append(h("button", {title:"下移", text:"↓", onclick:(e)=>{ e.stopPropagation();
      if (i < arr.length - 1){ arr.splice(i + 1, 0, arr.splice(i, 1)[0]); commit(); markDirty(); renderAll(); } }}));
    ops.append(h("button", {title:"复制一份", text:"⧉", onclick:(e)=>{ e.stopPropagation();
      arr.splice(i + 1, 0, clone(item)); commit(); markDirty(); renderAll(); }}));
    ops.append(h("button", {class:"warn", title:"删除", text:"✕", onclick:(e)=>{ e.stopPropagation();
      if (!confirm("删除这一条？\n\n" + (spec.titleOf ? spec.titleOf(item, i) : ("条目 " + (i + 1))))) return;
      // ★ 第四十一轮：给 spec 一个「删之前」的钩子 —— 用来做**联动**。
      //   返回 false = 取消这次删除（钩子自己会弹确认 / 报原因）。
      //   典型用法：删掉一轮时，把「只属于那一轮」的题目一并删掉、
      //   把后面几轮的题目整体往前挪一轮（见 bgSections ③）。
      if (spec.onBeforeDelete && spec.onBeforeDelete(i, arr) === false) return;
      arr.splice(i, 1); commit(); markDirty(); renderAll(); }}));

    const head = h("div", {class:"itemhead", onclick:()=>{
      if (openSet.has(key)) openSet.delete(key); else openSet.add(key);
      itemNode.classList.toggle("fold");
    }}, h("span", {class:"caret", text:"▾"}), titleEl, h("span", {class:"sp"}), ops);

    const body = h("div", {class:"itembody"});
    const pvhost = h("div", {class:"pvhost"});
    fields.forEach(f => {
      const sp = Object.assign({}, f);
      sp._refresh = () => { rebuildBody(); refreshTitle(); buildNav(); };
      sp._onTitle = refreshTitle;
      body.append(renderField(sp, item, key, path));
    });
    body.append(pvhost);

    function rebuildBody(){
      const f2 = spec.fieldsFor ? spec.fieldsFor(item, i) : spec.fields;
      body.innerHTML = "";
      f2.forEach(f => {
        const sp = Object.assign({}, f);
        sp._refresh = () => { rebuildBody(); refreshTitle(); buildNav(); };
        sp._onTitle = refreshTitle;
        body.append(renderField(sp, item, key, path));
      });
      body.append(pvhost);
    }

    itemNode.append(head, body);
    box.append(itemNode);
  });

  const addRow = h("div", {class:"addrow"});
  addRow.append(h("button", {text:"＋ 新增一条", onclick:()=>{
    const b = spec.blank ? spec.blank() : {};
    arr.push(b);
    openSet.add(path + "/" + (arr.length - 1));
    commit(); markDirty(); renderAll();
    const el = document.querySelector('[data-k="' + path + "/" + (arr.length - 1) + '"]');
    if (el) el.scrollIntoView({block:"center"});
  }}));
  if (spec.noAdd) addRow.innerHTML = "";
  box.append(addRow);
  return box;
}

    ops.append(h("button", {text:"↑", onclick:()=>{ if (i > 0){ arr.splice(i - 1, 0, arr.splice(i, 1)[0]); commit(); markDirty(); renderAll(); } }}));
    ops.append(h("button", {text:"↓", onclick:()=>{ if (i < arr.length - 1){ arr.splice(i + 1, 0, arr.splice(i, 1)[0]); commit(); markDirty(); renderAll(); } }}));

// ---------- strmap / strarrmap ----------
function renderStrMap(spec, path, isArr){
  const box = h("div");
  const map = spec.map();
  const keys = Object.keys(map);
  if (!keys.length) box.append(h("div", {class:"empty", text:"（空）"}));
  keys.forEach(k => {
    const row = h("div", {class:"item", style:"padding:8px 9px"});
    row.append(h("div", {class:"flabel"},
      h("span", {class:"k", text:k}),
      h("span", {class:"hint", text:SLOT_CN[k] ? SLOT_CN[k] : ""})));
    if (isArr){
      const list = h("div");
      (map[k] || []).forEach((s, i) => {
        const r = h("div", {style:"display:flex;gap:6px;margin-bottom:5px;align-items:flex-start"});
        const inp = h("input", {type:"text"});
        inp.value = s == null ? "" : String(s);
        inp.addEventListener("input", () => { map[k][i] = inp.value; commit("txt:" + path + "." + k + "." + i); markDirty(); });
        r.append(inp, h("button", {class:"warn", text:"✕", onclick:()=>{
          map[k].splice(i, 1); commit(); markDirty(); renderAll(); }}));
        list.append(r);
      });
      list.append(h("button", {text:"＋ 来源", onclick:()=>{ (map[k] = map[k] || []).push(""); commit(); markDirty(); renderAll(); }}));
      row.append(list);
    } else {
      const ta = h("textarea", {rows:1});
      ta.value = map[k] == null ? "" : String(map[k]);
      const autosize = () => { ta.style.height = "auto"; ta.style.height = Math.max(32, ta.scrollHeight) + "px"; };
      autosize();
      ta.addEventListener("input", () => {
        map[k] = ta.value; commit("txt:" + path + "." + k); markDirty(); autosize();
        if (k in SLOT_CN && spec.key === "clue_frame" && !ta.value.includes("%s")) ta.style.borderColor = "var(--red)";
        else ta.style.borderColor = "";
      });
      row.append(ta);
    }
    box.append(row);
  });

  const missing = spec.missing ? spec.missing() : [];
  const addRow = h("div", {class:"addrow"});
  if (missing.length){
    addRow.append(h("button", {text:"＋ 补齐缺失的 " + missing.length + " 项", onclick:()=>{
      missing.forEach(k => { map[k] = isArr ? ["来源一", "来源二"] : "「他」"; });
      commit(); markDirty(); renderAll();
    }}));
  }
  // ★★ 第五十四轮：对称于 `missing` 的「多出来的项」提示。
  //   这一条原来挂在校验面板里（每次打开编辑器都刷一行），但它是**数据现状说明**
  //   而不是「你改坏了」—— 出厂数据本身就有 21 条这样的描述。
  //   挪到这一节里显示：信息不丢（就在你编辑这张表的地方），也不再淹没别的问题。
  const extra = spec.extra ? spec.extra() : [];
  if (extra.length){
    addRow.append(h("div", {class:"help", style:"margin-left:10px"},
      h("div", {}, "· 另有 ", h("b", {text:extra.length + " 项是多出来的"}), "："
        + extra.join("、")),
      h("div", {}, "　这些衣服不在原貌候选池里（原貌抽不到它们），所以这几条描述"
        + "**永远用不到**。留着不影响运行 —— 以后把这件衣服加进候选池，它就用上了。")));
  }
  addRow.append(h("button", {text:"＋ 自定义键", onclick:()=>{
    const k = prompt("新键名（英文，例如 neck_scarf）：");
    if (!k) return;
    map[k] = isArr ? ["来源一"] : "「他」"; commit(); markDirty(); renderAll();
  }}));
  box.append(addRow);
  return box;
}

// ============================================================
//  校验
// ============================================================
let valTimer = null;
function scheduleValidate(){
  clearTimeout(valTimer);
  valTimer = setTimeout(() => { validateNow(); renderIssues(); renderStatus(); }, 400);
}

function validateNow(){
  const out = [];
  const err = (m, v) => out.push({lv:"e", m, v});
  const warn = (m, v) => out.push({lv:"w", m, v});
  const bgs = story.backgrounds || [];
  const seen = new Set();

  if (!bgs.length) err("没有任何背景 —— 游戏会读不出场景");
  if (!(story.traits || []).length) err("没有任何审问者性情");

  bgs.forEach((bg, bi) => {
    const v = {kind:"bg", index:bi};
    const tag = "【" + (bg.name || bg.id || ("背景" + (bi + 1))) + "】";
    if (!bg.id) err(tag + " 缺少 id", v);
    if (seen.has(bg.id)) err(tag + " id 重复：" + bg.id, v);
    seen.add(bg.id);

    // ★★ 第五十三轮：**草稿背景只报一条提醒，不逐条校验内容**。
    //   理由：草稿是「新建的空白背景」，它的档案卡 / 题目 / 事实 / 短信本来就还没填 ——
    //   逐条校验会刷出几十条「缺这个缺那个」，把真正的问题淹掉。
    //   而且草稿**不参与游戏抽取、不进自动化测试**（`bgEnabled()`），
    //   所以它内容不全也不会造成实际后果。
    //   ★ 但 id / 重名这两条在上面照旧检查 —— 那是结构性问题，草稿也躲不过。
    if (!bgEnabled(bg)){
      warn(tag + " 还是草稿（未启用）—— 游戏不会抽到它，也不会进自动化测试。"
        + "内容填齐后在「① 基础信息」里勾上「★ 启用这一套」。", v);
      return;
    }

    // ★ 第五十五轮：题目来源 —— manual 时跳过「档案卡 / 事实」这一整套交叉检查
    const manual = bgQuestionsSource(bg) === "manual";

    if (!bg.name) warn(tag + " 没有背景名", v);
    // ★ 第五十六轮：自行编辑下 B / A 两个身份与 A 的真身名都不显示 —— 也就不再要求填。
    //   （它们只服务「档案卡归属判定」和「阶段二被认出」。）审讯官的**称呼**两模式都要 ——
    //   准备室顶栏、手机备忘录、短信联系人都靠它。
    if (!manual){
      if (!bg.cover_role) warn(tag + " 没有 cover_role（B 伪装的身份）", v);
      if (!bg.true_role) warn(tag + " 没有 true_role（A 的真实身份）", v);
      if (!bg.true_name) warn(tag + " 没有 true_name（A 的真身名字）—— 阶段二被认出来时会退回念 true_role", v);
    }
    if (!bg.intro) warn(tag + " 没有 intro（开场介绍）—— 开局那个浮动窗口会退回显示一行场景描写", v);
        // ★★ 第五十四轮：这里原来有一条「没有自己的关卡表 —— 会回落到全局那一份」的提醒。
    //   **删掉了** —— 空 = 回落全局是出厂常态（第 52 轮起每套背景的 `levels` 就是空的），
    //   每次打开编辑器都刷 4 条「你的数据没问题」的提醒，只会淹没真问题。
    //   要报的是「配了但条数与全局不一致」，那条在下面的轮次段里另有专门检查。

    const cardIds = new Set();
    (bg.cards || []).forEach(c => {
      if (!c.id) err(tag + " 有档案卡缺 id", v);
      if (cardIds.has(c.id)) err(tag + " 档案卡 id 重复：" + c.id, v);
      cardIds.add(c.id);
      if (c.owner !== "A" && c.owner !== "B") err(tag + " 卡片 " + c.id + " 的 owner 必须是 A 或 B", v);
      if (!c.text) warn(tag + " 卡片 " + c.id + " 内容是空的", v);
    });
    // ★ 第五十五轮：这两条「有没有 A 卡 / B 卡」只在「自动生成」模式下有意义 ——
    //   自行编辑模式本来就不要求建档案卡（用户口径：不用选身份档案卡、不分辨有没有雷区）。
    if (!manual){
      if (!(bg.cards || []).some(c => c.owner === "A")) warn(tag + " 一张 A 卡都没有 —— 盘问就没有雷区了", v);
      if (!(bg.cards || []).some(c => c.owner === "B")) warn(tag + " 一张 B 卡都没有", v);
    }

    const factIds = new Set();
    (bg.facts || []).forEach(f => {
      if (!f.id) err(tag + " 有事实缺 id", v);
      if (factIds.has(f.id)) err(tag + " 事实 id 重复：" + f.id, v);
      factIds.add(f.id);
      if ((f.values || []).length < 2) err(tag + " 事实 " + f.id + " 至少要 2 个版本（否则判定不了矛盾）", v);
      const vids = new Set();
      (f.values || []).forEach(x => {
        if (!x.id) err(tag + " 事实 " + f.id + " 有版本缺 id", v);
        if (vids.has(x.id)) err(tag + " 事实 " + f.id + " 版本 id 重复：" + x.id, v);
        vids.add(x.id);
        if (!x.label) warn(tag + " 事实 " + f.id + " 的版本 " + x.id + " 说法是空的", v);
      });
      if (!(f.prompts || []).filter(s => s).length) err(tag + " 事实 " + f.id + " 一条问法都没有", v);
    });

    // ---- 题目清单（★ 第二十九轮：一套统一的 schema）----
    //   判定的依据是**每个选项自己的 tone**，所以这里不再按「题目属于哪一类」
    //   分四段检查，只查三件事：引用存在、选项合法、每关的题量够不够。
    const TONES = new Set(["correct","leak","version","bluff","evade","silence","made_up"]);
    const qIds = new Set();
    const levelCount = (bg.levels || []).length || 4;
    const perLevel = {};
    (bg.questions || []).forEach((q, i) => {
      const label = tag + " 第 " + (i + 1) + " 道题";
      if (!q.id) err(label + " 缺 id（题目要能唯一识别，自动生成时尤其要紧）", v);
      else if (qIds.has(q.id)) err(label + " 的 id 和前面重复了：" + q.id, v);
      qIds.add(q.id);
      if (!q.text && !q.q) err(label + " 没有题面", v);

      const lv = Number(q.level);
      if (!Number.isInteger(lv))
        err(label + " 的「属于哪一关」必须是整数（-1 = 通用池），现在是 " + JSON.stringify(q.level), v);
      else if (lv !== -1 && (lv < 0 || lv >= levelCount))
        err(label + " 指向第 " + (lv + 1) + " 关，但这一局一共只有 " + levelCount + " 关", v);
      else perLevel[lv] = (perLevel[lv] || 0) + 1;

      // ★ 第五十五轮：manual 模式不查「题目挂在什么卡 / 什么事实下」——
      //   那套结构本来就不要求（用户口径：「不用检查题目挂在什么事实下，不分辨有没有雷区」）。
      if (!manual){
      if (q.card && !cardIds.has(q.card)) err(label + " 指向的档案卡 " + q.card + " 不存在", v);
      if (q.fact && !factIds.has(q.fact)) err(label + " 指向的事实 " + q.fact + " 不存在", v);
      // 同行者提问必须有一个「顶回去」的选项（指向官方口径）——
      // 否则这道题没有正解，玩家怎么答都是错的。
      if (q.fact && q.speaker === "companion") {
        const f = (bg.facts || []).find(x => x.id === q.fact) || {};
        const canon = ((f.values || [])[0] || {}).id || "";
        const hasTop = (q.options || []).some(o => o.tone === "version" && o.value === canon);
        if (canon && !hasTop)
          err(label + " 是同行者提问，却没有「顶回去」的选项（要有一个「某个版本」指向官方口径 " + canon + "）", v);
      }

      // 盲区题（既不挂卡、也不挂事实）：手里一点底都没有，只能靠「撒谎 / 回避 / 硬编」。
      // 三条一条都没有的话，这题就没有任何可选项 —— 直接卡死玩家。
      if (!q.card && !q.fact && q.speaker !== "companion") {
        const ts = (q.options || []).map(o => o.tone);
        if (!ts.includes("bluff") && !ts.includes("evade") && !ts.includes("made_up"))
          err(label + " 没挂卡也没挂事实（盲区题），却没有任何「撒谎 / 回避 / 硬编」选项 —— 这题没法答", v);
      }

      if (q.card && q.card in cardIds) {
        const c = (bg.cards || []).find(x => x.id === q.card) || {};
        const tones = new Set((q.options || []).map(o => o.tone));
        if (c.owner === "A" && !tones.has("leak"))
          warn(label + " 挂的是 A 卡，却没有「说漏嘴」选项 —— 这道题的雷区不见了", v);
        if (c.owner === "B" && !tones.has("correct") && !tones.has("version"))
          warn(label + " 挂的是 B 卡，却没有「照实答」选项", v);
      }
      }   // ← 结束 manual 的跳过块

      const opts = q.options || [];
      if (!opts.length) err(label + " 一个选项都没有 —— 盘问时它摆不出任何按钮", v);
      opts.forEach((o, oi) => {
        const ol = label + " 的第 " + (oi + 1) + " 个选项";
        // ★ 第五十六轮：manual 模式没有「这句话算哪一种」—— 不查类型，只看文本与怀疑值。
        if (!manual){
          if (!TONES.has(o.tone))
            err(ol + " 的类型「" + (o.tone || "（空）") + "」不是合法的七种之一（correct / leak / version / bluff / evade / silence / made_up）", v);
          if (!o.text && o.tone !== "silence")
            err(ol + " 没有文本（只有「沉默」允许留空 —— 那会用出厂那句）", v);
        } else if (!o.text){
          warn(ol + " 没有文本 —— 盘问时这个按钮会是空的（想写「沉默」就给个「（沉默）」）", v);
        }
        if (o.suspicion != null && typeof o.suspicion !== "number")
          err(ol + " 的怀疑值必须是数字（留空 = 用「照实答」的出厂值）", v);
        if (!manual && o.tone === "version"){
          if (!o.value) err(ol + " 类型是「某个版本」却没写 value", v);
          // ★ 第五十五轮：manual 模式本来就不挂事实 —— 那就不查版本表（也没表可查）
          else if (!q.fact){ if (!manual) err(ol + " 是「某个版本」但整道题没挂事实 —— 它无法参与跨关一致性检查", v); }
          else {
            const f = (bg.facts || []).find(x => x.id === q.fact) || {};
            const vals = new Set((f.values || []).map(x => x.id));
            if (!vals.has(o.value))
              err(ol + " 的 value「" + o.value + "」不在事实 " + q.fact + " 的版本表里", v);
          }
        }
      });
    });
    if (!(bg.questions || []).length) err(tag + " 一道题都没有", v);

    // 每关的题量：固定题 + 通用池 必须够得出该关要的题数
    const ppl = Number((story.rules || {}).questions_per_level) || 8;
    for (let li = 0; li < levelCount; li++){
      const fixed = perLevel[li] || 0;
      const pool = perLevel[-1] || 0;
      if (fixed + pool < ppl)
        warn(tag + " 第 " + (li + 1) + " 关最多只凑得出 " + (fixed + pool) + " 道题，比「每关 " + ppl + " 道」少 "
          + (ppl - fixed - pool) + " 道", v);
      if (fixed > ppl)
        warn(tag + " 第 " + (li + 1) + " 关写了 " + fixed + " 道固定题，比「每关 " + ppl + " 道」还多 —— 会全出", v);
    }
    if (!perLevel[-1])
      warn(tag + " 通用池是空的 —— 每关出了固定题之后没有可补的题", v);

    // ---- 主人公 ----
    if (!bg.interrogator) warn(tag + " 审讯官没有称呼 —— 准备室顶栏、手机备忘录、短信联系人都要用它", v);
    // ★ 第五十六轮：自行编辑下「审讯官的性别」这一栏不显示 —— 也就不查它的取值。
    if (!manual && GENDERS.every(g => g.v !== bg.interrogator_gender))
      err(tag + " 审讯官的性别必须是「男」或「女」（现在是「" + (bg.interrogator_gender || "空") + "」）", v);
    const cp = bg.companion;
    if (!cp || typeof cp !== "object") err(tag + " 缺少 companion —— 同行人 C 的信息整块没了", v);
    else {
      if (!cp.name) err(tag + " companion 没有 name", v);
      if (!manual && GENDERS.every(g => g.v !== cp.gender)) err(tag + " companion.gender 必须是「男」或「女」", v);
      // ★ 第五十五轮：「他和你的关系」「他是谁、知道什么」已从编辑器下线，
      //   空着也不再提醒 —— 提醒了也没有地方改（数据出厂就写好了）。
    }

    // ---- 短信：三组同构（★ 第五十五轮） ----
    //   `sms`（与朋友，揭示官方口径）/ `companion_sms`（与同行的人）/ `interrogator_sms`（与审问官）
    //   现在按**同一套规则**校验：id 唯一、有联系人、有对话、level 在轮次范围内、一关只来一条。
    //   只有「与朋友」多两条：每轮那条必须揭示本关要问的那条事实的官方口径。
    const factOrder = (bg.facts || []).map(f => f.id);
    const roundCount = (bg.levels || []).length || (story.levels || []).length || 2;
    SMS_GROUPS.forEach(gr => {
      const arr = bg[gr.field] || [];
      const nameOf = gr.label;
      const byLevel = new Map();
      const ids = new Set();
      arr.forEach((t, i) => {
        const where = tag + " " + nameOf + " 第 " + (i + 1) + " 条短信";
        if (!t.id) err(where + " 缺 id", v);
        else if (ids.has(t.id)) err(where + " 的 id 重复：" + t.id, v);
        ids.add(t.id);
        if (!t.contact) warn(where + " 没有联系人（列表里会显示「?」）", v);
        if (!(t.messages || []).length) err(where + " 一条消息都没有", v);
        (t.messages || []).forEach((m, mi) => { if (!m.text) warn(where + " 第 " + (mi + 1) + " 句是空的", v); });

        // 揭示口径：只有「与朋友」会用
        if (!gr.reveals && (t.reveals || []).length)
          warn(where + " 带了 reveals —— 游戏不会读它（这一组不给口径），删掉更干净", v);
        if (gr.reveals && !manual) (t.reveals || []).forEach((rv, ri) => {
          const f = (bg.facts || []).find(x => x.id === rv.fact);
          if (!f) err(where + " 第 " + (ri + 1) + " 条揭示指向了不存在的事实 " + rv.fact, v);
          else {
            const canon = (f.values || [])[0] ? f.values[0].id : "";
            if (!(f.values || []).some(x => x.id === rv.value))
              err(where + " 揭示的版本 " + rv.value + " 在事实 " + rv.fact + " 里不存在", v);
            else if (rv.value !== canon)
              warn(where + " 揭示的是「" + rv.value + "」而不是官方口径「" + canon + "」—— 玩家学到的口径会和判定不一致", v);
          }
        });

        const lv = t.level;
        if (typeof lv !== "number" || !Number.isInteger(lv))
          err(where + " 的 level 必须是整数（0 起，第几轮解锁），现在是「" + (lv === undefined ? "缺" : lv) + "」", v);
        else if (lv < 0 || lv >= roundCount)
          err(where + " 的 level = " + lv + " 越界（这一局只有 " + roundCount + " 轮，合法范围 0~" + (roundCount - 1) + "）", v);
        else {
          if (byLevel.has(lv)) err(tag + " 第 " + (lv + 1) + " 轮有两条「" + nameOf + "」的短信同时解锁（" + byLevel.get(lv) + " 和 " + t.id + "）—— 一轮只该来一条", v);
          byLevel.set(lv, t.id);
          if (gr.reveals && !manual){
            const wantFact = factOrder[lv];
            const gotFacts = (t.reveals || []).map(rv => rv.fact);
            if (!gotFacts.length)
              err(where + " 是第 " + (lv + 1) + " 轮解锁的那条，却什么都没揭示 —— 玩家答不出本关的新问题", v);
            else if (wantFact && gotFacts.indexOf(wantFact) < 0)
              err(where + " 在第 " + (lv + 1) + " 轮解锁，但它揭示的是 [" + gotFacts.join("、") + "]，而本关要问的是 " + wantFact + " —— level 和 facts 的顺序没对齐", v);
          }
        }
      });
      if (!arr.length) warn(tag + " 「" + nameOf + "」一段短信都没有", v);
      for (let i = 0; i < roundCount; i++)
        if (!byLevel.has(i)) warn(tag + " 「" + nameOf + "」第 " + (i + 1) + " 轮没有解锁的短信", v);
    });

    // 每个 fact 是否都有短信教它（只在「自动生成」模式下有意义）
    if (!manual) (bg.facts || []).forEach(f => {
      const taught = (bg.sms || []).some(t => (t.reveals || []).some(rv => rv.fact === f.id));
      if (!taught) warn(tag + " 事实 " + f.id + " 没有任何短信揭示它 —— 玩家只能靠瞎猜", v);
    });

    if (!(bg.interference_lines || []).length) warn(tag + " 没有同行者干扰台词", v);
  });

  (story.traits || []).forEach((t, i) => {
    const v = {kind:"traits"};
    const tag = "【性情 " + (t.name || t.id || (i + 1)) + "】";
    if (!t.id) err(tag + " 缺 id", v);
    if (!t.name) err(tag + " 缺名字", v);
    if (["", "bluff", "evade"].indexOf(t.dangerous) < 0) err(tag + " dangerous 只能是 bluff / evade / 空", v);
    if (t.bluff_delta === undefined || t.bluff_delta === null) err(tag + " 缺 bluff_delta", v);
    if (t.evade_delta === undefined || t.evade_delta === null) err(tag + " 缺 evade_delta", v);
    if (!t.desc) warn(tag + " 没有描述", v);
    if (!t.hint) warn(tag + " 没有对策提示", v);
    if (!t.bluff_note) warn(tag + " 没有撒谎反馈文案", v);
    if (!t.evade_note) warn(tag + " 没有回避反馈文案", v);
    if (!t.memo) warn(tag + " 没有备忘录「性格」（手机备忘录第一条会缺一块）", v);
    if (!t.like) warn(tag + " 没有备忘录「喜好」", v);
    if (!t.hate) warn(tag + " 没有备忘录「忌讳」", v);
  });

  // ★ 第三十九轮：妙妙工具（catalog.manual_slots）是「只能手动装备」的一栏 ——
  //   它不进原貌，所以也不会出现在外貌情报里，不必要求它写句式与来源。
  const MANUAL_SLOTS = (story.catalog && story.catalog.manual_slots) || [];
  const CLUE_SLOTS = SLOTS.filter(s => !MANUAL_SLOTS.includes(s));
  const cf = story.clue_frame || {};
  CLUE_SLOTS.forEach(s => {
    if (!(s in cf)) err("外貌情报句式缺槽位 " + s + "（" + SLOT_CN[s] + "）", {kind:"global"});
    else if (!String(cf[s]).includes("%s")) err("槽位 " + s + " 的句式没有 %s —— 拼句子时游戏会报错", {kind:"global"});
  });
  const cs = story.clue_sources || {};
  CLUE_SLOTS.forEach(s => {
    if (!(s in cs)) err("外貌情报来源缺槽位 " + s + "（" + SLOT_CN[s] + "）", {kind:"global"});
    else if ((cs[s] || []).length < 2) warn("槽位 " + s + " 只有 " + (cs[s] || []).length + " 个来源，建议 ≥ 2", {kind:"global"});
  });
  const idsc = story.item_desc || {};
  POOL_IDS.forEach(id => {
    if (!(id in idsc)) err("衣物描述缺 " + id + " —— 抽到这件原貌时情报拼不出来", {kind:"global"});
  });
  // ★★ 第五十四轮：原来这里**逐条**报「衣物描述里多了一条 XXX（不在候选池里，永远用不到）」
  //   —— 出厂就有 21 条，一屏刷 21 行。
  //   ★ 现在**不再进校验面板**了 —— 它是「数据现状说明」而不是「你改坏了」，
  //     挂在这里等于每次打开都刷一条。改成在「📝 外貌情报 / 全局文本」页的
  //     衣物描述那一节里显示（见 `globalSections()` 的 `extra`），
  //     就在你编辑那张表的地方，信息不丢。
  //   ★ 判据本身是对的：`item_desc` 只用于「原貌的目击描述」（`clue_text`），
  //     而原貌只会从候选池（+ 按轮钉死那几件）里出，所以池外的描述确实用不到。
  if (!(story.photo_notes || []).length) warn("照片背面一句话都没有", {kind:"global"});

  // ---- 玩法数值（rules）----
  //   缺一个键不算错 —— 游戏会退回 DEFAULT_RULES。但类型错了（比如写成字符串）
  //   会让 rule_f() 读出 0，玩家会撞上「QTE 窗口 0 秒」这种莫名其妙的难度。
  const R = story.rules || {};
  rulesSections().forEach(sec => (sec.fields || []).forEach(f => {
    const val = R[f.k];
    const where = "数值 · " + stripNum(sec.title) + " · " + (f.label || f.k);
    if (val === undefined || val === null){
      warn(where + " 缺 " + f.k + " —— 游戏会用出厂值", {kind:"rules"});
    } else if (f.t === "strlist"){
      if (!Array.isArray(val) || !val.length) err(where + "（" + f.k + "）必须是非空数组", {kind:"rules"});
      else if (f.k === "combo_keys"){
        val.forEach(s => {
          if (!/^[A-Za-z0-9]$/.test(String(s)))
            warn("组合键位里的「" + s + "」不是单个字母 / 数字 —— Godot 认不出来时会退回 J/K/L", {kind:"rules"});
        });
      }
    } else if (typeof val !== "number" || !isFinite(val)){
      err(where + "（" + f.k + "）必须是数字，现在是「" + val + "」", {kind:"rules"});
    }
  }));
  const ck = R.combo_keys;
  const ckLen = R.combo_len;
  if (Array.isArray(ck) && typeof ckLen === "number" && ck.length !== ckLen)
    warn("组合键位有 " + ck.length + " 个，但「组合干扰要敲几个键」写的是 " + ckLen + " —— 对不上时游戏会整组退回 J/K/L", {kind:"rules"});
  if (typeof R.expr_qte_boost === "number" && typeof R.expr_qte_decay === "number" && R.expr_qte_boost <= R.expr_qte_decay)
    warn("按住时涨的（" + R.expr_qte_boost + "）不大于松手时掉的（" + R.expr_qte_decay + "）—— QTE 会变成永远压不过去", {kind:"rules"});
  if (typeof R.contradiction_limit === "number" && R.contradiction_limit < 1)
    warn("前后矛盾上限是 " + R.contradiction_limit + " —— 等于一次都不允许，第 1 次矛盾就直接判负", {kind:"rules"});

  // ---- 界面文案（ui）----
  // ★★ 第七十四轮（用户口径）：「将现在编辑器中提醒会退回出厂文案和界面上会留下空白的地方
  //   全部去掉，不再需要填入文字」——
  //   所以**空着 / 缺键都不再提醒**：这些文案都有出厂兜底（`ScenarioData.DEFAULT_UI`），
  //   空着游戏照跑；界面上那些空标签也会自动收起（见 Main._build_title_screen）。
  //   只留「真会拼崩」的检查：**带占位符的**那一栏空着 / 丢了 %s，游戏拼参数时会出错。
  //   ★ 结局文案（endings）那批不动 —— 用户明确说「会退回出厂模板那一句的地方不用管」。
  const U = story.ui || {};
  uiSections().forEach(sec => (sec.fields || []).forEach(f => {
    const g = U[sec.seg] || {};
    const val = g[f.k];
    const where = "界面文案 · " + stripNum(sec.title) + " · " + (f.label || f.k);
    if (val === undefined || val === null) return;
    if (f.t === "strlist"){
      if (!Array.isArray(val) || !val.length) err(where + "（" + sec.seg + "." + f.k + "）必须是非空数组", {kind:"ui"});
      return;
    }
    if (!String(val).length){
      // 空着本身不是问题（有出厂兜底、界面会收起空标签）——
      // 但**带占位符**的那句空着会 `"" % 参数` 直接报错，这条必须留着。
      if (f.ph) err(where + " 是空的 —— 这句带占位符，空着游戏拼参数时会崩", {kind:"ui"});
      return;
    }
    if (f.ph && !String(val).includes("%"))
      err(where + " 丢了占位符（%s / %d）—— 游戏拼这句话时参数会对不上", {kind:"ui"});
  }));

  // ---- 手机（★ 第五十五轮：并入的那一半，原 phone_editor 的校验搬过来）----
  if (!story.phone || typeof story.phone !== "object"){
    err("缺少 phone 段 —— 手机页整块缺失（会全部用出厂文案）", {kind:"phone", page:"shell"});
  } else {
    Object.keys(PHONE_SEGS).forEach(name => {
      const meta = PHONE_PAGES.find(p => p.key === name) || {title:name};
      const data = story.phone[name] || {};
      PHONE_SEGS[name].forEach(f => {
        const where = "手机 · " + meta.title + " · " + f.label;
        const val = data[f.k];
        const v = {kind:"phone", page:name};
        const want = PH_EXPECT[name + "." + f.k];
        // ★★ 第七十四轮：空着不再提醒（有出厂兜底）。**带占位符**的那几栏空着照样算错。
        if (val === undefined || val === null || val === ""){
          if (want !== undefined && want > 0)
            err(where + " 是空的 —— 这栏带占位符，空着游戏拼参数时会崩", v);
          return;
        }
        const got = countPh(val);
        if (want === undefined){
          // 只提醒「真的写成了 %s / %d」的情况 —— 状态栏那种 🔋78% 是百分号，不是占位符
          if (got > 0) warn(where + " 不是模板，但里面写了 " + got
            + " 个 %s / %d 这类占位符 —— 游戏不会替换它，会原样印出来", v);
        } else if (got !== want){
          err(where + " 需要 " + want + " 个占位符，现在有 " + got
            + " 个 —— 格式化会失败，这句话会拼不出来", v);
        }
      });
    });
  }

  // ---- 结局文案（endings）—— 每个背景一套 ----
  bgs.forEach((bg, bi) => {
    const tag = "【" + (bg.name || bg.id || ("背景" + (bi + 1))) + "】";
    const v = {kind:"endings", index:bi};
    // ★ 第五十三轮：草稿背景跳过 —— 空草稿的 endings 是 `{}`，
    //   逐条校验会为 27 条结局各刷一条「是空的」提醒（上面背景内容那段同理）。
    if (!bgEnabled(bg)) return;
    const E = bg.endings;
    if (!E || typeof E !== "object"){ err(tag + " 没有 endings —— 整局结束时的话会全部用出厂模板", v); return; }
    endingsSections().forEach(sec => (sec.fields || []).forEach(f => {
      const val = E[f.k];
      const where = tag + " 结局 · " + (f.label || f.k) + "（" + f.k + "）";
      if (val === undefined || val === null || String(val) === ""){
        warn(where + " 是空的 —— 会退回出厂模板那一句", v);
      } else if (f.ph && !String(val).includes("%")){
        err(where + " 丢了占位符（%s / %d）—— 结局画面会拼不出那句话", v);
      }
    }));
  });

  // ------------------------------------------------------------
  //  第二十三轮那四段的校验
  //   这几段都是「改了立刻影响玩法」的东西，写坏了玩家会卡在某一关过不去，
  //   所以这里查得比剧情严：越界、引用不存在的衣服、规则空着都算错。
  // ------------------------------------------------------------
  const LV = {kind:"levels"}, FO = {kind:"forced"}, QT = {kind:"qte"}, DF = {kind:"defects"};

  // ---- 关卡表 ----
  const lvs = story.levels;
  if (lvs !== undefined){
    if (!Array.isArray(lvs)) err("levels 必须是数组", LV);
    else {
      if (!lvs.length) err("关卡表是空的 —— 一局会一关都没有。要恢复出厂的四关就把 levels 整个删掉。", LV);
      // ★ 第二十九轮：「留空 = 自动」—— 先把整条曲线解析出来，再校验。
      //   解析规则与游戏端 OutfitData._resolve_contrast_req 完全一致：
      //     留空 → 上一关的最终值 + step；第 1 关留空 → base；手写的值成为后面自增的新起点。
      const reqBase = Number((story.rules || {}).contrast_req_base) || 20;
      const reqStep = Number((story.rules || {}).contrast_req_step) || 10;
      const resolved = [];
      {
        let prev = reqBase;
        lvs.forEach((l, i) => {
          const raw = (l || {}).contrast_req;
          const given = (raw == null) ? 0 : Number(raw);
          prev = (given > 0) ? given : (i > 0 ? prev + reqStep : reqBase);
          resolved[i] = prev;
        });
      }
      lvs.forEach((l, i) => {
        const tag = "【第 " + (i + 1) + " 关】";
        if (!l || typeof l !== "object"){ err(tag + " 不是一个对象", LV); return; }
        if (!l.name) warn(tag + " 没有名字", LV);
        const rawReq = l.contrast_req;
        if (rawReq != null && typeof rawReq !== "number") err(tag + " 的 contrast_req 必须是数字（留空 = 自动）", LV);
        else if (typeof rawReq === "number" && rawReq < 0) err(tag + " 的反差要求是负数", LV);
        if (typeof l.acceptance_gain !== "number") err(tag + " 的 acceptance_gain 必须是数字", LV);
        else if (l.acceptance_gain < 0) err(tag + " 的接受度加成是负数（过关反而扣接受度）", LV);
        // 单调性：按**解析后**的值比 —— 留空的关也会跟着抬，所以曲线永远是递增的；
        // 只有「手写值低于上一关」才会翻车。
        if (i > 0 && resolved[i] < resolved[i - 1])
          warn(tag + " 的反差要求（" + resolved[i] + (rawReq > 0 ? "，手写" : "，自增") + "）比上一关（"
            + resolved[i - 1] + "）还低 —— 曲线反了", LV);
      });
      // ★★ 第五十四轮：这里原来有一条「最后一关还在给接受度 —— 给了也用不上」的提醒。
      //   **删掉了 —— 它的判据是错的**：通关那一步走的也是 `RunData.advance_level()`
      //   （`Main._on_overlay_pressed()` 的 `last_level` 分支），而 `advance_level()`
      //   里有 `ProfileData.add_gain(gain)` —— 接受度是**跨局保留**的，
      //   所以最后一轮给的接受度照样进账号，下一局开局就更宽松。不是白给。
      // ★★ 第五十四轮：**这条「理论上界」原来是错的，整个重算。**
      //
      //   错在哪儿：它把「每件衣服的 `contrast` 字段」按槽位取最大值再求和。
      //   但第 49 轮把反差的口径改成了 **`Σ|你穿的这件 − 原貌这件| × 倍率`** ——
      //   单件反差**不再是一个固定值**（它取决于原貌那件穿的是什么），
      //   所以「按槽位取 max(contrast)」算出来的 78（再被 `acc2 = 6` 这个旧起点
      //   削到 59 / 77）与真实口径完全无关。它会把 125 / 150 这种**有解**的曲线
      //   报成「一定无解」，属于**误导性告警**（比没有告警更糟）。
      //
      //   正确口径的上界，只用两条事实就能推：
      //     ① `|a − b| ≤ a + b` → Σ|你 − 原貌| ≤ Σ你 + Σ原貌
      //     ② 「你穿的暴露值合计」≤ 这一轮的暴露值上限 `cap = 10 + 接受度 × 2`
      //   于是 **反差 ≤ 倍率 × (cap + Σ原貌)**。
      //   `Σ原貌` 取「原貌候选池里每槽位最大暴露之和」—— 原貌只会从候选池
      //   （以及按轮钉死的那几件）里出，所以这是它的上界。
      //
      //   ★ 这个上界是**安全**的（不会漏报无解），但**偏松** ——
      //     真正的可解性要跑 DP（游戏里的 `auto_complete_outfit`），编辑器算不了。
      //     所以它只拦「明显写飞了」的值，**没超上界不保证一定有解**。
      //   ★ 三个常量与 `OutfitData` 对齐：START_ACCEPTANCE 14 /
      //     EXPOSURE_BASE 10 / EXPOSURE_PER_ACCEPTANCE 2 —— 游戏侧改了要一起改。
      const cat = catItems().filter(x => !x.disabled);
      if (cat.length){
        const perExp = Number((story.rules || {}).contrast_per_exposure) || 5;
        const poolMax = {};
        Object.keys(TRUE_POOL).forEach(sl => (TRUE_POOL[sl] || []).forEach(id => {
          const it = cat.find(x => x.id === id);
          if (it) poolMax[sl] = Math.max(poolMax[sl] || 0, it.exposure || 0);
        }));
        const trueUpper = Object.keys(poolMax).reduce((a, k) => a + poolMax[k], 0);
        let acc2 = 14;
        lvs.forEach((l, i) => {
          const cap = 10 + acc2 * 2;
          const upper = perExp * (cap + trueUpper);
          if (resolved[i] > upper)
            warn("【第 " + (i + 1) + " 轮】反差要求 " + resolved[i]
              + (l.contrast_req > 0 ? "（手写）" : "（自增出来的）")
              + " 超过了这一轮的宽松上界 " + upper + "（暴露值上限 " + cap
              + " ＋ 原貌最多能贡献 " + trueUpper + "，再乘反差倍率 " + perExp
              + "）—— 这一轮一定无解", LV);
          acc2 += (typeof l.acceptance_gain === "number" ? l.acceptance_gain : 0);
        });
      }
    }
  }

  // ---- 强制穿着 ----
  const frs = story.forced_rules;
  const knownIds = new Set(catItems().filter(x => !x.disabled).map(x => x.id));
  if (frs !== undefined){
    if (!Array.isArray(frs)) err("forced_rules 必须是数组", FO);
    else {
      frs.forEach((e, i) => {
        const tag = "【强制穿着 · 第 " + (i + 1) + " 关】";
        if (!e || typeof e !== "object"){ err(tag + " 不是一个对象", FO); return; }
        if (["none", "random", "fixed"].indexOf(e.mode) < 0){
          err(tag + " 的 mode 必须是 none / random / fixed（现在是「" + (e.mode || "空") + "」）", FO);
          return;
        }
        if (e.mode !== "fixed"){
          if ((e.rules || []).length) warn(tag + " 选了「" + e.mode + "」，下面写死的规则不会生效", FO);
          return;
        }
        const rules = e.rules || [];
        if (!rules.length) warn(tag + " 选了「写死的规则」却一条都没写 —— 这一关等于没有强制要求", FO);
        rules.forEach((r, ri) => {
          const rtag = tag + " 规则 " + (ri + 1);
          if (["all", "any"].indexOf(r.pick) < 0) err(rtag + " 的 pick 必须是 all 或 any", FO);
          const items = r.items || [];
          if (!items.length){ err(rtag + " 一件衣服都没选", FO); return; }
          items.forEach(id => {
            if (!knownIds.has(id)) err(rtag + " 引用了不存在 / 已下架的衣物：" + id, FO);
          });
          // 同一槽位出现两次 = 一组里要求穿两件同部位的衣服，玩家做不到。
          // ★ 只对 "all" 组报错 —— "any" 组里同槽位两件**正是它的用法**
          //   （「超短皮裙 / 开衩短裙 里任选一件」，两条裙子本来就同槽位）。
          if (r.pick !== "any"){
            const slots = {};
            items.forEach(id => {
              const it = itemById(id);
              if (!it) return;
              if (slots[it.slot]) err(rtag + " 同时要求穿两件「" + it.slot_name + "」的衣服（"
                + slots[it.slot] + " 和 " + id + "）—— 同一个部位穿不了两件", FO);
              else slots[it.slot] = id;
            });
          } else {
            // "any" 组里同槽位两件是正常写法，只提一句让作者心里有数
            const seenSlot = {};
            const dup = [];
            items.forEach(id => {
              const it = itemById(id);
              if (!it) return;
              if (seenSlot[it.slot]) dup.push(id);
              else seenSlot[it.slot] = id;
            });
            if (dup.length) warn(rtag + " 的「任选一件」里有同部位的两件（" + dup.join("、")
              + "）—— 这不算错，玩家只能挑其中的一件", FO);
          }
        });
      });
      if (frs.length && lvs !== undefined && Array.isArray(lvs) && frs.length !== lvs.length)
        warn("强制穿着写了 " + frs.length + " 关，而关卡表有 " + lvs.length + " 关 —— 多出来的用不上，少的那几关按「没有要求」算", FO);
    }
  }

  // ---- QTE 计划 ----
  const qps = story.qte_plan;
  const QTES = ["auto", "none", "expression", "interference", "combo"];
  if (qps !== undefined){
    if (!Array.isArray(qps)) err("qte_plan 必须是数组", QT);
    else {
      qps.forEach((e, i) => {
        const tag = "【QTE 计划 · 第 " + (i + 1) + " 题】";
        if (!e || typeof e !== "object"){ err(tag + " 不是一个对象", QT); return; }
        if (QTES.indexOf(e.qte) < 0) err(tag + " 的 qte 只能是 " + QTES.join(" / ") + "（现在是「" + (e.qte || "空") + "」）", QT);
        if (e.delay !== undefined && typeof e.delay !== "number") err(tag + " 的 delay 必须是数字", QT);
        if (typeof e.delay === "number" && e.delay > 20) warn(tag + " 的延迟有 " + e.delay + " 秒 —— 玩家多半在它出现前就把题答完了", QT);
      });
      const per = (story.rules || {}).questions_per_level;
      if (typeof per === "number" && qps.length > per)
        warn("QTE 计划写了 " + qps.length + " 道题，但一关只问 " + per + " 道 —— 后面 "
          + (qps.length - per) + " 行永远用不上", QT);
    }
  }

  // ---- 身体缺陷 ----
  const dfs = story.defects;
  const knownTags = new Set(catTags());
  if (dfs !== undefined){
    if (!Array.isArray(dfs)) err("defects 必须是数组", DF);
    else {
      if (!dfs.length) warn("缺陷表是空的 —— 「缺陷遮挡」这个玩法就没了（准备室不会再要求遮任何东西）", DF);
      const ids = new Set();
      dfs.forEach((d, i) => {
        const tag = "【缺陷 · " + (d && (d.name || d.id) || ("第 " + (i + 1) + " 项")) + "】";
        if (!d || typeof d !== "object"){ err(tag + " 不是一个对象", DF); return; }
        if (!d.id) err(tag + " 缺少 id", DF);
        else if (ids.has(d.id)) err(tag + " id 重复：" + d.id, DF);
        else ids.add(d.id);
        if (!d.name) warn(tag + " 没有给玩家看的名字", DF);
        const tags = d.cover_tags || [];
        if (!Array.isArray(tags)) err(tag + " 的 cover_tags 必须是数组", DF);
        else {
          if (!tags.length) warn(tag + " 没有遮挡标签 —— 这处缺陷永远露着，玩家怎么穿都会被发现", DF);
          tags.forEach(t => { if (!knownTags.has(t)) err(tag + " 引用了不存在的标签：" + t + "（可用："
            + Array.from(knownTags).join(" / ") + "）", DF); });
        }
      });
    }
  }

  // ---------- 第四十轮：服装数值 / 原貌 两段的校验 ----------
  const VI = {kind:"items"};
  const VT = {kind:"trueapp"};
  const cat = story.catalog || {};
  const itemList = (cat.items || []);
  const byId = {};
  itemList.forEach(it => { byId[it.id] = it; });
  const baseVals = cat.base_values || {};

  const ov = story.item_overrides;
  if (ov !== undefined && ov !== null && typeof ov !== "object")
    err("item_overrides 必须是对象（{物品 id: {exposure, acceptance_req}}）", VI);
  else if (ov && typeof ov === "object"){
    Object.keys(ov).forEach(id => {
      if (!byId[id]) { err("item_overrides 里有不存在的物品 id：" + id, VI); return; }
      const rec = ov[id];
      if (!rec || typeof rec !== "object"){ err("item_overrides[" + id + "] 必须是个对象", VI); return; }
      const b = baseVals[id] || {};
      ["exposure", "acceptance_req"].forEach(f => {
        if (rec[f] === undefined) return;
        if (typeof rec[f] !== "number" || !isFinite(rec[f]))
          err("item_overrides[" + id + "]." + f + " 必须是数字", VI);
        else if (f === "exposure" && (rec[f] < -1 || rec[f] > 12))
          err("item_overrides[" + id + "].exposure = " + rec[f] + " 超出 −1 ~ 12（游戏会忽略它）", VI);
        else if (f === "acceptance_req" && (rec[f] < 0 || rec[f] > 99))
          err("item_overrides[" + id + "].acceptance_req = " + rec[f] + " 超出 0 ~ 99（游戏会忽略它）", VI);
        else if (b[f] !== undefined && Number(b[f]) === Number(rec[f]))
          warn("item_overrides[" + id + "]." + f + " 与代码内置值相同 —— 这一条是多余的，删掉更干净", VI);
      });
      if (!Object.keys(rec).length) warn("item_overrides[" + id + "] 是空对象，可以删掉", VI);
    });
  }

  const tp = story.true_presets;
  if (tp !== undefined && tp !== null && typeof tp !== "object")
    err("true_presets 必须是对象（{pool: [...], by_level: [...]}）", VT);
  else if (tp && typeof tp === "object"){
    const checkPreset = (e, where) => {
      if (e === null || e === undefined) return;              // null = 不覆写，合法
      if (typeof e !== "object"){ err(where + " 必须是对象或 null", VT); return; }
      const slots = e.slots;
      if (slots === undefined) return;                        // 还没配内容，合法
      if (typeof slots !== "object" || Array.isArray(slots)){
        err(where + " 的 slots 必须是对象（{槽位: 物品 id}）", VT); return;
      }
      const keys = Object.keys(slots);
      if (!keys.length) warn(where + " 一个槽位都没指定 —— 等同于不覆写", VT);
      keys.forEach(s => {
        const id = slots[s];
        const it = byId[id];
        if (!it){ err(where + " 指定了不存在的物品：" + id, VT); return; }
        if (it.slot !== s) err(where + " 把「" + (it.name || id) + "」（属于 " + it.slot
          + " 槽）放进了 " + s + " 槽 —— 游戏会忽略这一项", VT);
      });
    };

    const pool = tp.pool;
    if (pool !== undefined && !Array.isArray(pool)) err("true_presets.pool 必须是数组", VT);
    else if (Array.isArray(pool)){
      if (pool.length === 1) warn("随机池里只有 1 套 —— 每局都会抽到同一套，等于固定原貌", VT);
      pool.forEach((e, i) => checkPreset(e, "随机池第 " + (i + 1) + " 套"));
    }
    const byLv = tp.by_level;
    if (byLv !== undefined && !Array.isArray(byLv)) err("true_presets.by_level 必须是数组", VT);
    else if (Array.isArray(byLv)){
      const nLv = (story.levels || []).length || 4;
      if (byLv.length !== nLv) warn("true_presets.by_level 有 " + byLv.length
        + " 项，而关卡数是 " + nLv + " —— 多出来的会被忽略，少掉的按「不覆写」处理", VT);
      byLv.forEach((e, i) => checkPreset(e, "第 " + (i + 1) + " 关"));
    }

    // ★★ 第五十四轮：删掉了「「按关覆写」生效时 A 的样子会逐轮变化 —— 这是设计意图」
    //   那条常驻提醒。理由：它是**设计说明**，不是**问题** —— 放在校验面板里
    //   会让人以为数据有毛病，而且出厂就是按轮钉死原貌，等于每次打开都刷一条。
    //   这段说明本来就写在「🎬 背景」页的「⑦ 本局覆写 · 怎么读」里，位置更合适。
  }

  // ---------- 第四十一轮：背景级「本局流程覆写」的校验 ----------
  //   五项都可空（空 = 用全局那份），所以这里只在**写了**的时候检查合法性。
  const QTE_KINDS = ["auto", "none", "expression", "interference", "combo"];
  const FMODES = ["none", "random", "fixed"];
  const str0 = v => (v == null ? "" : String(v));
  (story.backgrounds || []).forEach((bg, bi) => {
    const VB = {kind:"bg", index:bi};
    const tag = "【" + (bg.name || bg.id || ("背景" + (bi + 1))) + "】";

    // ★ 第五十三轮：草稿背景跳过 —— 空草稿的 levels / forced_rules / qte_plan /
    //   defects / true_presets 都是空的，逐项校验会刷出一片「等同于用全局那套」的提醒。
    if (!bgEnabled(bg)) return;

    // ③ 本局几轮
    if (bg.levels !== undefined){
      if (!Array.isArray(bg.levels)) err(tag + " 的 levels 必须是数组", VB);
      else {
        // ★★ 第五十四轮：删掉「levels 是空数组 —— 等同于用全局那套轮次」这条提醒。
        //   空数组就是出厂状态（回落全局那套轮次），而且上面已经删掉了同义的
        //   「没有自己的关卡表」—— 两条规则报同一件事，且都不该报。
        bg.levels.forEach((lv, i) => {
          if (!lv || typeof lv !== "object"){ err(tag + " 第 " + (i+1) + " 轮不是一个对象", VB); return; }
          if (lv.contrast_req !== undefined && lv.contrast_req !== null
              && (typeof lv.contrast_req !== "number" || !isFinite(lv.contrast_req)))
            err(tag + " 第 " + (i+1) + " 轮的 contrast_req 必须是数字或留空", VB);
          if (lv.acceptance_gain !== undefined && lv.acceptance_gain !== null
              && (typeof lv.acceptance_gain !== "number" || !isFinite(lv.acceptance_gain)))
            err(tag + " 第 " + (i+1) + " 轮的 acceptance_gain 必须是数字或留空", VB);
        });
        // ★ 题目挂到「这一局不存在的轮次」上 → 那些题永远不会出现
        // ★★ 第五十四轮修：`n` 原来直接取 `bg.levels.length` —— 而**空数组 = 回落全局**，
        //   于是出厂那四套（levels 都是空的）算出来 n = 0，把每套的 6 道题全报成
        //   「属于第 N 轮，而这一局只打 0 轮 —— 它永远不会出现」（4 套 × 6 = 24 条假警告）。
        //   正确做法：本套没配就按**全局**的轮数算。
        const n = bg.levels.length || (story.levels || []).length;
        (bg.questions || []).forEach(q => {
          const lv = Number(q.level);
          if (lv >= n) warn(tag + " 的题目「" + (q.id || "?") + "」属于第 " + (lv + 1)
            + " 轮，而这一局只打 " + n + " 轮 —— 它永远不会出现", VB);
        });
      }
    }

    // ⑦ 强制穿着
    if (bg.forced_rules !== undefined){
      if (!Array.isArray(bg.forced_rules)) err(tag + " 的 forced_rules 必须是数组", VB);
      else bg.forced_rules.forEach((e, i) => {
        if (!e || typeof e !== "object"){ err(tag + " 强制规则第 " + (i+1) + " 条不是对象", VB); return; }
        if (!FMODES.includes(e.mode)) err(tag + " 强制规则第 " + (i+1) + " 条的 mode 只能是 "
          + FMODES.join(" / ") + "，现在写的是「" + e.mode + "」", VB);
        (e.rules || []).forEach((r, ri) => (r.items || []).forEach(id => {
          if (!byId[id]) err(tag + " 强制规则第 " + (i+1) + " 条引用了不存在的衣物：" + id, VB);
        }));
      });
    }

    // ⑦ QTE 计划
    if (bg.qte_plan !== undefined){
      if (!Array.isArray(bg.qte_plan)) err(tag + " 的 qte_plan 必须是数组", VB);
      else bg.qte_plan.forEach((e, i) => {
        if (!e || typeof e !== "object"){ err(tag + " QTE 计划第 " + (i+1) + " 条不是对象", VB); return; }
        const k = str0(e.qte);
        if (k && !QTE_KINDS.includes(k)) err(tag + " QTE 计划第 " + (i+1) + " 条的 qte 只能是 "
          + QTE_KINDS.join(" / ") + "，现在写的是「" + k + "」", VB);
      });
    }

    // ⑦ 身体缺陷
    if (bg.defects !== undefined){
      if (!Array.isArray(bg.defects)) err(tag + " 的 defects 必须是数组", VB);
      else {
        const seen = new Set();
        bg.defects.forEach((d, i) => {
          if (!d || typeof d !== "object"){ err(tag + " 缺陷第 " + (i+1) + " 项不是对象", VB); return; }
          const id = str0(d.id);
          if (!id) err(tag + " 缺陷第 " + (i+1) + " 项没有 id", VB);
          else if (seen.has(id)) err(tag + " 缺陷 id 重复：" + id, VB);
          else seen.add(id);
          (d.cover_tags || []).forEach(t => {
            if (!knownTags.has(t)) err(tag + " 缺陷「" + (d.name || id || i) + "」引用了不存在的标签："
              + t + "（可用：" + Array.from(knownTags).join(" / ") + "）", VB);
          });
          if (!(d.cover_tags || []).length) warn(tag + " 缺陷「" + (d.name || id || i)
            + "」没有遮挡标签 —— 这处缺陷永远露着", VB);
        });
      }
    }

    // ⑦ 原貌（逐轮）
    if (bg.true_presets !== undefined){
      if (bg.true_presets === null || typeof bg.true_presets !== "object")
        err(tag + " 的 true_presets 必须是对象（{pool, by_level}）", VB);
      else {
        const p = bg.true_presets.pool;
        const bl = bg.true_presets.by_level;
        if (p !== undefined && !Array.isArray(p)) err(tag + " 的 true_presets.pool 必须是数组", VB);
        if (bl !== undefined && !Array.isArray(bl)) err(tag + " 的 true_presets.by_level 必须是数组", VB);
        const check = (e, where) => {
          if (e === null || e === undefined) return;
          if (typeof e !== "object"){ err(where + " 必须是对象或 null", VB); return; }
          if (e.slots === undefined) return;
          if (typeof e.slots !== "object" || Array.isArray(e.slots)){
            err(where + " 的 slots 必须是对象（{槽位: 物品 id}）", VB); return;
          }
          Object.keys(e.slots).forEach(s => {
            const id = e.slots[s];
            const it = byId[id];
            if (!it){ err(where + " 指定了不存在的衣物：" + id, VB); return; }
            if (it.slot !== s) err(where + " 把「" + (it.name || id) + "」（属于 " + it.slot
              + " 槽）放进了 " + s + " 槽 —— 游戏会忽略这一项", VB);
          });
        };
        (Array.isArray(p) ? p : []).forEach((e, i) => check(e, tag + " 原貌随机池第 " + (i+1) + " 套"));
        (Array.isArray(bl) ? bl : []).forEach((e, i) => check(e, tag + " 原貌第 " + (i+1) + " 轮"));
        const n = (bg.levels || []).length || (story.levels || []).length || 0;
        if (Array.isArray(bl) && n && bl.length && bl.length !== n)
          warn(tag + " 的 true_presets.by_level 有 " + bl.length + " 项，这一局是 " + n
            + " 轮 —— 多出来的会被忽略、少掉的按「不覆写」处理", VB);
      }
    }

    // 出场序号：同一轮的固定题里，序号重复 → 提醒（重复时按清单先后决胜）
    const dupMap = {};
    (bg.questions || []).forEach(q => {
      const lv = Number(q.level);
      if (lv < 0 || q.order === undefined || q.order === null) return;
      const k = lv + "|" + q.order;
      (dupMap[k] = dupMap[k] || []).push(q.id || "?");
    });
    Object.keys(dupMap).forEach(k => {
      if (dupMap[k].length > 1)
        warn(tag + " 第 " + (Number(k.split("|")[0]) + 1) + " 轮里有 " + dupMap[k].length
          + " 道题的出场序号相同（" + k.split("|")[1] + "）："
          + dupMap[k].join(" / ") + " —— 它们之间按清单先后排", VB);
    });
  });

  issues = out;
}

function renderIssues(){
  const host = $("issues");
  if (!host) return;
  host.innerHTML = "";
  const e = issues.filter(x => x.lv === "e").length;
  const w = issues.length - e;
  const box = h("div", {class:"issbox"});
  const head = h("div", {class:"isshead " + (e ? "err" : (w ? "warn" : "good"))});
  head.append(h("span", {text: e ? "🚨 " + e + " 个错误" + (w ? " · " + w + " 个提醒" : "") :
    (w ? "⚠️ " + w + " 个提醒（不影响运行）" : "✅ 全部检查通过")}));
  const list = h("div", {class:"isslist", style:"display:none"});
  if (issues.length){
    head.append(h("span", {class:"sp", style:"flex:1"}));
    head.append(h("span", {class:"hint", text:"点击展开"}));
    head.addEventListener("click", () => {
      list.style.display = list.style.display === "none" ? "block" : "none";
    });
    issues.forEach(it => list.append(h("div", {class:"iss", onclick:()=>{
      if (it.v) go(it.v);
    }},
      h("span", {class:"lv " + it.lv, text: it.lv === "e" ? "错误" : "提醒"}),
      h("span", {class:"m", text: it.m}))));
  }
  box.append(head, list);
  host.append(box);
}

function renderStatus(){
  const e = issues.filter(x => x.lv === "e").length;
  const w = issues.length - e;
  $("st-file").textContent = fileName + (dirty ? " *" : "");
  const bgs = story.backgrounds || [];
  $("st-count").textContent =
    bgs.length + " 背景 / " +
    bgs.reduce((a,b)=>a+(b.sms||[]).reduce((x,t)=>x+(t.messages||[]).length,0),0) + " 条短信 / " +
    bgs.reduce((a,b)=>a+(b.questions||[]).length,0) + " 道题 / " +
    bgs.reduce((a,b)=>a+(b.companion_questions||[]).length,0) + " 条同行者提问";
  $("st-iss").textContent = e ? ("🚨 " + e + " 错误" + (w ? " · " + w + " 提醒" : "")) : (w ? ("⚠️ " + w + " 提醒") : "✅ 校验通过");
  $("st-iss").style.color = e ? "var(--red)" : (w ? "var(--amber)" : "var(--ok)");
}

// ---------- 回退常量导出 ----------
function exportGDScript(){
  const j = o => JSON.stringify(o, "\t", false).replace(/^/gm, "\t");
  // 结局文案：GDScript 里只有一份「模板」常量（DEFAULT_ENDINGS），
  // 每套背景各自的那一份是跟着 DEFAULT_BACKGROUNDS 走的。导出时取第 1 套当模板。
  const endTpl = ((story.backgrounds || [])[0] || {}).endings || {};
  const parts = [
    "const DEFAULT_BACKGROUNDS := " + j(story.backgrounds || []) + "",
    "const DEFAULT_TRAITS := " + j(story.traits || []) + "",
    "const DEFAULT_CLUE_FRAME := " + j(story.clue_frame || {}) + "",
    "const DEFAULT_CLUE_SOURCES := " + j(story.clue_sources || {}) + "",
    "const DEFAULT_ITEM_DESC := " + j(story.item_desc || {}) + "",
    "const DEFAULT_PHOTO_NOTES := " + j(story.photo_notes || []) + "",
    "# ---- 玩法数值（全局一套）----\nconst DEFAULT_RULES := " + j(story.rules || {}) + "",
    "# ---- 界面文案 ----\nconst DEFAULT_UI := " + j(story.ui || {}) + "",
    "# ---- 结局文案模板（取自第 1 套背景；每套背景各自的一份在上面 DEFAULT_BACKGROUNDS 里）----\nconst DEFAULT_ENDINGS := " + j(endTpl) + "",
  ];
  const text = parts.join("\n\n");
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const a = h("a", {href:URL.createObjectURL(blob), download:"ScenarioData_constants.gd"});
  document.body.append(a); a.click(); a.remove();
  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
  toast("已导出并尝试复制到剪贴板 —— 粘回 ScenarioData.gd 覆盖对应的 DEFAULT_* 常量", 4600);
}

// ---------- 快捷键 ----------
document.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === "s"){ e.preventDefault(); save(false); }
  else if (k === "z" && !e.shiftKey){ e.preventDefault(); undo(); }
  else if (k === "y" || (k === "z" && e.shiftKey)){ e.preventDefault(); redo(); }
  else if (k === "f"){ e.preventDefault(); $("search").focus(); }
  else if (k === "o"){ e.preventDefault(); openFile(); }
});

$("search").addEventListener("input", e => renderResults(e.target.value));
$("btn-open").addEventListener("click", openFile);
$("btn-save").addEventListener("click", () => save(false));
$("btn-saveas").addEventListener("click", () => save(true));
$("btn-gd").addEventListener("click", exportGDScript);
$("btn-undo").addEventListener("click", undo);
$("btn-redo").addEventListener("click", redo);

// ---------- 启动 ----------
(async function boot(){
  const seed = getSeed();
  if (seed){ loadStory(seed, "story.json（页面内置快照）", false); }
  const fetched = await tryFetch();
  if (fetched){
    loadStory(fetched.json, "data/story.json（已自动读取）", false);
    toast("已自动读取 " + fetched.from, 2600);
  } else if (!seed){
    $("main").append(h("div", {class:"empty", text:"没有内置数据，也没有读到 data/story.json —— 请点「📂 打开」选一个文件"}));
  } else {
    toast("这是页面内置的快照。点「📂 打开」选 data/story.json 可以拿到最新版本。", 3600);
  }
  // ★ 第四十一轮：把上次保存过的文件句柄捡回来 ——
  //   之后按 Ctrl+S 就能直接写回同一个文件，连对话框都不弹。
  //   ★ 这里**不**申请权限（浏览器要求用户手势），只登记一下；
  //     真正 requestPermission 的时机在 save() 里 —— 那本身就是手势。
  const h = await idbGet("story");
  if (h){
    rememberedHandle = h;
    fileName = h.name || fileName;
    updateFileInfo();
    toast("记得上次保存的是「" + (h.name || "?") + "」—— 按 Ctrl+S 会直接写回它", 4200);
  }
})();
</script>
