<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千面人 · 手机编辑器</title>
<style>
:root{
  --bg:#0e1015; --panel:#161a21; --panel2:#1d222c; --panel3:#242a36;
  --line:#2b3240; --line2:#3a4354;
  --fg:#e9edf4; --fg2:#b6becd; --dim:#7c869a;
  --amber:#e6a23c; --red:#f0554f; --ok:#4fc98a; --blue:#5aa9e6; --purple:#a98be0;
  --mono:"Cascadia Mono","Consolas","Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--fg); font:13px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--panel3);border-color:var(--line2)}
button.primary{background:#2c3d2f;border-color:#3f6a48;color:#bff0cf}
button.primary:hover{background:#354a39}
button.warn{background:#3d2b2b;border-color:#6a3f3f;color:#f5c0bd}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{
  font:inherit;color:var(--fg);background:#11141a;border:1px solid var(--line);
  border-radius:6px;padding:5px 8px;width:100%;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--amber);background:#0d1015}
textarea{resize:vertical;line-height:1.65;font-family:inherit}
input[type=number]{font-family:var(--mono)}
input[type=checkbox]{width:auto;accent-color:var(--amber)}
select{cursor:pointer}
::placeholder{color:#5b6376}

/* ---------- 顶栏 ---------- */
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-weight:700;letter-spacing:.5px;color:var(--purple);white-space:nowrap}
.brand small{color:var(--dim);font-weight:400;margin-left:6px;letter-spacing:0}
#fileinfo{color:var(--dim);font-size:12px;padding-left:10px;border-left:1px solid var(--line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fileinfo.dirty{color:var(--amber)}
.spacer{flex:1}

/* ---------- 主体 ---------- */
#body{flex:1;display:flex;min-height:0}
#side{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
#nav{overflow:auto;padding:6px;flex:1}
.navgroup{margin-bottom:8px}
.navhead{padding:5px 8px;color:var(--dim);font-size:11px;letter-spacing:1px}
.navitem{padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.navitem:hover{background:var(--panel2)}
.navitem.on{background:#2a2417;color:var(--amber);box-shadow:inset 2px 0 0 var(--amber)}
.navitem .cnt{margin-left:auto;color:var(--dim);font-size:11px;font-family:var(--mono)}

#main{flex:1;display:flex;min-width:0;min-height:0}
#form{flex:1;overflow:auto;padding:14px 18px 60px;min-width:0}
#form h1{font-size:16px;margin:0 0 4px}
#form .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
#pvcol{flex:0 0 384px;border-left:1px solid var(--line);background:#0b0d12;
  padding:14px;overflow:auto}
#pvcol .pvtitle{color:var(--dim);font-size:11px;letter-spacing:1px;margin-bottom:10px}

/* ---------- 区块 ---------- */
.sec{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.sechead{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel2);cursor:pointer}
.sechead:hover{background:var(--panel3)}
.sechead .t{font-weight:600}
.sechead .n{color:var(--dim);font-size:11px;font-family:var(--mono)}
.secbody{padding:12px}
.sec.fold .secbody{display:none}
.sec.fold .caret{transform:rotate(-90deg)}
.caret{display:inline-block;transition:transform .12s;color:var(--dim)}

/* ---------- 字段 ---------- */
.field{margin-bottom:11px}
.field:last-child{margin-bottom:0}
.flabel{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;color:var(--fg2);font-size:12px}
.flabel .k{font-family:var(--mono);color:var(--dim);font-size:11px}
.flabel .hint{color:#6b7488;font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid2>.field{margin-bottom:0}

/* ---------- 条目 ---------- */
.item{border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:8px}
.item.fold .itembody{display:none}
.itemhead{display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:pointer}
.itemhead:hover{background:var(--panel3)}
.itemhead .it{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itemhead .ops{display:flex;gap:3px;flex:0 0 auto}
.itemhead .ops button{padding:2px 6px;font-size:12px;background:transparent;border-color:transparent}
.itemhead .ops button:hover{background:var(--panel3);border-color:var(--line2)}
.itembody{padding:10px 11px 12px;border-top:1px solid var(--line)}
.badge{font-size:11px;padding:1px 6px;border-radius:20px;border:1px solid var(--line2);color:var(--dim);font-family:var(--mono)}
.badge.g1{color:#a0d8b0;border-color:#3f6a48}
.badge.g2{color:#f0d0a0;border-color:#6a5a3f}
.badge.g3{color:#f0a0a0;border-color:#6a3f3f}
.badge.g0{color:#9fc4e8;border-color:#3f5a6a}
.addrow{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--dim);padding:10px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs button.on{background:#2a2417;border-color:var(--amber);color:var(--amber)}

/* ---------- 手机预览 ---------- */
.phone{width:336px;border:2px solid #3d4250;border-radius:24px;background:#0e0f13;padding:9px;
  display:flex;flex-direction:column;gap:7px}
.phone .status{display:flex;align-items:center;gap:6px;font-size:11px;color:#b8bfcc}
.phone .status .sig{margin-left:auto;font-size:10px;color:#99a3b8}
.phone .screen{border:1px solid #2e3140;border-radius:15px;background:#16171d;padding:8px;
  min-height:392px;display:flex;flex-direction:column;gap:6px}
.phone .ptitle{font-size:13px;color:#e0e6f2}
.phone hr{border:none;border-top:1px solid #2b3240;margin:0}
.phone .body{display:flex;flex-direction:column;gap:7px;overflow:auto}
.phone .apps{display:flex;gap:4px}
.phone .apps div{flex:1;text-align:center;font-size:10px;padding:6px 2px;border-radius:7px;
  background:#1e212b;border:1px solid #333846;color:#8f96a6;white-space:nowrap;overflow:hidden}
.phone .apps div.on{background:#2b5485;border-color:#5494dc;color:#fff}
.phone .ghead{display:flex;align-items:center;gap:6px;font-size:11px}
.phone .ghead .l{flex:1;border-top:1px solid #2b3240}
.phone .ghint{font-size:9px;color:#707887}
.phone .ghint.empty{color:#8a7070}
.phone .row{background:#1e212b;border:1px solid #303645;border-radius:8px;padding:7px 8px;
  display:flex;gap:8px;align-items:flex-start}
.phone .row .av{font-size:20px;width:26px;text-align:center}
.phone .row .mid{flex:1;min-width:0}
.phone .row .nm{font-size:12px}
.phone .row .pv{font-size:10px;color:#808799;word-break:break-word}
.phone .row .go{font-size:11px;padding:2px 8px;border:1px solid #3a4152;border-radius:6px;color:#aab2c2}
.phone .hint{font-size:10px;color:#8c93a3;white-space:pre-wrap}
.phone .bub{max-width:82%;padding:6px 10px;border-radius:9px;font-size:11px;word-break:break-word}
.phone .bub.me{margin-left:auto;background:#295739;border:1px solid #3f6a48}
.phone .bub.them{background:#2b2e38;border:1px solid #3a4152}
.phone .bub.intr{background:#422121;border:1px solid #6a3f3f}
.phone .card{background:#1e212b;border:1px solid #303645;border-radius:8px;padding:7px 8px;font-size:11px}
.phone .card .h{color:#f5bd75;font-size:12px}
.phone .note{font-size:10px;color:#767e90}

/* ---------- 校验 ---------- */
#issues{margin-bottom:12px}
.issbox{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.isshead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel2);cursor:pointer;font-weight:600}
.isshead.err{color:var(--red)} .isshead.warn{color:var(--amber)} .isshead.good{color:var(--ok)}
.isslist{padding:8px 12px;max-height:300px;overflow:auto}
.iss{display:flex;gap:8px;padding:3px 0;font-size:12px;cursor:pointer;border-radius:4px}
.iss:hover{background:var(--panel2)}
.iss .lv{flex:0 0 42px;font-family:var(--mono);font-size:11px}
.iss .lv.e{color:var(--red)} .iss .lv.w{color:var(--amber)}
.iss .m{color:var(--fg2);word-break:break-word}

#status{flex:0 0 auto;display:flex;gap:14px;align-items:center;padding:5px 12px;background:var(--panel);
  border-top:1px solid var(--line);color:var(--dim);font-size:12px;font-family:var(--mono)}
#toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:#252c38;
  border:1px solid var(--line2);border-radius:8px;padding:9px 16px;opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:99;max-width:80vw;text-align:center}
#toast.on{opacity:1}
.help{padding:12px;color:var(--fg2);font-size:12px;line-height:1.9}
.help code{font-family:var(--mono);background:#11141a;padding:1px 5px;border-radius:4px;color:var(--amber)}
.help b{color:var(--fg)}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--fg2);margin-right:6px}
</style>
</head>
<body>

<header id="top">
  <div class="brand">千面人 · 手机编辑器<small>短信三组 / 备忘录 / 相册 / 备注 / 外壳</small></div>
  <div id="fileinfo">未打开文件</div>
  <div class="spacer"></div>
  <button id="btn-open" title="打开一个 story.json">📂 打开</button>
  <button id="btn-save" class="primary" title="Ctrl+S">💾 保存</button>
  <button id="btn-saveas">另存为…</button>
  <button id="btn-undo" title="Ctrl+Z">↶</button>
  <button id="btn-redo" title="Ctrl+Shift+Z">↷</button>
</header>

<div id="body">
  <aside id="side"><div id="nav"></div></aside>
  <main id="main">
    <div id="form"></div>
    <div id="pvcol">
      <div class="pvtitle">📱 实时预览 —— 游戏里长这样</div>
      <div id="pvhost"></div>
    </div>
  </main>
</div>

<footer id="status">
  <span id="st-file">—</span><span id="st-count"></span><span id="st-iss"></span>
</footer>
<div id="toast"></div>
<input type="file" id="fileinput" accept=".json,application/json" style="display:none">

只在旁边替老兵把话头往你身上引。"},"cover_role":"北境香料行商","true_role":"北环帮的联络人","true_name":"沈棠","levels":[{"name":"第一关 · 外栅栏哨位","derived_profile":"一个赶路的行商"},{"name":"第二关 · 查验棚","derived_profile":"手续齐全的香料贩子"},{"name":"第三关 · 哨所长官室","derived_profile":"有靠山的商队领队"},{"name":"第四关 · 关隘地牢前厅","derived_profile":"即将被放行的清白旅人"}],"cards":[{"id":"b_identity","topic":"身份","owner":"B","text":"我是北境香料行的行商，常年往返寒霜港与黑石山脉。"},{"id":"b_birth","topic":"来处","owner":"B","text":"寒霜港东侧旧城区，码头往上数第三条巷子。"},{"id":"b_goods","topic":"货品","owner":"B","text":"丁香、肉桂、肉豆蔻，偶尔捎带些北境的琥珀。"},{"id":"b_scar","topic":"手背的痕迹","owner":"B","text":"幼年在香料工坊帮工，被蒸煮锅的蒸汽烫的。"},{"id":"b_purpose","topic":"此行目的","owner":"B","text":"替东家送样品去公爵府邸，顺路讨去年欠下的货款。"},{"id":"a_signal","topic":"敲门暗号","owner":"A","text":"三长两短敲三下门板 —— 北环码头的接头信号。"},{"id":"a_contact","topic":"上线","owner":"A","text":"「灰隼」是我的上线，只在满月夜的老灯塔见面。"},{"id":"a_cargo","topic":"驮队夹层","owner":"A","text":"夹层里运的是禁运硝石，香料只是幌子。"},{"id":"a_brand","topic":"颈侧的烙印","owner":"A","text":"那是北环帮的入伙烙印，烧红的船锚铁按上去的。"},{"id":"a_debt","topic":"旧账","owner":"A","text":"去年冬天在寒霜港欠了「独眼」三百金，至今没还。"},{"id":"a_tunnel","topic":"密道","owner":"A","text":"黑石山脉北坡有条不走官道的雪洞，只有帮里人知道。"},{"id":"a_boss","topic":"帮里的规矩","owner":"A","text":"货丢了可以，名字漏了不行 —— 这是北环帮唯一一条死规矩。"}],"questions":[{"id":"q_b_birth","level":-1,"speaker":"interrogator","text":"你说你从寒霜港来。旧城区那股鱼腥味，现在还散得掉吗？","card":"b_birth","options":[{"text":"散不掉。码头往上数第三条巷子，一到夏天最难熬。","tone":"correct"},{"text":"鱼腥味？我走的时候那一片早就拆了。","tone":"bluff"},{"text":"这个……我不太想聊家乡的事。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_birth 卡，归属 B）"},{"id":"q_a_brand","level":-1,"speaker":"interrogator","text":"（他忽然前倾，目光钉在你领口）你颈侧那道印子 —— 我好像在哪儿见过。","card":"a_brand","options":[{"text":"那是北环帮的入伙烙印，烧红的船锚铁按上去的。","tone":"leak"},{"text":"胎记，生下来就有。","tone":"bluff"},{"text":"小时候烫的。我不想谈这个。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_brand 卡，归属 A）"},{"id":"q_b_scar","level":-1,"speaker":"interrogator","text":"把手套摘了。你手背上那片疤是怎么来的？","card":"b_scar","options":[{"text":"幼年在香料工坊帮工，被蒸煮锅的蒸汽烫的。","tone":"correct"},{"text":"打猎的时候被火燎了一下。","tone":"bluff"},{"text":"旧伤了，没什么好说的。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_scar 卡，归属 B）"},{"id":"q_a_cargo","level":-1,"speaker":"interrogator","text":"（翻着货单）你这驮队……夹层是做什么用的？","card":"a_cargo","options":[{"text":"夹层里运的是禁运硝石，香料只是幌子。","tone":"leak"},{"text":"防潮的。山里雨水重，香料受不得湿。","tone":"bluff"},{"text":"夹层？我不太清楚，那是东家置办的。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_cargo 卡，归属 A）"},{"id":"q_b_purpose","level":-1,"speaker":"interrogator","text":"这趟进公爵府，你到底是来做什么的？","card":"b_purpose","options":[{"text":"替东家送样品去公爵府邸，顺路讨去年欠下的货款。","tone":"correct"},{"text":"来见一位老朋友，私事。","tone":"bluff"},{"text":"……就是些生意上的往来。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_purpose 卡，归属 B）"},{"id":"q_a_contact","level":-1,"speaker":"interrogator","text":"（压低声音）你在北边，跟谁搭线？","card":"a_contact","options":[{"text":"「灰隼」是我的上线，只在满月夜的老灯塔见面。","tone":"leak"},{"text":"跟几个香料行的掌柜，都是正经买卖。","tone":"bluff"},{"text":"我不明白您在问什么。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_contact 卡，归属 A）"},{"id":"q_b_goods","level":-1,"speaker":"interrogator","text":"你这一车货，都运的什么？","card":"b_goods","options":[{"text":"丁香、肉桂、肉豆蔻，偶尔捎带些北境的琥珀。","tone":"correct"},{"text":"布匹和铁器，都是不值钱的东西。","tone":"bluff"},{"text":"货单上写着，您自己看吧。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_goods 卡，归属 B）"},{"id":"q_a_debt","level":-1,"speaker":"interrogator","text":"去年冬天，你在寒霜港欠了谁的钱？","card":"a_debt","options":[{"text":"欠了「独眼」三百金，至今没还。","tone":"leak"},{"text":"我从不在外头赊账。","tone":"bluff"},{"text":"我不记得有这么回事。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_debt 卡，归属 A）"},{"id":"q_fact_origin_new","level":0,"speaker":"interrogator","text":"你说你从寒霜港来 —— 具体在城里哪一片？","fact":"origin","options":[{"text":"寒霜港东侧旧城区，码头往上数第三条巷子","tone":"version","value":"harbor"},{"text":"黑石山脚下的小镇，离官道不远","tone":"version","value":"inland"},{"text":"北境靠冻原的边地，一年有半年在下雪","tone":"version","value":"north"}],"note":"事实题：本关新问的「origin」"},{"id":"q_fact_origin_recall","level":-1,"speaker":"interrogator","text":"（他忽然换了个问法）你老家，是在水边还是山里？","fact":"origin","recall":true,"options":[{"text":"寒霜港东侧旧城区，码头往上数第三条巷子","tone":"version","value":"harbor"},{"text":"黑石山脚下的小镇，离官道不远","tone":"version","value":"inland"},{"text":"北境靠冻原的边地，一年有半年在下雪","tone":"version","value":"north"}],"note":"事实题：跨关复问「origin」（哪一关复问由运行时决定）"},{"id":"q_fact_goods_new","level":1,"speaker":"interrogator","text":"你这一车都运的什么货？","fact":"goods","options":[{"text":"丁香、肉桂、肉豆蔻，偶尔捎带些北境的琥珀","tone":"version","value":"spice"},{"text":"布匹和铁器，都是不值钱的粗货","tone":"version","value":"cloth"},{"text":"药材为主，还有些南边来的蜜饯","tone":"version","value":"medicine"}],"note":"事实题：本关新问的「goods」"},{"id":"q_fact_goods_recall","level":-1,"speaker":"interrogator","text":"（翻着货单）香料之外，还捎带别的吗？","fact":"goods","recall":true,"options":[{"text":"丁香、肉桂、肉豆蔻，偶尔捎带些北境的琥珀","tone":"version","value":"spice"},{"text":"布匹和铁器，都是不值钱的粗货","tone":"version","value":"cloth"},{"text":"药材为主，还有些南边来的蜜饯","tone":"version","value":"medicine"}],"note":"事实题：跨关复问「goods」（哪一关复问由运行时决定）"},{"id":"q_fact_purpose_new","level":2,"speaker":"interrogator","text":"这趟进关，你是来做什么的？","fact":"purpose","options":[{"text":"替东家送样品，顺路讨去年欠下的货款","tone":"version","value":"deliver"},{"text":"来见一位老朋友，私事","tone":"version","value":"visit"},{"text":"想在这儿找个长期买主，把线铺开","tone":"version","value":"work"}],"note":"事实题：本关新问的「purpose」"},{"id":"q_fact_purpose_recall","level":-1,"speaker":"interrogator","text":"（合上本子）说重点 —— 你来这儿图什么？","fact":"purpose","recall":true,"options":[{"text":"替东家送样品，顺路讨去年欠下的货款","tone":"version","value":"deliver"},{"text":"来见一位老朋友，私事","tone":"version","value":"visit"},{"text":"想在这儿找个长期买主，把线铺开","tone":"version","value":"work"}],"note":"事实题：跨关复问「purpose」（哪一关复问由运行时决定）"},{"id":"q_fact_scar_new","level":3,"speaker":"interrogator","text":"你手背上这片疤，怎么弄的？","fact":"scar","options":[{"text":"幼年在香料工坊帮工，被蒸煮锅的蒸汽烫的","tone":"version","value":"workshop"},{"text":"打猎的时候被火燎了一下","tone":"version","value":"hunt"},{"text":"年轻时候跟人动手，被油灯砸的","tone":"version","value":"fight"}],"note":"事实题：本关新问的「scar」"},{"id":"q_fact_scar_recall","level":-1,"speaker":"interrogator","text":"（盯着你的手）这印子，是烫的还是划的？","fact":"scar","recall":true,"options":[{"text":"幼年在香料工坊帮工，被蒸煮锅的蒸汽烫的","tone":"version","value":"workshop"},{"text":"打猎的时候被火燎了一下","tone":"version","value":"hunt"},{"text":"年轻时候跟人动手，被油灯砸的","tone":"version","value":"fight"}],"note":"事实题：跨关复问「scar」（哪一关复问由运行时决定）"},{"id":"q_companion_origin","level":0,"speaker":"companion","text":"「大人，我这位同伴是黑石山脚那边来的吧？我记得他提过。」","fact":"origin","plant":"审讯官没接话，只是把「黑石山」三个字也写进了册子 —— 现在他手里有两个版本。","options":[{"text":"「你记错了。我从寒霜港来，码头往上第三条巷子。」","tone":"version","suspicion":-2.0,"value":"harbor"},{"text":"「……对，山脚那边。」","tone":"version","suspicion":16.0,"value":"inland"},{"text":"「我不太想聊家乡。」","tone":"evade","suspicion":6.0}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_goods","level":1,"speaker":"companion","text":"「说起来，您那车货 —— 是布匹吧？我记得您说过。」","fact":"goods","plant":"「货单」两个字被他咬得很轻 —— 审讯官翻页的手停了一下。","options":[{"text":"「是香料。丁香、肉桂、肉豆蔻，货单上写着。」","tone":"version","suspicion":-2.0,"value":"spice"},{"text":"「……也有几匹布。」","tone":"version","suspicion":16.0,"value":"cloth"},{"text":"「货的事，您看单子就好。」","tone":"evade","suspicion":6.0}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_purpose","level":2,"speaker":"companion","text":"「您这趟不是来见老朋友的吗？上回您跟我说的。」","fact":"purpose","plant":"审讯官把笔搁下看了你很久 —— 一个跑商的，行程里不该有说不清的部分。","options":[{"text":"「替东家送样品，顺路讨一笔旧账。」","tone":"version","suspicion":-2.0,"value":"deliver"},{"text":"「……也见个朋友。」","tone":"version","suspicion":16.0,"value":"visit"},{"text":"「私事，不方便讲。」","tone":"evade","suspicion":6.0}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_scar","level":3,"speaker":"companion","text":"「您手上那疤，是跟人动手落下的吧？看着就不像烫的。」","fact":"scar","plant":"「不像烫的」—— 这句话被原样记进了册子。他不下结论，只是留了个问号。","options":[{"text":"「幼年在香料工坊帮工，被蒸煮锅的蒸汽烫的。」","tone":"version","suspicion":-2.0,"value":"workshop"},{"text":"「……年轻时打过一架。」","tone":"version","suspicion":16.0,"value":"fight"},{"text":"「旧伤，没什么好说的。」","tone":"evade","suspicion":6.0}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_blind_border_0","level":0,"speaker":"interrogator","text":"上月十一，你在哪处落的脚？","setup":"档案里没有这一天 —— 你也没跟任何人提过。","options":[{"text":"「十一那天我在青石镇的悦来栈歇的，掌柜姓周。」","tone":"made_up"},{"text":"「十一……记不真切了，那阵子一直在赶路。」","tone":"bluff"},{"text":"「您问这个做什么？我得翻翻货单才想得起来。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_border_1","level":1,"speaker":"interrogator","text":"你左腕上那只银镯子，哪儿来的？","setup":"档案里没有镯子 —— 你腕上本来也没戴过。","options":[{"text":"「我娘留下的。出关前她塞给我的。」","tone":"made_up"},{"text":"「旧东西了，早不知道搁哪儿去了。」","tone":"bluff"},{"text":"「您看错了 —— 我不戴那些玩意儿。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_border_2","level":2,"speaker":"interrogator","text":"你这一路上，跟谁搭过伙？","setup":"档案里没写同伴 —— 你一直是一个人走的。","options":[{"text":"「有个姓吴的猎户，同行了三天，到北岔口就分了。」","tone":"made_up"},{"text":"「搭过一两回吧，路上碰见的，名字都没问。」","tone":"bluff"},{"text":"「跑单帮的，谁也不认谁。您问这个做什么？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_border_3","level":3,"speaker":"interrogator","text":"你靴子底下那层泥 —— 是从哪段路上带进来的？","setup":"档案里没有这一条 —— 你自己也说不清，连编都没处编。","options":[{"text":"「一路走一路沾，谁知道是哪段。」","tone":"bluff"},{"text":"「泥就是泥，您还能从泥里看出什么来？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"}],"interference_lines":["「说起来，大人 —— 我这位同伴的左手，好像一直不太方便呢。」","「他上次提到过一件事……啊，没什么，我记错了。」","（他忽然咳嗽了一声，把审讯官的视线引向你的领口）","「您不觉得他说话的腔调，不太像寒霜港那边的人吗？」","（他慢条斯理地把自己那只完好的手放到桌上，正好在你旁边）","「北边来的商人，手上一般不会有那种印子吧？」"],"facts":[{"id":"origin","prompts":["你说你从寒霜港来 —— 具体在城里哪一片？","（他忽然换了个问法）你老家，是在水边还是山里？"],"values":[{"id":"harbor","label":"寒霜港东侧旧城区，码头往上数第三条巷子"},{"id":"inland","label":"黑石山脚下的小镇，离官道不远"},{"id":"north","label":"北境靠冻原的边地，一年有半年在下雪"}]},{"id":"goods","prompts":["你这一车都运的什么货？","（翻着货单）香料之外，还捎带别的吗？"],"values":[{"id":"spice","label":"丁香、肉桂、肉豆蔻，偶尔捎带些北境的琥珀"},{"id":"cloth","label":"布匹和铁器，都是不值钱的粗货"},{"id":"medicine","label":"药材为主，还有些南边来的蜜饯"}]},{"id":"purpose","prompts":["这趟进关，你是来做什么的？","（合上本子）说重点 —— 你来这儿图什么？"],"values":[{"id":"deliver","label":"替东家送样品，顺路讨去年欠下的货款"},{"id":"visit","label":"来见一位 olor=#8a919c]背景[/color]  %s\n[color=#8a919c]你装成[/color]  %s\n\n[color=#f0a83c]下一关[/color]  %s\n接受度 [b]+%d[/b] → [b]%d[/b]（暴露值上限放宽到 [b]%d[/b]）\n反差值要求提高到 [b]%d[/b]\n\n[color=#8a919c]审讯官还是那个人 —— 他记忆里的「A」没有变，你已经查到的外貌情报也还在。要改的是打扮，不是身份。[/color]"},"questions_schema":"faceless-questions-v1"},{"id":"town_inn","name":"城镇驿站","venue":"官道旁的三层木楼。楼下马厩，楼上客房，中间是大堂与账房。","intro":"官道旁的三层木楼。\n楼下马厩里还拴着两匹没卸鞍的马，楼上客房大半空着。大堂中点着一盏昼灯，账房的算盘声一下一下，很规律。\n你背着琴箱走进去要一间房，柜台后的驿丞把你上下打量了一遍。\n他说登记簿上要写明来处与去向 —— 顺便，问了你几句题外话。\n\n跟你前后脚进店的还有个背琴的年轻人。他知道你是谁，也知道你在装谁。\n他不帮你，也不拆你 —— 他只是站在柜台旁边，时不时替驿丞，把你刚才的话头再接一句。","interrogator":"驿丞","interrogator_gender":"男","companion":{"name":"琴师·阿武","relation":"同台的琴师","gender":"男","desc":"驿站里跟你搭班卖艺的琴师。他听过你记谱用的暗号，知道你是公会的信使。他不会替你圆谎，只会在驿丞面前提起「你上回可不是这么说的」。"},"cover_role":"流浪琴师","true_role":"刺客公会的信使","true_name":"苏绾","levels":[{"name":"第一关 · 驿站门房","derived_profile":"一个落魄的卖艺人"},{"name":"第二关 · 大堂账房","derived_profile":"靠卖唱换宿的琴师"},{"name":"第三关 · 后院上房","derived_profile":"被某位贵人召见的乐师"},{"name":"第四关 · 驿丞私室","derived_profile":"天亮就要上路的过客"}],"cards":[{"id":"b_identity","topic":"身份","owner":"B","text":"我是走南闯北的琴师，一把旧琴跟了我十年。"},{"id":"b_birth","topic":"来处","owner":"B","text":"南边的水乡，芦荡边上一个小镇，名字您未必听过。"},{"id":"b_goods","topic":"随身行头","owner":"B","text":"一把七弦琴，一只装换洗衣物的布袋，就这些。"},{"id":"b_scar","topic":"手背的痕迹","owner":"B","text":"早年在码头搬货，被缆绳勒出来的。"},{"id":"b_purpose","topic":"此行目的","owner":"B","text":"听说这儿的驿丞爱听曲，想来讨个落脚的地方。"},{"id":"a_tune","topic":"记谱的暗号","owner":"A","text":"那支《芦荡月》的第三段，其实是「货已到手」的暗号。"},{"id":"a_contact","topic":"派单的人","owner":"A","text":"只认铜牌不认脸。牌子背面刻着三道横纹的就是我的人。"},{"id":"a_case","topic":"琴箱夹层","owner":"A","text":"琴箱夹层里放的是淬了毒的短刃，一共七把。"},{"id":"a_mark","topic":"左腕的旧伤","owner":"A","text":"那是第一次失手留下的 —— 目标的反手刀划的。"},{"id":"a_debt","topic":"欠的命","owner":"A","text":"三年前我放过一个不该放过的人，公会一直记着这笔账。"},{"id":"a_safehouse","topic":"落脚点","owner":"A","text":"城南棺材铺的后院，掌柜姓周，敲三下门框他就明白。"},{"id":"a_rule","topic":"公会的规矩","owner":"A","text":"收钱之前不能问名字，收钱之后不能留活口。"}],"questions":[{"id":"q_b_birth","level":-1,"speaker":"interrogator","text":"你说你从南边水乡来。那边端午的龙舟，是从哪条河下水的？","card":"b_birth","options":[{"text":"芦荡西边那条，叫柳溪。水浅，船得挑小的。","tone":"correct"},{"text":"河名我记不清了，走的时候还小。","tone":"bluff"},{"text":"……家乡的事，我不太想说。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_birth 卡，归属 B）"},{"id":"q_a_mark","level":-1,"speaker":"interrogator","text":"（他盯着你挽起的袖口）你左腕上那道疤，看着不像缆绳勒的。","card":"a_mark","options":[{"text":"那是第一次失手留下的 —— 目标的反手刀划的。","tone":"leak"},{"text":"小时候摔进石臼里磕的。","tone":"bluff"},{"text":"旧伤了，早忘了怎么来的。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_mark 卡，归属 A）"},{"id":"q_b_scar","level":-1,"speaker":"interrogator","text":"把手伸出来。手背上这片痕迹，怎么弄的？","card":"b_scar","options":[{"text":"早年在码头搬货，被缆绳勒出来的。","tone":"correct"},{"text":"打猎时被火燎的。","tone":"bluff"},{"text":"不值一提的小伤。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_scar 卡，归属 B）"},{"id":"q_a_case","level":-1,"speaker":"interrogator","text":"（敲了敲琴箱）你这琴箱，比一般的沉。","card":"a_case","options":[{"text":"琴箱夹层里放的是淬了毒的短刃，一共七把。","tone":"leak"},{"text":"老木头，实心的，当然沉。","tone":"bluff"},{"text":"琴箱是师父传的，我没打开看过。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_case 卡，归属 A）"},{"id":"q_b_purpose","level":-1,"speaker":"interrogator","text":"你在这镇上，到底想做什么？","card":"b_purpose","options":[{"text":"听说这儿的驿丞爱听曲，想来讨个落脚的地方。","tone":"correct"},{"text":"等一个朋友，私事。","tone":"bluff"},{"text":"……混口饭吃罢了。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_purpose 卡，归属 B）"},{"id":"q_a_contact","level":-1,"speaker":"interrogator","text":"（压低声音）你在南边，跟谁搭线？","card":"a_contact","options":[{"text":"只认铜牌不认脸。牌子背面刻着三道横纹的就是我的人。","tone":"leak"},{"text":"跟几家茶楼，都是正经生意。","tone":"bluff"},{"text":"我不明白您在问什么。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_contact 卡，归属 A）"},{"id":"q_b_goods","level":-1,"speaker":"interrogator","text":"你身上就带这些？","card":"b_goods","options":[{"text":"一把七弦琴，一只装换洗衣物的布袋，就这些。","tone":"correct"},{"text":"还有几件换钱的首饰，压在箱底。","tone":"bluff"},{"text":"出门在外，东西越少越好。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_goods 卡，归属 B）"},{"id":"q_a_safehouse","level":-1,"speaker":"interrogator","text":"（忽然换了个话题）城南棺材铺的掌柜，姓什么来着？","card":"a_safehouse","options":[{"text":"掌柜姓周，敲三下门框他就明白。","tone":"leak"},{"text":"棺材铺？我没去过城南。","tone":"bluff"},{"text":"我……不太清楚您说的是哪家。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_safehouse 卡，归属 A）"},{"id":"q_fact_origin_new","level":0,"speaker":"interrogator","text":"你说你从南边水乡来 —— 哪个镇子？","fact":"origin","options":[{"text":"芦荡边上的柳溪镇，水浅，船得挑小的","tone":"version","value":"reed"},{"text":"西边山坳里的小村子，一年到头见不着外人","tone":"version","value":"mountain"},{"text":"府城里，热闹得很，我是在街面上长大的","tone":"version","value":"city"}],"note":"事实题：本关新问的「origin」"},{"id":"q_fact_origin_recall","level":-1,"speaker":"interrogator","text":"（他换了个问法）你老家靠水还是靠山？","fact":"origin","recall":true,"options":[{"text":"芦荡边上的柳溪镇，水浅，船得挑小的","tone":"version","value":"reed"},{"text":"西边山坳里的小村子，一年到头见不着外人","tone":"version","value":"mountain"},{"text":"府城里，热闹得很，我是在街面上长大的","tone":"version","value":"city"}],"note":"事实题：跨关复问「origin」（哪一关复问由运行时决定）"},{"id":"q_fact_instrument_new","level":1,"speaker":"interrogator","text":"你那把琴，哪儿来的？","fact":"instrument","options":[{"text":"师父传的，跟了我十年，漆掉了半边也舍不得换","tone":"version","value":"master"},{"text":"旧货市上淘的，不值几个钱","tone":"version","value":"bought"},{"text":"自己削的，凑合能用就行","tone":"version","value":"made"}],"note":"事实题：本关新问的「instrument」"},{"id":"q_fact_instrument_recall","level":-1,"speaker":"interrogator","text":"（敲了敲琴身）这琴跟着你多久了？","fact":"instrument","recall":true,"options":[{"text":"师父传的，跟了我十年，漆掉了半边也舍不得换","tone":"version","value":"master"},{"text":"旧货市上淘的，不值几个钱","tone":"version","value":"bought"},{"text":"自己削的，凑合能用就行","tone":"version","value":"made"}],"note":"事实题：跨关复问「instrument」（哪一关复问由运行时决定）"},{"id":"q_fact_purpose_new","level":2,"speaker":"interrogator","text":"你在这镇上想做什么？","fact":"purpose","options":[{"text":"想讨个落脚的地方，卖唱换宿就行","tone":"version","value":"lodge"},{"text":"等一个朋友，私事","tone":"version","value":"friend"},{"text":"想找几家茶楼搭线，往后常来","tone":"version","value":"trade"}],"note":"事实题：本关新问的「purpose」"},{"id":"q_fact_purpose_recall","level":-1,"speaker":"interrogator","text":"（合上账本）说实在的，你来干什么？","fact":"purpose","recall":true,"options":[{"text":"想讨个落脚的地方，卖唱换宿就行","tone":"version","value":"lodge"},{"text":"等一个朋友，私事","tone":"version","value":"friend"},{"text":"想找几家茶楼搭线，往后常来","tone":"version","value":"trade"}],"note":"事实题：跨关复问「purpose」（哪一关复问由运行时决定）"},{"id":"q_fact_scar_new","level":3,"speaker":"interrogator","text":"你手背上这片痕迹，怎么弄的？","fact":"scar","options":[{"text":"早年在码头搬货，被缆绳勒出来的","tone":"version","value":"rope"},{"text":"打猎时被火燎了一下","tone":"version","value":"fire"},{"text":"收网的时候被刀划的","tone":"version","value":"knife"}],"note":"事实题：本关新问的「scar」"},{"id":"q_fact_scar_recall","level":-1,"speaker":"interrogator","text":"（看了一眼你的手）缆绳勒的？还是别的？","fact":"scar","recall":true,"options":[{"text":"早年在码头搬货，被缆绳勒出来的","tone":"version","value":"rope"},{"text":"打猎时被火燎了一下","tone":"version","value":"fire"},{"text":"收网的时候被刀划的","tone":"version","value":"knife"}],"note":"事实题：跨关复问「scar」（哪一关复问由运行时决定）"},{"id":"q_companion_origin","level":0,"speaker":"companion","text":"「大人，我这位同伴是府城来的吧？听他说话就不像乡下人。」","fact":"origin","plant":"「不像乡下人」—— 审讯官点了点头，像是同意，又像只是记下了。","options":[{"text":"「芦荡边上的柳溪镇，小地方。」","tone":"version","suspicion":-2.0,"value":"reed"},{"text":"「……府城边上。」","tone":"version","suspicion":16.0,"value":"city"},{"text":"「问这些做什么。」","tone":"evade","suspicion":6.0}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_instrument","level":1,"speaker":"companion","text":"「您那把琴，不是旧货市上淘的吗？」","fact":"instrument","plant":"审讯官看了一眼那只琴箱 —— 旧货市上淘的琴，不会配这么讲究的箱子。","options":[{"text":"「师父传的，跟了我十年。」","tone":"version","suspicion":-2.0,"value":"master"},{"text":"「……淘的，不值钱。」","tone":"version","suspicion":16.0,"value":"bought"},{"text":"「一把琴而已，有什么好说的。」","tone":"evade","suspicion":6.0}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_purpose","level":2,"speaker":"companion","text":"「您不是说，来这儿等一位老朋友吗？」","fact":"purpose","plant":"「等人」两个字落进册子里 —— 一个卖唱的，等的是谁？","options":[{"text":"「我是来讨个落脚的地方，卖唱换宿。」","tone":"version","suspicion":-2.0,"value":"lodge"},{"text":"「……也等等人。」","tone":"version","suspicion":16.0,"value":"friend"},{"text":"「私事。」","tone":"evade","suspicion":6.0}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_scar","level":3,"speaker":"companion","text":"「您手背那一片，是刀划的吧？缆绳勒不出那种口子。」","fact":"scar","plant":"他没有反驳，只是把「码头」两个字圈了起来。","options":[{"text":"「缆绳勒的。早年在码头搬货。」","tone":"version","suspicion":-2.0,"value":"rope"},{"text":"「……收网时被刀划了一下。」","tone":"version","suspicion":16.0,"value":"knife"},{"text":"「旧伤，忘了。」","tone":"evade","suspicion":6.0}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_blind_inn_0","level":0,"speaker":"interrogator","text":"你上回打这儿过，是哪一年？","setup":"档案里没有你的行踪 —— 驿站的登记簿上也没有你的名字。","options":[{"text":"「三年前，也是这个季节，住的东厢第二间。」","tone":"made_up"},{"text":"「记不清了，我这行当一年到头都在路上。」","tone":"bluff"},{"text":"「驿丞大人，您这儿一天过多少人，还记得住谁？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_inn_1","level":1,"speaker":"interrogator","text":"你琴箱里那把旧琴，是谁给你做的？","setup":"档案里没提过制琴的人 —— 你也不知道。","options":[{"text":"「城南的郑师傅，他专做这种小尺寸的。」","tone":"made_up"},{"text":"「街边买来的，谁做的早忘了。」","tone":"bluff"},{"text":"「一把旧琴罢了，值得您这么问？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_inn_2","level":2,"speaker":"interrogator","text":"前几日在西市，你是不是跟一个戴斗笠的人说过话？","setup":"档案里没有这一段 —— 西市你这几日根本没去过。","options":[{"text":"「是说过两句。他来问路，问的是城隍庙怎么走。」","tone":"made_up"},{"text":"「西市？我这几日一直在驿站里，没出去过。」","tone":"bluff"},{"text":"「戴斗笠的人满街都是，您说的是哪一位？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_inn_3","level":3,"speaker":"interrogator","text":"你袖口那道口子，是跟人动手撕的？","setup":"档案里没有这一条 —— 你自己都没留意过，连编都没处编。","options":[{"text":"「哪儿挂的记不得了，衣裳穿久了总这样。」","tone":"bluff"},{"text":"「一道口子而已 —— 您还想看出什么来？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"}],"interference_lines":["「大人，我这位同伴的琴，好像从来不让人碰呢。」","「他上回提起过一个姓周的掌柜……啊，没什么，我记错了。」","（他忽然咳了一声，把驿丞的视线引向你的手腕）","「您不觉得他这双手，不太像弹了十年琴的人吗？」","（他慢条斯理地把自己的琴横在桌上，正好在你旁边）","「走南闯北的琴师，身上一般不会带着那种味道吧？」"],"facts":[{"id":"origin","prompts":["你说你从南边水乡来 —— 哪个镇子？","（他换了个问法）你老家靠水还是靠山？"],"values":[{"id":"reed","label":"芦荡边上的柳溪镇，水浅，船得挑小的"},{"id":"mountain","label":"西边山坳里的小村子，一年到头见不着外人"},{"id":"city","label":"府城里，热闹得很，我是在街面上长大的"}]},{"id":"instrument","prompts":["你那把琴，哪儿来的？","（敲了敲琴身）这琴跟着你多久了？"],"values":[{"id":"master","label":"师父传的，跟了我十年，漆掉了半边也舍不得换"},{"id":"bought","label":"旧货市上淘的，不值几个钱"},{"id":"made","label":"自己削的，凑合能用就行"}]},{"id":"purpose","prompts":["你在这镇上想做什么？","（合上账本）说实在的，你来干什么？"],"values":[{"id":"lodge","label":"想讨个落脚的地方，卖唱换宿就行"},{"id":"friend","label":"等一个朋友，私事"},{"id":"trade","label":"想找几家茶楼搭线，往后常来"}]},{"id":"scar","prompts":["你手背上这片痕迹，怎么弄的？","（看了一眼你的手）缆绳勒的？还是别的？"],"values":[{"id":"rope","label":"早年在码头搬货，被缆绳勒出来的"},{"id":"fire","label":"打猎时被火燎了一下"},{"id":"knife","label":"收网的时候被刀划的"}]}],"sms":[{"id":"sms_master","level":0,"contact":"师父·沈三","avatar":"🧓","reveals":[{"fact":"origin","value":"reed"}],"messages":[{"me":false,"text":"琴还带着吗？"},{"me":true,"text":"带着。师父传的那把，跟了我十年了。"},{"me":false,"text":"柳溪那边水浅，你小时候学琴就在芦荡边上。别忘了根。"},{"me":true,"text":"忘不了。琴漆掉了半边，我也没舍得换。"}]},{"id":"sms_luthier","level":1,"contact":"琴行的老账房","avatar":"🧓","reveals":[{"fact":"instrument","value":"master"}],"messages":[{"me":false,"text":"你那把琴，是沈三手上传下来的吧？漆都掉了半边。"},{"me":true,"text":"是。跟了我十年，舍不得换。"},{"me":false,"text":"驿站里识货的人多，来路你可别说岔了。"},{"me":true,"text":"就说师父传的，没别的说法。"}]},{"id":"sms_tao","level":2,"contact":"阿桃","avatar":"👧","reveals":[{"fact":"purpose","value":"lodge"}],"messages":[{"me":false,"text":"你到镇上了吗？"},{"me":true,"text":"刚到。先找个地方落脚，卖唱换宿就行。"},{"me":false,"text":"驿丞爱听曲，你去他那儿试试。"},{"me":true,"text":"正是这么打算的。混口饭吃罢了。"}]},{"id":"sms_dock","level":3,"contact":"码头的老李","avatar":"🧔","reveals":[{"fact":"scar","value":"rope"}],"messages":[{"me":false,"text":"手上那伤好了没？"},{"me":true,"text":"早好了。早年在码头搬货，被缆绳勒出来的。"},{"me":false,"text":"缆绳勒的都是一道一道的，你那片是斜的。"},{"me":true,"text":"……勒得深了呗。"}]}],"companion_sms":[{"id":"c_inn_0","level":0,"contact":"琴师·阿武","avatar":"🎻","messages":[{"me":false,"text": olor=#f0a83c]这一关的准备室[/color]重来。\n背景不变、他记忆里的那张脸不变、你已经查到的情报也都还在。\n要改的是[color=#f0a83c]这一轮的打扮[/color]，不是身份。","overlay_win_title":"🏁 本局通关","overlay_win_btn":"再来一局（新背景 · 新原貌）  ↺","overlay_win_body":"[color=#8a919c]这一局[/color]  第 %d 局 ｜ %s\n[color=#8a919c]身份[/color]  %s → 以「%s」的身份走完全程\n[color=#8a919c]成绩[/color]  4 / 4 关全部通过 ｜ 前后矛盾 [b]%d[/b] 次\n\n你把 A 藏进了 B 的皮里，一路没有露馅。\n同行者从头到尾没有揭穿你 —— 他只是把你留在了原地。","overlay_level_title":"✅ 第 %d 关通过","overlay_level_btn":"进入第 %d 关  ➔","overlay_next_body":"[color=#8a919c]背景[/color]  %s\n[color=#8a919c]你装成[/color]  %s\n\n[color=#f0a83c]下一关[/color]  %s\n接受度 [b]+%d[/b] → [b]%d[/b]（暴露值上限放宽到 [b]%d[/b]）\n反差值要求提高到 [b]%d[/b]\n\n[color=#8a919c]审讯官还是那个人 —— 他记忆里的「A」没有变，你已经查到的外貌情报也还在。要改的是打扮，不是身份。[/color]"},"questions_schema":"faceless-questions-v1"},{"id":"ducal_manor","name":"公爵府邸","venue":"内城的深宅。三重门禁、抄手游廊、满院子的白蜡树。","intro":"内城的深宅。\n三重门禁一道比一道查得细，抄手游廊绕了大半个院子，白蜡树的影子被灯笼拉得很长。\n你以新招抄写文书的身份禀了进去，在偏厅等了半个时辰。\n来见你的是府里的执事。他没问你叫什么，先要了你写的一页字。\n\n陪你进来的是同批的文书程九。他知道你是谁，也知道你在装谁。\n他不声张，也不点破 —— 他只负责在执事停顿的地方，替他把下一句接上。","interrogator":"府中的执事","interrogator_gender":"男","companion":{"name":"文书·程九","relation":"同房的文书","gender":"男","desc":"跟你同住角房的抄写文书。他在密写药水的味道里认出了你 —— 知道你是宫廷密探，也知道你抄的是假名。他不点破，只在执事问话时替你把破绽递过去。"},"cover_role":"府里新招的抄写文书","true_role":"宫廷密探","true_name":"陆青梧","levels":[{"name":"第一关 · 侧门角房","derived_profile":"新来的抄写文书"},{"name":"第二关 · 文书房","derived_profile":"字迹端正的低等文书"},{"name":"第三关 · 内庭回廊","derived_profile":"被某位大人点名的近侍"},{"name":"第四关 · 执事厅","derived_profile":"即将领到腰牌的府中之人"}],"cards":[{"id":"b_identity","topic":"身份","owner":"B","text":"我是府上新招的抄写，管誊录田册和来往信件。"},{"id":"b_birth","topic":"来处","owner":"B","text":"城南书坊街，我家在街尾开了三代人的笔墨铺。"},{"id":"b_goods","topic":"手边的物件","owner":"B","text":"一方砚、三支笔、半卷没抄完的田册。"},{"id":"b_scar","topic":"手背的痕迹","owner":"B","text":"磨墨磨的。常年压着砚台，皮都磨硬了。"},{"id":"b_purpose","topic":"此行目的","owner":"B","text":"执事大人传唤，说是要核对去年的租册。"},{"id":"a_cipher","topic":"密写药水","owner":"A","text":"牛奶写的字，火上一烤就显出来 —— 我给外头递消息就用这个。"},{"id":"a_contact","topic":"接头方式","owner":"A","text":"每隔九日在东角门的第三根廊柱下留一枚铜扣。"},{"id":"a_map","topic":"回廊图","owner":"A","text":"内庭那条少有人走的夹道，直通公爵的书房后窗。"},{"id":"a_mark","topic":"耳后的针孔","owner":"A","text":"那是接密信用的，线从耳后穿过去，藏在发里。"},{"id":"a_debt","topic":"未还的债","owner":"A","text":"去年我卖掉了府里一位老人的行踪，他一直没等到人。"},{"id":"a_poison","topic":"袖中的药","owner":"A","text":"袖口缝着一小包乌头粉，是留给最后那一个人的。"},{"id":"a_rule","topic":"行里的规矩","owner":"A","text":"递出去的消息不许留副本，看过就烧。"}],"questions":[{"id":"q_b_birth","level":-1,"speaker":"interrogator","text":"书坊街尾那家笔墨铺，招牌上写的是什么？","card":"b_birth","options":[{"text":"「三代笔墨」，我爷爷亲手刻的，漆都掉了大半。","tone":"correct"},{"text":"招牌早摘了，那一片去年就拆了。","tone":"bluff"},{"text":"……铺子的事，我不太想提。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_birth 卡，归属 B）"},{"id":"q_a_mark","level":-1,"speaker":"interrogator","text":"（他绕到你身后，忽然停住）你耳后……有个小孔。","card":"a_mark","options":[{"text":"那是接密信用的，线从耳后穿过去，藏在发里。","tone":"leak"},{"text":"小时候生疮，溃了个洞。","tone":"bluff"},{"text":"不知道，可能一直就有吧。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_mark 卡，归属 A）"},{"id":"q_b_scar","level":-1,"speaker":"interrogator","text":"把手摊开。指节上这些硬皮是怎么来的？","card":"b_scar","options":[{"text":"磨墨磨的。常年压着砚台，皮都磨硬了。","tone":"correct"},{"text":"干粗活干的。","tone":"bluff"},{"text":"写字的人，手都这样。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_scar 卡，归属 B）"},{"id":"q_a_cipher","level":-1,"speaker":"interrogator","text":"（把一张白纸凑到烛火上）你觉得，这上头有字吗？","card":"a_cipher","options":[{"text":"牛奶写的字，火上一烤就显出来 —— 我给外头递消息就用这个。","tone":"leak"},{"text":"空白的。您是不是看错了？","tone":"bluff"},{"text":"我……不懂这些门道。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_cipher 卡，归属 A）"},{"id":"q_b_purpose","level":-1,"speaker":"interrogator","text":"执事传你，是为什么事？","card":"b_purpose","options":[{"text":"核对去年的租册，有几处数目对不上。","tone":"correct"},{"text":"说是有人举荐我，让我来听差遣。","tone":"bluff"},{"text":"……大人没细说。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_purpose 卡，归属 B）"},{"id":"q_a_contact","level":-1,"speaker":"interrogator","text":"（压低声音）你在府里，跟谁 练出来的吧？」","fact":"skill","plant":"审讯官把你抄的那页翻过去，对着光看了看笔锋 —— 什么也没说。","options":[{"text":"「家里三代做笔墨，自小跟着抄。」","tone":"version","suspicion":-2.0,"value":"family"},{"text":"「……在义学待过几年。」","tone":"version","suspicion":16.0,"value":"academy"},{"text":"「字而已，能看就行。」","tone":"evade","suspicion":6.0}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_purpose","level":2,"speaker":"companion","text":"「听说您是有人举荐才进府的？」","fact":"purpose","plant":"「举荐」两个字写得很轻，但写下来了。","options":[{"text":"「是执事传我来核对租册的。」","tone":"version","suspicion":-2.0,"value":"ledger"},{"text":"「……是有人举荐。」","tone":"version","suspicion":16.0,"value":"recommend"},{"text":"「谁说的？」","tone":"evade","suspicion":6.0}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_scar","level":3,"speaker":"companion","text":"「您这手上的硬皮，是在工地上干出来的吧？」","fact":"scar","plant":"他把你的手看了很久 —— 像是在数，一个抄写的人手上该有几处茧。","options":[{"text":"「磨墨磨的。常年压着砚台。」","tone":"version","suspicion":-2.0,"value":"ink"},{"text":"「……早年在工地上干过。」","tone":"version","suspicion":16.0,"value":"labor"},{"text":"「写字的人，手都这样。」","tone":"evade","suspicion":6.0}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_blind_manor_0","level":0,"speaker":"interrogator","text":"你是哪一年入的府？引荐人是谁？","setup":"档案里没有入府记录 —— 名册上也翻不到你的名字。","options":[{"text":"「前年秋天，是账房的刘管事引荐的。」","tone":"made_up"},{"text":"「去年来应募的，具体经谁的手我记不清了。」","tone":"bluff"},{"text":"「名册上应当有，执事大人一查便知。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_manor_1","level":1,"speaker":"interrogator","text":"你住的角房，隔壁那间现在住着谁？","setup":"档案里没有角房的记录 —— 你没留意过隔壁。","options":[{"text":"「住着一位姓陈的老仆，腿脚不太方便。」","tone":"made_up"},{"text":"「隔壁……似乎一直空着，我没怎么留意。」","tone":"bluff"},{"text":"「同房的事我从不多问 —— 府里的规矩。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_manor_2","level":2,"speaker":"interrogator","text":"上月十五的灯会，你在府里还是在街上？","setup":"档案里没有这一天 —— 你也不记得府里办过灯会。","options":[{"text":"「在府里当值，跟着程九抄了一夜的卷宗。」","tone":"made_up"},{"text":"「灯会？我那几日病着，一直在房里。」","tone":"bluff"},{"text":"「日子我记不准。执事大人查当值簿更稳妥。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_manor_3","level":3,"speaker":"interrogator","text":"你右手中指上的茧，是握什么磨出来的？","setup":"档案里没有这一条 —— 你自己也没留意过，连编都没处编。","options":[{"text":"「做粗活做出来的，家里早年开过磨坊。」","tone":"bluff"},{"text":"「手上茧子多，哪一处是什么磨的，我自己也分不清。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"}],"interference_lines":["「执事大人，我这位同伴的耳朵后面，好像一直不太舒服。」","「他上次提过东角门……啊，没什么，是我记错了。」","（他忽然把手里的笔搁下，声音正好让执事听见）","「您不觉得他握笔的姿势，不太像抄了十年册子的人吗？」","（他慢条斯理地把自己的手摊在桌上，正好在你旁边）","「在府里做抄写的，手背上一般不会留着那种印子吧？」"],"facts":[{"id":"origin","prompts":["你说你家在城南书坊街 —— 铺子在街口还是街尾？","（他换了个问法）你家那铺子，开了多少年？"],"values":[{"id":"tail","label":"书坊街街尾，开了三代人的笔墨铺"},{"id":"head","label":"街口，我爹那一辈才开的，年头不算长"},{"id":"market","label":"不在书坊街，在旧市口那边，铺面很小"}]},{"id":"skill","prompts":["你这手字，跟谁学的？","（翻着你抄的册子）练了多少年了？"],"values":[{"id":"family","label":"家里三代做笔墨，自小跟着抄，手是练出来的"},{"id":"academy","label":"在城南的义学里练过几年"},{"id":"self","label":"自己照着旧帖描的，没正经拜过师"}]},{"id":"purpose","prompts":["执事传你，是为什么事？","（合上册子）说重点，你来府里做什么？"],"values":[{"id":"ledger","label":"核对去年的租册，有几处数目对不上"},{"id":"recommend","label":"有人举荐我，让我来听差遣"},{"id":"errand","label":"替人跑一趟腿，送几封文书"}]},{"id":"scar","prompts":["你指节上这些硬皮，怎么来的？","（看了一眼你的手）不像干粗活的，倒像常年压着什么。"],"values":[{"id":"ink","label":"磨墨磨的，常年压着砚台，皮都磨硬了"},{"id":"labor","label":"早年在工地上干过活，落下的"},{"id":"burn","label":"小时候被炭火烫过一片，一直没好利索"}]}],"sms":[{"id":"sms_mother","level":0,"contact":"娘","avatar":"👵","reveals":[{"fact":"origin","value":"tail"}],"messages":[{"me":false,"text":"铺子今天没开张，风大。"},{"me":true,"text":"娘，别站在门口。街尾那一段最招风。"},{"me":false,"text":"知道。你爷爷刻的招牌还挂着呢 —— 「三代笔墨」，漆都掉了大半。"},{"me":true,"text":"别摘。我在这边抄册子，也是靠这手字吃饭。"}]},{"id":"sms_carver","level":1,"contact":"街口的刻字匠·老穆","avatar":"🧔","reveals":[{"fact":"skill","value":"family"}],"messages":[{"me":false,"text":"你那手字，一看就是从小练的，不是半路学的。"},{"me":true,"text":"家里三代做笔墨，会走路就跟着抄。"},{"me":false,"text":"府里要的是能抄密件的人，师承你得说清楚。"},{"me":true,"text":"照实说就行，家里传的。"}]},{"id":"sms_yan","level":2,"contact":"书坊街·阿砚","avatar":"🧑","reveals":[{"fact":"purpose","value":"ledger"}],"messages":[{"me":false," 过，我拿手去挡，烫的","tone":"version","value":"burn"}],"note":"事实题：跨关复问「scar」（哪一关复问由运行时决定）"},{"id":"q_companion_origin","level":0,"speaker":"companion","text":"「大人，我这位同伴好像不是本地人 —— 他说过自己是在船上长大的。」","fact":"origin","plant":"「不是本地人」—— 审讯官抬眼看了看你，又低头写了两笔。","options":[{"text":"「我住灯塔下头四排棚户，本地人。」","tone":"version","suspicion":-2.0,"value":"four"},{"text":"「……算是船上长大的。」","tone":"version","suspicion":16.0,"value":"boat"},{"text":"「问这个做什么。」","tone":"evade","suspicion":6.0}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_catch","level":1,"speaker":"companion","text":"「您这几筐，不全是自己捞的吧？」","fact":"catch","plant":"他没追问，只是把筐翻过来看了一眼底。","options":[{"text":"「都是近海捞的，今早刚上岸。」","tone":"version","suspicion":-2.0,"value":"near"},{"text":"「……有几筐是收来的。」","tone":"version","suspicion":16.0,"value":"bought"},{"text":"「货的事，看单子。」","tone":"evade","suspicion":6.0}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_purpose","level":2,"speaker":"companion","text":"「您上回说，是来讨说法的吧？上个月扣了您一船货。」","fact":"purpose","plant":"「讨说法」写进了册子 —— 一个来讨说法的人，态度未免太软了。","options":[{"text":"「送两筐新鲜货，顺带办通关文书。」","tone":"version","suspicion":-2.0,"value":"papers"},{"text":"「……对，也是来讨个说法。」","tone":"version","suspicion":16.0,"value":"claim"},{"text":"「我不太想谈这个。」","tone":"evade","suspicion":6.0}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_scar","level":3,"speaker":"companion","text":"「您手上那几道，是烫的吧？看着像。」","fact":"scar","plant":"他把「炉子」两个字念了一遍，像是记，又像是试探。","options":[{"text":"「收网时被缆绳绞的。」","tone":"version","suspicion":-2.0,"value":"net"},{"text":"「……船上炉子翻过，烫的。」","tone":"version","suspicion":16.0,"value":"burn"},{"text":"「旧伤了，记不清。」","tone":"evade","suspicion":6.0}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_blind_harbor_0","level":0,"speaker":"interrogator","text":"你这船是哪一年下的水？","setup":"档案里没有船龄 —— 船契也不在你手上。","options":[{"text":"「六年前在船坞里新打的，桐油刷了三遍。」","tone":"made_up"},{"text":"「二手船，转了几道手，哪年下的水说不好。」","tone":"bluff"},{"text":"「船契在船东那儿 —— 您要问，我回头取来。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_harbor_1","level":1,"speaker":"interrogator","text":"昨夜子时，你的船泊在几号桩？","setup":"档案里没有泊位记录 —— 你也记不清。","options":[{"text":"「七号桩，靠东边那排。缆绳是我亲手系的。」","tone":"made_up"},{"text":"「泊位是码头上临时指的，我没记号。」","tone":"bluff"},{"text":"「您查一查港簿不就清楚了？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_harbor_2","level":2,"speaker":"interrogator","text":"你左耳后面那道疤，是怎么来的？","setup":"档案里没有这一条 —— 你从没听人提过。","options":[{"text":"「小时候从桅杆上摔下来，磕在舱沿上。」","tone":"made_up"},{"text":"「不记得了，打小就有的。」","tone":"bluff"},{"text":"「有吗？我自己从没看见过。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_harbor_3","level":3,"speaker":"interrogator","text":"这网是什么时候补的？谁的手艺？","setup":"档案里没有这一条 —— 你也说不清，连编都没处编。","options":[{"text":"「船上谁空了谁补，记不得是哪一天了。」","tone":"bluff"},{"text":"「一张破网罢了。您也管这个？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"}],"interference_lines":["「大人，我这位同伴的手，好像一直揣在袖子里呢。」","「他上回提起过旧船坞……啊，没什么，我记错了。」","（他忽然咳了一声，把验货官的目光引向你的手心）","「您不觉得他这身衣裳，不太像天天泡在海水里的人吗？」","（他慢条斯理地把自己的手摊在货筐上，正好在你旁边）","「近海收渔的人，掌心一般不会留着那种疤吧？」"],"facts":[{"id":"origin","prompts":["你说你就住这儿 —— 灯塔下头那片棚户，第几排？","（换了个问法）你是本地的，还是搬来的？"],"values":[{"id":"four","label":"灯塔下头四排棚户，最靠海那排去年塌了半边"},{"id":"two","label":"两排，靠里那排，避风"},{"id":"boat","label":"不是本地的，从小在船上长大，上岸才几年"}]},{"id":"catch","prompts":["今天上岸的都在这儿了？","（敲了敲筐）你这货，都是近海捞的？"],"values":[{"id":"near","label":"今早三筐鲱鱼、两筐青口，都是近海捞的"},{"id":"deep","label":"有几筐是远海带的，船东的货，我顺路捎回来"},{"id":"bought","label":"不全是我捞的，有一部分是从别的船上收的"}]},{"id":"purpose","prompts":["你往值房送鱼，是想办什么事？","（合上单子）说重点，你来干什么？"],"values":[{"id":"papers","label":"送两筐新鲜货给值房的大人尝尝，顺带办通关文书"},{"id":"claim","label":"来讨个说法，上个月扣了我一船货"},{"id":"sell","label":"想把这条线的货，长期供到府里去"}]},{"id":"scar","prompts":["你手背上这些口子，怎么来的？","（看了一眼你的手）不像缆绳绞的。"],"values":[{"id":"net","label":"收网的时候被缆绳绞的，年年都要添新伤"},{"id":"knife","label":"剖鱼的时候被刀划的，手上到处都是"},{"id":"burn","label":"船上的炉子翻过，我拿手去挡，烫的"}]}],"sms":[{"id":"sms_granny","level":0,"contact":"阿婆","avatar":"👵","reveals":[{"fact":"origin","value":"four"}],"messages":[{"me":false,"text":"今晚回来吃饭吗？"},{"me":true,"text":"看情况。阿婆，家里那排棚户的屋顶 // ---------- 小工具 ----------
function h(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat(9)) if (kid !== null && kid !== undefined && kid !== false)
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
}
const $ = id => document.getElementById(id);
function short(s, n){ s = String(s == null ? "" : s); return s.length > n ? s.slice(0, n) + "…" : s; }
function num(v, d){ const x = parseInt(v, 10); return isNaN(x) ? d : x; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function countPh(s){
  let n = 0;
  s = String(s == null ? "" : s);
  for (let i = 0; i < s.length; i++){
    if (s[i] === "%"){ if (s[i+1] === "%"){ i++; continue; } n++; }
  }
  return n;
}
// 数「真正像占位符」的 %s / %d —— 用来区分 78% 这种百分号，和真的写错位置的占位符。
// 游戏那边用 Godot 的 `tpl % args`，只认 %s %d %f %x %c 这几种。
function specPh(s){ return (String(s == null ? "" : s).match(/%[sdfxXc]/g) || []).length; }

let toastTimer = null;
function toast(msg, ms){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), ms || 2400);
}

// ---------- 撤销 / 重做 ----------
const undoStack = [];
const redoStack = [];
let lastSig = "", lastSigT = 0;
function snapshot(){ return JSON.stringify(story); }
function commit(sig){
  const s = snapshot();
  if (undoStack.length && undoStack[undoStack.length - 1] === s) return;
  const now = Date.now();
  const coalesce = sig && sig === lastSig && (now - lastSigT) < 900 && undoStack.length >= 2;
  if (coalesce) undoStack[undoStack.length - 1] = s;
  else { undoStack.push(s); if (undoStack.length > 80) undoStack.shift(); }
  redoStack.length = 0;
  lastSig = sig || ""; lastSigT = now;
}
function markDirty(){
  dirty = true;
  $("fileinfo").classList.add("dirty");
  updateFileInfo();
  scheduleValidate();
}
function undo(){
  if (undoStack.length < 2){ toast("没有可撤销的步骤了"); return; }
  redoStack.push(undoStack.pop());
  story = JSON.parse(undoStack[undoStack.length - 1]);
  lastSig = ""; dirty = true; scheduleValidate(); renderAll();
}
function redo(){
  if (!redoStack.length){ toast("没有可重做的步骤了"); return; }
  const s = redoStack.pop();
  undoStack.push(s);
  story = JSON.parse(s);
  lastSig = ""; dirty = true; scheduleValidate(); renderAll();
}

// ---------- 载入 / 保存 ----------
function loadStory(obj, name, fromFile){
  story = obj; seedStory = clone(obj); fileName = name || "story.json";
  fileHandle = null; dirty = !!fromFile;
  undoStack.length = 0; redoStack.length = 0; undoStack.push(snapshot());
  lastSig = ""; lastSigT = 0;
  openSet.clear(); foldSet.clear();
  view = {kind:"home"};
  previewThread = ""; previewBg = 0;
  validateNow();
  renderAll();
  $("fileinfo").classList.remove("dirty");
  updateFileInfo();
}
function updateFileInfo(){
  $("fileinfo").textContent = fileName + (dirty ? " · 有未保存的改动" : " · 已同步");
}
function getSeed(){
  const txt = $("seed").textContent.trim();
  if (!txt || txt.indexOf("__PHONE_JSON__") === 0) return null;
  try { return JSON.parse(txt); } catch(e){ return null; }
}
async function tryFetch(){
  const cands = ["data/story.json", "../data/story.json", "./story.json", "../../data/story.json"];
  for (const u of cands){
    try {
      const r = await fetch(u, {cache:"no-store"});
      if (r.ok){ const j = await r.json(); if (j && j.backgrounds) return {json:j, from:u}; }
    } catch(e){ /* 继续试下一个 */ }
  }
  return null;
}
function toJSON(){ return JSON.stringify(story, null, "\t") + "\n"; }

async function save(asNew){
  const text = toJSON();
  if (!asNew && fileHandle){
    try {
      const w = await fileHandle.createWritable();
      await w.write(text); await w.close();
      dirty = false; $("fileinfo").classList.remove("dirty"); updateFileInfo();
      toast("已写入 " + fileName); return;
    } catch(e){ /* 落到下面重新挑文件 */ }
  }
  if (window.showSaveFilePicker){
    try {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: fileName || "story.json",
        types:[{description:"剧情文本 JSON", accept:{"application/json":[".json"]}}]
      });
      fileName = fileHandle.name;
      const w = await fileHandle.createWritable();
      await w.write(text); await w.close();
      dirty = false; $("fileinfo").classList.remove("dirty"); updateFileInfo();
      toast("已保存到 " + fileName); return;
    } catch(e){
      if (e && e.name === "AbortError") return;
    }
  }
  const blob = new Blob([text], {type:"application/json"});
  const a = h("a", {href:URL.createObjectURL(blob), download:"story.json"});
  document.body.append(a); a.click(); a.remove();
  toast("已下载 story.json —— 请覆盖项目里的 data/story.json", 4200);
}

async function openFile(){
  if (window.showOpenFilePicker){
    try {
      const [fh] = await window.showOpenFilePicker({
        types:[{description:"剧情文本 JSON", accept:{"application/json":[".json"]}}]
      });
      const f = await fh.getFile();
      const j = JSON.parse(await f.text());
      fileHandle = fh;
      loadStory(j, fh.name, false);
      toast("已打开 " + fh.name); return;
    } catch(e){
      if (e && e.name === "AbortError") return;
      toast("打不开这个文件：" + (e && e.message ? e.message : e), 4000); return;
    }
  }
  $("fileinput").click();
}
$("fileinput").addEventListener("change", async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    loadStory(j, f.name, false);
    toast("已打开 " + f.name + "（浏览器不允许就地写回，保存时会下载一份）", 4200);
  } catch(e){ toast("JSON 解析失败：" + e.message, 4000); }
  ev.target.value = "";
});

function renderField(obj, spec, path){
  const wrap = h("div", {class:"field"});
  wrap.append(h("div", {class:"flabel"},
    h("span", {text:spec.label}),
    spec.k ? h("span", {class:"k", text:spec.k}) : null,
    spec.hint ? h("span", {class:"hint", text:spec.hint}) : null));
  const val = obj[spec.k];

  if (spec.t === "area" || spec.t === "text"){
    const inp = spec.t === "area" ? h("textarea", {rows:spec.rows || 3}) : h("input", {type:"text"});
    inp.value = val == null ? "" : String(val);
    inp.addEventListener("input", () => {
      if (obj[spec.k] === inp.value) return;
      obj[spec.k] = inp.value;
      commit("txt:" + path); markDirty(); renderPreview(); paintPh(inp, spec, path);
    });
    paintPh(inp, spec, path);
    wrap.append(inp);
  } else if (spec.t === "num"){
    const inp = h("input", {type:"number", step:"1"});
    inp.value = val == null ? "0" : String(val);
    inp.addEventListener("input", () => {
      obj[spec.k] = num(inp.value, 0); commit("num:" + path); markDirty(); renderPreview();
    });
    wrap.append(inp);
  }
  return wrap;
}

// 占位符个数不对就把输入框描红 —— 免得等游戏跑起来才发现少写一个 %s
function paintPh(inp, spec, path){
  const want = PH_EXPECT[path];
  const got = countPh(inp.value);
  inp.style.borderColor = (want === undefined ? (specPh(inp.value) > 0 ? "var(--amber)" : "")
    : (got === want ? "" : "var(--red)"));
}

// ---------- 消息 App 的三个界面 ----------
function renderGroup(main, group, bi){
  const gr = GROUPS.find(g => g.key === group) || GROUPS[0];
  main.append(h("h1", {text: gr.icon + " " + gr.label}));
  main.append(h("div", {class:"sub", text: gr.what}));

  if (group === "interrogator"){
    renderInterrogatorSms(main);
    return;
  }

  // 背景选择（与 C / 与朋友都是「每套背景各一份」）
  const tabs = h("div", {class:"tabs"});
  bgs().forEach((b, i) => tabs.append(h("button", {
    class: (i === bi ? "on" : ""),
    text: (b.name || b.id) + "（" + ((group === "companion" ? b.companion_sms : b.sms) || []).length + "）",
    onclick: ()=>go({kind:"group", group:group, bg:i})
  })));
  main.append(tabs);

  if (group === "companion"){
    main.append(h("div", {class:"help", style:"color:var(--dim);font-size:12px;margin-bottom:10px"},
      "★ 与 C 的短信**没有** reveals —— 他不给口径。所以下面每条线程里没有「读完学到什么」那一节，"
      + "编辑器也不让你加（加了这个字段游戏也不会读）。"));
  }

  const arr = threadsOf(group, bi);
  const secEl = h("div", {class:"sec"});
  const body = h("div", {class:"secbody"});
  secEl.append(h("div", {class:"sechead"},
    h("span", {class:"caret", text:"▾"}),
    h("span", {class:"t", text:"短信线程（逐关解锁）"}),
    h("span", {class:"n", text:arr.length + " 条"})), body);
  body.append(renderThreadList(arr, group, bi));
  main.append(secEl);
}

function renderInterrogatorSms(main){
  const arr = phone().interrogator_sms || (phone().interrogator_sms = []);
  main.append(h("div", {class:"help", style:"color:var(--dim);font-size:12px;margin-bottom:10px"},
    "这几条是**事件短信**：盘问里掏手机掏太多次，他本人发来的。"
    + "第 4 次起每掏一次追加一条（循环取用），怀疑度同时上涨。"));

  const secEl = h("div", {class:"sec"});
  const body = h("div", {class:"secbody"});
  secEl.append(h("div", {class:"sechead"},
    h("span", {class:"caret", text:"▾"}),
    h("span", {class:"t", text:"他发来的话"}),
    h("span", {class:"n", text:arr.length + " 条"})), body);

  if (!arr.length) body.append(h("div", {class:"empty", text:"（空 —— 点下面加一条）"}));
  arr.forEach((s, i) => {
    const row = h("div", {class:"item", style:"padding:8px 9px"});
    row.append(h("div", {class:"flabel"}, h("span", {class:"k", text:"#" + (i + 1)})));
    const ta = h("textarea", {rows:2});
    ta.value = s == null ? "" : String(s);
    ta.addEventListener("input", () => {
      if (arr[i] === ta.value) return;
      arr[i] = ta.value; commit("txt:intr." + i); markDirty(); renderPreview();
    });
    const ops = h("div", {class:"ops", style:"display:flex;gap:4px;margin-top:5px;justify-content:flex-end"});
    ops.append(h("button", {text:"↑", onclick:()=>{ if (i > 0){ arr.splice(i-1, 0, arr.splice(i,1)[0]); commit(); markDirty(); renderAll(); } }}));
    ops.append(h("button", {text:"↓", onclick:()=>{ if (i < arr.length-1){ arr.splice(i+1, 0, arr.splice(i,1)[0]); commit(); markDirty(); renderAll(); } }}));
    ops.append(h("button", {class:"warn", text:"✕", onclick:()=>{ if (!confirm("删除这一条？")) return; arr.splice(i,1); commit(); markDirty(); renderAll(); }}));
    row.append(ta, ops);
    body.append(row);
  });
  body.append(h("div", {class:"addrow"},
    h("button", {text:"＋ 新增一条", onclick:()=>{ arr.push(""); commit(); markDirty(); renderAll(); }})));
  main.append(secEl);
}

function levelBadge(lv){
  const cls = "badge g" + Math.max(0, Math.min(3, num(lv, 0)));
  return h("span", {class:cls, text:"第 " + (num(lv, 0) + 1) + " 关解锁"});
}

function renderThreadList(arr, group, bi){
  const box = h("div");
  if (!Array.isArray(arr)) return box;
  if (!arr.length) box.append(h("div", {class:"empty", text:"（这个界面还没有短信 —— 点下面加一条）"}));

  arr.forEach((t, i) => {
    const key = "th/" + group + "/" + bi + "/" + i;
    const open = openSet.has(key);
    const item = h("div", {class:"item" + (open ? "" : " fold"), "data-k":key});
    const titleEl = h("span", {class:"it", text:
      "💬 " + (t.contact || "（无联系人）") + "   ·   " + ((t.messages || []).length) + " 条   ·   "
      + "第 " + (num(t.level, 0) + 1) + " 关解锁   [" + (t.id || "?") + "]"});
    const refresh = () => { titleEl.textContent =
      "💬 " + (t.contact || "（无联系人）") + "   ·   " + ((t.messages || []).length) + " 条   ·   "
      + "第 " + (num(t.level, 0) + 1) + " 关解锁   [" + (t.id || "?") + "]"; };

    const ops = h("div", {class:"ops"});
    ops.append(h("button", {title:"在预览里打开这段对话", text:"👁", onclick:(e)=>{
      e.stopPropagation(); previewThread = String(t.id || ""); renderPreview(); }}));
    ops.append(h("button", {title:"上移", text:"↑", onclick:(e)=>{ e.stopPropagation();
      if (i > 0){ arr.splice(i-1, 0, arr.splice(i,1)[0]); commit(); markDirty(); renderAll(); } }}));
    ops.append(h("button", {title:"下移", text:"↓", onclick:(e)=>{ e.stopPropagation();
      if (i < arr.length-1){ arr.splice(i+1, 0, arr.splice(i,1)[0]); commit(); markDirty(); renderAll(); } }}));
    ops.append(h("button", {title:"复制一份", text:"⧉", onclick:(e)=>{ e.stopPropagation();
      const cp = clone(t); cp.id = (cp.id || "sms") + "_copy"; arr.splice(i+1, 0, cp);
      commit(); markDirty(); renderAll(); }}));
    ops.append(h("button", {class:"warn", title:"删除", text:"✕", onclick:(e)=>{ e.stopPropagation();
      if (!confirm("删除这条短信线程？\n\n" + (t.contact || t.id))) return;
      arr.splice(i,1); commit(); markDirty(); renderAll(); }}));

    const head = h("div", {class:"itemhead", onclick:()=>{
      if (openSet.has(key)) openSet.delete(key); else openSet.add(key);
      item.classList.toggle("fold");
    }}, h("span", {class:"caret", text:"▾"}), titleEl, h("span", {style:"flex:1"}), ops);

    const body = h("div", {class:"itembody"});
    const refreshAll = () => { rebuild(); refresh(); };

    function rebuild(){
      const fields = threadFields(t, group, bi, refreshAll);
      body.innerHTML = "";
      fields.forEach(f => body.append(renderField(t, f, group + "." + bi + "." + i + "." + f.k)));
      body.append(renderBubbles(t, refreshAll));
      if (group === "friends") body.append(renderReveals(t, bi, refreshAll));
    }
    rebuild();
    item.append(head, body);
    box.append(item);
  });

  box.append(h("div", {class:"addrow"},
    h("button", {text:"＋ 新增一条短信", onclick:()=>{
      const bg = bgAt(bi);
      const prefix = group === "companion" ? ("c_" + (bg.id || "bg") + "_") : ("sms_" + (bg.id || "bg") + "_");
      const used = new Set(arr.map(x => x.id));
      let n = 0; while (used.has(prefix + n)) n++;
      arr.push({
        id: prefix + n,
        level: Math.min(arr.length, Math.max(0, factsOf(bi).length - 1)),
        contact: group === "companion" ? "新联系人" : "新联系人",
        avatar: "💬",
        messages: [{me:false, text:"（对方说的第一句）"}],
      });
      openSet.add("th/" + group + "/" + bi + "/" + (arr.length - 1));
      commit(); markDirty(); renderAll();
    }})));
  return box;
}

function threadFields(t, group, bi, refresh){
  const maxLv = Math.max(0, factsOf(bi).length - 1);
  const fields = [
    {k:"id", label:"id", hint:"内部标识，别和别的线程重名", t:"text"},
    {k:"level", label:"第几关解锁（0 起）", hint:"0 = 第 1 关就能看到；最大 " + maxLv, t:"num"},
    {k:"contact", label:"联系人（列表里显示的名字）", t:"text"},
    {k:"avatar", label:"头像 emoji", t:"text"},
  ];
  if (group === "friends"){
    fields.push({k:"_hint", label:"", t:"none"});
  }
  return fields.filter(f => f.t !== "none");
}

function renderBubbles(t, refresh){
  const box = h("div", {style:"margin-top:8px"});
  box.append(h("div", {class:"flabel"},
    h("span", {text:"对话内容"}),
    h("span", {class:"hint", text:"勾选 = 这条是我（玩家）发的"})));
  const arr = t.messages || (t.messages = []);
  if (!arr.length) box.append(h("div", {class:"empty", text:"（空）"}));

  arr.forEach((m, i) => {
    const row = h("div", {class:"item", style:"padding:8px 9px;margin-bottom:6px"});
    const top = h("div", {style:"display:flex;gap:8px;align-items:center;margin-bottom:5px"});
    const cb = h("input", {type:"checkbox"});
    cb.checked = !!m.me;
    cb.addEventListener("change", () => { m.me = cb.checked; commit(); markDirty(); renderPreview(); rebuildTitles(); });
    const who = h("span", {style:"font-size:11px;color:var(--dim)", text: (m.me ? "我 ▸" : "对方 ◂")});
    top.append(cb, who, h("span", {style:"flex:1"}));
    top.append(h("button", {text:"↑", onclick:()=>{ if (i > 0){ arr.splice(i-1,0,arr.splice(i,1)[0]); commit(); markDirty(); renderAll(); } }}));
    top.append(h("button", {text:"↓", onclick:()=>{ if (i < arr.length-1){ arr.splice(i+1,0,arr.splice(i,1)[0]); commit(); markDirty(); renderAll(); } }}));
    top.append(h("button", {class:"warn", text:"✕", onclick:()=>{ arr.splice(i,1); commit(); markDirty(); renderAll(); }}));

    const ta = h("textarea", {rows:2});
    ta.value = m.text == null ? "" : String(m.text);
    ta.addEventListener("input", () => {
      if (m.text === ta.value) return;
      m.text = ta.value; commit("txt:bub"); markDirty(); renderPreview();
    });
    row.append(top, ta);
    box.append(row);
  });
  box.append(h("div", {class:"addrow"},
    h("button", {text:"＋ 我发一条", onclick:()=>{ arr.push({me:true, text:""}); commit(); markDirty(); renderAll(); }}),
    h("button", {text:"＋ 对方发一条", onclick:()=>{ arr.push({me:false, text:""}); commit(); markDirty(); renderAll(); }})));
  return box;
}

function renderReveals(t, bi, refresh){
  const box = h("div", {style:"margin-top:10px"});
  box.append(h("div", {class:"flabel"},
    h("span", {text:"读完这段 → 学会哪些官方口径"}),
    h("span", {class:"hint", text:"★ 选第一条（官方口径）才有用；选别的会让玩家学到跟判定不一致的说法"})));
  const arr = t.reveals || (t.reveals = []);
  if (!arr.length) box.append(h("div", {class:"empty", text:"（没有 —— 这段读完什么也不教）"}));

  arr.forEach((rv, i) => {
    const row = h("div", {class:"item", style:"padding:8px 9px;margin-bottom:6px"});
    const top = h("div", {style:"display:flex;gap:8px;align-items:center;margin-bottom:5px"});
    top.append(h("span", {style:"font-size:11px;color:var(--dim)", text:"#" + (i+1)}), h("span", {style:"flex:1"}));
    top.append(h("button", {class:"warn", text:"✕", onclick:()=>{ arr.splice(i,1); commit(); markDirty(); renderAll(); }}));
    row.append(top);

    const selF = h("select");
    factsOf(bi).forEach(f => {
      const op = h("option", {value:f.id, text:f.id + " —— " + short((f.prompts || [])[0], 30)});
      if (String(f.id) === String(rv.fact)) op.selected = true;
      selF.append(op);
    });
    selF.addEventListener("change", () => { rv.fact = selF.value; rv.value = ""; commit(); markDirty(); renderAll(); });
    row.append(h("div", {class:"flabel"}, h("span", {text:"事实"})), selF);

    const selV = h("select");
    valueOpts(bi, rv.fact).forEach(o => {
      const op = h("option", {value:o.v, text:o.l});
      if (String(o.v) === String(rv.value)) op.selected = true;
      selV.append(op);
    });
    selV.addEventListener("change", () => { rv.value = selV.value; commit(); markDirty(); renderAll(); });
    row.append(h("div", {class:"flabel"}, h("span", {text:"官方口径"})), selV);
    box.append(row);
  });

  box.append(h("div", {class:"addrow"},
    h("button", {text:"＋ 加一条揭示", onclick:()=>{
      const f = factsOf(bi)[0] || {};
      arr.push({fact:f.id || "", value:((f.values || [])[0] || {}).id || ""});
      commit(); markDirty(); renderAll();
    }})));
  return box;
}

function buildPhone(){
  const sh = sec("shell");
  const phoneEl = h("div", {class:"phone"});

  // 状态栏
  phoneEl.append(h("div", {class:"status"},
    h("span", {text: sh.time || "21:40"}),
    h("span", {class:"sig", text: sh.signal || ""})));

  // 屏幕
  const screen = h("div", {class:"screen"});
  const apps = h("div", {class:"apps"});
  const appDefs = [["messages", sh.app_messages], ["photos", sh.app_photos],
                   ["memo", sh.app_memo], ["notes", sh.app_notes]];
  const activeApp = view.kind === "group" ? "messages"
    : (view.kind === "album" ? "photos" : (view.kind === "memo" ? "memo" : (view.kind === "notes" ? "notes" : "messages")));
  appDefs.forEach(([k, label]) => apps.append(h("div", {class: k === activeApp ? "on" : ""}, label || "")));

  const content = h("div", {class:"body"});
  let title = "";
  if (view.kind === "group"){
    if (previewThread) { const r = threadPreview(previewThread, view.group, view.bg || 0); title = r.title; content.append(...r.nodes); }
    else { const r = listPreview(view.group, view.bg || 0); title = r.title; content.append(...r.nodes); }
  } else if (view.kind === "album"){
    title = sec("album").title || "相册";
    content.append(h("div", {class:"hint", text: fmt(sec("album").hint, [3, 5])}));
    content.append(h("div", {class:"card"}, h("div", {class:"note", text: fmt(sec("album").shot, ["发型"])})));
    content.append(h("div", {class:"card"}, h("div", {class:"note", text: fmt(sec("album").wipe, [2])})));
  } else if (view.kind === "memo"){
    title = sec("memo").title || "备忘录";
    content.append(h("div", {class:"hint", text: sec("memo").hint || ""}));
    content.append(h("div", {class:"card"},
      h("div", {class:"h"}, fmt(sec("memo").head_interrogator, ["哨所的老兵", "男"])),
      h("div", {class:"note", text: fmt(sec("memo").trait_line, ["多疑", "他谁也不信"])}),
      h("div", {class:"note", text:"办案二十年，谁在他面前装可怜都白搭。"}),
      h("div", {class:"note", text: fmt(sec("memo").like_line, ["干净利落、前后对得上的答复"])}),
      h("div", {class:"note", text: fmt(sec("memo").hate_line, ["临时现编的说法"])}),
      h("div", {class:"note", text: fmt(sec("memo").howto_line, ["在他面前千万别撒谎 —— 现编的说法他当场就能闻出味来。要么照档案答，要么干脆回避。"])})));
    content.append(h("div", {class:"card"}, h("div", {class:"h", text: sec("memo").head_cast || ""}),
      h("div", {class:"note", text: fmt(sec("memo").cast_body, ["沈棠","女","北环帮的联络人","北境香料行商","哨所的老兵","男","多疑","车夫·老崔","同行的车夫","男","沈棠"])})));
  } else if (view.kind === "notes"){
    // ★ 备注现在是「按轮次回放的问答记录」：
    //   第一轮整页空着（连说明文字都不写），第二轮起把前几轮的问与答摊出来。
    //   预览按「第二轮」的样子画 —— 那样才看得出长什么样。
    title = sec("notes").title || "备注";
    content.append(h("div", {class:"note", text: fmt(sec("notes").head_round, [1])}));
    content.append(h("div", {class:"card"},
      h("div", {class:"note", text: fmt(sec("notes").q_line, ["你说你从寒霜港来 —— 具体在城里哪一片？"])}),
      h("div", {class:"note", text: fmt(sec("notes").a_line, ["A. 寒霜港东侧旧城区，码头往上数第三条巷子"])})));
    content.append(h("div", {class:"card"},
      h("div", {class:"note", text: fmt(sec("notes").q_line, ["你这一车货，都运的什么？"])}),
      h("div", {class:"note", text: fmt(sec("notes").a_line, ["B. 布匹和铁器，都是不值钱的东西"])})));
  } else if (view.kind === "shell"){
    title = "外壳";
    content.append(h("div", {class:"hint", text:"状态栏与 App 名字 —— 看看底下的四个按钮。"}));
  } else {
    title = "手机";
    content.append(h("div", {class:"hint", text:"左边选一个界面，这里会显示它在游戏里的样子。"}));
  }

  screen.append(h("div", {class:"ptitle", text:title}));
  screen.append(h("hr"));
  screen.append(content);
  phoneEl.append(screen, apps);
  return phoneEl;
}

function fmt(tpl, args){
  tpl = tpl == null ? "" : String(tpl);
  if (countPh(tpl) !== args.length) return tpl;
  // 照抄 Godot 的 `tpl % args`：%s / %d 被换掉，%% 变成一个字面 %，
  // 所以正则要连后面的类型字母一起吃掉，不能只换掉那个 % 字符。
  let i = 0;
  return tpl.replace(/%(.)/g, (m, c) => {
    if (c === "%") return "%";
    const v = args[i]; i++;
    return v === undefined ? "" : String(v);
  });
}

function listPreview(group, bi){
  const gr = GROUPS.find(g => g.key === group) || GROUPS[0];
  const msg = sec("messages");
  const nodes = [];

  let n = 0;
  if (group === "interrogator") n = (phone().interrogator_sms || []).length;
  else n = threadsOf(group, bi).length;
  nodes.push(h("div", {class:"hint", text: fmt(msg.hint, [n, n])}));

  // ★ 不再按组写身份标题（「与审问官」「与同行的人」这些说明文字都删了）——
  //   直接排列表项，每条短信自己的头像、联系人名和语气就够说明它来自谁了。
  const g2 = GROUPS.find(x => x.key === group);
  if (group === "interrogator"){
    const arr = phone().interrogator_sms || [];
    if (arr.length) nodes.push(h("div", {class:"row"},
      h("span", {class:"av", text:"🕶"}),
      h("div", {class:"mid"},
        h("div", {class:"nm", style:"color:#f0554f", text: fmt(msg.interrogator_row, ["哨所的老兵", arr.length])}),
        h("div", {class:"pv", text: arr[arr.length-1]})),
      h("span", {class:"go", text: msg.btn_open || "看"})));
  } else {
    const arr = threadsOf(group, bi);
    arr.forEach(t => {
      const ms = t.messages || [];
      nodes.push(h("div", {class:"row"},
        h("span", {class:"av", text: t.avatar || "👤"}),
        h("div", {class:"mid"},
          h("div", {class:"nm", style:"color:" + g2.color, text:(t.contact || "?") + "  ●"}),
          h("div", {class:"pv", text: ms.length ? ms[ms.length-1].text : ""})),
        h("span", {class:"go", text: msg.btn_read || "读"})));
    });
  }
  return {title: msg.title || gr.label, nodes};
}

function threadPreview(id, group, bi){
  const msg = sec("messages");
  const nodes = [];
  let t = null, isComp = false;
  if (id === "__interrogator__") return intrPreview();

  if (group === "companion"){ t = threadsOf("companion", bi).find(x => String(x.id) === id); isComp = true; }
  if (!t) t = threadsOf("friends", bi).find(x => String(x.id) === id);
  if (!t) return {title: msg.title || "消息", nodes:[h("div", {class:"note", text:"（这条线程已经不在当前背景里了）"})]};

  const title = fmt(msg.thread_title, [t.contact || "?"]);
  nodes.push(h("div", {class:"note", text: msg.btn_back || "‹ 返回"}));
  (t.messages || []).forEach(m => nodes.push(h("div", {class:"bub " + (m.me ? "me" : "them"), text:m.text || ""})));
  if (!isComp && (t.reveals || []).length){
    nodes.push(h("div", {class:"hint", style:"color:#7fca9a", text:(msg.reveals_head || "") +
      (t.reveals || []).map(rv => "· 「" + rv.fact + "」").join(" ")}));
  }
  return {title: title, nodes: nodes};
}

function intrPreview(){
  const msg = sec("messages");
  const arr = phone().interrogator_sms || [];
  const nodes = [h("div", {class:"note", text: msg.btn_back || "‹ 返回"})];
  arr.forEach(s => nodes.push(h("div", {class:"bub intr", text:s})));
  nodes.push(h("div", {class:"note", text: msg.interrogator_tail || ""}));
  return {title: fmt(msg.thread_title, ["哨所的老兵"]), nodes: nodes};
}

let valTimer = null;
function scheduleValidate(){
  clearTimeout(valTimer);
  valTimer = setTimeout(() => { validateNow(); renderIssues(); renderStatus(); }, 400);
}

function validateNow(){
  const out = [];
  const err = (m, v) => out.push({lv:"e", m, v});
  const warn = (m, v) => out.push({lv:"w", m, v});

  if (!story.backgrounds || !story.backgrounds.length) err("没有任何背景 —— 游戏读不出场景");
  if (!story.phone || typeof story.phone !== "object") err("缺少 phone 段 —— 手机会全部退回出厂文案");
  const p = story.phone || {};

  // ---- 文案段的字段齐全 + 占位符个数 ----
  Object.keys(PHONE_FIELDS).forEach(name => {
    const data = p[name] || {};
    if (!p[name]) err("phone." + name + " 整段没了");
    PHONE_FIELDS[name].forEach(f => {
      const path = name + "." + f.k;
      const v = data[f.k];
      if (v === undefined || v === null || v === ""){
        warn("phone." + path + " 是空的（会退回出厂文案）");
        return;
      }
      const want = PH_EXPECT[path];
      const got = countPh(v);
      if (want === undefined){
        // 只提醒「真的写成了 %s / %d」的情况 —— 状态栏那种 🔋78% 是百分号，不是占位符
        const stray = specPh(v);
        if (stray > 0) warn("phone." + path + " 不是模板，但里面写了 " + stray
          + " 个 %s / %d 这类占位符 —— 游戏不会替换它，会原样印出来");
      } else if (got !== want){
        err("phone." + path + " 需要 " + want + " 个占位符，现在有 " + got + " 个 —— 格式化会失败，游戏会退回出厂文案");
      }
    });
  });

  // ---- 与审问官的短信 ----
  const intr = p.interrogator_sms || [];
  if (!intr.length) warn("phone.interrogator_sms 是空的 —— 掏手机掏太多次不会有任何反应");
  intr.forEach((s, i) => { if (!s) warn("phone.interrogator_sms 第 " + (i+1) + " 条是空的"); });

  // ---- 每套背景的短信 ----
  (story.backgrounds || []).forEach((bg, bi) => {
    const v = {kind:"group", group:"companion", bg:bi};
    const tag = "【" + (bg.name || bg.id || ("背景" + (bi+1))) + "】";
    const factIds = (bg.facts || []).map(f => f.id);
    const maxLv = Math.max(0, factIds.length - 1);

    const check = (arr, group) => {
      const ids = new Set();
      const byLevel = new Map();
      (arr || []).forEach((t, i) => {
        const label = tag + (group === "companion" ? " 与 C 的短信 " : " 与朋友的短信 ") + "第 " + (i+1) + " 条";
        if (!t.id) err(label + " 缺 id", v);
        else if (ids.has(t.id)) err(label + " 的 id 重复：" + t.id, v);
        ids.add(t.id);
        if (!t.contact) warn(label + " 没有联系人", v);
        if (!(t.messages || []).length) err(label + " 一条消息都没有", v);
        (t.messages || []).forEach((m, mi) => {
          if (!m.text) warn(label + " 第 " + (mi+1) + " 句是空的", v);
        });

        const lv = t.level;
        if (!Number.isInteger(lv)) err(label + " 的 level 必须是整数（0 起，第几关解锁）", v);
        else if (lv < 0 || lv > maxLv) err(label + " 的 level = " + lv + " 越界（本背景合法范围 0~" + maxLv + "）", v);
        else {
          if (byLevel.has(lv)) warn(tag + " 第 " + (lv+1) + " 关有两条" + (group === "companion" ? "「与 C」" : "「与朋友」") + "的短信同时解锁", v);
          byLevel.set(lv, t.id);
        }

        if (group === "companion"){
          if ((t.reveals || []).length)
            warn(label + " 带了 reveals —— 游戏不会读它（C 不给口径），删掉更干净", v);
        } else {
          (t.reveals || []).forEach((rv, ri) => {
            const f = (bg.facts || []).find(x => x.id === rv.fact);
            const rl = label + " 的第 " + (ri+1) + " 条揭示";
            if (!f) err(rl + "指向了不存在的事实 " + rv.fact, v);
            else {
              const canon = (f.values || [])[0] ? f.values[0].id : "";
              if (!(f.values || []).some(x => x.id === rv.value))
                err(rl + "指向的版本 " + rv.value + " 在事实 " + rv.fact + " 里不存在", v);
              else if (rv.value !== canon)
                warn(rl + "揭示的是「" + rv.value + "」而不是官方口径「" + canon + "」—— 玩家学到的口径会和判定不一致", v);
            }
          });
        }
      });
      // 每关都该有一条
      for (let i = 0; i <= maxLv; i++){
        if (!byLevel.has(i)) warn(tag + (group === "companion" ? " 与 C " : " 与朋友 ")
          + "第 " + (i+1) + " 关没有解锁的短信", v);
      }
    };

    if (!bg.companion_sms) warn(tag + " 没有 companion_sms（与 C 的短信整块缺失）", v);
    check(bg.sms, "friends");
    check(bg.companion_sms, "companion");

    // 与朋友的那一组必须揭示本关的官方口径（level 与 facts 顺序对齐）
    const order = (bg.facts || []).map(f => f.id);
    (bg.sms || []).forEach(t => {
      if (!Number.isInteger(t.level) || t.level < 0 || t.level >= order.length) return;
      const want = order[t.level];
      const got = (t.reveals || []).map(rv => rv.fact);
      if (got.indexOf(want) < 0)
        err(tag + " 与朋友的第 " + (t.level+1) + " 关那条短信揭示的是 [" + got.join("、") + "]，本关要问的是 " + want + " —— 没对齐", v);
    });
  });

  issues = out;
}

function renderIssues(){
  const host = $("issues"); if (!host) return;
  host.innerHTML = "";
  const e = issues.filter(x => x.lv === "e").length;
  const w = issues.length - e;
  const box = h("div", {class:"issbox"});
  const head = h("div", {class:"isshead " + (e ? "err" : (w ? "warn" : "good"))});
  head.append(h("span", {text: e ? "🚨 " + e + " 个错误" + (w ? " · " + w + " 个提醒" : "") :
    (w ? "⚠️ " + w + " 个提醒（不影响运行）" : "✅ 全部检查通过")}));
  const list = h("div", {class:"isslist", style:"display:none"});
  if (issues.length){
    head.append(h("span", {style:"flex:1"}));
    head.append(h("span", {class:"hint", text:"点击展开"}));
    head.addEventListener("click", () => {
      list.style.display = list.style.display === "none" ? "block" : "none";
    });
    issues.forEach(it => list.append(h("div", {class:"iss", onclick:()=>{ if (it.v) go(it.v); }},
      h("span", {class:"lv " + it.lv, text: it.lv === "e" ? "错误" : "提醒"}),
      h("span", {class:"m", text: it.m}))));
  }
  box.append(head, list);
  host.append(box);
}

function renderStatus(){
  const e = issues.filter(x => x.lv === "e").length;
  const w = issues.length - e;
  $("st-file").textContent = fileName + (dirty ? " *" : "");
  const p = phone();
  let nComp = 0, nFri = 0;
  bgs().forEach(b => { nComp += (b.companion_sms || []).length; nFri += (b.sms || []).length; });
  $("st-count").textContent =
    "🕶 " + (p.interrogator_sms || []).length + " / 🪶 " + nComp + " / 👥 " + nFri + " 条短信";
  $("st-iss").textContent = e ? ("🚨 " + e + " 错误" + (w ? " · " + w + " 提醒" : "")) : (w ? ("⚠️ " + w + " 提醒") : "✅ 校验通过");
  $("st-iss").style.color = e ? "var(--red)" : (w ? "var(--amber)" : "var(--ok)");
}

// ---------- 快捷键 ----------
document.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === "s"){ e.preventDefault(); save(false); }
  else if (k === "z" && !e.shiftKey){ e.preventDefault(); undo(); }
  else if (k === "y" || (k === "z" && e.shiftKey)){ e.preventDefault(); redo(); }
  else if (k === "o"){ e.preventDefault(); openFile(); }
});

$("btn-open").addEventListener("click", openFile);
$("btn-save").addEventListener("click", () => save(false));
$("btn-saveas").addEventListener("click", () => save(true));
$("btn-undo").addEventListener("click", undo);
$("btn-redo").addEventListener("click", redo);

// ---------- 启动 ----------
(async function boot(){
  const seed = getSeed();
  if (seed) loadStory(seed, "story.json（页面内置快照）", false);
  const fetched = await tryFetch();
  if (fetched){
    loadStory(fetched.json, "data/story.json（已自动读取）", false);
    toast("已自动读取 " + fetched.from, 2600);
  } else if (!seed){
    $("form").append(h("div", {class:"empty", text:"没有内置数据，也没有读到 data/story.json —— 请点「📂 打开」选一个文件"}));
  } else {
    toast("这是页面内置的快照。点「📂 打开」选 data/story.json 可以拿到最新版本。", 3600);
  }
})();
</script>
