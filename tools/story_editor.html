<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千面人 · 文本编辑器</title>
<style>
:root{
  --bg:#0e1015; --panel:#161a21; --panel2:#1d222c; --panel3:#242a36;
  --line:#2b3240; --line2:#3a4354;
  --fg:#e9edf4; --fg2:#b6becd; --dim:#7c869a;
  --amber:#e6a23c; --red:#f0554f; --ok:#4fc98a; --blue:#5aa9e6; --purple:#a98be0;
  --mono:"Cascadia Mono","Consolas","Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--fg); font:13px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--panel3);border-color:var(--line2)}
button.primary{background:#2c3d2f;border-color:#3f6a48;color:#bff0cf}
button.primary:hover{background:#354a39}
button.warn{background:#3d2b2b;border-color:#6a3f3f;color:#f5c0bd}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{
  font:inherit;color:var(--fg);background:#11141a;border:1px solid var(--line);
  border-radius:6px;padding:5px 8px;width:100%;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--amber);background:#0d1015}
textarea{resize:vertical;line-height:1.65;font-family:inherit}
input[type=number]{font-family:var(--mono)}
input[type=checkbox]{width:auto;accent-color:var(--amber)}
select{cursor:pointer}
::placeholder{color:#5b6376}

/* ---------- 顶栏 ---------- */
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-weight:700;letter-spacing:.5px;color:var(--amber);white-space:nowrap}
.brand small{color:var(--dim);font-weight:400;margin-left:6px;letter-spacing:0}
#fileinfo{color:var(--dim);font-size:12px;padding-left:10px;border-left:1px solid var(--line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fileinfo.dirty{color:var(--amber)}
.spacer{flex:1}

/* ---------- 主体 ---------- */
#body{flex:1;display:flex;min-height:0}
#side{width:280px;flex:0 0 280px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
#searchbox{padding:8px;border-bottom:1px solid var(--line)}
#nav,#results{overflow:auto;padding:6px}
#nav{flex:1}
.navgroup{margin-bottom:6px}
.navhead{padding:5px 8px;color:var(--dim);font-size:11px;letter-spacing:1px}
.navitem{padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.navitem:hover{background:var(--panel2)}
.navitem.on{background:#2a2417;color:var(--amber);box-shadow:inset 2px 0 0 var(--amber)}
.navitem .cnt{margin-left:auto;color:var(--dim);font-size:11px;font-family:var(--mono)}
.navitem.sub{padding-left:22px;font-size:12px;color:var(--fg2)}
.res{display:block;width:100%;text-align:left;margin-bottom:4px;padding:6px 8px;
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.res:hover{border-color:var(--amber)}
.res .where{color:var(--dim);font-size:11px}
.res .what{color:var(--fg2);font-size:12px;margin-top:2px;word-break:break-all}

#main{flex:1;overflow:auto;padding:14px 18px 60px;min-width:0}
#main h1{font-size:16px;margin:0 0 4px}
#main .sub{color:var(--dim);font-size:12px;margin-bottom:14px}

/* ---------- 区块 ---------- */
.sec{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.sechead{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel2);cursor:pointer}
.sechead:hover{background:var(--panel3)}
.sechead .t{font-weight:600}
.sechead .n{color:var(--dim);font-size:11px;font-family:var(--mono)}
.sechead .sp{flex:1}
.secbody{padding:12px}
.sec.fold .secbody{display:none}
.sec.fold .caret{transform:rotate(-90deg)}
.caret{display:inline-block;transition:transform .12s;color:var(--dim)}

/* ---------- 字段 ---------- */
.field{margin-bottom:11px}
.field:last-child{margin-bottom:0}
.flabel{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;color:var(--fg2);font-size:12px}
.flabel .k{font-family:var(--mono);color:var(--dim);font-size:11px}
.flabel .hint{color:#6b7488;font-size:11px}
.ro{opacity:.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid2>.field{margin-bottom:0}

/* ---------- 条目 ---------- */
.item{border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:8px}
.item.fold .itembody{display:none}
.itemhead{display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:pointer}
.itemhead:hover{background:var(--panel3)}
.itemhead .it{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itemhead .ops{display:flex;gap:3px;flex:0 0 auto}
.itemhead .ops button{padding:2px 6px;font-size:12px;background:transparent;border-color:transparent}
.itemhead .ops button:hover{background:var(--panel3);border-color:var(--line2)}
.itembody{padding:10px 11px 12px;border-top:1px solid var(--line)}
.badge{font-size:11px;padding:1px 6px;border-radius:20px;border:1px solid var(--line2);color:var(--dim);font-family:var(--mono)}
.badge.A{color:#f0a0a0;border-color:#6a3f3f}
.badge.B{color:#a0d8b0;border-color:#3f6a48}
.addrow{margin-top:8px;display:flex;gap:8px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.tabs button.on{background:#2a2417;border-color:var(--amber);color:var(--amber)}
.empty{color:var(--dim);padding:10px;text-align:center;border:1px dashed var(--line);border-radius:8px}

/* ---------- 预览 ---------- */
.pv{margin-top:10px;border:1px dashed var(--line2);border-radius:8px;background:#0c0f14;padding:11px}
.pv .pt{color:var(--dim);font-size:11px;letter-spacing:1px;margin-bottom:8px}
.pv .who{color:var(--amber);font-weight:600;margin-right:4px}
.pv .opt{padding:6px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);margin-top:5px}
.pv .opt .d{float:right;font-family:var(--mono);font-size:11px;color:var(--dim)}
.pv .opt.danger{border-color:#6a3f3f;background:#2a1c1c}
.pv .opt.ok{border-color:#3f6a48;background:#1b2a20}
.pv .plant{margin-top:8px;padding-left:9px;border-left:2px solid var(--purple);color:var(--fg2);font-size:12px}
.pv .leak{margin-top:8px;padding:7px 9px;border-radius:6px;background:#2a1c1c;border:1px solid #6a3f3f;color:#f5c0bd;font-size:12px}
.phone{max-width:330px;border:1px solid var(--line2);border-radius:14px;background:#0b0e13;padding:10px}
.phone .phead{text-align:center;color:var(--fg2);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}
.bub{max-width:82%;padding:6px 10px;border-radius:12px;margin:5px 0;font-size:12px;word-break:break-word}
.bub.me{margin-left:auto;background:#2c3d2f;border:1px solid #3f6a48}
.bub.them{background:var(--panel3);border:1px solid var(--line2)}
.traits{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--fg2)}

/* ---------- 校验 ---------- */
#issues{margin-bottom:12px}
.issbox{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.isshead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel2);cursor:pointer;font-weight:600}
.isshead.err{color:var(--red)} .isshead.warn{color:var(--amber)} .isshead.good{color:var(--ok)}
.isslist{padding:8px 12px;max-height:280px;overflow:auto}
.iss{display:flex;gap:8px;padding:3px 0;font-size:12px;cursor:pointer;border-radius:4px}
.iss:hover{background:var(--panel2)}
.iss .lv{flex:0 0 42px;font-family:var(--mono);font-size:11px}
.iss .lv.e{color:var(--red)} .iss .lv.w{color:var(--amber)}
.iss .m{color:var(--fg2);word-break:break-word}

/* ---------- 状态栏 ---------- */
#status{flex:0 0 auto;display:flex;gap:14px;align-items:center;padding:5px 12px;background:var(--panel);
  border-top:1px solid var(--line);color:var(--dim);font-size:12px;font-family:var(--mono)}
#toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:#252c38;
  border:1px solid var(--line2);border-radius:8px;padding:9px 16px;opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:99;max-width:80vw;text-align:center}
#toast.on{opacity:1}
.help{padding:12px;color:var(--fg2);font-size:12px;line-height:1.9}
.help code{font-family:var(--mono);background:#11141a;padding:1px 5px;border-radius:4px;color:var(--amber)}
.help b{color:var(--fg)}

/* ---------- 勾选组（衣物 id / 标签 / 槽位多选）---------- */
.msbox{border:1px solid var(--line);border-radius:8px;background:#11141a;padding:8px}
.msbox input[type=text]{width:100%;margin-bottom:6px}
.mslist{max-height:230px;overflow:auto;display:flex;flex-wrap:wrap;gap:4px}
.msitem{display:flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line);
  border-radius:999px;font-size:12px;cursor:pointer;color:var(--fg2);background:#161a22}
.msitem:hover{border-color:var(--line2);color:var(--fg)}
.msitem.on{border-color:var(--amber);color:var(--fg);background:#241d10}
.msitem input{margin:0}
/* 嵌套清单（每一关下面的若干条规则）往右缩一档，层级一眼看得出 */
.field .sec{margin-left:10px;border-left:2px solid var(--line)}

/* ---------- 第四十轮：服装数值 / 原貌 两个页签的表格 ---------- */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.row:last-child{margin-bottom:0}
.chk{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--fg2);cursor:pointer;user-select:none}
.dim{opacity:.5}
.sec.off{opacity:.62}
.btn.on{background:#2a2417;border-color:var(--amber);color:var(--amber)}
.btn.tiny{padding:1px 7px;font-size:12px;line-height:1.5}
.btn.danger{background:#3d2b2b;border-color:#6a3f3f;color:#f5c0bd}
.btn.danger:hover{background:#4a3434}

/* 表格：物品行 = 4 列，原貌行 = 3 列 */
.irow{display:grid;gap:8px;align-items:center;padding:4px 8px;border-top:1px solid var(--line)}
.irow.items{grid-template-columns:minmax(160px,1fr) 210px 210px 34px}
.irow.picks{grid-template-columns:minmax(140px,200px) 1fr 34px}
.irow.ihead{color:var(--dim);font-size:11px;border-top:0;background:var(--panel2);letter-spacing:.5px;
  position:sticky;top:0;z-index:1}
.irow.changed{background:rgba(230,162,60,.08)}
.irow.changed:hover{background:rgba(230,162,60,.13)}
.iname{display:flex;gap:6px;align-items:baseline;min-width:0;overflow:hidden}
.iname b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iname .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inum,.ipick,.iact{display:flex;gap:6px;align-items:center;min-width:0}
.inum input{width:72px;text-align:right}
.inum .hint,.ipick .hint{font-size:11px;color:var(--dim);white-space:nowrap}
.iact{justify-content:flex-end}
input.in{background:#11141a;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--fg)}
input.in:focus{border-color:var(--amber)}
input.in.sel{}
select.in{padding:3px 7px;width:100%;max-width:420px}
.presetlist .navitem{cursor:pointer}
.presetlist .navitem.dim{opacity:.55}
</style>
</head>
<body>

<header id="top">
  <div class="brand">千面人 · 文本编辑器<small>剧情 / 数值 / 文案 / 结局</small></div>
  <div id="fileinfo">未打开文件</div>
  <div class="spacer"></div>
  <button id="btn-open" title="打开一个 story.json">📂 打开</button>
  <button id="btn-save" class="primary" title="Ctrl+S">💾 保存</button>
  <button id="btn-saveas">另存为…</button>
  <button id="btn-gd" title="导出可粘贴回 ScenarioData.gd 的常量块">📋 回退常量</button>
  <button id="btn-undo" title="Ctrl+Z">↶</button>
  <button id="btn-redo" title="Ctrl+Shift+Z">↷</button>
</header>

<div id="body">
  <aside id="side">
    <div id="searchbox"><input id="search" placeholder="搜索短信 / 对话 / 选项文本…"></div>
    <div id="nav"></div>
    <div id="results"></div>
  </aside>
  <main id="main"></main>
</div>

<footer id="status">
  <span id="st-file">—</span><span id="st-count"></span><span id="st-iss"></span>
</footer>
<div id="toast"></div>
<input type="file" id="fileinput" accept=".json,application/json" style="display:none">

知道你是谁，也知道你在装谁。\n他不出手，也不揭穿 —— 他只是在旁边看着，偶尔替那位老兵，把话头往你身上引一引。","interrogator":"哨所的老兵","interrogator_gender":"男","companion":{"name":"车夫·老崔","relation":"同行的车夫","gender":"男","desc":"替你赶车过哨卡的人。他认得你颈侧那道烙印 —— 知道你是北环帮的联络人，也知道你在装香料商。他不揭穿，只在旁边替老兵把话头往你身上引。"},"cover_role":"北境香料行商","true_role":"北环帮的联络人","true_name":"沈棠","levels":[{"intro":"黑石山脉北麓的官道关隘。\n风从垭口灌下来，栅栏上的霜一夜没化。火盆烧得半死不活，四五个兵丁缩在背风的墙根。\n你赶着一队驮马走到哨卡前，被拦了下来 —— 例行查验。\n负责查验的是个快五十的老兵。他翻着你的货单，目光却总往你领口飘。\n\n你身边是替你赶车的老崔。他知道你是谁，也知道你在装谁。\n他不出手，也不揭穿 —— 他只是在旁边看着，偶尔替那位老兵，把话头往你身上引一引。"},{"intro":"第一轮的问话没能把你钉死，老兵把货单合上，却又从抽屉底下抽出另一本更旧的册子。\n火盆添了新炭，栅栏外的风更冷了。他让你把来处、货、还有刚才那些话，从头再说一遍 —— 这一次，他记得你上一遍是怎么说的。\n\n老崔靠在门框上，没看你，也没打算替你圆。"}],"cards":[{"id":"b_identity","topic":"身份","owner":"B","text":"我是北境香料行的行商，常年往返寒霜港与黑石山脉。"},{"id":"b_birth","topic":"来处","owner":"B","text":"寒霜港东侧旧城区，码头往上数第三条巷子。"},{"id":"b_goods","topic":"货品","owner":"B","text":"丁香、肉桂、肉豆蔻，偶尔捎带些北境的琥珀。"},{"id":"b_scar","topic":"手背的痕迹","owner":"B","text":"幼年在香料工坊帮工，被蒸煮锅的蒸汽烫的。"},{"id":"b_purpose","topic":"此行目的","owner":"B","text":"替东家送样品去公爵府邸，顺路讨去年欠下的货款。"},{"id":"a_signal","topic":"敲门暗号","owner":"A","text":"三长两短敲三下门板 —— 北环码头的接头信号。"},{"id":"a_contact","topic":"上线","owner":"A","text":"「灰隼」是我的上线，只在满月夜的老灯塔见面。"},{"id":"a_cargo","topic":"驮队夹层","owner":"A","text":"夹层里运的是禁运硝石，香料只是幌子。"},{"id":"a_brand","topic":"颈侧的烙印","owner":"A","text":"那是北环帮的入伙烙印，烧红的船锚铁按上去的。"},{"id":"a_debt","topic":"旧账","owner":"A","text":"去年冬天在寒霜港欠了「独眼」三百金，至今没还。"},{"id":"a_tunnel","topic":"密道","owner":"A","text":"黑石山脉北坡有条不走官道的雪洞，只有帮里人知道。"},{"id":"a_boss","topic":"帮里的规矩","owner":"A","text":"货丢了可以，名字漏了不行 —— 这是北环帮唯一一条死规矩。"}],"questions":[{"id":"q_b_birth","level":-1,"speaker":"interrogator","text":"你说你从寒霜港来。旧城区那股鱼腥味，现在还散得掉吗？","card":"b_birth","options":[{"text":"散不掉。码头往上数第三条巷子，一到夏天最难熬。","tone":"correct"},{"text":"鱼腥味？我走的时候那一片早就拆了。","tone":"bluff"},{"text":"这个……我不太想聊家乡的事。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_birth 卡，归属 B）"},{"id":"q_a_brand","level":-1,"speaker":"interrogator","text":"（他忽然前倾，目光钉在你领口）你颈侧那道印子 ":"档案题（来自 a_debt 卡，归属 A）"},{"id":"q_fact_origin_new","level":0,"speaker":"interrogator","text":"你说你从寒霜港来 —— 具体在城里哪一片？","fact":"origin","options":[{"text":"寒霜港东侧旧城区，码头往上数第三条巷子","tone":"version","value":"harbor"},{"text":"黑石山脚下的小镇，离官道不远","tone":"version","value":"inland"},{"text":"北境靠冻原的边地，一年有半年在下雪","tone":"version","value":"north"}],"note":"事实题：本轮新问的「origin」"},{"id":"q_fact_origin_recall","level":-1,"speaker":"interrogator","text":"（他忽然换了个问法）你老家，是在水边还是山里？","fact":"origin","recall":true,"options":[{"text":"寒霜港东侧旧城区，码头往上数第三条巷子","tone":"version","value":"harbor"},{"text":"黑石山脚下的小镇，离官道不远","tone":"version","value":"inland"},{"text":"北境靠冻原的边地，一年有半年在下雪","tone":"version","value":"north"}],"note":"事实题：跨轮复问「origin」（哪一轮复问由运行时决定）"},{"id":"q_fact_goods_new","level":1,"speaker":"interrogator","text":"你这一车都运的什么货？","fact":"goods","options":[{"text":"丁香、肉桂、肉豆蔻，偶尔捎带些北境的琥珀","tone":"version","value":"spice"},{"text":"布匹和铁器，都是不值钱的粗货","tone":"version","value":"cloth"},{"text":"药材为主，还有些南边来的蜜饯","tone":"version","value":"medicine"}],"note":"事实题：本轮新问的「goods」"},{"id":"q_fact_goods_recall","level":-1,"speaker":"interrogator","text":"（翻着货单）香料之外，还捎带别的吗？","fact":"goods","recall":true,"options":[{"text":"丁香、肉桂、肉豆蔻，偶尔捎带些北境的琥珀","tone":"version","value":"spice"},{"text":"布匹和铁器，都是不值钱的粗货","tone":"version","value":"cloth"},{"text":"药材为主，还有些南边来的蜜饯","tone":"version","value":"medicine"}],"note":"事实题：跨轮复问「goods」（哪一轮复问由运行时决定）"},{"id":"q_companion_origin","level":0,"speaker":"companion","text":"「大人，我这位同伴是黑石山脚那边来的吧？我记得他提过。」","fact":"origin","plant":"审讯官没接话，只是把「黑石山」三个字也写进了册子 —— 现在他手里有两个版本。","options":[{"text":"「你记错了。我从寒霜港来，码头往上第三条巷子。」","tone":"version","suspicion":-2,"value":"harbor"},{"text":"「……对，山脚那边。」","tone":"version","suspicion":16,"value":"inland"},{"text":"「我不太想聊家乡。」","tone":"evade","suspicion":6}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_goods","level":1,"speaker":"companion","text":"「说起来，您那车货 —— 是布匹吧？我记得您说过。」","fact":"goods","plant":"「货单」两个字被他咬得很轻 —— 审讯官翻页的手停了一下。","options":[{"text":"「是香料。丁香、肉桂、肉豆蔻，货单上写着。」","tone":"version","suspicion":-2,"value":"spice"},{"text":"「……也有几匹布。」","tone":"version","suspicion":16,"value":"cloth"},{"text":"「货的事，您看单子就好。」","tone":"evade","suspicion":6}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_blind_border_0","level":0,"speaker":"interrogator","text":"上月十一，你在哪处落的脚？","setup":"档案里没有这一天 —— 你也没跟任何人提过。","options":[{"text":"「十一那天我在青石镇的悦来栈歇的，掌柜姓周。」","tone":"made_up"},{"text":"「十一……记不真切了，那阵子一直在赶路。」","tone":"bluff"},{"text":"「您问这个做什么？我得翻翻货单才想得起来。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_border_1","level":1,"speaker":"interrogator","text":"你左腕上那只银镯子，哪儿来的？","setup":"档案里没有镯子 —— 你腕上本来也没戴过。","options":[{"text":"「我娘留下的。出关前她塞给我的。」","tone":"made_up"},{"text":"「旧东西了，早不知道搁哪儿去了。」","tone":"bluff"},{"text":"「您看错了 —— 我不戴那些玩意儿。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"}],"interference_lines":["「说起来，大人 —— 我这位同伴的左手，好像一直不太方便呢。」","「他上次提到过一件事……啊，没什么，我记错了。」","（他忽然咳嗽了一声，把审讯官的视线引向你的领口）","「您不觉得他说话的腔调，不太像寒霜港那边的人吗？」","（他慢条斯理地把自己那只完好的手放到桌上，正好在你旁边）","「北边来的商人，手上一般不会有那种印子吧？」"],"facts":[{"id":"origin","prompts":["你说你从寒霜港来 —— 具体在城里哪一片？","（他忽然换了个问法）你老家，是在水边还是山里？"],"values":[{"id":"harbor","label":"寒霜港东侧旧城区，码头往上数第三条巷子"},{"id":"inland","label":"黑石山脚下的小镇，离官道不远"},{"id":"north","label":"北境靠冻原的边地，一年有半年在下雪"}]},{"id":"goods","prompts":["你这一车都运的什么货？","（翻着货单）香料之外，还捎带别的吗？"],"values":[{"id":"spice","label":"丁香、肉桂、肉豆蔻，偶尔捎带些北境的琥珀"},{"id":"cloth","label":"布匹和铁器，都是不值钱的粗货"},{"id":"medicine","label":"药材为主，还有些南边来的蜜饯"}]}],"sms":[{"id":"sms_sister","level":0,"contact":"阿姐","avatar":"👩","reveals":[{"fact":"origin","value":"harbor"}],"messages":[{"me":false,"text":"到哪儿了？娘天天问你什么时候回。"},{"me":true,"text":"刚到关口。东侧旧城区那间房，你替我看着点。"},{"me":false,"text":"码头往上第三条巷子那间？漏雨了，我让人补过。"},{"me":true,"text":"多谢。一到夏天那味儿最难熬，你多开窗。"}]},{"id":"sms_boss","level":1,"contact":"东家·鲁伯","avatar":"🧔","reveals":[{"fact":"goods","value":"spice"}],"messages":[{"me":false,"text":"货备齐了没有？公爵府那边催了三回。"},{"me":true,"text":"齐了。丁香、肉桂、肉豆蔻各三包，琥珀我随身带着。"},{"me":false,"text":"顺道把去年那笔货款要回来，别再让他拖。"},{"me" ","text":"南边的水乡，芦荡边上一个小镇，名字您未必听过。"},{"id":"b_goods","topic":"随身行头","owner":"B","text":"一把七弦琴，一只装换洗衣物的布袋，就这些。"},{"id":"b_scar","topic":"手背的痕迹","owner":"B","text":"早年在码头搬货，被缆绳勒出来的。"},{"id":"b_purpose","topic":"此行目的","owner":"B","text":"听说这儿的驿丞爱听曲，想来讨个落脚的地方。"},{"id":"a_tune","topic":"记谱的暗号","owner":"A","text":"那支《芦荡月》的第三段，其实是「货已到手」的暗号。"},{"id":"a_contact","topic":"派单的人","owner":"A","text":"只认铜牌不认脸。牌子背面刻着三道横纹的就是我的人。"},{"id":"a_case","topic":"琴箱夹层","owner":"A","text":"琴箱夹层里放的是淬了毒的短刃，一共七把。"},{"id":"a_mark","topic":"左腕的旧伤","owner":"A","text":"那是第一次失手留下的 —— 目标的反手刀划的。"},{"id":"a_debt","topic":"欠的命","owner":"A","text":"三年前我放过一个不该放过的人，公会一直记着这笔账。"},{"id":"a_safehouse","topic":"落脚点","owner":"A","text":"城南棺材铺的后院，掌柜姓周，敲三下门框他就明白。"},{"id":"a_rule","topic":"公会的规矩","owner":"A","text":"收钱之前不能问名字，收钱之后不能留活口。"}],"questions":[{"id":"q_b_birth","level":-1,"speaker":"interrogator","text":"你说你从南边水乡来。那边端午的龙舟，是从哪条河下水的？","card":"b_birth","options":[{"text":"芦荡西边那条，叫柳溪。水浅，船得挑小的。","tone":"correct"},{"text":"河名我记不清了，走的时候还小。","tone":"bluff"},{"text":"……家乡的事，我不太想说。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_birth 卡，归属 B）"},{"id":"q_a_mark","level":-1,"speaker":"interrogator","text":"（他盯着你挽起的袖口）你左腕上那道疤，看着不像缆绳勒的。","card":"a_mark","options":[{"text":"那是第一次失手留下的 —— 目标的反手刀划的。","tone":"leak"},{"text":"小时候摔进石臼里磕的。","tone":"bluff"},{"text":"旧伤了，早忘了怎么来的。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_mark 卡，归属 A）"},{"id":"q_b_scar","level":-1,"speaker":"interrogator","text":"把手伸出来。手背上这片痕迹，怎么弄的？","card":"b_scar","options":[{"text":"早年在码头搬货，被缆绳勒出来的。","tone":"correct"},{"text":"打猎时被火燎的。","tone":"bluff"},{"text":"不值一提的小伤。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_scar 卡，归属 B）"},{"id":"q_a_case","level":-1,"speaker":"interrogator","text":"（敲了敲琴箱）你这琴箱，比一般的沉。","card":"a_case","options":[{"text":"琴箱夹层里放的是淬了毒的短刃，一共七把。","tone":"leak"},{"text":"老木头，实心的，当然沉。","tone":"bluff"},{"text":"琴箱是师父传的，我没打开看过。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_case 卡，归属 A）"},{"id":"q_b_purpose","level":-1,"speaker":"interrogator","text":"你在这镇上，到底想做什么？","card":"b_purpose","options":[{"text":"听说这儿的驿丞爱听曲，想来讨个落脚的地方。","tone":"correct"},{"text":"等一个朋友，私事。","tone":"bluff"},{"text":"……混口饭吃罢了。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_purpose 卡，归属 B）"},{"id":"q_a_contact","level":-1,"speaker":"interrogator","text":"（压低声音）你在南边，跟谁搭线？","card":"a_contact","options":[{"text":"只认铜牌不认脸。牌子背面刻着三道横纹的就是我的人。","tone":"leak"},{"text":"跟几家茶楼，都是正经生意。","tone":"bluff"},{"text":"我不明白您在问什么。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_contact 卡，归属 A）"},{"id":"q_b_goods","level":-1,"speaker":"interrogator","text":"你身上就带这些？","card":"b_goods","options":[{"text":"一把七弦琴，一只装换洗衣物的布袋，就这些。","tone":"correct"},{"text":"还有几件换钱的首饰，压在箱底。","tone":"bluff"},{"text":"出门在外，东西越少越好。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_goods 卡，归属 B）"},{"id":"q_a_safehouse","level":-1,"speaker":"interrogator","text":"（忽然换了个话题）城南棺材铺的掌柜，姓什么来着？","card":"a_safehouse","options":[{"text":"掌柜姓周，敲三下门框他就明白。","tone":"leak"},{"text":"棺材铺？我没去过城南。","tone":"bluff"},{"text":"我……不太清楚您说的是哪家。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_safehouse 卡，归属 A）"},{"id":"q_fact_origin_new","level":0,"speaker":"interrogator","text":"你说你从南边水乡来 —— 哪个镇子？","fact":"origin","options":[{"text":"芦荡边上的柳溪镇，水浅，船得挑小的","tone":"version","value":"reed"},{"text":"西边山坳里的小村子，一年到头见不着外人","tone":"version","value":"mountain"},{"text":"府城里，热闹得很，我是在街面上长大的","tone":"version","value":"city"}],"note":"事实题：本轮新问的「origin」"},{"id":"q_fact_origin_recall","level":-1,"speaker":"interrogator","text":"（他换了个问法）你老家靠水还是靠山？","fact":"origin","recall":true,"options":[{"text":"芦荡边上的柳溪镇，水浅，船得挑小的","tone":"version","value":"reed"},{"text":"西边山坳里的小村子，一年到头见不着外人","tone":"version","value":"mountain"},{"text":"府城里，热闹得很，我是在街面上长大的","tone":"version","value":"city"}],"note":"事实题：跨轮复问「origin」（哪一轮复问由运行时决定）"},{"id":"q_fact_instrument_new","level":1,"speaker":"interrogator","text":"你那把琴，哪儿来的？","fact":"instrument","options":[{"text":"师父传的，跟了我十年，漆掉了半边也舍不得换","tone":"version","value":"master"},{"text":"旧货市上淘的，不值几个钱","tone":"version","value":"bought"},{"text":"自己削的，凑合能用就行","tone":"version","value":"made"}],"note":"事实题：本轮新问的「instrument」"},{"id":"q_fact_instrument_recall","level":-1,"speaker":"interrogator","text":"（敲了敲琴身）这琴跟着你多久了？","fact":"instrument","recall":true,"options":[{"text":"师父传的，跟了我十年，漆掉了半边也舍不得换","tone":"version","value":"master"},{"text":"旧货市上淘的，不值几个钱","tone":"version","value":"bought"},{"text":"自己削的，凑合能用就行","tone":"version","value":"made"}],"note":"事实题：跨轮复问「instrument」（哪一轮复问由运行时决定）"},{"id":"q_companion_origin","level":0,"speaker":"companion","text":"「大人，我这位同伴是府城来的吧？听他说话就不像乡下人。」","fact":"origin","plant":"「不像乡下人」—— 审讯官点了点头，像是同意，又像只是记下了。","options":[{"text":"「芦荡边上的柳溪镇，小地方。」","tone":"version","suspicion":-2,"value":"reed"},{"text":"「……府城边上。」","tone":"version","suspicion":16,"value":"city"},{"text":"「问这些做什么。」","tone":"evade","suspicion":6}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_instrument","level":1,"speaker":"companion","text":"「您那把琴，不是旧货市上淘的吗？」","fact":"instrument","plant":"审讯官看了一眼那只琴箱 —— 旧货市上淘的琴，不会配这么讲究的箱子。","options":[{"text":"「师父传的，跟了我十年。」","tone":"version","suspicion":-2,"value":"master"},{"text":"「……淘的，不值钱。」","tone":"version","suspicion":16,"value":"bought"},{"text":"「一把琴而已，有什么好说的。」","tone":"evade","suspicion":6}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_blind_inn_0","level":0,"speaker":"interrogator","text":"你上回打这儿过，是哪一年？","setup":"档案里没有你的行踪 —— 驿站的登记簿上也没有你的名字。","options":[{"text":"「三年前，也是这个季节，住的东厢第二间。」","tone":"made_up"},{"text":"「记不清了，我这行当一年到头都在路上。」","tone":"bluff"},{"text":"「驿丞大人，您这儿一天过多少人，还记得住谁？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_inn_1","level":1,"speaker":"interrogator","text":"你琴箱里那把旧琴，是谁给你做的？","setup":"档案里没提过制琴的人 —— 你也不知道。","options":[{"text":"「城南的郑师傅，他专做这种小尺寸的。」","tone":"made_up"},{"text":"「街边买来的，谁做的早忘了。」","tone":"bluff"},{"text":"「一把旧琴罢了，值得您这么问？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"}],"interference_lines":["「大人，我这位同伴的琴，好像从来不让人碰呢。」","「他上回提起过一个姓周的掌柜……啊，没什么，我记错了。」","（他忽然咳了一声，把驿丞的视线引向你的手腕）","「您不觉得他这双手，不太像弹了十年琴的人吗？」","（他慢条斯理地把自己的琴横在桌上，正好在你旁边）","「走南闯北的琴师，身上一般不会带着那种味道吧？」"],"facts":[{"id":"origin","prompts":["你说你从南边水乡来 —— 哪个镇子？","（他换了个问法）你老家靠水还是靠山？"],"values":[{"id":"reed","label":"芦荡边上的柳溪镇，水浅，船得挑小的"},{"id":"mountain","label":"西边山坳里的小村子，一年到头见不着外人"},{"id":"city","label":"府城里，热闹得很，我是在街面上长大的"}]},{"id":"instrument","prompts":["你那把琴，哪儿来的？","（敲了敲琴身）这琴跟着你多久了？"],"values":[{"id":"master","label":"师父传的，跟了我十年，漆掉了半边也舍不得换"},{"id":"bought","label":"旧货市上淘的，不值几个钱"},{"id":"made","label":"自己削的，凑合能用就行"}]}],"sms":[{"id":"sms_master","level":0,"contact":"师父·沈三","avatar":"🧓","reveals":[{"fact":"origin","value":"reed"}],"messages":[{"me":false,"text":"琴还带着吗？"},{"me":true,"text":"带着。师父传的那把，跟了我十年了。"},{"me":false,"text":"柳溪那边水浅，你小时候学琴就在芦荡边上。别忘了根。"},{"me":true,"text":"忘不了。琴漆掉了半边，我也没舍得换。"}]},{"id":"sms_luthier","level":1,"contact":"琴行的老账房","avatar":"🧓","reveals":[{"fact":"instrument","value":"master"}],"messages":[{"me":false,"text":"你那把琴，是沈三手上传下来的吧？漆都掉了半边。"},{"me":true,"text":"是。跟了我十年，舍不得换。"},{"me":false,"text":"驿站里识货的人多，来路你可别说岔了。"},{"me":true,"text":"就说师父传的，没别的说法。"}]}],"companion_sms":[{"id":"c_inn_0","level":0,"contact":"琴师·阿武","avatar":"🎻","messages":[{"me":false,"text":"进门那一下，你的手先摸的是琴，不是门框。"},{"me":true,"text":"顺手。"},{"me":false,"text":"卖艺的人不会顺手摸琴。你顺的是别的习惯。"}]},{"id":"c_inn_1","level":1,"contact":"琴师·阿武","avatar":"🎻","messages":[{"me":false,"text":"驿丞问你的谱子，你答的是「自己记的」。"},{"me":true,"text":"本来就是我自己记的。"},{"me":false,"text":"记谱的人不会拿笔杆的姿势。你是写字的。"}]}],"endings":{"recognized_line":"%s抬起头，视线在你脸上停住了。\n\n他看了很久，久到旁边的人都安静下来。然后他放下手里的册子，念出了那个你早就不打算再听见的名字 ——\n\n「怎么是你，%s。」\n\n%s\n\n【潜伏失败 · 一眼认出】","recognized_note":"这一身打扮没能把他记忆里的那个 A 盖住 —— 门还没关上，他就叫出了你的名字。本轮到此为止。","exposure_line":"%s只扫了你一眼，脸色就变了。\n\n%s\n\n「把他拿下 —— 这个人根本不像他自己说的那样。」\n\n【潜伏失败 · 身份暴露】","exposure_reason_contrast":"你这一身几乎还是 A 本人的样子 —— 反差值 %d，低于要求的 %d 点（仍有 %d 处与原貌一致）。","exposure_reason_defects":"而且以下缺陷暴露在外：","exposure_r  B）"},{"id":"q_a_rule","level":-1,"speaker":"interrogator","text":"（忽然换了个话题）递出去的信，你留底吗？","card":"a_rule","options":[{"text":"递出去的消息不许留副本，看过就烧。","tone":"leak"},{"text":"当然留底，万一出了岔子好对账。","tone":"bluff"},{"text":"……看是什么信吧。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_rule 卡，归属 A）"},{"id":"q_fact_origin_new","level":0,"speaker":"interrogator","text":"你说你家在城南书坊街 —— 铺子在街口还是街尾？","fact":"origin","options":[{"text":"书坊街街尾，开了三代人的笔墨铺","tone":"version","value":"tail"},{"text":"街口，我爹那一辈才开的，年头不算长","tone":"version","value":"head"},{"text":"不在书坊街，在旧市口那边，铺面很小","tone":"version","value":"market"}],"note":"事实题：本轮新问的「origin」"},{"id":"q_fact_origin_recall","level":-1,"speaker":"interrogator","text":"（他换了个问法）你家那铺子，开了多少年？","fact":"origin","recall":true,"options":[{"text":"书坊街街尾，开了三代人的笔墨铺","tone":"version","value":"tail"},{"text":"街口，我爹那一辈才开的，年头不算长","tone":"version","value":"head"},{"text":"不在书坊街，在旧市口那边，铺面很小","tone":"version","value":"market"}],"note":"事实题：跨轮复问「origin」（哪一轮复问由运行时决定）"},{"id":"q_fact_skill_new","level":1,"speaker":"interrogator","text":"你这手字，跟谁学的？","fact":"skill","options":[{"text":"家里三代做笔墨，自小跟着抄，手是练出来的","tone":"version","value":"family"},{"text":"在城南的义学里练过几年","tone":"version","value":"academy"},{"text":"自己照着旧帖描的，没正经拜过师","tone":"version","value":"self"}],"note":"事实题：本轮新问的「skill」"},{"id":"q_fact_skill_recall","level":-1,"speaker":"interrogator","text":"（翻着你抄的册子）练了多少年了？","fact":"skill","recall":true,"options":[{"text":"家里三代做笔墨，自小跟着抄，手是练出来的","tone":"version","value":"family"},{"text":"在城南的义学里练过几年","tone":"version","value":"academy"},{"text":"自己照着旧帖描的，没正经拜过师","tone":"version","value":"self"}],"note":"事实题：跨轮复问「skill」（哪一轮复问由运行时决定）"},{"id":"q_companion_origin","level":0,"speaker":"companion","text":"「执事大人，我这位同伴说过，他家铺子在旧市口那边。」","fact":"origin","plant":"「旧市口」被记了下来 —— 一个府里的抄写，家在哪儿不该有两说。","options":[{"text":"「在书坊街街尾，开了三代人。」","tone":"version","suspicion":-2,"value":"tail"},{"text":"「……对，旧市口。」","tone":"version","suspicion":16,"value":"market"},{"text":"「我不记得跟你说过这个。」","tone":"evade","suspicion":6}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_skill","level":1,"speaker":"companion","text":"「您这手字，是在义学里练出来的吧？」","fact":"skill","plant":"审讯官把你抄的那页翻过去，对着光看了看笔锋 —— 什么也没说。","options":[{"text":"「家里三代做笔墨，自小跟着抄。」","tone":"version","suspicion":-2,"value":"family"},{"text":"「……在义学待过几年。」","tone":"version","suspicion":16,"value":"academy"},{"text":"「字而已，能看就行。」","tone":"evade","suspicion":6}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_blind_manor_0","level":0,"speaker":"interrogator","text":"你是哪一年入的府？引荐人是谁？","setup":"档案里没有入府记录 —— 名册上也翻不到你的名字。","options":[{"text":"「前年秋天，是账房的刘管事引荐的。」","tone":"made_up"},{"text":"「去年来应募的，具体经谁的手我记不清了。」","tone":"bluff"},{"text":"「名册上应当有，执事大人一查便知。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_manor_1","level":1,"speaker":"interrogator","text":"你住的角房，隔壁那间现在住着谁？","setup":"档案里没有角房的记录 —— 你没留意过隔壁。","options":[{"text":"「住着一位姓陈的老仆，腿脚不太方便。」","tone":"made_up"},{"text":"「隔壁……似乎一直空着，我没怎么留意。」","tone":"bluff"},{"text":"「同房的事我从不多问 —— 府里的规矩。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"}],"interference_lines":["「执事大人，我这位同伴的耳朵后面，好像一直不太舒服。」","「他上次提过东角门……啊，没什么，是我记错了。」","（他忽然把手里的笔搁下，声音正好让执事听见）","「您不觉得他握笔的姿势，不太像抄了十年册子的人吗？」","（他慢条斯理地把自己的手摊在桌上，正好在你旁边）","「在府里做抄写的，手背上一般不会留着那种印子吧？」"],"facts":[{"id":"origin","prompts":["你说你家在城南书坊街 —— 铺子在街口还是街尾？","（他换了个问法）你家那铺子，开了多少年？"],"values":[{"id":"tail","label":"书坊街街尾，开了三代人的笔墨铺"},{"id":"head","label":"街口，我爹那一辈才开的，年头不算长"},{"id":"market","label":"不在书坊街，在旧市口那边，铺面很小"}]},{"id":"skill","prompts":["你这手字，跟谁学的？","（翻着你抄的册子）练了多少年了？"],"values":[{"id":"family","label":"家里三代做笔墨，自小跟着抄，手是练出来的"},{"id":"academy","label":"在城南的义学里练过几年"},{"id":"self","label":"自己照着旧帖描的，没正经拜过师"}]}],"sms":[{"id":"sms_mother","level":0,"contact":"娘","avatar":"👵","reveals":[{"fact":"origin","value":"tail"}],"messages":[{"me":false,"text":"铺子今天没开张，风大。"},{"me":true,"text":"娘，别站在门口。街尾那一段最招风。"},{"me":false,"text":"知道。你爷爷刻的招牌还挂着呢 —— 「三代笔墨」，漆都掉了大半。"},{"me":true,"text":"别摘。我在这边抄册子，也是靠这手字吃饭。"}]},{"id":"sms_carver","level":1,"cont 开，往你身上补一句。"},{"intro":"验货官把港簿合上，却又从抽屉里摸出一本旧的。\n潮水涨了一截，值房里的气灯晃了晃 —— 他让你把船、货、还有昨夜子时的事，从头再说一遍。\n\n阿鲛靠在门框上，把缆绳在手里绕了两圈。"}],"cards":[{"id":"b_identity","topic":"身份","owner":"B","text":"我在西码头收渔获，再转手卖给城里的鱼行。"},{"id":"b_birth","topic":"来处","owner":"B","text":"就住在这儿，灯塔下头那片棚户，土生土长。"},{"id":"b_goods","topic":"货品","owner":"B","text":"今早三筐鲱鱼、两筐青口，都是近海捞的。"},{"id":"b_scar","topic":"手背的痕迹","owner":"B","text":"收网的时候被缆绳绞的，年年都要添新伤。"},{"id":"b_purpose","topic":"此行目的","owner":"B","text":"送两筐新鲜货给值房的大人尝尝，顺带办通关文书。"},{"id":"a_signal","topic":"灯塔灯语","owner":"A","text":"灯塔亮三下灭两下，就是「今晚可以进港」。"},{"id":"a_contact","topic":"接头的人","owner":"A","text":"只在退潮时见，站在旧船坞第二根桩子边上。"},{"id":"a_cargo","topic":"舱底","owner":"A","text":"舱底隔了一层，装的是南边来的火药，上面压着鱼。"},{"id":"a_mark","topic":"掌心的烫痕","owner":"A","text":"那是船上的炉子翻了，我拿手去挡，留了这块。"},{"id":"a_debt","topic":"欠的抽成","owner":"A","text":"港务那边抽三成，我欠了两个月的没交。"},{"id":"a_channel","topic":"暗水道","owner":"A","text":"灯塔西边那道礁缝，涨潮时能过小船，官船进不去。"},{"id":"a_rule","topic":"船上的规矩","owner":"A","text":"上了船就不问货，问货的会被丢下海。"}],"questions":[{"id":"q_b_birth","level":-1,"speaker":"interrogator","text":"灯塔下头那片棚户，一共几排？","card":"b_birth","options":[{"text":"四排。最靠海那排去年被浪打塌了半边。","tone":"correct"},{"text":"棚户早拆了，我搬走好几年了。","tone":"bluff"},{"text":"……那边的事，我不太想提。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_birth 卡，归属 B）"},{"id":"q_a_mark","level":-1,"speaker":"interrogator","text":"（他忽然抓住你的手翻过来）掌心上这块，不像缆绳绞的。","card":"a_mark","options":[{"text":"那是船上的炉子翻了，我拿手去挡，留了这块。","tone":"leak"},{"text":"小时候玩火烫的。","tone":"bluff"},{"text":"旧伤了，记不清。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_mark 卡，归属 A）"},{"id":"q_b_scar","level":-1,"speaker":"interrogator","text":"手背上这些口子，怎么来的？","card":"b_scar","options":[{"text":"收网的时候被缆绳绞的，年年都要添新伤。","tone":"correct"},{"text":"搬货磕的。","tone":"bluff"},{"text":"干这行的，手上都这样。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_scar 卡，归属 B）"},{"id":"q_a_cargo","level":-1,"speaker":"interrogator","text":"（敲了敲筐底）你这筐，底下垫得挺厚。","card":"a_cargo","options":[{"text":"舱底隔了一层，装的是南边来的火药，上面压着鱼。","tone":"leak"},{"text":"怕鱼压坏了，垫点草。","tone":"bluff"},{"text":"筐是船东给的，我没动过。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_cargo 卡，归属 A）"},{"id":"q_b_purpose","level":-1,"speaker":"interrogator","text":"你往值房送鱼，是想办什么事？","card":"b_purpose","options":[{"text":"送两筐新鲜货给值房的大人尝尝，顺带办通关文书。","tone":"correct"},{"text":"来讨个说法，上个月扣了我一船货。","tone":"bluff"},{"text":"……就是些生意上的往来。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_purpose 卡，归属 B）"},{"id":"q_a_contact","level":-1,"speaker":"interrogator","text":"（压低声音）你在港里，跟谁搭线？","card":"a_contact","options":[{"text":"只在退潮时见，站在旧船坞第二根桩子边上。","tone":"leak"},{"text":"跟几个鱼行的掌柜，都是正经买卖。","tone":"bluff"},{"text":"我不明白您在问什么。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_contact 卡，归属 A）"},{"id":"q_b_goods","level":-1,"speaker":"interrogator","text":"今天上岸的都在这儿了？","card":"b_goods","options":[{"text":"今早三筐鲱鱼、两筐青口，都是近海捞的。","tone":"correct"},{"text":"还有些干货，压在船上了。","tone":"bluff"},{"text":"单子上写着，您自己看吧。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_goods 卡，归属 B）"},{"id":"q_a_channel","level":-1,"speaker":"interrogator","text":"（忽然换了个话题）灯塔西边那道礁缝，你走过吗？","card":"a_channel","options":[{"text":"涨潮时能过小船，官船进不去。","tone":"leak"},{"text":"礁缝？那儿不是搁浅过好几条船吗。","tone":"bluff"},{"text":"我……不太清楚您说的是哪道缝。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_channel 卡，归属 A）"},{"id":"q_fact_origin_new","level":0,"speaker":"interrogator","text":"你说你就住这儿 —— 灯塔下头那片棚户，第几排？","fact":"origin","options":[{"text":"灯塔下头四排棚户，最靠海那排去年塌了半边","tone":"version","value":"four"},{"text":"两排，靠里那排，避风","tone":"version","value":"two"},{"text":"不是本地的，从小在船上长大，上岸才几年","tone":"version","value":"boat"}],"note":"事实题：本轮新问的「origin」"},{"id":"q_fact_origin_recall","level":-1,"speaker":"interrogator","text":"（换了个问法）你是本地的，还是搬来的？","fact":"origin","recall":true,"options":[{"text":"灯塔下头四排棚户，最靠海那排去年塌了半边","tone":"version","value":"four"},{"text":"两排，靠里那排，避风","tone":"version","value":"two"} 说出这样的话的你，心中一定有一处真的是这么想的 —— 你觉得自己可能再也不配回到空太郎身边了。"},{"text":"喜欢是不需要理由的","tone":"evade","suspicion":10,"echo":"空太郎对你的直率感到有些诧异，不禁让他联想起你在他身边的模样，怀疑度略微上升。\n虽然自作聪明地省略了主语和宾语，当着真正喜欢的人说这种话，但你的心头还是一紧。"},{"text":"我是阳乃，我被他抓住了把柄","tone":"leak","ending":"leak","echo":"在心上人面前受这种委屈的你，最终没有绷住，吐露了实情。\n空太郎因为吃惊愣在原地。\n陈虎也吃了一大惊，手足无措了起来，本想开始解释，嘴开始抖动，下意识地选择了逃跑。\n"}],"note":"原文结果：因为他器大活好 → 空太郎不理解为什么会有这样的女孩；喜欢是不需要理由的 → 怀疑度略微上升；我是阳乃，我被他抓住了把柄 → 空太郎愣住、陈虎逃跑、你流泪，游戏结束。","qte":{"qte":"none"}},{"id":"s1_q2","level":0,"speaker":"interrogator","text":"空太郎换了个话题：真巧啊，能在这里遇见，陈虎不是对桌游没什么兴趣吗？","options":[{"text":"其实是因为我很喜欢桌游，是我强行把他拉过来的，之前也拉他去过桌游店","tone":"correct","suspicion":0,"echo":"空太郎点了点头，然后又摇了摇头 —— 大概是对「我这样的女生和陈虎凑成一对」感到可惜。"},{"text":"听说你正好来采购桌游","tone":"leak","ending":"leak","echo":"脱口而出的瞬间，你就感觉到了后悔。\n「？！我是今天下午和阳乃聊天时，才决定来这里买她推荐的新出的桌游，你怎么会知道？」\n空太郎皱紧了眉头，更加仔细地端详着我，然后说出了那句决定性的话语：「难不成你是……」"}],"note":"原文结果：第一句 → 空太郎点头又摇头，觉得可惜；第二句 → 空太郎皱眉追问「你怎么知道」，然后说出「难不成你是…」，进入结局。"},{"id":"s1_q3","level":0,"speaker":"companion","text":"喂，老兄，怎么不讲讲我是怎么吹嘘的？我可是把她的各种照片视频发给你，让你知道她有多棒了。\n先不说这些了，你那位贵族学校上学的女友阳乃呢？我这位女友之前还和我说想见见她，和她说说话。你要说什么来着，要不要让空太郎转告一下？","options":[{"text":"之前我和阳乃小姐偶遇过一回，已经成朋友啦，没什么话需要转告的了","tone":"bluff","suspicion":30,"echo":"空太郎：「我从没听阳乃小姐说过有这么个朋友。」怀疑值上升。"},{"text":"阳乃同学其实是我失散多年的姐姐","tone":"bluff","suspicion":10,"echo":"空太郎：「……何意味？」"},{"text":"我非常憧憬阳乃小姐，想要和她做朋友","tone":"bluff","suspicion":0,"echo":"空太郎：「那下次有机会，我介绍你们认识吧。」"}],"note":"原文结果：第一句 → 空太郎「我从没听阳乃小姐说过有这么个朋友」，怀疑值上升；第二句 → 空太郎「何意味」；第三句 → 空太郎「那下次有机会我介绍你们认识吧」。"},{"id":"s1_q4","level":0,"speaker":"interrogator","text":"其实刚才我一直在回忆，对你一点印象也没有。校服也不合身,\n最主要是你的气质和阳乃真的很像。难不成你是\n刚从贵族学校转到我们学校的吗？","options":[{"text":"家道中落desuwa","tone":"bluff","suspicion":0,"echo":"(空太郎：「竟然是 desuwa，原来是高纯度的大小姐。」,这下肯定是没问题了)"},{"text":"是的，我是你退学后才转来的","tone":"correct","suspicion":0},{"text":"（你只听到空太郎说“你难道是”，便开始辩解）不对不对 。（接着听到空太郎说“你难道是贵族学校转校来的”）哦，对的对的","suspicion":20,"echo":"(空太郎：「好奇怪的反应」)"}],"note":"原文结果：家道中落desuwa → 空太郎「竟然是 desuwa，原来是高纯度的大小姐」；是的，我是你退学后才转来的 → 空太郎继续端详你。"},{"id":"s1_q5","level":0,"speaker":"interrogator","text":"过几天，我的生日宴会你来参加吗？带上阳乃一起来，我们好久没有聚过了。之前让你定的 KTV 怎么样了？","options":[{"text":"15号下午的cdd","tone":"bluff","suspicion":20,"echo":"空太郎：「刚才还说得那么恩爱，真的会有不记得自己男友生日的女友？」怀疑度上升。\n随后空太郎答应带阳乃赴宴：「行吧，正好带阳乃见一下你的新女友，我再参加一次。」\n听到空太郎说要带你去参加陈虎的生日宴，还要分身装作陈虎的女友，你有点不知所措，但很快你就冷静下来了 —— 毕竟空太郎的邀请，肯定是很好拒绝的。"},{"text":"14号下午的abd","tone":"bluff","suspicion":0,"echo":"听到空太郎说要带你去参加陈虎的生日宴，还要分身装作陈虎的女友，你有点不知所措，但很快你就冷静下来了 —— 毕竟空太郎的邀请，肯定是很好拒绝的。"},{"text":"15号下午的pca","tone":"bluff","suspicion":20,"echo":"空太郎：「刚才还说得那么恩爱，真的会有不记得自己男友生日的女友？」怀疑度上升。\n随后空太郎答应带阳乃赴宴：「行吧，正好带阳乃见一下你的新女友，我再参加一次。」\n听到空太郎说要带你去参加陈虎的生日宴，还要分身装作陈虎的女友，你有点不知所措，但很快你就冷静下来了 —— 毕竟空太郎的邀请，肯定是很好拒绝的。"}],"note":"原文结果：空太郎「刚才还说的那么恩爱，真的会有不记得自己男友生日的女友」，怀疑度上升。随后空太郎答应带阳乃赴宴：「行吧，正好带阳乃见一下你的新女友，我再参加一次」。","qte":{"qte":"expression","delay":4,"prompt":"说话时，陈虎顺手拍了拍你的屁股，你感到一阵不对"}},{"id":"s1_q6","level":0,"speaker":"interrogator","text":"空太郎：对了，小姐平时在哪里玩桌游？咱们这附近的桌游店不多，我刚好和其他桌游店都有些联系。\n我可以给他们打个招呼，下次去店里玩，让他们帮忙打个折。","options":[{"text":"kotoneiro","tone":"evade","suspicion":40,"echo":"「你常去我们店吗？」空太郎更加仔细地端详着我。\n害怕被认出，我赶紧低下了头。"},{"text":"yuri&claire","tone":"correct","suspicion":0,"echo":"空太郎：「好的，我记下了。下次去那里，说是我的朋友就可以。」"}],"note":"原文结果：kotoneiro → 空太郎更加仔细地端详你，你害怕被认出赶紧低头，怀疑度大幅上升；yuri&claire → 空太郎「好的，我记下了，下次去那里，说是我的朋友就可以」。"},{"id":"s1b_q1","level":1,"speaker":"interrogator","text":"两位好，你们看见阳乃了吗？刚才说出去打个电话，马上就回来，之后已经过了好长时间了，联系她也不回复。刚才有人说，见到阳乃和你们说话了。","options":[{"text":"阳乃说电话没电了，她有事先回家了","tone":"bluff","suspicion":10,"echo":"空太郎：「阳乃为什么不给我说，专门跑过来让你们转达呢？」怀疑值增加。"},{"text":"我就是阳乃，你有什么事","tone":"correct","suspicion":0,"echo":"空太郎愣在原地，不知道说什么；而你只是看着他的傻样，笑出了声。"},{"text":"她说她等会回来。","tone":"bluff","suspicion":10,"echo":"空太郎：「阳乃为什么不给我说，专门跑过来让你们转达呢？」怀疑值增加。"},{"text":"不清楚，也许她在你不知道的地方被别的男生勾搭走了……因为你没有保护好她。","tone":"bluff","suspicion":6,"echo":"空太郎一脸惊讶 —— 虽然之前只和陈虎的女友见过一面，但你留给他的印象，完全不是会说出这种话的人。"}],"note":"原文结果：A / C → 空太郎「阳乃为什么不给我说，专门跑过来让你们转达呢」，怀疑值增加；B → 空太郎愣住，你看着他的傻样笑出了声；D → 空太郎惊讶，觉得你不像会说这种话的人。"},{"id":"s1b_q2","level":1,"speaker":"interrogator","text":"（陈虎）老兄，行了，反正你女友天天见，我们好容易聚这一回，今天还是我生日，陪我们说几句话呗。\n（空太郎）说起来，你们最近去的哪家桌游店啊？之前和其他店的人聊天时，提起了你们，他们都说没什么印象。","options":[{"text":"其实我对桌游没什么兴趣。","tone":"bluff","suspicion":12,"echo":"空太郎：「上次在采购桌游的地方见面时，还说因为有兴趣才偶遇，这次怎么就改口了？」怀疑度上升。"},{"text":"我们最近很忙的","tone":"evade","suspicion":6,"echo":"你挽住陈虎的胳膊这么说到，并且把具体忙什么给省略掉了。\n空太郎：「我越来越觉得你们俩般配了。」\n你的心里没有一丝波动，甚至有点想笑。"},{"text":"是少女的秘密啦","tone":"bluff","suspicion":12,"echo":"「这套说辞和腔调，好熟悉。」怀疑度上升。\n（短信要写这段。）"}],"note":"原文结果：第一句 → 空太郎「上次在采购桌游的地方见面时，还说因为有兴趣才偶遇，这次怎么就改口了」，怀疑度上升；第二句 → 空太郎「我越来越觉得你们俩般配了」；第三句 → 空太郎「这套说辞和腔调好熟悉」，怀疑度上升，短信要写这段。"},{"id":"s1b_q3","level":1,"speaker":"interrogator","text":"再过几天就是校园祭了，你们班里的要举行什么活动？","options":[{"text":"女仆咖啡馆","tone":"correct","suspicion":0},{"text":"鬼屋","tone":"correct","suspicion":0}],"note":"原文给了两个选项；第三个选项缺失。"},{"id":"s1b_q4","level":1,"speaker":"interrogator","text":"（空太郎沉默了，不想再搭理你们，开始玩手机。你装在手提包里的电话响了起来 —— 不是陈虎送的那部，而是阳乃的。空太郎听到恋人熟悉的铃声，四处张望，最终锁定到你的手提包上，然后把视线转向你，眼神分明在问着为什么。）","options":[{"text":"阳乃和我们说完话后，走得匆忙，把手机落在这儿了。我们刚还在想着等碰见你就把它给你，刚才光顾着说话，忘记了这事。","tone":"bluff","suspicion":20,"echo":"「阳乃和我们说完话后，走得匆忙，把手机落在这儿了。我们刚还在想着等碰见你就把它给你，刚才光顾着说话，忘记了这事。」\n怀疑度大上升。"},{"text":"刚才我们说话时，手机都放桌上，阳乃走得匆忙，拿错手机，把我的拿走了。","tone":"bluff","suspicion":12,"echo":"「刚才我们说话时，手机都放桌上。阳乃走得匆忙，拿错手机，把我的拿走了。」\n怀疑度上升。"}],"note":"原文结果：第一句 → 怀疑度大上升；第二句 → 怀疑度上升。"},{"id":"s1b_q5","level":1,"speaker":"interrogator","text":"阳乃什么时候来找你们的？","options":[{"text":"18.30","tone":"correct","suspicion":0},{"text":"18.15","tone":"correct","suspicion":0},{"text":"18.45","tone":"correct","suspicion":0},{"text":"18.00","tone":"correct","suspicion":0}],"note":"原文只给了四个时间，没有标注哪个是真的。"},{"id":"s1b_q7","level":1,"speaker":"companion","text":"（空太郎问完后便要离开去找阳乃）陈虎叫住了他，对你说：阳乃走前让你捎的话，你不会忘记了吧？","options":[{"text":"她说今晚的约会取消了","tone":"bluff","suspicion":16,"echo":"空太郎：「阳乃不是不会把我们的约会随便告诉别人的人，况且是没认识多久的女生 —— 她到底和阳乃有什么关系？」"},{"text":"她说再见","echo":" 空太郎懒得理会这样的玩笑，扭头便走"},{"text":"她说小心陈虎 ","echo":"空太郎懒得理会这样的玩笑，扭头便走"}],"note":"原文结果：空太郎「阳乃不是不会把我们的约会随便告诉别人的人，况且是没认识多久的女生，她到底和阳乃有什么关系」。"}],"interference_lines":["你感觉到陈虎的手轻轻的从肩膀往下滑"],"endings":{"recognized_line":""},"levels":[{"name":"第一轮 · 桌游店偶遇","intro":"我不记得和陈虎的第一次相遇，但记得第二次是在他知道了我和空太郎交往后，找到了我，说找到了一些在我妨碍了他妹妹与空太郎恋情的证据，虽然我本意不是如此，但空太郎和米芙露会怎么想。\n\n在犹豫的时候，被陈虎强迫了，并以此要挟，让我进一步屈从于他，一直到了今日。\n\n任务说明：陈虎通过我得知了空太郎今天下班后要去桌游店采购，不仅让我拒绝了空太郎的一起去的邀请，还准备带我去偶遇。\n\n强制要求着装校服上下装。原貌为暴露值小于三。"},{"name":"第二轮 · 生日宴","intro":"几天后陈虎的生日宴：我用「陈虎是导致空太郎退学的元凶」为理由拒绝了空太郎的邀请，但空太郎说，既然答应了陈虎和他女朋友的邀请，而且陈虎的女朋友原先和我同校、转校后说不定一个朋友也没有，希望让我和她见见。我心一软便答应了。\n\n只好在聚会前半段以阳乃的身份亮相，中途借口离开，然后变装。"}],"forced_rules":[{"mode":"fixed","rules":[{"pick":"all","items":["top_school_navy","bottom_school_navy"]}]},{"mode":"none","rules":[]}],"qte_plan":[],"defects":[],"true_presets":{"pool":[],"by_level":[{"name":"第 1 轮","slots":{"hair":"hair_long","glasses":"glasses_none","makeup":"makeup_none","tattoo":"tattoo_none","neckwear":"neck_none","top":"top_sailor_white","bra":"bra_lace","bottom":"bottom_sailor_white","dress":"dress_none","panties":"panties_lace","stockings":"stockings_school_green","shoes":"shoes_school_green"}},{"name":"第 2 轮","slots":{"hair":"hair_long","glasses":"glasses_none","makeup":"makeup_light","tattoo":"tattoo_none","neckwear":"acc_locket","top":"top_sailor_white","bra":"bra_pasties","bottom":"bottom_sailor_white","dress":"dress_eveninggown","panties":"panties_shibari","stockings":"stockings_sheer","shoes":"shoes_heels"}}]},"enabled":true},{"id":"scene_2","name":"杜鹃之女","venue":"苦主：小力  你：美羽  黄毛：父亲","intro":"我美羽对男友小力不忠，大概是从一个月前开始的。\n也是在那天，我第一次见到晚归还醉醺醺的父亲。\n再次看见那天的日期时，第一时间出现在我脑海里的不是意识到已经背叛了小力后的痛心疾首，也不是被酒精和冲动麻痹了神经的父亲扑倒，而是那天早上上学路上我遇到了离家多年的母亲\n和她的丈夫——我的亲生父亲。\n美羽，好久没见，都长这么大了，这是第一句\n在那个废物的男人身边那么久，委屈你了，来和你亲生父母回家，这是第二句也是最后一句。\n我躲开了那个人想要拉住我的手，开始狂奔。\n停下的我，才开始思考，那个女人真的是我的母亲吗，答案应该是肯定，毕竟容貌和父亲与母亲的合照里那位一致。\n我不是父亲亲生的这件事是真的吗，种种细节被我一一想起，父亲电脑里奇怪的视频，母亲不辞而别的原因……又被我一一否定，恍惚中，身体已经自行来到了学校门口。\n那天直到父亲推开门前，我一直处于非常混乱的状态，不知道如何面对这个人，不知道该对他抱有什么样的感情。但头一次见到如此模样的父亲，我的心中只剩下惊讶和疑惑。\n索取后清醒的父亲抱着我一边道歉一边说着不要离开我，我只要你一个亲人这种无理的要求，那时我心中的混乱也好，疑惑也罢，都消散得一干二净，只剩下两个念头。\n面前的这个男人一定是爱我的，我也同样爱他。虽然常说父母之爱不求回报的，但既然父亲向我索求，我想用这种方式回报他和展示我对他的爱意。\n\n任务说明：某日我和父亲逛街，路过一家服装店，父亲进去试衣间后，我也偷偷进去进行恶作剧。结束后，因为担心刚才的动静被人听见，于是在外面多穿了几件才出去。但在我看清试衣区门口站着的人，惊讶得脱口而出他的名字时，一切伪装都失效了。\n你需要决定你走试衣间时的衣服，尽量做出区分。","interrogator":"小力","interrogator_gender":"男","companion":{"name":"父亲","relation":"养育美羽的人","gender":"男","desc":"把美羽养大的人，也是这一个月来她背叛小力的对象。他知道美羽不是自己亲生的，知道她母亲离家的事；在服装店替她挡过小力，也在约会地点陪她演过戏。"},"cover_role":"爱子（美羽的双胞胎妹妹）","true_role":"小力的女友","true_name":"美羽","questions_schema":"faceless-questions-v1","questions_source":"manual","cards":[],"facts":[],"sms":[],"companion_sms":[{"id":"c_scene2_0","level":0,"contact":"父亲","avatar":"👨","messages":[{"me":true,"text":"爸爸工作辛苦了，今天几点到家。"},{"text":"今天可能不回去，要加班到很晚"},{"me":true,"text":"晚上不陪陪我吗😡，明天要补偿我一起去逛街"},{"text":"好好好，美羽现在比以前更热情了，要什么奖励都可以"},{"text":"毕竟之前不知道怎么和爸爸相处嘛😛","me":true},{"me":true,"text":"太热情怕你烦，这种事情又不好请教别人，我曾经也是被困扰了很久不知道怎么做"},{"me":true,"text":"最后想到世上那么多家父女关系处得都不冷不淡的，要不就这样平淡也好"},{"me":true,"text":"第一次做女儿，多有见谅。"},{"text":"我也是第一次做父亲，多有过错请见谅"},{"me":true,"text":"不过肯定不代表以后关系平等，我永远是女儿牌"},{"text":"打住，消息被身后的同事看到就不好了"},{"text":"明天我会好好补偿你的，早点睡"},{"text":"嗯","me":true}]}],"interrogator_sms":[{"id":"intr_scene2_0","level":0,"contact":"小力","avatar":"🕶","messages":[{"me":false,"text":"美羽，明天一起出去玩吗"},{"me":true,"text":"力抱歉，我有点不舒服，明天可能要在家里休息💤💤💤"},{"text":"那我能去你家照顾你吗"},{"me":true,"text":"没事没事，我怕传染给你了😷"},{"me":true,"text":"之前不是给你说的那位因为父母离婚，出生没多久就和我分开的双胞胎妹妹，她来了"},{"me":true,"text":"让她照顾我就行了，她可比你个老爷们细腻多了"},{"text":"怎么又提这个事，太假了，你那个分开多年才重逢的妹妹到底为啥现在又见面了，你还没编清楚。"},{"text":"好吧好吧，我不去找你了，你平时没心没肺的，这时候还逞强，真的比我还像男生了。你好好养病吧。"}]},{"id":"intr_new","level":1,"contact":"小力","avatar":"🕶","messages":[{"me":false,"text":"最近是说话，怎么这么喜欢用敬语？\n"},{"text":"被你妹妹传染了？"},{"me":true,"text":"唉 别提了这事了"},{"me":true,"text":"相处下来我感觉和她一点都不对付，除了外貌和都不喜欢母亲外"},{"me":true,"text":"看起来挺文静的，但她一见我爸就跟换了个人似的，一有机会就往他身边凑，还缠着要睡一起"},{"me":true,"text":"就算是太久没见，也不至于把自己把自己真实的一面这样展现出来"},{"me":true,"text":"一见她我就有点恼火"},{"me":true,"text":"不说了，我要去盯着我爸让她离远点"}]}],"questions":[{"id":"s2_q1","level":0,"speaker":"interrogator","text":"美羽？你怎么会出现在这？","options":[{"text":"小……小力，你怎么会在这","tone":"bluff","suspicion":20,"ending":"leak","echo":"你奇怪的回应方式让小力起了疑心。在不断追问下，不擅长撒谎的你败下阵来；了解了一些实情后，小力一言不发地离开了。"},{"text":"你是姐姐的朋友吗？初次见面，我是爱子，双胞胎妹妹desu。","tone":"correct","suspicion":0,"echo":"你尝试伪装成之前和小力开玩笑时编造的双胞胎妹妹。为了装得更文静一些，你开始高强度使用敬语。"}],"note":"原文：第一句 → 小力起疑、追问、了解到一些实情后离开；第二句 → 伪装成双胞胎妹妹爱子。"},{"id":"s2_q2","level":0,"speaker":"interrogator","text":"原来美羽真的有个双胞胎妹妹啊，我之前还以为她是在骗我。我是美羽的男朋友，初次见面。……请问你姐姐在里面吗？","options":[{"text":"姐姐大人今天出门了，去海边玩了。","tone":"bluff","suspicion":10,"echo":"小力：「美羽今天和我说她生病在家躺着。眼前这位……不会是实际偷偷自己出来玩、被我遇到，然后跟我开玩笑的美羽吧？」"},{"text":"姐姐大人今天有点生病了，在家里没出来。","tone":"bluff","suspicion":6,"echo":"小力：「美羽今天和我说她生病在家躺着。眼前这位……不会是实际偷偷自己出来玩、被我遇到，然后跟我开玩笑的美羽吧？」"},{"text":"姐姐大人今天出门了，去找朋友玩了。","tone":"bluff","suspicion":10,"echo":"小力：「美羽今天和我说她生病在家躺着。眼前这位……不会是实际偷偷自己出来玩、被我遇到，然后跟我开玩笑的美羽吧？」"}],"note":"原文：三个「姐姐大人」的答法之后，小力说美羽告诉他生病在家，眼前这位不会就是美羽吧。"},{"id":"s2_q3","level":0,"speaker":"interrogator","text":"我刚才听到了一些奇怪的声音……你听到了吗？","options":[{"text":"没听到。","tone":"evade","suspicion":6},{"text":"（支支吾吾）","tone":"bluff","suspicion":12}],"note":"原文只有两句回应，没有写后续结果。"},{"id":"s2_q4","level":0,"speaker":"interrogator","text":"哦，刚才有点幻听，好像听到美羽的声音了。我还以为你是和姐姐一起来的 —— 今天是一个人来的吗？","options":[{"text":"今天是和父亲大人一起来的。","tone":"correct","suspicion":0,"echo":"正巧，在你回答这句话时，父亲拉开了帘子。"},{"text":"今天是一个人来的。","tone":"bluff","suspicion":12,"echo":"好巧不巧，在你回答这句话时，对现状一无所知的父亲拉开帘子从试衣间出来。\n小力：「就算是离婚了，和生父一起出来玩，也不至于隐瞒吧？难道和刚才的声音有关？」怀疑度增加。"}],"note":"原文：第一句 → 父亲拉开帘子；第二句 → 父亲出来，小力起疑，怀疑度增加。"},{"id":"s2_q5","level":0,"speaker":"interrogator","text":"（父亲看到小力先是一愣，但很快反应过来）我试衣服的时候，辛苦你陪我女儿了。我们有点急事，先走了。","options":[{"text":"明天见，力君。","tone":"bluff","suspicion":16,"ending":"leak","echo":"演到最后一刻，你还是没有绷住。虽然小力什么也没说，但那天是最后一次和小力说话。"},{"text":"前辈，我们先告辞了。","tone":"correct","suspicion":0}],"note":"原文：明天见 → 没绷住，那天是最后一次和小力说话；前辈 → 按礼数收场。"},{"id":"s2b_q1","level":1,"speaker":"interrogator","text":"（在约会地点焦急等待的小力注意到了从身边经过的我和父亲）诶？这不是爱子吗？今天又和父亲一起出来玩，父女俩感情真好。","options":[{"text":"我和父亲大人分开了很久，有好多好多爱意倾诉不完呢","tone":"bluff","echo":"看着和自己女友长得如此相像的女生，当众宣告对父亲的爱，小力有些担心：自己的女友在自己面前对父亲那么冷淡，私下里会不会是另一副模样。","suspicion":0},{"text":"我最喜欢父亲大人了","tone":"bluff","suspicion":0,"echo":"看着和自己女友长得如此相像的女生，当众宣告对父亲的爱意，小力有些担心：自己的女友在自己面前对父亲那么冷淡，私下里会不会是另一副模样。"}],"note":"原文：两个选项都让小力担心「美羽私下里会不会是另一副模样」。"},{"id":"s2b_q2","level":1,"speaker":"interrogator","text":"（小力半开玩笑地）爱子和父亲的关系这么好，不会现在还在一起洗澡吧？","options":[{"text":"是的呢，听说其他父女都有这个时期，但因为家庭的缘故我没怎么体验过，昨天就缠着父亲大人一起试了下","tone":"bluff","suspicion":20,"echo":"小力愣了一下，随即皱起眉：「……美羽呢？她为什么没有阻止你们？」怀疑度上升。"},{"text":"听说其他父女都有这个时期，但因为家庭的缘故我没怎么体验过，昨天对父亲大人说想试一下，被拒绝了","tone":"bluff","suspicion":0,"echo":"小力沉默了几秒，像是松了口气，又像更在意了：「……被拒绝了。」"}],"note":"原文：承认 → 小力问「美羽为什么没有阻止他们」、怀疑度上升；被拒绝 → 小力沉默。"},{"id":"s2b_q3","level":1,"speaker":"interrogator","text":"（觉得刚才的交流有些尴尬，小力换了个话题）你身上的香水味，和我送美羽的那款好像。是你自己挑的吗？","options":[{"text":"是的。","tone":"bluff","suspicion":0,"echo":"小力：「感觉和你挺配的。是不是美羽那种女生不喜欢这种类型？我送她以后，从没见她用过。」"},{"text":"不是。","tone":"bluff","suspicion":20,"echo":"小力：「美羽短信里和我说，和妹妹关系并不算好。为什么还会借给她当初说会好好珍惜的我送的礼物？」"}],"note":"原文：是 → 小力说和她挺配、美羽从没用过；不是 → 小力问「关系不好为什么还借」。","qte":{"qte":"none"}},{"id":"s2b_q4","level":1,"speaker":"interrogator","text":"（小力觉得没什么话可聊的了，但你依然站在那里等他继续问）于是就问 ：今天你见到你姐姐美羽了吗？其实今天我和美羽约定在这里见面，不过已经过去了好久。","options":[{"text":"今天早上出门时她还没起，可能是她有点发烧，就没出来。","tone":"bluff","suspicion":30,"echo":"小力：「美羽那样的练田径的女生，怎么会生这么多次病？而且每次都正好是爱子出现的时候。」怀疑度上升。"},{"text":"可能是昨晚运动太久，今天早上我们出门时她还没起，睡过了。","tone":"bluff","suspicion":0,"echo":"小力：「明明是美羽主动提出约会的，昨晚怎么运动那么久……不过，既然是美羽那样大大咧咧的女生，也确实有可能。」"}],"note":"原文：发烧 → 小力质疑「怎么老生病、每次都正好是爱子出现」；运动太久 → 小力半信半疑。","qte":{"qte":"none"}},{"id":"s2b_q5","level":1,"speaker":"interrogator","text":"（小力苦笑）爱子，你姐姐最近……是不是有什么事瞒着我？她对我越来越冷淡了。","options":[{"text":"姐姐大人只是不擅长表达。","tone":"evade","suspicion":6,"echo":"小力：「不擅长表达……可她以前不是这样的。」"},{"text":"姐姐大人私下里对父亲大人很好。","tone":"bluff","suspicion":12,"echo":"小力的表情僵了一下：「对父亲……很好？」"},{"text":"我不清楚姐姐大人的事。","tone":"evade","suspicion":8,"echo":"小力点了点头，没再追问，但目光留在你脸上。"}],"note":"用户只给了题干；三个选项与后果沿用上一版，保持承接关系。"},{"id":"s2b_q6","level":1,"speaker":"inter }

// ---------- 脏标记 / 撤销 ----------
// 模型：undoStack 里存的是一串「状态」，栈顶 = 当前状态。
// 每次改动**之后**调 commit() 把新状态压栈。
//
// 传了 sig 时，900ms 内的连续同类改动会**替换栈顶**而不是新压一帧 ——
// 否则打一句话就塞进几十帧，撤销变成逐字符（踩过这个坑）。
// 增删 / 上下移这类离散操作不传 sig，每一下都算一步。
const undoStack = [];
const redoStack = [];
let lastSig = "", lastSigT = 0;

function snapshot(){ return JSON.stringify(story); }

function commit(sig){
  const s = snapshot();
  if (undoStack.length && undoStack[undoStack.length - 1] === s) return;
  const now = Date.now();
  const coalesce = sig && sig === lastSig && (now - lastSigT) < 900 && undoStack.length >= 2;
  if (coalesce) undoStack[undoStack.length - 1] = s;
  else { undoStack.push(s); if (undoStack.length > 80) undoStack.shift(); }
  redoStack.length = 0;
  lastSig = sig || ""; lastSigT = now;
}

function markDirty(){
  dirty = true;
  $("fileinfo").classList.add("dirty");
  updateFileInfo();
  scheduleValidate();
}
function undo(){
  if (undoStack.length < 2) { toast("没有可撤销的步骤了"); return; }
  redoStack.push(undoStack.pop());
  story = JSON.parse(undoStack[undoStack.length - 1]);
  lastSig = ""; dirty = true; scheduleValidate(); renderAll();
}
function redo(){
  if (!redoStack.length) { toast("没有可重做的步骤了"); return; }
  const s = redoStack.pop();
  undoStack.push(s);
  story = JSON.parse(s);
  lastSig = ""; dirty = true; scheduleValidate(); renderAll();
}

// ---------- 载入 ----------
// 编辑器要保证几个容器存在，否则输入框写不进去（readHost 拿到 undefined 就直接放弃）。
// 真实 story.json 里都有（DumpStory 一定会写）；这里只是给「手动删过键 / 老版本文件」兜底。
function normalizeStory(o){
  if (!o.rules || typeof o.rules !== "object") o.rules = {};
  if (!o.ui || typeof o.ui !== "object") o.ui = {};
  uiSections().forEach(sec => { if (!o.ui[sec.seg] || typeof o.ui[sec.seg] !== "object") o.ui[sec.seg] = {}; });
  (o.backgrounds || []).forEach(b => { if (!b.endings || typeof b.endings !== "object") b.endings = {}; });
  // 第二十三轮的四段：**不**自动建空数组 —— 缺了就一直缺，游戏会退回出厂兜底。
  // （建了空数组反而危险：`levels: []` 会被当成「一关都没有」。
  //   真要改，就在对应的那一页点「＋加一条」，那时才建。）
  ["levels", "forced_rules", "qte_plan", "defects"].forEach(k => {
    if (o[k] !== undefined && !Array.isArray(o[k])) delete o[k];
  });
  if (!o.catalog || typeof o.catalog !== "object") o.catalog = {items:[], tags:[], slots:[]};
  if (!Array.isArray(o.catalog.items)) o.catalog.items = [];
  if (!Array.isArray(o.catalog.tags)) o.catalog.tags = [];
  return o;
}

function loadStory(obj, name, fromFile){
  normalizeStory(obj);
  story = obj; seedStory = clone(obj); fileName = name || "story.json";
  fileHandle = null; dirty = !!fromFile;
  undoStack.length = 0; redoStack.length = 0; undoStack.push(snapshot());
  lastSig = ""; lastSigT = 0;
  openSet.clear(); foldSet.clear();
  view = {kind:"home"};
  buildIndex();
  validateNow();
  renderAll();
  $("fileinfo").classList.remove("dirty");
  updateFileInfo();
  $("search").value = ""; renderResults("");
}
function updateFileInfo(){
  const where = fileHandle ? " · 已连上文件（Ctrl+S 直接写回）"
    : (rememberedHandle ? " · 记忆里有上次的文件（Ctrl+S 会试着写回它）" : "");
  $("fileinfo").textContent = fileName + (dirty ? " · 有未保存的改动" : " · 已同步") + where;
}

// ============================================================
//  第四十一轮：记住「上次把 json 存到哪儿了」
//
//  用户口径：「结果 json 保存的位置应位于编辑器同一目录」。
//
//  ★ 先说清楚浏览器给不了什么：`showSaveFilePicker` **不能**接收一个任意路径
//    （安全沙箱 —— 网页不许指定「写到 D:\...\tools\」）。能合法做到的有两条：
//      ① `showSaveFilePicker` 的 `id` 选项 —— 同一个 id 会记住**上次用过的目录**，
//         下次打开对话框默认就停在那儿；
//      ② 把上次拿到的 fileHandle 存进 IndexedDB —— 关掉页面再打开，
//         按 Ctrl+S 还能直接写回**同一个文件**，连对话框都不弹。
//    两条一起用，实际体验就是「第一次手动选到 tools/ 之后，以后都默认在那一带」。
//  ★ 权限：句柄是持久化的，但读写权限要用户手势才能重新授予 ——
//    所以恢复权限这一步放在「按 Ctrl+S」或点保存时做（那时本身就是手势）。
// ============================================================
const IDB_NAME = "faceless-editor";
const IDB_STORE = "handles";
const PICKER_ID = "faceless-story-json";
var rememberedHandle = null;

function idbOpen(){
  return new Promise((res, rej) => {
    if (typeof indexedDB === "undefined"){ rej(new Error("no indexedDB")); return; }
    const rq = indexedDB.open(IDB_NAME, 1);
    rq.onupgradeneeded = () => { rq.result.createObjectStore(IDB_STORE); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbPut(k, v){
  try {
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(v, k);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
    db.close();
  } catch(e){ /* 存不下不影响保存本身 */ }
}
async function idbGet(k){
  try {
    const db = await idbOpen();
    const v = await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, "readonly");
      const rq = tx.objectStore(IDB_STORE).get(k);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
    db.close();
    return v;
  } catch(e){ return null; }
}

// 取出一个「现在能写」的句柄 —— 优先用当前会话的，其次用记忆里的。
// ★ 权限只在用户手势里申请得到，所以这个函数必须从点击 / Ctrl+S 的调用链里进。
async function writableHandle(){
  const cand = fileHandle || rememberedHandle;
  if (!cand) return null;
  try {
    if (cand.queryPermission){
      let p = await cand.queryPermission({mode:"readwrite"});
      if (p !== "granted" && cand.requestPermission)
        p = await cand.requestPermission({mode:"readwrite"});
      if (p !== "granted") return null;
    }
    return cand;
  } catch(e){ return null; }
}

function getSeed(){
  const txt = $("seed").textContent.trim();
  if (!txt || txt.indexOf("__STORY_JSON__") === 0) return null;
  try { return JSON.parse(txt); } catch(e){ return null; }
}

async function tryFetch(){
  const cands = ["data/story.json", "../data/story.json", "./story.json", "../../data/story.json"];
  for (const u of cands){
    try {
      const r = await fetch(u, {cache:"no-store"});
      if (r.ok) { const j = await r.json(); if (j && j.backgrounds) return {json:j, from:u}; }
    } catch(e){ /* 继续试下一个 */ }
  }
  return null;
}

// ---------- 保存 / 打开 ----------
function toJSON(){ return JSON.stringify(story, null, "\t") + "\n"; }

async function save(asNew){
  const text = toJSON();
  // ★ 第四十一轮：先试「用已有 / 记住的句柄直接写回」—— 连对话框都不弹。
  if (!asNew){
    const h = await writableHandle();
    if (h){
      try {
        const w = await h.createWritable();
        await w.write(text); await w.close();
        fileHandle = h; fileName = h.name || fileName;
        dirty = false; $("fileinfo").classList.remove("dirty"); updateFileInfo();
        toast("已写回 " + fileName); return;
      } catch(e){ /* 句柄失效了 → 落到下面重新挑文件 */ }
    }
  }
  if (window.showSaveFilePicker){
    try {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: fileName || "story.json",
        // ★ `id` = 让浏览器**记住上次用过的目录**（下次默认停在那儿）。
        //   这是「默认定位到 tools/」在浏览器里唯一合规的实现方式。
        id: PICKER_ID,
        types:[{description:"剧情文本 JSON", accept:{"application/json":[".json"]}}]
      });
      fileName = fileHandle.name;
      const w = await fileHandle.createWritable();
      await w.write(text); await w.close();
      dirty = false; $("fileinfo").classList.remove("dirty");
      await idbPut("story", fileHandle);      // ★ 记住它，下次打开页面还能直接写回
      rememberedHandle = fileHandle;
      updateFileInfo();
      toast("已保存到 " + fileName); return;
    } catch(e){
      if (e && e.name === "AbortError") return;
    }
  }
  // 回退：下载（浏览器不给就地写权限时）
  const blob = new Blob([text], {type:"application/json"});
  const a = h("a", {href:URL.createObjectURL(blob), download:"story.json"});
  document.body.append(a); a.click(); a.remove();
  toast("已下载 story.json —— 请覆盖项目里的 data/story.json", 4200);
}

async function openFile(){
  if (window.showOpenFilePicker){
    try {
      const [fh] = await window.showOpenFilePicker({
        types:[{description:"剧情文本 JSON", accept:{"application/json":[".json"]}}]
      });
      const f = await fh.getFile();
      const j = JSON.parse(await f.text());
      fileHandle = fh;
      loadStory(j, fh.name, false);
      toast("已打开 " + fh.name); return;
    } catch(e){
      if (e && e.name === "AbortError") return;
      toast("打不开这个文件：" + (e && e.message ? e.message : e), 4000); return;
    }
  }
  $("fileinput").click();
}
$("fileinput").addEventListener("change", async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    loadStory(j, f.name, false);
    toast("已打开 " + f.name + "（浏览器不允许就地写回，保存时会下载一份）", 4200);
  } catch(e){ toast("JSON 解析失败：" + e.message, 4000); }
  ev.target.value = "";
});

// ---------- 导航 ----------
// 结局文案是「每个背景一套」，所以它和 bg 一样带 index —— 折叠状态要按背景分开记。
function navKey(){
  if (view.kind === "bg" || view.kind === "endings") return view.kind + view.index;
  // ★ 第五十五轮：手机那几页也要各自记折叠状态（同一份 navKey 会被当成一页）
  if (view.kind === "sms") return "sms" + view.group + (view.index || 0);
  if (view.kind === "phone") return "phone" + view.page;
  return view.kind;
}
function bgOf(){ return story.backgrounds[view.index] || {}; }

// ★ 第五十三轮：「草稿 / 启用」标志。
//   缺省（没写这个键）= **启用** —— 这样出厂那四套不用补字段，向后兼容。
//   只有显式写了 `enabled: false` 才算草稿。
//   为什么要这个标志：新增一套背景时它是空的（没有档案卡 / 题目 / 事实 / 短信），
//   而游戏是**开局随机抽背景**的 —— 抽到一套空背景会直接崩（归类环节要 12 张卡、
//   每轮要恰好 1 道盲区题、短信要按轮揭示事实）。测试也会有一批断言变红。
//   所以草稿**不参与抽取、不参与测试**，但照旧存在 story.json 里、编辑器里能看到。
function bgEnabled(b){ return !(b && b.enabled === false); }

// ★★ 第五十五轮：题目来源 —— `auto`（默认）/ `manual`。
//   为什么要这个开关：一套背景的题目本来绑在「档案卡 + 事实」这套结构上（挂卡才有雷区归属、
//   挂事实才参与跨关一致性）。但也可以完全自己写题、不建档案卡和事实表 ——
//   那种情况下再要求「每题必须挂卡」「必须有一张 A 卡」就是无意义的拦截。
//   ★ 缺省（不写这个键）= auto，所以出厂那四套一个字都不用补。
function bgQuestionsSource(b){ return (b && b.questions_source === "manual") ? "manual" : "auto"; }

// ★★ 第五十六轮：「自行编辑」模式下**用不到的字段直接不显示**（数据不动，切回自动生成就回来）。
//   用户口径：「在用户自己编辑的背景时，用不到的空全部删去，如审讯官的名字，身份档案卡，
//   选项中的「这句话算哪种」」+ 追问时补充的「审讯官的性别 / 同行人的性别 / 你伪装的身份 /
//   你的真实身份 / A 的真身名字」。
//   ★ 为什么这些在自行编辑下用不到：它们全是**档案卡与事实那套结构**的配套设定 ——
//     A 的真身名只在「阶段二被认出来」时念，而那条戏要靠「雷区题」触发；
//     B/A 两个身份是档案卡归属判定的依据；性别只用在顶栏与备忘录的括号里。
//     不建卡片与事实的背景，这四栏就是纯负担。
const MANUAL_HIDDEN_META = ["interrogator_gender", "cover_role", "true_role", "true_name"];
const MANUAL_HIDDEN_COMPANION = ["gender"];
function enabledBgs(){ return (story.backgrounds || []).filter(bgEnabled); }

// 全部背景一共多少道题（首页统计与冒烟用）
//   ★ 第五十三轮：题目并进每套背景之后，「🗣 题库」那个页签没有了，
//     但这个统计还有用（首页的「盘问题目 N 道」），所以函数保留。
function totalQuestions(){
  return (story.backgrounds || []).reduce((a, b) => a + ((b.questions || []).length), 0);
}

// 一套空白背景的骨架：标量字段给占位文字，**列表一律留空** ——
// 内容由你去填（题目节、档案卡、短信、事实…都在下面几节里）。
// 这样「新增」是纯粹的空白新建，不会塞进一批你不想要的假数据。
function blankBackground(){
  const used = {};
  (story.backgrounds || []).forEach(b => { used[String((b || {}).id || "")] = true; });
  let n = 1;
  while (used["bg_new_" + n]) n++;
  return {
    id: "bg_new_" + n,
    name: "新的一套背景",
    venue: "",
    intro: "",
    interrogator: "",
    interrogator_gender: "男",
    companion: {name:"", gender:"女", relation:"", desc:""},
    cover_role: "",
    true_role: "",
    true_name: "",
    questions_schema: "faceless-questions-v1",
    cards: [],
    facts: [],
    sms: [],
    companion_sms: [],
    questions: [],
    interference_lines: [],
    endings: {},
    levels: [], forced_rules: [], qte_plan: [], defects: [], true_presets: {},
    enabled: false,
  };
}

function addBackground(){
  const arr = (story.backgrounds = story.backgrounds || []);
  arr.push(blankBackground());
  view = {kind:"bg", index: arr.length - 1};
  commit("bg_add"); markDirty(); renderAll();
  toast("新增了一套空白背景（状态：草稿）。把内容填齐后，在「① 基础信息」里勾上「启用」。", 5200);
}

function removeBackground(){
  const arr = story.backgrounds || [];
  const i = view.index;
  const b = arr[i] || {};
  if (arr.length <= 1){ toast("至少要留一套背景"); return; }

    return;
  }
  if (!confirm("删掉「" + (b.name || b.id || ("背景 " + (i + 1))) + "」？\n\n"
    + "它的开场介绍、档案卡、题目、事实、短信、结局文案会一起删掉。")) return;
  arr.splice(i, 1);
  view = {kind:"bg", index: Math.max(0, i - 1)};
  commit("bg_del"); markDirty(); renderAll();
  toast("已删掉那套背景");
}

      h("span", {text: gr.icon + " " + gr.label}),
      h("span", {class:"cnt", text: nSms(gr.field)})));
  });
  PHONE_PAGES.forEach(p => {
    ph.append(h("div", {class:"navitem" + (view.kind === "phone" && view.page === p.key ? " on" : ""),
      onclick:()=>go({kind:"phone", page:p.key})},
      h("span", {text: p.icon + " " + p.title})));
  });
  nav.append(ph);
}

// ============================================================
//  题库（第二十九轮）—— 盘问环节的题目清单
//
//  用户口径：「阶段二的问题我想不再给问题分类，直接让我编辑对问题进行编辑」。
//  所以这里不再有「档案题 / 说法题 / 同行者题 / 盲区题」四个分区，
//  只有一份清单：每道题自己带题面、选项、QTE、抖动、以及每个选项的怀疑值。
//
//  两处最容易看错的地方：
//   · `level` —— -1 = 通用池（每关都可能抽到），0..N = 固定给第 N+1 关。
//     「某关出几道题」= 那关的固定题 + 从通用池补足到 rules.questions_per_level。
//     想精确控制就分配下去，想保留随机就留在通用池。
//   · `tone` —— 选项的语义标签，判定**只看它**，不再看「题目属于哪一类」。
//     `suspicion` 留空 = 用全局默认（照实答看 rules.correct_delta、
//     撒谎/回避按审问官性情现算）；填了就硬覆盖。
// ============================================================
const TONE_OPTS = [
  {v:"correct", l:"照实答（B 的档案 —— 对得上就没事）"},
  {v:"leak",    l:"说漏嘴（只有 A 才知道的事 —— 当场出局）"},
  {v:"version", l:"某个版本（对错看「你之前立过什么说法」）"},
  {v:"bluff",   l:"撒谎（代价按审问官性情现算）"},
  {v:"evade",   l:"回避（同上看性情）"},
  {v:"silence", l:"沉默（代价固定，与性情无关）"},
  {v:"made_up", l:"硬编一个细节（盲区题：编得越细越糟）"},
];
const QUESTION_QTE_OPTS = [
  {v:"auto", l:"自动（★ 只看暴露值：露得越多，这一关被盯住脸的次数越多）"},
  {v:"none", l:"无（这道题什么都不出）"},
  {v:"expression", l:"表情控制（长按空格顶过 80%，顶过之前不能答题）"},
  {v:"interference", l:"递话打断（按一下空格）"},
  {v:"combo", l:"组合干扰（依次敲 J → K → L）"},
];
const SPEAKER_OPTS = [
  {v:"interrogator", l:"审讯官"},
  {v:"companion", l:"同行者"},
];
function questionLevelOpts(){
  // ★ 第五十三轮：题目的归属跟着「轮次」走（第四十二轮统一了「关 → 轮」的说法）。
  //   轮数取本轮实际的一局几轮（story.levels），不再写死 4。
  const n = (story.levels || []).length || 2;
  const out = [{v:"-1", l:"通用池（每轮都可能抽到）"}];
  for (let i = 0; i < n; i++) out.push({v:String(i), l:"第 " + (i + 1) + " 轮（固定必出）"});
  return out;
}
function pickCardOpts(){

function pickFactOpts(){

    (bg.facts || []).map(f => ({v:f.id, l:f.id + "（" + ((f.values || []).length) + " 个版本）"})));

function optionFields(manual){
  // ★★ 第五十六轮：「自行编辑」模式下**只留三样** —— 选项文本 / 怀疑值 / 触发结局。
  //   用户口径：「选项中的「这句话算哪种」去掉」，追问时确认连「代表哪个说法」一起去掉。
  //   ★ 为什么：`tone` 里那七种有一半是给档案卡与事实用的 ——
  //     「某个版本」要挂事实才判得了、「说漏嘴」的语义是「说了只有 A 知道的事」。
  //     不建卡片与事实的背景，这些分类就成了必须猜的负担。
  //   ★ 判定改成**只看怀疑值**：留空 = 用「照实答」的出厂值（rules.correct_delta，默认 -6）。
  //     运行时那边也改了 —— tone 为空不再打印警告，直接按这个口径结算。
  const fields = [
    {k:"text", label:"选项文本", t:"area", rows:2,
      hint: manual ? "沉默也可以留空 —— 那就用出厂那句通用文案。"
        : "类型选「沉默」时可以留空 —— 那就用出厂那句通用文案。"},
    // ★ 第五十七轮（用户口径）：「选项选择后，对应的选项文本和下一个题面一起出现」。
    //   这一栏就是「接在下一题题面前的那段」：留空 = 自动显示「你：<选项文本>」。
    // ★ 第六十一轮：填了就打**原样**显示（不再加「你：」）—— 也可以写选完之后的后果 / 旁白。
    {k:"echo", label:"接在下一题题面前的回应（可空）", t:"area", rows:3,
      hint:"选了这个选项之后，下一道题的题面前会多出这一段。"
        + "留空 = 自动显示「你：<选项文本>」。"
        + "填了就用这段**原样**显示（不再自动加「你：」）—— "
        + "可以写你说的话，也可以写「这句话的后果 / 旁白」，"
        + "比如「空太郎：「我从没听阳乃小姐说过有这么个朋友。」怀疑值上升。」"},
  ];
  if (!manual){
    fields.push({k:"tone", label:"这句话算哪一种（判定只看它）", t:"select", opts:()=>TONE_OPTS});
  }
  // ★ 第五十六轮：`blankDelete` —— **清空 = 删掉这个键**。
  //   不加的话空框会写回 0（`num("", 0)`），于是「留空 = 用默认」在界面上根本做不到：
  //   用户看到 0，改一下就成了「0 怀疑值」，和 hint 上写的「留空 = -6」对不上。
  //   （这条对两种模式都成立：自动生成的「留空 = 用全局默认」也是同一个坑。）
  fields.push({k:"suspicion", label:"选了它，怀疑值加多少", t:"num", blankDelete:true,
    placeholder: manual ? "留空 = 按「照实答」算（-6）" : "留空 = 用全局默认",
    hint: manual
      ? "留空 = 按「照实答」算（rules.correct_delta，默认 -6）。填了就按这个数结算 —— 自行编辑模式下判定**只看这一栏**。"
      : "留空 = 用全局默认（照实答看 rules.correct_delta、撒谎 / 回避按性情现算、硬编看 rules.blind_made_up_delta）。填了就硬覆盖这道题。"});
  if (!manual){
    fields.push({k:"value", label:"代表哪个说法（可空）", t:"text",
      hint:"只有「某个版本」要填 —— 写事实表里的版本 id（如 harbor）。跨关「不许改口」的比对就靠它。"});
  }
  fields.push({k:"ending", label:"触发什么结局（可空）", t:"text",
    hint:"填 leak = 当场暴露收场（**和「类型」分开**，所以「照实答」也能被写成一句话把人送走）；留空 = 只按上面的怀疑值结算。"});
  fields.push({k:"shake", label:"选完震屏的力度（0 = 不震）", t:"num",
    hint:"填了就让屏幕晃一下 —— 用在「这句话一说出来，气氛就变了」的选项上。出厂那几处抖动是 18（重）/ 10（QTE 失败）/ 7（掏手机被抓）。"});
  return fields;
}
function optionTitle(o, i){
  const t = (o || {}).tone;
  const s = (o || {}).suspicion;
  // ★ 第五十六轮：自行编辑的题没有 tone —— 标题就只报怀疑值，别显示一个「?」
  const head = "选项 " + (i + 1) + (t ? " · " + t : "");
  return head +
    (typeof s === "number" ? "　怀疑 " + (s > 0 ? "+" + s : s) : "　（默认代价）");

function questionFields(manual){
  // ★★ 第五十五轮：「题目来源」= 自行编辑（manual）时，题目与档案卡 / 事实脱钩 ——

  const fields = [

  if (!manual){

  fields.push(

function buildIndex(){
  index = [];
  const add = (v, path, where, what) => index.push({v, path, where, what:String(what || "")});
  (story.backgrounds || []).forEach((b, bi) => {
    const bv = {kind:"bg", index:bi};
    const bn = b.name || b.id;
    add(bv, "intro", bn + " · 开场介绍", b.intro || "");
    (b.levels || []).forEach((l, i) => add(bv, "levels/" + i, bn + " · 关卡" + (i + 1), (l.name || "") + " " + (l.derived_profile || "")));
    (b.cards || []).forEach((c, i) => add(bv, "cards/" + i, bn + " · 档案卡", c.topic + " " + c.text));
    // ★ 第二十九轮：题目改成统一 schema —— 题面在 text，候选回答在 options[]
    (b.questions || []).forEach((q, i) => add(bv, "questions/" + i, bn + " · 盘问题目",
      (q.text || q.q || "") + " " + (q.note || "") + " " + (q.options || []).map(o => ((o.text || "") + " " + (o.echo || ""))).join(" ")));
    (b.companion_questions || []).forEach((cq, i) => add(bv, "companion_questions/" + i, bn + " · 同行者提问",
      cq.line + " " + cq.plant + " " + (cq.options || []).map(o => o.text).join(" ")));
    (b.blind_questions || []).forEach((bq, i) => add(bv, "blind_questions/" + i, bn + " · 盲区题",
      bq.q + " " + bq.setup + " " + bq.made_up + " " + bq.bluff + " " + bq.evade));
    (b.facts || []).forEach((f, i) => add(bv, "facts/" + i, bn + " · 事实 " + f.id,
      (f.prompts || []).join(" ") + " " + (f.values || []).map(v => v.label).join(" ")));
    (b.sms || []).forEach((t, i) => add(bv, "sms/" + i, bn + " · 短信 · " + t.contact,
      (t.messages || []).map(m => m.text).join(" ")));
    (b.interference_lines || []).forEach((s, i) => add(bv, "interference_lines/" + i, bn + " · 干扰台词", s));
  });
  (story.traits || []).forEach((t, i) => add({kind:"traits"}, "traits/" + i, "审问者性情 · " + t.name,
    t.tag + " " + t.desc + " " + t.hint + " " + t.bluff_note + " " + t.evade_note +
    " " + (t.memo || "") + " " + (t.like || "") + " " + (t.hate || "")));
  Object.keys(story.item_desc || {}).forEach(k => add({kind:"global"}, "item_desc/" + k, "衣物描述", story.item_desc[k]));
  Object.keys(story.clue_frame || {}).forEach(k => add({kind:"global"}, "clue_frame/" + k, "情报句式", story.clue_frame[k]));
  Object.keys(story.clue_sources || {}).forEach(k => add({kind:"global"}, "clue_sources/" + k, "情报来源", (story.clue_sources[k] || []).join(" ")));
  (story.photo_notes || []).forEach((s, i) => add({kind:"global"}, "photo_notes/" + i, "照片背面", s));

  // 玩法数值 / 界面文案 / 结局文案 —— 路径的第一段必须是区块的 key，
  // 这样 jumpTo 里的「展开这一节」才能对得上（foldSet 用的就是 navKey()/区块key）。
  const R = story.rules || {};
  rulesSections().forEach(sec => (sec.fields || []).forEach(f => {
    const val = R[f.k];
    add({kind:"rules"}, sec.key + "/" + f.k, "数值 · " + stripNum(sec.title) + " · " + (f.label || f.k),
      Array.isArray(val) ? val.join(" ") : String(val == null ? "" : val));
  }));
  const U = story.ui || {};
  uiSections().forEach(sec => (sec.fields || []).forEach(f => {
    const g = U[sec.seg] || {};
    const val = g[f.k];
    add({kind:"ui"}, sec.key + "/" + f.k, "界面文案 · " + stripNum(sec.title) + " · " + (f.label || f.k),
      Array.isArray(val) ? val.join(" ") : String(val == null ? "" : val));
  }));
  (story.backgrounds || []).forEach((b, bi) => {
    const bn = b.name || b.id || ("背景 " + (bi + 1));
    const E = b.endings || {};
    endingsSections().forEach(sec => (sec.fields || []).forEach(f => {
      add({kind:"endings", index:bi}, sec.key + "/" + f.k, bn + " · 结局 · " + (f.label || f.k),
        String(E[f.k] == null ? "" : E[f.k]));
    }));
  });
  // 第二十三轮那四段也要进搜索索引 —— 否则搜「强制」「QTE」找不到东西
  const lv = {kind:"levels"}, fo = {kind:"forced"}, qt = {kind:"qte"}, df = {kind:"defects"};
  (story.levels || []).forEach((l, i) => add(lv, "lv_list/" + i,
    "关卡" + (i + 1) + " · " + (l.name || ""),
    (l.name || "") + " " + (l.derived_profile || "") + " 反差要求 " + (l.contrast_req == null ? "" : l.contrast_req)));
  (story.forced_rules || []).forEach((e, i) => add(fo, "fr_list/" + i,
    "强制穿着 · 第 " + (i + 1) + " 关",
    (e.mode || "") + " " + (e.rules || []).map(r => ((r.items || []).map(id => itemLabel(id)).join("、"))).join(" | ")));
  (story.qte_plan || []).forEach((e, i) => add(qt, "qte_list/" + i,
    "QTE 计划 · 第 " + (i + 1) + " 题", qteTitle(e, i)));
  (story.defects || []).forEach((e, i) => add(df, "df_list/" + i,
    "身体缺陷 · " + (e.name || e.id || (i + 1)),
    (e.name || "") + " " + (e.slot_hint || "") + " " + ((e.cover_tags || []).join(" "))));
}


function stripNum(s){ return String(s || "").replace(/^[①-⑳]\s*/, ""); }

function renderResults(q){
  const box = $("results"); box.innerHTML = "";
  q = (q || "").trim().toLowerCase();
  if (!q) return;
  const hits = index.filter(e => (e.what + " " + e.where).toLowerCase().includes(q)).slice(0, 120);
  box.append(h("div", {class:"navhead", text: hits.length + " 条匹配"}));
  hits.forEach(e => box.append(h("button", {class:"res", onclick:()=>jumpTo(e)},
    h("div", {class:"where", text:e.where}),
    h("div", {class:"what", text: short(e.what, 90)}))));
}

function jumpTo(e){
  const parts = e.path.split("/");
  const secKey = parts[0];
  go(e.v);
  foldSet.delete(navKey() + "/" + secKey);
  for (let i = 1; i < parts.length; i += 2) openSet.add(navKey() + "/" + secKey + "/" + parts[i]);
  renderAll();
  const target = document.querySelector('[data-k="' + navKey() + "/" + secKey + (parts[1] !== undefined ? "/" + parts[1] : "") + '"]');
  if (target){
    target.scrollIntoView({block:"center"});
    target.style.outline = "2px solid var(--amber)";
    setTimeout(() => target.style.outline = "", 1600);
  }
}

// ★ 第四十一轮：删掉「一轮」时的**联动清理**。
//   用户口径：「删除关卡后只出现在对应关卡的题目也应自动删去」。
//   具体做三件事 ——
//     ① 把「固定给这一轮」的题目删掉（它们只属于这一轮，留着永远不会再出现）
//     ② 把「属于后面几轮」的题目整体往前挪一轮（否则它们同样永远出不来）
//     ③ 原貌预设里「逐轮指定」那一项同样删掉，后面几项往前挪
//   ★ 弹一次确认，把「会牵连到什么」列清楚 —— 这个操作只能靠 Ctrl+Z 撤销。
//   ★ 返回 false = 放弃这次删除（renderObjList 会照做）。
function cascadeDeleteRound(bg, idx){
  const qs = bg.questions || [];
  let doomed = 0, moved = 0;
  qs.forEach(q => {
    const lv = Number(q.level);
    if (lv === idx) doomed++;
    else if (lv > idx) moved++;
  });
  const tp = bg.true_presets || {};
  const byLv = Array.isArray(tp.by_level) ? tp.by_level : [];
  const hasPvHere = !!(byLv[idx] && byLv[idx].slots && Object.keys(byLv[idx].slots).length);
  let pvMoved = 0;
  for (let k = idx + 1; k < byLv.length; k++)
    if (byLv[k] && byLv[k].slots && Object.keys(byLv[k].slots).length) pvMoved++;

  const bits = [];
  if (doomed) bits.push("删掉 " + doomed + " 道只属于这一轮的题目");
  if (moved) bits.push("把 " + moved + " 道属于后面几轮的题目往前挪一轮");
  if (hasPvHere) bits.push("丢掉这一轮的原貌指定");
  if (pvMoved) bits.push("把后面几轮的原貌指定往前挪一轮");
  if (!bits.length) return true;               // 没有牵连，直接删

  if (!confirm("第 " + (idx + 1) + " 轮还有东西挂着：\n\n· " + bits.join("\n· ")
      + "\n\n继续删除这一轮？（删错了可以 Ctrl+Z 撤销）")) return false;

  // ① 题目
  if (bg.questions){
    const keep = [];
    bg.questions.forEach(q => {
      const lv = Number(q.level);
      if (lv === idx) return;                    // 只属于这一轮 → 删掉
      if (lv > idx) q.level = lv - 1;            // 后面的整体往前提一轮
      keep.push(q);
    });
    bg.questions.length = 0;
    for (const q of keep) bg.questions.push(q);
  }
  // ② 原貌预设的「逐轮指定」
  if (Array.isArray(tp.by_level)) tp.by_level.splice(idx, 1);
  return true;
}

function phoneSections(page){
  const seg = PHONE_SEGS[page] || [];
  const out = [{
    key:"ph_" + page, title:"文案", kind:"object", host:()=>phoneSec(page),
    fields: seg.map(f => {
      const want = PH_EXPECT[page + "." + f.k];
      return {
        k:f.k, label:f.label, t:f.t || "text", rows:f.rows || 2,
        hint:(f.hint || "") + (want !== undefined ? "　★ 必须 " + want + " 个占位符（现在填了几个会在校验面板里报）" : ""),
      };
    }),
  }];
  const withPh = seg.filter(f => PH_MEANING[page + "." + f.k]);
  if (withPh.length){
    // 占位符对照写在同一个节的提示里 —— 单开一节会是个空壳（0 项）
    out[0].hint = withPh.map(f => f.label + "：" + PH_MEANING[page + "." + f.k]
      .map((m, i) => "第 " + (i + 1) + " 个 = " + m).join("，")).join("　｜　");
  }
  return out;
}

function renderAll(){ buildNav(); renderMain(); renderStatus(); }

function renderMain(){
  const main = $("main"); main.innerHTML = "";
  // 校验面板永远挂在最上面 —— 改坏了当场看得见
  main.append(h("div", {id:"issues"}));
  renderIssues();

  if (view.kind === "home") return renderHome(main);
  if (view.kind === "bg"){
    const bg = bgOf();
    const draft = !bgEnabled(bg);
    main.append(h("h1", {text:(draft ? "📝 " : "🎬 ") + (bg.name || bg.id || "背景")}));
    main.append(h("div", {class:"sub", text:(bg.venue || "") + "　·　审讯官：" + (bg.interrogator || "?") +
      "　·　你装成 " + (bg.cover_role || "?") + "，其实是 " + (bg.true_role || "?") +
      (bg.true_name ? "（" + bg.true_name + "）" : "")}));

    // ★ 第五十三轮：草稿说明 + 删除入口。
    //   草稿不参与抽取与测试，所以这里要**明说**，否则会以为「怎么游戏里碰不到它」。
    if (draft){
      main.append(h("div", {class:"sec"},
        h("div", {class:"sechead"}, h("span", {class:"t", text:"📝 这一套还是草稿"})),
        h("div", {class:"secbody"}, h("div", {class:"help"},
          h("div", {}, "· 草稿 ", h("b", {text:"不会被游戏抽到"}), "，也不进自动化测试 —— "
            + "所以你可以慢慢填，半成品不会漏到游戏里。"),
          h("div", {}, "· 填齐内容后，去下面的「① 基础信息」勾上 ", h("b", {text:"★ 启用这一套"}), "。"),
          h("div", {}, "· 一套「能上场」的背景至少要：",
            h("b", {text:"12 张档案卡"}), "（B 的 5 张 + A 的 7 张）、",
            h("b", {text:"每轮 1 道盲区题"}), "、",
            h("b", {text:"每轮 1 条事实 + 1 条短信"}), "（短信负责揭示那条事实的官方口径）、",
            h("b", {text:"4 条以上干扰台词"}), "，外加基础信息里那几行文字。"),
          h("div", {}, "· 启动检查面板会先说清楚缺什么（草稿只报一条提醒，"
            + "**启用之后**才会逐条校验内容）。"),
        ))));
    }

    bgSections(bg).forEach(s => main.append(renderSection(s, navKey())));

    main.append(h("div", {class:"sec"},
      h("div", {class:"sechead"}, h("span", {class:"t", text:"删除这一套背景"})),
      h("div", {class:"secbody"}, h("div", {class:"row"},
        h("button", {class:"btn danger", text:"删掉「" + (bg.name || bg.id || "这套") + "」",
          onclick:removeBackground})),
        h("div", {class:"help", style:"margin-top:6px"},

        h("div", {}, "· 缺陷越多，换装越难（每处都得找衣服盖住）。删到 0 项也能跑，就是「没有缺陷」这个玩法没了。"),
      ))));
    main.append(renderSection({
      key:"df_list", title:"缺陷表", kind:"objlist",
      arr:()=>{ if (!Array.isArray(story.defects)) story.defects = []; return story.defects; },

    }, navKey()));
