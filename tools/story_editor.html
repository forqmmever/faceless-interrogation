<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千面人 · 文本编辑器</title>
<style>
:root{
  --bg:#0e1015; --panel:#161a21; --panel2:#1d222c; --panel3:#242a36;
  --line:#2b3240; --line2:#3a4354;
  --fg:#e9edf4; --fg2:#b6becd; --dim:#7c869a;
  --amber:#e6a23c; --red:#f0554f; --ok:#4fc98a; --blue:#5aa9e6; --purple:#a98be0;
  --mono:"Cascadia Mono","Consolas","Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--fg); font:13px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--panel3);border-color:var(--line2)}
button.primary{background:#2c3d2f;border-color:#3f6a48;color:#bff0cf}
button.primary:hover{background:#354a39}
button.warn{background:#3d2b2b;border-color:#6a3f3f;color:#f5c0bd}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{
  font:inherit;color:var(--fg);background:#11141a;border:1px solid var(--line);
  border-radius:6px;padding:5px 8px;width:100%;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--amber);background:#0d1015}
textarea{resize:vertical;line-height:1.65;font-family:inherit}
input[type=number]{font-family:var(--mono)}
input[type=checkbox]{width:auto;accent-color:var(--amber)}
select{cursor:pointer}
::placeholder{color:#5b6376}

/* ---------- 顶栏 ---------- */
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-weight:700;letter-spacing:.5px;color:var(--amber);white-space:nowrap}
.brand small{color:var(--dim);font-weight:400;margin-left:6px;letter-spacing:0}
#fileinfo{color:var(--dim);font-size:12px;padding-left:10px;border-left:1px solid var(--line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fileinfo.dirty{color:var(--amber)}
.spacer{flex:1}

/* ---------- 主体 ---------- */
#body{flex:1;display:flex;min-height:0}
#side{width:280px;flex:0 0 280px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
#searchbox{padding:8px;border-bottom:1px solid var(--line)}
#nav,#results{overflow:auto;padding:6px}
#nav{flex:1}
.navgroup{margin-bottom:6px}
.navhead{padding:5px 8px;color:var(--dim);font-size:11px;letter-spacing:1px}
.navitem{padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.navitem:hover{background:var(--panel2)}
.navitem.on{background:#2a2417;color:var(--amber);box-shadow:inset 2px 0 0 var(--amber)}
.navitem .cnt{margin-left:auto;color:var(--dim);font-size:11px;font-family:var(--mono)}
.navitem.sub{padding-left:22px;font-size:12px;color:var(--fg2)}
.res{display:block;width:100%;text-align:left;margin-bottom:4px;padding:6px 8px;
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.res:hover{border-color:var(--amber)}
.res .where{color:var(--dim);font-size:11px}
.res .what{color:var(--fg2);font-size:12px;margin-top:2px;word-break:break-all}

#main{flex:1;overflow:auto;padding:14px 18px 60px;min-width:0}
#main h1{font-size:16px;margin:0 0 4px}
#main .sub{color:var(--dim);font-size:12px;margin-bottom:14px}

/* ---------- 区块 ---------- */
.sec{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.sechead{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel2);cursor:pointer}
.sechead:hover{background:var(--panel3)}
.sechead .t{font-weight:600}
.sechead .n{color:var(--dim);font-size:11px;font-family:var(--mono)}
.sechead .sp{flex:1}
.secbody{padding:12px}
.sec.fold .secbody{display:none}
.sec.fold .caret{transform:rotate(-90deg)}
.caret{display:inline-block;transition:transform .12s;color:var(--dim)}

/* ---------- 字段 ---------- */
.field{margin-bottom:11px}
.field:last-child{margin-bottom:0}
.flabel{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;color:var(--fg2);font-size:12px}
.flabel .k{font-family:var(--mono);color:var(--dim);font-size:11px}
.flabel .hint{color:#6b7488;font-size:11px}
.ro{opacity:.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid2>.field{margin-bottom:0}

/* ---------- 条目 ---------- */
.item{border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:8px}
.item.fold .itembody{display:none}
.itemhead{display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:pointer}
.itemhead:hover{background:var(--panel3)}
.itemhead .it{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itemhead .ops{display:flex;gap:3px;flex:0 0 auto}
.itemhead .ops button{padding:2px 6px;font-size:12px;background:transparent;border-color:transparent}
.itemhead .ops button:hover{background:var(--panel3);border-color:var(--line2)}
.itembody{padding:10px 11px 12px;border-top:1px solid var(--line)}
.badge{font-size:11px;padding:1px 6px;border-radius:20px;border:1px solid var(--line2);color:var(--dim);font-family:var(--mono)}
.badge.A{color:#f0a0a0;border-color:#6a3f3f}
.badge.B{color:#a0d8b0;border-color:#3f6a48}
.addrow{margin-top:8px;display:flex;gap:8px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.tabs button.on{background:#2a2417;border-color:var(--amber);color:var(--amber)}
.empty{color:var(--dim);padding:10px;text-align:center;border:1px dashed var(--line);border-radius:8px}

/* ---------- 预览 ---------- */
.pv{margin-top:10px;border:1px dashed var(--line2);border-radius:8px;background:#0c0f14;padding:11px}
.pv .pt{color:var(--dim);font-size:11px;letter-spacing:1px;margin-bottom:8px}
.pv .who{color:var(--amber);font-weight:600;margin-right:4px}
.pv .opt{padding:6px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);margin-top:5px}
.pv .opt .d{float:right;font-family:var(--mono);font-size:11px;color:var(--dim)}
.pv .opt.danger{border-color:#6a3f3f;background:#2a1c1c}
.pv .opt.ok{border-color:#3f6a48;background:#1b2a20}
.pv .plant{margin-top:8px;padding-left:9px;border-left:2px solid var(--purple);color:var(--fg2);font-size:12px}
.pv .leak{margin-top:8px;padding:7px 9px;border-radius:6px;background:#2a1c1c;border:1px solid #6a3f3f;color:#f5c0bd;font-size:12px}
.phone{max-width:330px;border:1px solid var(--line2);border-radius:14px;background:#0b0e13;padding:10px}
.phone .phead{text-align:center;color:var(--fg2);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}
.bub{max-width:82%;padding:6px 10px;border-radius:12px;margin:5px 0;font-size:12px;word-break:break-word}
.bub.me{margin-left:auto;background:#2c3d2f;border:1px solid #3f6a48}
.bub.them{background:var(--panel3);border:1px solid var(--line2)}
.traits{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--fg2)}

/* ---------- 校验 ---------- */
#issues{margin-bottom:12px}
.issbox{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.isshead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel2);cursor:pointer;font-weight:600}
.isshead.err{color:var(--red)} .isshead.warn{color:var(--amber)} .isshead.good{color:var(--ok)}
.isslist{padding:8px 12px;max-height:280px;overflow:auto}
.iss{display:flex;gap:8px;padding:3px 0;font-size:12px;cursor:pointer;border-radius:4px}
.iss:hover{background:var(--panel2)}
.iss .lv{flex:0 0 42px;font-family:var(--mono);font-size:11px}
.iss .lv.e{color:var(--red)} .iss .lv.w{color:var(--amber)}
.iss .m{color:var(--fg2);word-break:break-word}

/* ---------- 状态栏 ---------- */
#status{flex:0 0 auto;display:flex;gap:14px;align-items:center;padding:5px 12px;background:var(--panel);
  border-top:1px solid var(--line);color:var(--dim);font-size:12px;font-family:var(--mono)}
#toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:#252c38;
  border:1px solid var(--line2);border-radius:8px;padding:9px 16px;opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:99;max-width:80vw;text-align:center}
#toast.on{opacity:1}
.help{padding:12px;color:var(--fg2);font-size:12px;line-height:1.9}
.help code{font-family:var(--mono);background:#11141a;padding:1px 5px;border-radius:4px;color:var(--amber)}
.help b{color:var(--fg)}

/* ---------- 勾选组（衣物 id / 标签 / 槽位多选）---------- */
.msbox{border:1px solid var(--line);border-radius:8px;background:#11141a;padding:8px}
.msbox input[type=text]{width:100%;margin-bottom:6px}
.mslist{max-height:230px;overflow:auto;display:flex;flex-wrap:wrap;gap:4px}
.msitem{display:flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line);
  border-radius:999px;font-size:12px;cursor:pointer;color:var(--fg2);background:#161a22}
.msitem:hover{border-color:var(--line2);color:var(--fg)}
.msitem.on{border-color:var(--amber);color:var(--fg);background:#241d10}
.msitem input{margin:0}
/* 嵌套清单（每一关下面的若干条规则）往右缩一档，层级一眼看得出 */
.field .sec{margin-left:10px;border-left:2px solid var(--line)}

/* ---------- 第四十轮：服装数值 / 原貌 两个页签的表格 ---------- */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.row:last-child{margin-bottom:0}
.chk{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--fg2);cursor:pointer;user-select:none}
.dim{opacity:.5}
.sec.off{opacity:.62}
.btn.on{background:#2a2417;border-color:var(--amber);color:var(--amber)}
.btn.tiny{padding:1px 7px;font-size:12px;line-height:1.5}
.btn.danger{background:#3d2b2b;border-color:#6a3f3f;color:#f5c0bd}
.btn.danger:hover{background:#4a3434}

/* 表格：物品行 = 4 列，原貌行 = 3 列 */
.irow{display:grid;gap:8px;align-items:center;padding:4px 8px;border-top:1px solid var(--line)}
.irow.items{grid-template-columns:minmax(160px,1fr) 210px 210px 34px}
.irow.picks{grid-template-columns:minmax(140px,200px) 1fr 34px}
.irow.ihead{color:var(--dim);font-size:11px;border-top:0;background:var(--panel2);letter-spacing:.5px;
  position:sticky;top:0;z-index:1}
.irow.changed{background:rgba(230,162,60,.08)}
.irow.changed:hover{background:rgba(230,162,60,.13)}
.iname{display:flex;gap:6px;align-items:baseline;min-width:0;overflow:hidden}
.iname b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iname .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inum,.ipick,.iact{display:flex;gap:6px;align-items:center;min-width:0}
.inum input{width:72px;text-align:right}
.inum .hint,.ipick .hint{font-size:11px;color:var(--dim);white-space:nowrap}
.iact{justify-content:flex-end}
input.in{background:#11141a;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--fg)}
input.in:focus{border-color:var(--amber)}
input.in.sel{}
select.in{padding:3px 7px;width:100%;max-width:420px}
.presetlist .navitem{cursor:pointer}
.presetlist .navitem.dim{opacity:.55}
</style>
</head>
<body>

<header id="top">
  <div class="brand">千面人 · 文本编辑器<small>剧情 / 数值 / 文案 / 结局</small></div>
  <div id="fileinfo">未连接</div>
  <div class="spacer"></div>
  <button id="btn-reload" title="从磁盘重新读一遍 data/story.json（丢弃本页改动）">↻ 重新载入</button>
  <button id="btn-stop" title="停掉本地服务（它现在不占窗口，不用了可以关）">⏹ 停服务</button>
  <button id="btn-save" class="primary" title="Ctrl+S 直接写回 data/story.json">💾 保存到 data/story.json</button>
  <button id="btn-gd" title="导出可粘贴回 ScenarioData.gd 的常量块">📋 回退常量</button>
  <button id="btn-undo" title="Ctrl+Z">↶</button>
  <button id="btn-redo" title="Ctrl+Shift+Z">↷</button>
</header>

<div id="body">
  <aside id="side">
    <div id="searchbox"><input id="search" placeholder="搜索短信 / 对话 / 选项文本…"></div>
    <div id="nav"></div>
    <div id="results"></div>
  </aside>
  <main id="main"></main>
</div>

<footer id="status">
  <span id="st-file">—</span><span id="st-count"></span><span id="st-iss"></span>
</footer>
<div id="toast"></div>

边看着，偶尔替那位老兵，把话头往你身上引一引。","interrogator":"哨所的老兵","interrogator_gender":"男","companion":{"name":"车夫·老崔","relation":"同行的车夫","gender":"男","desc":"替你赶车过哨卡的人。他认得你颈侧那道烙印 —— 知道你是北环帮的联络人，也知道你在装香料商。他不揭穿，只在旁边替老兵把话头往你身上引。"},"cover_role":"北境香料行商","true_role":"北环帮的联络人","true_name":"沈棠","levels":[{"intro":"黑石山脉北麓的官道关隘。\n风从垭口灌下来，栅栏上的霜一夜没化。火盆烧得半死不活，四五个兵丁缩在背风的墙根。\n你赶着一队驮马走到哨卡前，被拦了下来 —— 例行查验。\n负责查验的是个快五十的老兵。他翻着你的货单，目光却总往你领口飘。\n\n你身边是替你赶车的老崔。他知道你是谁，也知道你在装谁。\n他不出手，也不揭穿 —— 他只是在旁边看着，偶尔替那位老兵，把话头往你身上引一引。"},{"intro":"第一轮的问话没能把你钉死，老兵把货单合上，却又从抽屉底下抽出另一本更旧的册子。\n火盆添了新炭，栅栏外的风更冷了。他让你把来处、货、还有刚才那些话，从头再说一遍 —— 这一次，他记得你上一遍是怎么说的。\n\n老崔靠在门框上，没看你，也没打算替你圆。"}],"cards":[{"id":"b_identity","topic":"身份","owner":"B","text":"我是北境香料行的行商，常年往返寒霜港与黑石山脉。"},{"id":"b_birth","topic":"来处","owner":"B","text":"寒霜港东侧旧城区，码头往上数第三条巷子。"},{"id":"b_goods","topic":"货品","owner":"B","text":"丁香、肉桂、肉豆蔻，偶尔捎带些北境的琥珀。"},{"id":"b_scar","topic":"手背的痕迹","owner":"B","text":"幼年在香料工坊帮工，被蒸煮锅的蒸汽烫的。"},{"id":"b_purpose","topic":"此行目的","owner":"B","text":"替东家送样品去公爵府邸，顺路讨去年欠下的货款。"},{"id":"a_signal","topic":"敲门暗号","owner":"A","text":"三长两短敲三下门板 —— 北环码头的接头信号。"},{"id":"a_contact","topic":"上线","owner":"A","text":"「灰隼」是我的上线，只在满月夜的老灯塔见面。"},{"id":"a_cargo","topic":"驮队夹层","owner":"A","text":"夹层里运的是禁运硝石，香料只是幌子。"},{"id":"a_brand","topic":"颈侧的烙印","owner":"A","text":"那是北环帮的入伙烙印，烧红的船锚铁按上去的。"},{"id":"a_debt","topic":"旧账","owner":"A","text":"去年冬天在寒霜港欠了「独眼」三百金，至今没还。"},{"id":"a_tunnel","topic":"密道","owner":"A","text":"黑石山脉北坡有条不走官道的雪洞，只有帮里人知道。"},{"id":"a_boss","topic":"帮里的规矩","owner":"A","text":"货丢了可以，名字漏了不行 —— 这是北环帮唯一一条死规矩。"}],"questions":[{"id":"q_b_birth","level":-1,"speaker":"interrogator","text":"你说你从寒霜港来。旧城区那股鱼腥味，现在还散得掉吗？","card":"b_birth","options":[{"text":"散不掉。码头往上数第三条巷子，一到夏天最难熬。","tone":"correct"},{"text":"鱼腥味？我走的时候那一片早就拆了。","tone":"bluff"},{"text":"这个……我不太想聊家乡的事。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_birth 卡，归属 B）"},{"id":"q_a_brand","level":-1,"speaker":"interrogator","text":"（他忽然前倾，目光钉在你领口）你颈侧那道印子 —— 我好像在哪儿见过。","card":"a_brand","op qte":{"kind":"none"}},{"id":"s1_q2","level":0,"speaker":"interrogator","text":"空太郎：真巧啊，能在这里遇见，陈虎不是对桌游没什么兴趣吗？","options":[{"text":"其实是因为我很喜欢桌游，是我强行把他拉过来的，之前也拉他去过桌游店","tone":"correct","suspicion":0,"echo":"空太郎点了点头，然后又摇了摇头 —— 你觉得大概是对你这样的女生和陈虎凑成一对感到可惜。"},{"text":"听说你正好来采购桌游","tone":"leak","suspicion":100,"ending":"leak","echo":"脱口而出的瞬间，你就感觉到了后悔。\n「？！我是今天下午和阳乃聊天时，才决定来这里买她推荐的新出的桌游，你怎么会知道？」\n空太郎皱紧了眉头，更加仔细地端详着我，然后说出了那句决定性的话语：「难不成你是……」\n\n失败原因：说出了伪装身份下，不应该知道的事情，暴露了真实身份。"}],"note":"原文结果：第一句 → 空太郎点头又摇头，觉得可惜；第二句 → 空太郎皱眉追问「你怎么知道」，然后说出「难不成你是…」，进入结局。"},{"id":"s1_q3","level":0,"speaker":"companion","text":"陈虎：喂，老兄，怎么不讲讲我是怎么吹嘘的？我可是把她的各种照片视频都让你看过了，让你知道她有多棒了。\n先不说这些了，你那位贵族学校上学的女友阳乃呢？我这位女友之前还和我说想见见她，和她说说话。你要说什么来着，要不要让空太郎转告一下？","options":[{"text":"之前我和阳乃小姐偶遇过一回，已经成朋友啦，没什么话需要转告的了","tone":"bluff","suspicion":20,"echo":"（空太郎：「我从没听阳乃小姐说过有这么个朋友。」）"},{"text":"阳乃同学其实是我失散多年的姐姐","tone":"bluff","suspicion":20,"echo":"（空太郎：「……何意味？」）"},{"text":"我非常憧憬阳乃小姐，想要和她做朋友","tone":"bluff","suspicion":0,"echo":"空太郎：「那下次有机会，我介绍你们认识吧。」"}],"note":"原文结果：第一句 → 空太郎「我从没听阳乃小姐说过有这么个朋友」，怀疑值上升；第二句 → 空太郎「何意味」；第三句 → 空太郎「那下次有机会我介绍你们认识吧」。","qte":{"kind":"expression"}},{"id":"s1_q4","level":0,"speaker":"interrogator","text":"其实刚才我一直在回忆，对你一点印象也没有。校服也不合身,\n最主要是你的气质和阳乃真的很像。难不成你是\n刚从贵族学校转到我们学校的吗？","options":[{"text":"家道中落desuwa","tone":"bluff","suspicion":0,"echo":"(空太郎：「竟然还保留着 desuwa这样的口癖，原来是高纯度的大小姐。」,这下准没错)"},{"text":"是的，我是你退学后才转来的","tone":"correct","suspicion":0},{"text":"（你只听到空太郎说“你难道是”，便开始辩解）不对不对 。（接着听到空太郎说“你难道是贵族学校转校来的”）哦，对的对的","suspicion":30,"echo":"(空太郎：「好奇怪的反应」)"}],"note":"原文结果：家道中落desuwa → 空太郎「竟然是 desuwa，原来是高纯度的大小姐」；是的，我是你退学后才转来的 → 空太郎继续端详你。"},{"id":"s1_q5","level":0,"speaker":"interrogator","text":"过几天，我的生日宴会你来参加吗？带上阳乃一起来，我们好久没有聚过了。之前让你定的 KTV 怎么样了？","options":[{"text":"15号下午的cdd","tone":"bluff","suspicion":30,"echo":"空太郎：「刚才还说得那么恩爱，真的会有不记得自己男友生日的女友？」怀疑度上升。\n随后空太郎答应带阳乃赴宴：「行吧，正好带阳乃见一下你的新女友，我再参加一次。」\n听到空太郎说要带你去参加陈虎的生日宴，还要分身装作陈虎的女友，你有点不知所措，但很快你就冷静下来了 —— 毕竟空太郎的邀请，肯定是很好拒绝的。"},{"text":"14号下午的abd","tone":"bluff","suspicion":0, ","tone":"bluff","suspicion":20}],"note":"原文只有两句回应，没有写后续结果。","qte":{"kind":"none"}},{"id":"s2_q4","level":0,"speaker":"interrogator","text":"哦，刚才有点幻听，好像听到美羽的声音了。我还以为你是和姐姐一起来的 —— 今天是一个人来的吗？","options":[{"text":"今天是和父亲大人一起来的。","tone":"correct","suspicion":0,"echo":"正巧，在你回答这句话时，父亲拉开了帘子。"},{"text":"今天是一个人来的。","tone":"bluff","suspicion":20,"echo":"好巧不巧，在你回答这句话时，对现状一无所知的父亲拉开帘子从试衣间出来。\n小力：「就算是离婚了，和生父一起出来玩，也不至于隐瞒吧？难道和刚才的声音有关？」怀疑度增加。"}],"note":"原文：第一句 → 父亲拉开帘子；第二句 → 父亲出来，小力起疑，怀疑度增加。","qte":{"kind":"none"}},{"id":"s2_q5","level":0,"speaker":"interrogator","text":"（父亲看到小力先是一愣，但很快反应过来）我试衣服的时候，辛苦你陪我女儿了。我们有点急事，先走了。","options":[{"text":"明天见，力。","tone":"bluff","suspicion":100,"ending":"leak","echo":"虽然演到最后一刻，你还是没有绷住。虽然小力什么也没说，但那天是最后一次和小力说话。\n\n原因：没有使用敬语，使用了美羽平常的称呼"},{"text":"小力前辈，我们先告辞了。","tone":"correct","suspicion":0}],"note":"原文：明天见 → 没绷住，那天是最后一次和小力说话；前辈 → 按礼数收场。","qte":{"kind":"none"}},{"id":"s2b_q1","level":1,"speaker":"interrogator","text":"（在约会地点焦急等待的小力注意到了从身边经过的我和父亲）诶？这不是爱子吗？今天又和父亲一起出来玩，父女俩感情真好。","options":[{"text":"我和父亲大人分开了很久，有好多好多爱意倾诉不完呢","tone":"bluff","echo":"看着和自己女友长得如此相像的女生，当众宣告对父亲的爱，小力有些担心：自己的女友在自己面前对父亲那么冷淡，私下里会不会是另一副模样。","suspicion":0},{"text":"我最喜欢父亲大人了","tone":"bluff","suspicion":0,"echo":"看着和自己女友长得如此相像的女生，当众宣告对父亲的爱意，小力有些担心：自己的女友在自己面前对父亲那么冷淡，私下里会不会是另一副模样。"}],"note":"原文：两个选项都让小力担心「美羽私下里会不会是另一副模样」。"},{"id":"s2b_q2","level":1,"speaker":"interrogator","text":"（小力半开玩笑地）爱子和父亲的关系这么好，不会现在还在一起洗澡吧？","options":[{"text":"是的呢，听说其他父女都有这个时期，但因为家庭的缘故我没怎么体验过，昨天就缠着父亲大人一起试了下","tone":"bluff","suspicion":20,"echo":"小力愣了一下，随即皱起眉：「……美羽呢？她为什么没有阻止你们？」怀疑度上升。"},{"text":"听说其他父女都有这个时期，但因为家庭的缘故我没怎么体验过，昨天对父亲大人说想试一下，被拒绝了","tone":"bluff","suspicion":0,"echo":"小力沉默了几秒，像是松了口气，又像更在意了：「……被拒绝了。」"}],"note":"原文：承认 → 小力问「美羽为什么没有阻止他们」、怀疑度上升；被拒绝 → 小力沉默。"},{"id":"s2b_q3","level":1,"speaker":"interrogator","text":"（觉得刚才的交流有些尴尬，小力换了个话题）你身上的香水味，和我送美羽的那款好像。是你自己挑的吗？","options":[{"text":"是的。","tone":"bluff","suspicion":0,"echo":"小力：「感觉和你挺配的。是不是美羽那种女生不喜欢这种类型？我送她以后，从没见她用过。」"},{"text":"不是。","tone":"bluff","suspicion":20,"echo":"小力：「美羽短信里和我说，和妹妹关系并不算好。为什么还会借给她当初说会好好珍惜的我送的礼物？」"}],"note":"原文：是 → 小力说和她挺配、美羽从没用过；不是 → 小力问「关系不好为什么还借」。","qte":{"kind":"none"}},{"id":"s2b_q4","level":1,"speaker":"interrogator","text":"（小力觉得没什么话可聊的了，但你依然站在那里等他继续问）于是就问 ：今天你见到你姐姐美羽了吗？其实今天我和美羽约定在这里见面，不过已经过去了好久。","options":[{"text":"今天早上出门时她还没起，可能是她有点发烧，就没出来。","tone":"bluff","suspicion":30,"echo":"小力：「美羽那样的练田径的女生，怎么会生这么多次病？而且每次都正好是爱子出现的时候。」怀疑度上升。"},{"text":"可能是昨晚运动太久，今天早上我们出门时她还没起，睡过了。","tone":"bluff","suspicion":0,"echo":"小力：「明明是美羽主动提出约会的，昨晚怎么运动那么久……不过，既然是美羽那样大大咧咧的女生，也确实有可能。」"}],"note":"原文：发烧 → 小力质疑「怎么老生病、每次都正好是爱子出现」；运动太久 → 小力半信半疑。","qte":{"kind":"none"}},{"id":"s2b_q5","level":1,"speaker":"interrogator","text":"（小力苦笑）爱子，你姐姐最近……是不是有什么事瞒着我？她对我越来越冷淡了。","options":[{"text":"姐姐大人只是不擅长表达。","tone":"evade","suspicion":20,"echo":"小力：「不擅长表达……可她以前不是这样的。」"},{"text":"姐姐大人私下里对父亲大人很好。","tone":"bluff","suspicion":20,"echo":"小力的表情僵了一下：「对父亲……很好？」"},{"text":"我不清楚姐姐大人的事。","tone":"evade","suspicion":10,"echo":"小力点了点头，没再追问，但目光留在你脸上。"}],"note":"用户只给了题干；三个选项与后果沿用上一版，保持承接关系。"},{"id":"s2b_q6","level":1,"speaker":"interrogator","text":"（又是一阵沉默，你觉得小力应该不会再问你什么了）你对小力说：那你就在这等一会儿吧，说不定她快来了。\n（望着你们离去的背影）小力忽然问道：……爱子，你会一直待在这吗？","options":[{"text":"那就要看姐姐大人什么时候，和父亲大人搞好关系了。","tone":"bluff","suspicion":30,"echo":"小力站住了。他像是想笑，又没笑出来：「……和父亲搞好关系？」"},{"text":"看父亲大人什么时候把我赶出去了","tone":"bluff","suspicion":10,"echo":"小力没有再问，只是站在原地，看着你们走远。"},{"text":"……（你只是笑了笑便转身离开）","tone":"silence","suspicion":20,"echo":"小力没有再问，只是站在原地，看着你们走远。"}],"note":"原文只给了一句「那就要看姐姐大人什么时候，和父亲大人搞好关系了」；另外两个选项是补的。"}],"interference_lines":[],"endings":{},"levels":[{"name":"第一轮 · 服装店试衣间","intro":"我美羽对男友小力不忠，大概是从一个月前开始的。\n也是在那天，我第一次见到晚归还醉醺醺的父亲。\n再次看见那天的日期时，第一时间出现在我脑海里的不是意识到已经背叛了小力后的痛心疾首，也不是被酒精和冲动麻痹了神经的父亲扑倒，而是那天早上上学路上我遇到了离家多年的母亲\n和她的丈夫——我的亲生父亲。\n美羽，好久没见，都长这么大了，这是第一句\n在那个废物的男人身边那么久，委屈你了，来和你亲生父母回家，这是第二句也是最后一句。\n我躲开了那个人想要拉住我的手，开始狂奔。\n停下的我，才开始思考，那个女人真的是我的母亲吗，答案应该是肯定，毕竟容貌和父亲与母亲的合照里那位一致。\n我不是父亲亲生的这件事是真的吗，种种细节被我一一想起，父亲电脑里奇怪的视频，母亲不辞而别的原因……又被我一一否定，恍惚中，身体已经自行来到了学校门口。\n那天直到父亲推开门前，我一直处于非常混乱的状态，不知道如何面对这个人，不知道该对他抱有什么样的感情。但头一次见到如此模样的父亲，我的心中只剩下惊讶和疑惑。\n索取后清醒的父亲抱着我一边道歉一边说着不要离开我，我只要你一个亲人这种无理的要求，那时我心中的混乱也好，疑惑也罢，都消散得一干二净，只剩下两个念头。\n面前的这个男人一定是爱我的，我也同样爱他。虽然常说父母之爱不求回报的，但既然父亲向我索求，我想用这种方式回报他和展示我对他的爱意。\n\n今天\n我和父亲逛街，路过一家服装店，父亲进去试衣间后，我也偷偷进去进行恶作剧。结束后，因为担心刚才的动静被人听见，于是在外面多穿了几件才出去。但在我看清试衣区门口站着的人，惊讶得脱口而出他的名字时，一切伪装都失效了。\n你需要决定你走试衣间时的衣服，尽量做出区分。","memo":[{"body":"{审问者}是小力。他这一局看见的是{马甲}，不是{真身} —— 我在试衣间门外的那一刻就已经漏了。"},{"body":"我是{真身}，{真身份}。{同行者}（{同行者关系}）就在旁边，他什么都听见了，也不会替我圆。"},{"body":"他{性情}，我越顺着他越要再问一遍。照档案答，别现编。"}],"memo_hint":true},{"name":"第二轮 · 又一次偶遇","intro":"经过那次的意外，我好像有点喜欢上了这种感觉。某个休息日，再也忍耐不住想要体验那种刺激的感觉的我，策划了又一次相遇。\n\n今天\n我用原本的身份约了小力出门，再次装扮成文静的爱子，带着父亲一起去赴约。\n","memo":[{"body":"又一次偶遇。我用{真身}的身份把{审问者}约出来，装扮成{马甲}，带着{同行者}一起去赴约。"},{"body":"{审问者}这一轮问得更细 —— 上一轮我说过的每句话，他都记着。"}],"memo_hint":true}],"forced_rules":[{"mode":"fixed","rules":[{"items":["hair_short"]}]},{"mode":"fixed","rules":[{"items":["hair_short"]}]}],"qte_plan":[],"defects":[],"true_presets":{"pool":[],"by_level":[{"name":"第 1 轮","slots":{"hair":"hair_short","glasses":"glasses_none","makeup":"makeup_heavy","tattoo":"tattoo_heart","neckwear":"neck_spiked","top":"top_crop","bra":"bra_pasties","bottom":"bottom_shortshort","dress":"dress_none","panties":"panties_shibari","stockings":"stockings_fishnettights","shoes":"shoes_trainers"}},{"name":"第 2 轮","slots":{"hair":"hair_short","glasses":"glasses_none","makeup":"makeup_heavy","tattoo":"tattoo_heart","neckwear":"neck_spiked","top":"top_crop","bra":"bra_pasties","bottom":"bottom_shortshort","dress":"dress_none","panties":"panties_shibari","stockings":"stockings_fishnettights","shoes":"shoes_trainers"}}]},"enabled":true},{"id":"bg_new_1","name":"球球的新玩具","venue":"苦主：李华  你：白菜   黄毛狗：球球","intro":"","interrogator":"李华","interrogator_gender":"男","companion":{"name":"球球","gender":"女","relation":"","desc":""},"cover_role":"狗主人","true_role":"狗妻子","true_name":"白菜","questions_schema":"faceless-questions-v1","cards":[],"facts":[],"sms":[],"companion_sms":[],"questions":[],"interference_lines":["球球在  *       改坏了当场看得见，不用等游戏跑起来才发现。
 *    2. 撤销栈（Ctrl+Z），上限 80 步。
 *    3. 「回退常量」按钮把当前数据导出成能直接粘回 ScenarioData.gd 的

 * ============================================================ */

// ---------- 小工具 ----------
function h(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat(9)) if (kid !== null && kid !== undefined && kid !== false)
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
}
const $ = id => document.getElementById(id);
function short(s, n){ s = String(s == null ? "" : s); return s.length > n ? s.slice(0, n) + "…" : s; }
function num(v, d){ const x = parseFloat(v); return isNaN(x) ? d : x; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

let toastTimer = null;
function toast(msg, ms){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), ms || 2400);
}

// ---------- 脏标记 / 撤销 ----------
// 模型：undoStack 里存的是一串「状态」，栈顶 = 当前状态。
// 每次改动**之后**调 commit() 把新状态压栈。
//
// 传了 sig 时，900ms 内的连续同类改动会**替换栈顶**而不是新压一帧 ——
// 否则打一句话就塞进几十帧，撤销变成逐字符（踩过这个坑）。
// 增删 / 上下移这类离散操作不传 sig，每一下都算一步。
const undoStack = [];
const redoStack = [];
let lastSig = "", lastSigT = 0;

function snapshot(){ return JSON.stringify(story); }

function commit(sig){
  const s = snapshot();
  if (undoStack.length && undoStack[undoStack.length - 1] === s) return;
  const now = Date.now();
  const coalesce = sig && sig === lastSig && (now - lastSigT) < 900 && undoStack.length >= 2;
  if (coalesce) undoStack[undoStack.length - 1] = s;
  else { undoStack.push(s); if (undoStack.length > 80) undoStack.shift(); }
  redoStack.length = 0;
  lastSig = sig || ""; lastSigT = now;
}

function markDirty(){
  dirty = true;
  $("fileinfo").classList.add("dirty");
  updateFileInfo();
  scheduleValidate();
}
function undo(){
  if (undoStack.length < 2) { toast("没有可撤销的步骤了"); return; }
  redoStack.push(undoStack.pop());
  story = JSON.parse(undoStack[undoStack.length - 1]);
  lastSig = ""; dirty = true; scheduleValidate(); renderAll();
}
function redo(){
  if (!redoStack.length) { toast("没有可重做的步骤了"); return; }
  const s = redoStack.pop();
  undoStack.push(s);
  story = JSON.parse(s);
  lastSig = ""; dirty = true; scheduleValidate(); renderAll();
}

// ---------- 载入 ----------
// 编辑器要保证几个容器存在，否则输入框写不进去（readHost 拿到 undefined 就直接放弃）。
// 真实 story.json 里都有（DumpStory 一定会写）；这里只是给「手动删过键 / 老版本文件」兜底。
function normalizeStory(o){
  if (!o.rules || typeof o.rules !== "object") o.rules = {};
  if (!o.ui || typeof o.ui !== "object") o.ui = {};
  uiSections().forEach(sec => { if (!o.ui[sec.seg] || typeof o.ui[sec.seg] !== "object") o.ui[sec.seg] = {}; });
  (o.backgrounds || []).forEach(b => { if (!b.endings || typeof b.endings !== "object") b.endings = {}; });
  // 第二十三轮的四段：**不**自动建空数组 —— 缺了就一直缺，游戏会退回出厂兜底。
  // （建了空数组反而危险：`levels: []` 会被当成「一关都没有」。
  //   真要改，就在对应的那一页点「＋加一条」，那时才建。）
  ["levels", "forced_rules", "qte_plan", "defects"].forEach(k => {
    if (o[k] !== undefined && !Array.isArray(o[k])) delete o[k];
  });
  if (!o.catalog || typeof o.catalog !== "object") o.catalog = {items:[], tags:[], slots:[]};
  if (!Array.isArray(o.catalog.items)) o.catalog.items = [];
  if (!Array.isArray(o.catalog.tags)) o.catalog.tags = [];
  return o;
}

function loadStory(obj, name, fromFile){
  normalizeStory(obj);
  story = obj; seedStory = clone(obj); fileName = name || "data/story.json";
  dirty = !!fromFile;
  undoStack.length = 0; redoStack.length = 0; undoStack.push(snapshot());
  lastSig = ""; lastSigT = 0;
  openSet.clear(); foldSet.clear();
  view = {kind:"home"};
  buildIndex();
  validateNow();
  renderAll();
  $("fileinfo").classList.remove("dirty");
  updateFileInfo();
  $("search").value = ""; renderResults("");
}
function updateFileInfo(){
  const where = canSave ? " · 直连本地服务（Ctrl+S 直接写回）" : " · 只读（没连上本地服务）";
  $("fileinfo").textContent = fileName + (dirty ? " · 有未保存的改动" : " · 已同步") + where;
}

// ============================================================
//  第七十六轮：编辑器只认 data/story.json，不再「打开文件」
//
//  用户口径：「编辑器现在直接编辑 data 中的 story.json，不要打开功能」。
//
//  ★ 为什么需要一个本地小服务：浏览器不许网页写本地磁盘 ——
//    file:// 下连 fetch 都被拦，`showSaveFilePicker` 又只能让用户手挑文件，
//    而且不能指定「就写 data/story.json」这个路径。所以「直接编辑那个文件」
//    只能靠 tools/story_server.py：页面 GET /api/story 拿原文、POST 写回。
//    （第 41～75 轮那套 File System Access + IndexedDB 记句柄的做法已经删掉。）
// ============================================================
const API_STORY = "/api/story";
const API_QUIT = "/api/quit";

// ★★ 第七十九轮：页面记住「我读到的是哪一版」。
//   服务端 GET 会回一个 X-Story-Rev（内容 sha256 前 16 位），保存时用 If-Match 带回去。
//   对不上 = 你打开页面之后，磁盘上的 story.json 被改过（可能是我、可能是 git 切换）——
//   这时**拒绝保存**，否则这一页内存里的旧内容会把那些改动整份冲掉。
//   ★ 这就是「改好的东西被覆盖」最真实的那条路：页面开着 → 磁盘被改 → 在旧页面上按保存。
let loadedRev = "";

function setRev(v){ loadedRev = String(v || ""); }

// 页面内置快照（`build_story_editor.py` 从 data/story.json 灌进来的）
function getSeed(){
  const txt = $("seed").textContent.trim();
  if (!txt || txt.indexOf("__STORY_JSON__") === 0) return null;
  try { return JSON.parse(txt); } catch(e){ return null; }
}

// 只读退路：有人拿 `python -m http.server` 之类的静态服务打开时，至少能看数据
async function tryFetch(){
  const cands = ["data/story.json", "../data/story.json", "./story.json", "../../data/story.json"];
  for (const u of cands){
    try {
      const r = await fetch(u, {cache:"no-store"});
      if (r.ok) { const j = await r.json(); if (j && j.backgrounds) return {json:j, from:u}; }
    } catch(e){ /* 继续试下一个 */ }
  }
  return null;
}

// ---------- 保存：直接写回 data/story.json ----------
function toJSON(){ return JSON.stringify(story, null, "\t") + "\n"; }

async function save(){
  if (!canSave){
    toast("没连上本地服务，存不了盘 —— 请用 open_story_editor.bat 启动（它会开一个小服务）", 5200);
    return;
  }
  const text = toJSON();
  try {
    const headers = {"Content-Type": "application/json; charset=utf-8"};
    // ★ 只有「从服务读到过版本」时才带 If-Match（内置快照那种只读路径没有 rev）
    if (loadedRev) headers["If-Match"] = loadedRev;
    const r = await fetch(API_STORY, { method: "POST", headers, body: text });
    let j = {};
    try { j = await r.json(); } catch(e){ /* 非 JSON 错误页 */ }
    if (r.status === 409){
      // 磁盘被别人改过 —— 不覆盖，让用户自己决定
      setRev(j.rev || "");
      toast(j.error || "磁盘上的文件已经变了，这次保存被拒绝。请点「↻ 重新载入」。", 9000);
      return;
    }
    if (!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status));
    if (j.rev) setRev(j.rev);
    dirty = false; $("fileinfo").classList.remove("dirty");
    updateFileInfo();
    toast("已写入 data/story.json（" + Math.round(text.length / 1024) + " KB，旧版另存到 data/backups/）", 3600);
  } catch(e){
    toast("写入失败：" + (e && e.message ? e.message : e), 5200);
  }
}

// ↻ 重新载入：丢掉本页改动，从磁盘再读一遍（带 rev）
async function reloadFromDisk(){
  if (dirty && !confirm("本页有未保存的改动，重新载入会丢掉它们。继续？")) return;
  try {
    const r = await fetch(API_STORY, {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    setRev(r.headers.get("X-Story-Rev"));
    const j = await r.json();
    loadStory(j, "data/story.json", false);
    dirty = false; $("fileinfo").classList.remove("dirty");
    toast("已从磁盘重新载入（" + (j.backgrounds || []).length + " 套背景）", 2600);
  } catch(e){
    toast("重新载入失败：" + (e && e.message ? e.message : e), 5200);
  }
}

// ⏹ 停服务：服务现在没有窗口可关了，用它
async function stopServer(){
  try {
    await fetch(API_QUIT, {method: "POST"});
    canSave = false;
    toast("本地服务已停。关掉这个页面前，改动记得先保存过。", 5200);
    updateFileInfo();
  } catch(e){
    toast("停服务失败：" + (e && e.message ? e.message : e), 4000);
  }
}

// ★ 第五十三轮：「草稿 / 启用」标志。
//   缺省（没写这个键）= **启用** —— 这样出厂那四套不用补字段，向后兼容。
//   只有显式写了 `enabled: false` 才算草稿。
//   为什么要这个标志：新增一套背景时它是空的（没有档案卡 / 题目 / 事实 / 短信），
//   而游戏是**开局随机抽背景**的 —— 抽到一套空背景会直接崩（归类环节要 12 张卡、
//   每轮要恰好 1 道盲区题、短信要按轮揭示事实）。测试也会有一批断言变红。
//   所以草稿**不参与抽取、不参与测试**，但照旧存在 story.json 里、编辑器里能看到。
function bgEnabled(b){ return !(b && b.enabled === false); }

// ★★ 第五十五轮：题目来源 —— `auto`（默认）/ `manual`。
//   为什么要这个开关：一套背景的题目本来绑在「档案卡 + 事实」这套结构上（挂卡才有雷区归属、
//   挂事实才参与跨关一致性）。但也可以完全自己写题、不建档案卡和事实表 ——
//   那种情况下再要求「每题必须挂卡」「必须有一张 A 卡」就是无意义的拦截。
//   ★ 缺省（不写这个键）= auto，所以出厂那四套一个字都不用补。
function bgQuestionsSource(b){ return (b && b.questions_source === "manual") ? "manual" : "auto"; }

// ★★ 第五十六轮：「自行编辑」模式下**用不到的字段直接不显示**（数据不动，切回自动生成就回来）。
//   用户口径：「在用户自己编辑的背景时，用不到的空全部删去，如审讯官的名字，身份档案卡，
//   选项中的「这句话算哪种」」+ 追问时补充的「审讯官的性别 / 同行人的性别 / 你伪装的身份 /
//   你的真实身份 / A 的真身名字」。
//   ★ 为什么这些在自行编辑下用不到：它们全是**档案卡与事实那套结构**的配套设定 ——
//     A 的真身名只在「阶段二被认出来」时念，而那条戏要靠「雷区题」触发；
//     B/A 两个身份是档案卡归属判定的依据；性别只用在顶栏与备忘录的括号里。
//     不建卡片与事实的背景，这四栏就是纯负担。
const MANUAL_HIDDEN_META = ["interrogator_gender", "cover_role", "true_role", "true_name"];
const MANUAL_HIDDEN_COMPANION = ["gender"];
function enabledBgs(){ return (story.backgrounds || []).filter(bgEnabled); }

// 全部背景一共多少道题（首页统计与冒烟用）

//     但这个统计还有用（首页的「盘问题目 N 道」），所以函数保留。
function totalQuestions(){
  return (story.backgrounds || []).reduce((a, b) => a + ((b.questions || []).length), 0);

// 一套空白背景的骨架：标量字段给占位文字，**列表一律留空** ——
// 内容由你去填（题目节、档案卡、短信、事实…都在下面几节里）。
// 这样「新增」是纯粹的空白新建，不会塞进一批你不想要的假数据。
function blankBackground(){
  const used = {};
  (story.backgrounds || []).forEach(b => { used[String((b || {}).id || "")] = true; });
  let n = 1;
  while (used["bg_new_" + n]) n++;
  return {
    id: "bg_new_" + n,
    name: "新的一套背景",
    venue: "",
    intro: "",
    interrogator: "",
    interrogator_gender: "男",
    companion: {name:"", gender:"女", relation:"", desc:""},
    cover_role: "",
    true_role: "",
    true_name: "",
    questions_schema: "faceless-questions-v1",
    cards: [],
    facts: [],
    sms: [],
    companion_sms: [],
    questions: [],
    interference_lines: [],
    endings: {},
    levels: [], forced_rules: [], qte_plan: [], defects: [], true_presets: {},
    enabled: false,
  };
}

function addBackground(){
  const arr = (story.backgrounds = story.backgrounds || []);
  arr.push(blankBackground());
  view = {kind:"bg", index: arr.length - 1};
  commit("bg_add"); markDirty(); renderAll();
  toast("新增了一套空白背景（状态：草稿）。把内容填齐后，在「① 基础信息」里勾上「启用」。", 5200);
}

function removeBackground(){
  const arr = story.backgrounds || [];
  const i = view.index;
  const b = arr[i] || {};
  if (arr.length <= 1){ toast("至少要留一套背景"); return; }
  const en = enabledBgs();
  if (bgEnabled(b) && en.length <= 1){
    toast("这是唯一一套「已启用」的背景 —— 删了游戏就没背景可抽了。先启用另一套再删。", 5200);
    return;
  }
  if (!confirm("删掉「" + (b.name || b.id || ("背景 " + (i + 1))) + "」？\n\n"
    + "它的开场介绍、档案卡、题目、事实、短信、结局文案会一起删掉。")) return;
  arr.splice(i, 1);
  view = {kind:"bg", index: Math.max(0, i - 1)};
  commit("bg_del"); markDirty(); renderAll();
  toast("已删掉那套背景");
}

//   这个常量给冒烟用：删掉的页不许再回到导航里（防止以后有人顺手加回去）。
const NAV_KINDS = ["home", "bg", "traits", "global", "rules", "ui", "endings",
                   "items", "trueapp", "sms", "phone"];

function buildNav(){

  nav.append(h("div", {class:"navgroup"},

      onclick:()=>go({kind:"bg", index:i})},
      h("span", {text: (draft ? "📝 " : "") + (b.name || b.id || ("背景 " + (i + 1)))}),
      h("span", {class:"cnt", text: draft ? "草稿" : (n + " 题")})));

function catItems(){ return ((story.catalog || {}).items || []); }
function catTags(){ return ((story.catalog || {}).tags || []); }
function itemById(id){ return catItems().find(x => String(x.id) === String(id)) || null; }
function itemLabel(id){

  return it ? (it.name + "（" + it.slot_name + " · 暴露 " + it.exposure + "）") : ("⚠ " + id);
}

function pickItemOpts(){

}
function pickTagOpts(){ return catTags().map(t => ({v:t, l:t})); }

const FORCED_MODES = [

const MEMO_PH_KEYS = ["{真身}", "{我性别}", "{真身份}", "{马甲}",

// ★ 第八十三轮：「🪜 关卡与轮数」这一页已经从左侧删掉了（那四项只在背景页 ⑦ 里配）。
//   这个函数留着是因为 `story.levels` 这一段**还在数据里**、而且 `_ensure_levels()`
//   仍按它逐键兜底 —— 这里描述的就是那段兜底数据的形状。
//   ★ 所以它**不再对应任何编辑入口**；真正能改的地方是背景页 ⑦（下面那份字段表）。
function levelsFields(){

  // ★ 第四十二轮：把「这一页是默认值」与「名字以背景那份为准」写在字段上 ——

  return [
    T("name", "这一轮叫什么（默认名）",
      "★ 只在这一套背景**没写轮次名**时生效。四套背景在「🎬 背景」页里各自写了名字，"
      + "游戏里显示的是那一份（同一句「第 1 轮」，四套场景可以叫得不一样）。"),
    // ★ 第六十轮：每轮的背景说明（浮窗正文）。留空 = 用「① 基础信息」里的总 intro。
    // ★ 第七十二轮：补一句「四套背景各自都写了，所以在这里改看不到效果」——
    //   游戏读的是背景那份（bg.levels[i].intro），本页只是**哪套都没写时**的兜底。
    {k:"intro", label:"这一轮的背景说明（默认，可空）", t:"area", rows:5,
      hint:"这一轮准备室弹出来的浮窗正文。留空 = 用「① 基础信息」里的总 intro。"
        + "★ 只在这一套背景**没写**这一轮的说明时才生效 —— 出厂四套背景都已经各自写了，"
        + "想改某一局的浮窗正文，请去「🎬 背景」页的「⑦ 本局覆写 · 几轮」里逐轮改。"},
    N("acceptance_gain", "通关后接受度 +多少", "最后一轮通常填 0（后面没轮次了，给了也用不上）。"),
    // ★★ 第七十五轮（用户口径「暂时不使用接受度全局累计，改为每轮可用的暴露值不同」）：
    //   这一轮用多少接受度 → 同时决定「能穿哪些」与「暴露值上限 = 10 + 接受度 × 2」。
    //   留空 = 起始值（10）+ 本局已通过那几轮的 gain —— 出厂两轮都手写了，别指望留空。
    {k:"acceptance", label:"这一轮的接受度（可空）", t:"num", step:"1", blankDelete:true,
      placeholder:"自动",
      hint:"这一轮固定用多少接受度。它决定两件事："
        + "① 能穿哪些衣服（`接受度要求` ≤ 它）；② **暴露值上限 = 10 + 接受度 × 2**。"
        + "想要这一轮上限 30 就填 10，上限 48 就填 19。"
        + "★ 留空 = 起始值 10 + 本局已通过那几轮的「通关后接受度」。"},
    {k:"contrast_req", label:"本轮反差值要求（默认）", t:"num", step:"1", blankZero:true, placeholder:"自动",
      hint:"★ 留空 = 自动：等于「上一轮 + 每轮自增」。第 1 轮留空则用「数值规则」里的 contrast_req_base。"
        + "写了数字就是手写值 —— 而且它会成为它后面那些轮自增的**新起点**（所以可以在某一轮插一个数、后面整段跟着抬）。"
        + "定太高会让这一轮无解（下面校验会提醒）。"},
    T("derived_profile", "审讯官推导出的形象（默认）",
      "写在准备室顶部，给他一个「你可能是什么人」的轮廓。同样以背景里那份为准。"),
    // ★ 第九十轮：每轮的备忘录正文 —— 与背景页 ⑦ 共用 `memoFields()`。
    ...memoFields(),
  ];
}

function forcedRuleFields(){

// ============================================================
//  题库（第二十九轮）—— 盘问环节的题目清单
//
//  用户口径：「阶段二的问题我想不再给问题分类，直接让我编辑对问题进行编辑」。
//  所以这里不再有「档案题 / 说法题 / 同行者题 / 盲区题」四个分区，
//  只有一份清单：每道题自己带题面、选项、QTE、抖动、以及每个选项的怀疑值。
//
//  两处最容易看错的地方：
//   · `level` —— -1 = 通用池（每关都可能抽到），0..N = 固定给第 N+1 关。
//     「某关出几道题」= 那关的固定题 + 从通用池补足到 rules.questions_per_level。
//     想精确控制就分配下去，想保留随机就留在通用池。
//   · `tone` —— 选项的语义标签，判定**只看它**，不再看「题目属于哪一类」。
//     `suspicion` 留空 = 用全局默认（照实答看 rules.correct_delta、
//     撒谎/回避按审问官性情现算）；填了就硬覆盖。
// ============================================================
const TONE_OPTS = [
  {v:"correct", l:"照实答（B 的档案 —— 对得上就没事）"},
  {v:"leak",    l:"说漏嘴（只有 A 才知道的事 —— 当场出局）"},
  {v:"version", l:"某个版本（对错看「你之前立过什么说法」）"},
  {v:"bluff",   l:"撒谎（代价按审问官性情现算）"},
  {v:"evade",   l:"回避（同上看性情）"},
  {v:"silence", l:"沉默（代价固定，与性情无关）"},
  {v:"made_up", l:"硬编一个细节（盲区题：编得越细越糟）"},
];
const QUESTION_QTE_OPTS = [
  {v:"none", l:"无（默认：这道题什么都不出）"},
  {v:"auto", l:"自动（★ 只看暴露值：露得越多，这一关被盯住脸的次数越多）"},
  {v:"expression", l:"表情控制（长按空格顶过 80%，顶过之前不能答题）"},
  {v:"interference", l:"递话打断（按一下空格）"},
  {v:"combo", l:"组合干扰（依次敲 J → K → L）"},
];
const SPEAKER_OPTS = [
  {v:"interrogator", l:"审讯官"},
  {v:"companion", l:"同行者"},
];
function questionLevelOpts(){
  // ★ 第五十三轮：题目的归属跟着「轮次」走（第四十二轮统一了「关 → 轮」的说法）。
  //   轮数取本轮实际的一局几轮（story.levels），不再写死 4。
  const n = (story.levels || []).length || 2;
  const out = [{v:"-1", l:"通用池（每轮都可能抽到）"}];
  for (let i = 0; i < n; i++) out.push({v:String(i), l:"第 " + (i + 1) + " 轮（固定必出）"});
  return out;
}
function pickCardOpts(){
  const bg = bgOf();
  return [{v:"", l:"（不挂卡 —— 这道题不考档案）"}].concat(
    (bg.cards || []).map(c => ({v:c.id, l:"[" + (c.owner || "?") + "] " + (c.topic || c.id)})));
}
function pickFactOpts(){
  const bg = bgOf();
  return [{v:"", l:"（不挂事实 —— 不参与跨关一致性检查）"}].concat(
    (bg.facts || []).map(f => ({v:f.id, l:f.id + "（" + ((f.values || []).length) + " 个版本）"})));
}
function optionFields(manual){
  // ★★ 第五十六轮：「自行编辑」模式下**只留三样** —— 选项文本 / 怀疑值 / 触发结局。
  //   用户口径：「选项中的「这句话算哪种」去掉」，追问时确认连「代表哪个说法」一起去掉。
  //   ★ 为什么：`tone` 里那七种有一半是给档案卡与事实用的 ——
  //     「某个版本」要挂事实才判得了、「说漏嘴」的语义是「说了只有 A 知道的事」。
  //     不建卡片与事实的背景，这些分类就成了必须猜的负担。
  //   ★ 判定改成**只看怀疑值**：留空 = 用「照实答」的出厂值（rules.correct_delta，现在是 0）。
  //     运行时那边也改了 —— tone 为空不再打印警告，直接按这个口径结算。
  //   ★ 第七十七轮（用户口径）：「怀疑值不要按回答类型设置，按我给的怀疑值结算」。
  //     代价这一栏从此是唯一权威 —— 连「触发结局 = leak」的选项也照它结算（只收场、不加价）。
  const fields = [
    {k:"text", label:"选项文本", t:"area", rows:2,
      hint: manual ? "沉默也可以留空 —— 那就用出厂那句通用文案。"
        : "类型选「沉默」时可以留空 —— 那就用出厂那句通用文案。"},
    // ★ 第五十七轮（用户口径）：「选项选择后，对应的选项文本和下一个题面一起出现」。
    //   这一栏就是「接在下一题题面前的那段」：留空 = 自动显示「你：<选项文本>」。
    // ★ 第六十一轮：填了就打**原样**显示（不再加「你：」）—— 也可以写选完之后的后果 / 旁白。
    {k:"echo", label:"接在下一题题面前的回应（可空）", t:"area", rows:3,
      hint:"选了这个选项之后，下一道题的题面前会多出这一段。"
        + "留空 = 自动显示「你：<选项文本>」。"
        + "填了就用这段**原样**显示（不再自动加「你：」）—— "
        + "可以写你说的话，也可以写「这句话的后果 / 旁白」，"
        + "比如「空太郎：「我从没听阳乃小姐说过有这么个朋友。」怀疑值上升。」"},
  ];
  if (!manual){
    fields.push({k:"tone", label:"这句话算哪一种（判定只看它）", t:"select", opts:()=>TONE_OPTS});
  }
  // ★ 第五十六轮：`blankDelete` —— **清空 = 删掉这个键**。
  //   不加的话空框会写回 0（`num("", 0)`），于是「留空 = 用默认」在界面上根本做不到：
  //   用户看到 0，改一下就成了「0 怀疑值」，和 hint 上写的「留空 = -6」对不上。
  //   （这条对两种模式都成立：自动生成的「留空 = 用全局默认」也是同一个坑。）

function buildIndex(){

  (story.backgrounds || []).forEach((b, bi) => {
    const bv = {kind:"bg", index:bi};
    const bn = b.name || b.id;

    (b.levels || []).forEach((l, i) => add(bv, "levels/" + i, bn + " · 关卡" + (i + 1), (l.name || "") + " " + (l.derived_profile || "")));
    (b.cards || []).forEach((c, i) => add(bv, "cards/" + i, bn + " · 档案卡", c.topic + " " + c.text));
    // ★ 第二十九轮：题目改成统一 schema —— 题面在 text，候选回答在 options[]
    (b.questions || []).forEach((q, i) => add(bv, "questions/" + i, bn + " · 盘问题目",
      (q.text || q.q || "") + " " + (q.note || "") + " " + (q.options || []).map(o => ((o.text || "") + " " + (o.echo || ""))).join(" ")));
    (b.companion_questions || []).forEach((cq, i) => add(bv, "companion_questions/" + i, bn + " · 同行者提问",
      cq.line + " " + cq.plant + " " + (cq.options || []).map(o => o.text).join(" ")));
    (b.blind_questions || []).forEach((bq, i) => add(bv, "blind_questions/" + i, bn + " · 盲区题",
      bq.q + " " + bq.setup + " " + bq.made_up + " " + bq.bluff + " " + bq.evade));
    (b.facts || []).forEach((f, i) => add(bv, "facts/" + i, bn + " · 事实 " + f.id,
      (f.prompts || []).join(" ") + " " + (f.values || []).map(v => v.label).join(" ")));
    (b.sms || []).forEach((t, i) => add(bv, "sms/" + i, bn + " · 短信 · " + t.contact,
      (t.messages || []).map(m => m.text).join(" ")));
    (b.interference_lines || []).forEach((s, i) => add(bv, "interference_lines/" + i, bn + " · 干扰台词", s));
  });
  (story.traits || []).forEach((t, i) => add({kind:"traits"}, "traits/" + i, "审问者性情 · " + t.name,
    t.tag + " " + t.desc + " " + t.hint + " " + t.bluff_note + " " + t.evade_note +
    " " + (t.memo || "") + " " + (t.like || "") + " " + (t.hate || "")));
  Object.keys(story.item_desc || {}).forEach(k => add({kind:"global"}, "item_desc/" + k, "衣物描述", story.item_desc[k]));
  Object.keys(story.clue_frame || {}).forEach(k => add({kind:"global"}, "clue_frame/" + k, "情报句式", story.clue_frame[k]));
  Object.keys(story.clue_sources || {}).forEach(k => add({kind:"global"}, "clue_sources/" + k, "情报来源", (story.clue_sources[k] || []).join(" ")));
  (story.photo_notes || []).forEach((s, i) => add({kind:"global"}, "photo_notes/" + i, "照片背面", s));

  // 玩法数值 / 界面文案 / 结局文案 —— 路径的第一段必须是区块的 key，
  // 这样 jumpTo 里的「展开这一节」才能对得上（foldSet 用的就是 navKey()/区块key）。
  const R = story.rules || {};
  rulesSections().forEach(sec => (sec.fields || []).forEach(f => {
    const val = R[f.k];
    add({kind:"rules"}, sec.key + "/" + f.k, "数值 · " + stripNum(sec.title) + " · " + (f.label || f.k),
      Array.isArray(val) ? val.join(" ") : String(val == null ? "" : val));
  }));
  const U = story.ui || {};
  uiSections().forEach(sec => (sec.fields || []).forEach(f => {
    const g = U[sec.seg] || {};
    const val = g[f.k];
    add({kind:"ui"}, sec.key + "/" + f.k, "界面文案 · " + stripNum(sec.title) + " · " + (f.label || f.k),
      Array.isArray(val) ? val.join(" ") : String(val == null ? "" : val));
  }));
  (story.backgrounds || []).forEach((b, bi) => {
    const bn = b.name || b.id || ("背景 " + (bi + 1));
    const E = b.endings || {};
    endingsSections().forEach(sec => (sec.fields || []).forEach(f => {
      add({kind:"endings", index:bi}, sec.key + "/" + f.k, bn + " · 结局 · " + (f.label || f.k),
        String(E[f.k] == null ? "" : E[f.k]));

}


function stripNum(s){ return String(s || "").replace(/^[①-⑳]\s*/, ""); }

function renderResults(q){
  const box = $("results"); box.innerHTML = "";
  q = (q || "").trim().toLowerCase();
  if (!q) return;
  const hits = index.filter(e => (e.what + " " + e.where).toLowerCase().includes(q)).slice(0, 120);
  box.append(h("div", {class:"navhead", text: hits.length + " 条匹配"}));
  hits.forEach(e => box.append(h("button", {class:"res", onclick:()=>jumpTo(e)},
    h("div", {class:"where", text:e.where}),
    h("div", {class:"what", text: short(e.what, 90)}))));
}

function jumpTo(e){
  const parts = e.path.split("/");
  const secKey = parts[0];
  go(e.v);
  foldSet.delete(navKey() + "/" + secKey);
  for (let i = 1; i < parts.length; i += 2) openSet.add(navKey() + "/" + secKey + "/" + parts[i]);
  renderAll();
  const target = document.querySelector('[data-k="' + navKey() + "/" + secKey + (parts[1] !== undefined ? "/" + parts[1] : "") + '"]');
  if (target){
    target.scrollIntoView({block:"center"});
    target.style.outline = "2px solid var(--amber)";
    setTimeout(() => target.style.outline = "", 1600);
  }
}

  }));

// ★ 第四十一轮：删掉「一轮」时的**联动清理**。
//   用户口径：「删除关卡后只出现在对应关卡的题目也应自动删去」。
//   具体做三件事 ——
//     ① 把「固定给这一轮」的题目删掉（它们只属于这一轮，留着永远不会再出现）
//     ② 把「属于后面几轮」的题目整体往前挪一轮（否则它们同样永远出不来）
//     ③ 原貌预设里「逐轮指定」那一项同样删掉，后面几项往前挪
//   ★ 弹一次确认，把「会牵连到什么」列清楚 —— 这个操作只能靠 Ctrl+Z 撤销。
//   ★ 返回 false = 放弃这次删除（renderObjList 会照做）。
function cascadeDeleteRound(bg, idx){
  const qs = bg.questions || [];
  let doomed = 0, moved = 0;
  qs.forEach(q => {
    const lv = Number(q.level);
    if (lv === idx) doomed++;
    else if (lv > idx) moved++;
  });
  const tp = bg.true_presets || {};
  const byLv = Array.isArray(tp.by_level) ? tp.by_level : [];
  const hasPvHere = !!(byLv[idx] && byLv[idx].slots && Object.keys(byLv[idx].slots).length);
  let pvMoved = 0;
  for (let k = idx + 1; k < byLv.length; k++)
    if (byLv[k] && byLv[k].slots && Object.keys(byLv[k].slots).length) pvMoved++;

  const bits = [];
  if (doomed) bits.push("删掉 " + doomed + " 道只属于这一轮的题目");
  if (moved) bits.push("把 " + moved + " 道属于后面几轮的题目往前挪一轮");
  if (hasPvHere) bits.push("丢掉这一轮的原貌指定");
  if (pvMoved) bits.push("把后面几轮的原貌指定往前挪一轮");
  if (!bits.length) return true;               // 没有牵连，直接删

  if (!confirm("第 " + (idx + 1) + " 轮还有东西挂着：\n\n· " + bits.join("\n· ")
      + "\n\n继续删除这一轮？（删错了可以 Ctrl+Z 撤销）")) return false;

  // ① 题目
  if (bg.questions){
    const keep = [];
    bg.questions.forEach(q => {
      const lv = Number(q.level);
      if (lv === idx) return;                    // 只属于这一轮 → 删掉
      if (lv > idx) q.level = lv - 1;            // 后面的整体往前提一轮
      keep.push(q);
    });
    bg.questions.length = 0;
    for (const q of keep) bg.questions.push(q);
  }
  // ② 原貌预设的「逐轮指定」
  if (Array.isArray(tp.by_level)) tp.by_level.splice(idx, 1);
  return true;
}

function phone(){ return story.phone || (story.phone = {}); }
function phoneSec(name){ const p = phone(); return p[name] || (p[name] = {}); }
function countPh(s){ return (String(s == null ? "" : s).match(/%[sdfxXc]/g) || []).length; }
function specPh(s){ return (String(s == null ? "" : s).match(/%[sdfxXc]/g) || []).length; }

function phoneSections(page){
  const seg = PHONE_SEGS[page] || [];
  const out = [{
    key:"ph_" + page, title:"文案", kind:"object", host:()=>phoneSec(page),
    fields: seg.map(f => {
      const want = PH_EXPECT[page + "." + f.k];
      return {
        k:f.k, label:f.label, t:f.t || "text", rows:f.rows || 2,
        hint:(f.hint || "") + (want !== undefined ? "　★ 必须 " + want + " 个占位符（现在填了几个会在校验面板里报）" : ""),
      };
    }),
  }];
  const withPh = seg.filter(f => PH_MEANING[page + "." + f.k]);
  if (withPh.length){
    // 占位符对照写在同一个节的提示里 —— 单开一节会是个空壳（0 项）
    out[0].hint = withPh.map(f => f.label + "：" + PH_MEANING[page + "." + f.k]
      .map((m, i) => "第 " + (i + 1) + " 个 = " + m).join("，")).join("　｜　");
  }
  return out;
}

function smsThreadFields(group, bg){
  const f = [
    {k:"id", label:"id", t:"text", hint:"内部标识，别和别的线程重名"},
    {k:"level", label:"第几轮解锁（0 起）", t:"num", step:"1",

    {k:"contact", label:"联系人（消息列表里显示的名字）", t:"text"},
    {k:"avatar", label:"头像 emoji", t:"text"},
    {k:"messages", label:"对话内容", t:"objlist",
      blank:()=>({me:false, text:""}),
      titleOf:(m, i)=>(m && m.me ? "我 ▸ " : "对方 ◂ ") + short(m && m.text, 30),
      fields:[
        {k:"me", label:"这条是我发的（不勾 = 对方发的）", t:"bool"},
        {k:"text", label:"内容", t:"area", rows:2},
      ]},
  ];
  if (group === "friends"){
    f.push({k:"reveals", label:"读完这段 → 学会哪些官方口径", t:"objlist",
      hint:"★ 选第一条（官方口径）才有用；选别的会让玩家学到跟判定不一致的说法。",
      blank:()=>({fact:((bg.facts || [])[0] || {}).id || "", value:""}),
      titleOf:(rv, i)=>{
        const f2 = (bg.facts || []).find(x => x.id === rv.fact);
        const val = f2 && (f2.values || []).find(y => y.id === rv.value);
        return (rv.fact || "?") + " → " + (val ? short(val.label, 30) : (rv.value || "（未选）"));
      },
      fieldsFor:(rv)=>[
        {k:"fact", label:"事实", t:"select", opts:()=>(bg.facts || []).map(x => ({v:x.id, l:x.id + "（" + ((x.values||[]).length) + " 个版本）"}))},

      ]});
  }
  return f;
}

function smsSection(groupKey, bg){
  const grp = SMS_GROUPS.find(g => g.key === groupKey) || SMS_GROUPS[0];
  const blankOf = () => {
    if (grp.key === "interrogator")
      return {id:"intr_new", level:0, contact:(bg.interrogator || "审问官"), avatar:"🕶", messages:[{me:false, text:""}]};
    if (grp.key === "companion")
      return {id:"c_new", level:0, contact:((bg.companion || {}).name || "同行的人"), avatar:"🪶", messages:[{me:false, text:""}]};
    return {id:"sms_new", level:0, contact:"新联系人", avatar:"💬", messages:[{me:false, text:""}]};
  };
  return [{
    key:"sms_" + grp.key,
    title:grp.icon + " " + grp.label + "（这一套背景的短信）",
    kind:"objlist",
    arr:()=>{ if (!Array.isArray(bg[grp.field])) bg[grp.field] = []; return bg[grp.field]; },
    blank:blankOf,
    fieldsFor:(t)=>smsThreadFields(grp.key, bg),
    titleOf:(t, i)=>"💬 " + (t.contact || "（无联系人）") + "　·　第 " + ((t.level | 0) + 1) + " 轮解锁"

// ============================================================
//  第四十轮 · 服装数值编辑器（暴露度 / 接受度）
//
//  改的是 `story.item_overrides`：只写「与代码内置值不同」的那几件。
//  游戏启动时 ScenarioData 读完 story.json 就调
//  OutfitData.apply_item_overrides() 原地覆盖，所以改完存盘、重启游戏即生效。
//
//  ★ 这里**只开放 exposure 与 acceptance_req 两个字段**。
//    槽位 / 标签 / 贴图改了会让贴图与门控对不上，不在编辑器里放开。
// ============================================================
// 「代码内置值」—— 用来标出「这件被改过」并支持一键还原。
//   ★ 兜底：老版本的 story.json 里没有 base_values 段，此时退回 catalog.items 里
//     那一件的当前值（那种文件里本来也还没有任何覆写，所以两者相等）。
function baseValueOf(id, f){
  const bv = ((story.catalog || {}).base_values || {})[id];
  if (bv && bv[f] !== undefined) return Number(bv[f]);
  const it = catalogItems().find(x => x.id === id);
  return it && it[f] !== undefined ? Number(it[f]) : null;
}
// 当前生效值：覆写写了就用它，否则用内置值
function effValueOf(id, f){
  const ov = ((story.item_overrides || {})[id] || {});
  if (ov[f] !== undefined && ov[f] !== null) return Number(ov[f]);
  const b = baseValueOf(id, f);
  return b === null ? 0 : b;
}
function catalogItems(){ return ((story.catalog || {}).items || []); }

function renderItemsEditor(main){
  main.append(h("h1", {text:"👕 服装数值"}));
  main.append(h("div", {class:"sub", text:"改每一件衣服的**暴露度**与**接受度门槛**。只写「跟代码内置值不同」的那几件 —— 没改过的不会在 story.json 里留痕。"}));

  main.append(h("div", {class:"sec"},
    h("div", {class:"sechead"}, h("span", {class:"t", text:"怎么读"})),
    h("div", {class:"secbody"}, h("div", {class:"help"},

      h("div", {}, "· ", h("b", {text:"接受度"}), "：穿它需要多高的接受度门槛（接受度每关涨，跨局保留）。允许 0 ~ 99。"),

      h("div", {}, "· 下架的槽位（外袍 / 耳饰 / 手套 / 头饰 / 穿环）也列出来，但灰色显示 —— 改了暂时看不出效果，等恢复那一栏就会生效。"),
    ))));

  const ov = story.item_overrides || (story.item_overrides = {});
  const n = overriddenItemCount();
  const bar = h("div", {class:"sec"},
    h("div", {class:"sechead"},
      h("span", {class:"t", text:"改动清单"}),
      h("span", {class:"cnt", text:n + " 件已改"})),
    h("div", {class:"secbody"},
      h("div", {class:"row"},
        h("input", {id:"itemSearch", class:"in", placeholder:"搜物品名 / id …",
          oninput:()=>{ itemFilter.q = $("itemSearch").value.trim().toLowerCase(); renderMain(); }}),
        h("label", {class:"chk"},
          h("input", {type:"checkbox", checked: itemFilter.onlyChanged ? "checked" : null,
            onchange:(e)=>{ itemFilter.onlyChanged = e.target.checked; renderMain(); }}),
          " 只看改过的"),
        n ? h("button", {class:"btn danger", onclick:()=>{
            if (!confirm("把 " + n + " 件服装的改动全部还原成代码内置值？")) return;
            story.item_overrides = {}; commit("items_reset_all"); markDirty(); renderAll();
            toast("已还原全部服装数值");
          }}, "↺ 全部还原") : null,
      )));
  main.append(bar);

  // 按槽位分组渲染
  const slots = ((story.catalog || {}).slots || []);
  const names = ((story.catalog || {}).slot_names || {});
  const disabled = ((story.catalog || {}).disabled_slots || []);
  const manual = ((story.catalog || {}).manual_slots || []);
  const bySlot = {};
  catalogItems().forEach(it => { (bySlot[it.slot] = bySlot[it.slot] || []).push(it); });

  let shown = 0;
  slots.forEach(slot => {
    let list = (bySlot[slot] || []);
    if (itemFilter.onlyChanged) list = list.filter(it => ov[it.id] && Object.keys(ov[it.id]).length);
    if (itemFilter.q){
      const q = itemFilter.q;
      list = list.filter(it => (String(it.name).toLowerCase().includes(q)) || (String(it.id).toLowerCase().includes(q)));
    }
    if (!list.length) return;
    shown += list.length;
    const offNote = disabled.includes(slot) ? " ← 已下架" : (manual.includes(slot) ? " ← 只能手动装备" : "");
    const body = h("div", {class:"secbody"});
    const head = h("div", {class:"irow items ihead"},
      h("span", {class:"iname", text:"物品"}),
      h("span", {class:"inum", text:"暴露度"}),
      h("span", {class:"inum", text:"接受度"}),

    body.append(head);
    list.forEach(it => body.append(itemRow(it, ov)));

        h("span", {class:"t", text:(names[slot] || slot)}),

      body));
  });
  if (!shown) main.append(h("div", {class:"sub", text:"（没有匹配的物品）"}));

function itemRow(it, ov){
  const id = it.id;
  const changed = !!(ov[id] && Object.keys(ov[id]).length);
  const row = h("div", {class:"irow items" + (changed ? " changed" : "")});
  row.append(h("span", {class:"iname"},
    h("b", {text: it.name || id}),
    h("span", {class:"hint", text:" " + id})));
  ["exposure", "acceptance_req"].forEach(f => {
    const base = baseValueOf(id, f);
    const cur = effValueOf(id, f);
    const cell = h("span", {class:"inum"});
    const inp = h("input", {type:"number", class:"in num", value:String(cur),
      min: f === "exposure" ? "-1" : "0", max: f === "exposure" ? "12" : "99"});
    inp.addEventListener("change", () => {
      const v = parseInt(inp.value, 10);
      if (isNaN(v)) { toast("请输入整数"); renderMain(); return; }
      setItemOverride(id, f, v);
    });
    cell.append(inp);
    if (base !== null && cur !== base){
      cell.append(h("span", {class:"hint", title:"代码内置值 " + base, text:" ⟵ 内置 " + base}));
    }
    row.append(cell);
  });
  // 还原按钮：只在这一行真的改过时才画
  const act = h("span", {class:"iact"});
  if (changed){
    act.append(h("button", {class:"btn tiny", title:"把这一件还原成代码内置值", onclick:()=>{
      delete story.item_overrides[id];
      if (!Object.keys(story.item_overrides).length) story.item_overrides = {};
      commit("item_revert_" + id); markDirty(); renderAll();
    }}, "↺"));
  }
  row.append(act);
  return row;
}

// 写入一件物品的覆写。★ 与内置值相同就**删掉**这个字段 —— 保持 story.json 干净，
// 也保证「没改过的东西不在文件里留痕」这条语义成立。
function setItemOverride(id, field, val){
  const bv = baseValueOf(id, field);
  const ov = story.item_overrides || (story.item_overrides = {});
  const rec = ov[id] || (ov[id] = {});
  if (bv !== null && Number(bv) === Number(val)) delete rec[field];
  else rec[field] = val;
  if (!Object.keys(rec).length) delete ov[id];
  if (!Object.keys(ov).length) story.item_overrides = {};
  commit("item_" + id + "_" + field); markDirty(); renderMain(); renderStatus();
}

// ============================================================
//  第四十轮 · 原貌编辑器
//
//  两块，都写进 `story.true_presets`：
//    · pool     —— 随机池：开局从这几套**整套**里随机抽一套
//    · by_level —— 按关覆写：第 i 关强制换成这一套（没配的关 = 不覆写）
//
//  两块都空 = 完全走原来的「逐槽位从 TRUE_POOL 随机抽」逻辑（默认就是这样）。
//  ★ 一套里**只写几件也算数** —— 没写到的槽位继续按老逻辑随机抽。
//    所以「只想钉死上衣和下装」这种用法是允许的。
// ============================================================
var presetMode = "pool";      // "pool" | "by_level"
var presetSel = 0;            // 当前正在编辑第几套（by_level 模式下 = 第几轮）
// ★ 第四十一轮：原貌编辑器现在有两处入口 —— 全局那套、以及**每套背景**那一套。
//   切页时若 scope 变了就把选中项归零，免得「在背景 B 里选了第 3 套」带到全局页去。
var presetScope = "global";
var itemFilter = { q:"", onlyChanged:false };

function autoSlots(){
  const c = story.catalog || {};
  const dis = c.disabled_slots || [];
  const man = c.manual_slots || [];
  return (c.active_slots || []).filter(s => !man.includes(s) && !dis.includes(s));
}
// 某槽位在该套里可选的物品（下架的槽位没有候选）
function itemsOfSlot(slot, includeDisabled){
  const c = story.catalog || {};
  const dis = c.disabled_slots || [];
  if (!includeDisabled && dis.includes(slot)) return [];
  return catalogItems().filter(it => it.slot === slot);
}
// 这一件在不在「A 的原貌池」里（编辑器给个 ★ 标记）
function inTruePool(slot, id){
  const tp = (((story.catalog || {}).true_pool) || {})[slot] || [];
  return tp.includes(id);
}

function renderTrueAppEditor(main){

    main.append(h("div", {class:"sec"},

  main.append(h("div", {class:"sec"},

        h("br"), "　", h("span", {class:"hint", text:"不改游戏机制，只是把「逐槽位乱抽」换成「从你设计的整套里抽」。适合让每一局都像样。"})),

      h("div", {}, "· 两种可以同时用：按关覆写**优先**，没配覆写的那一关走随机池（池子也空就退回原来的随机逻辑）。"),
      h("div", {}, "· 一套里", h("b", {text:"只写几件也算数"}), " —— 没写到的槽位继续按原逻辑随机抽。所以「只想钉死上衣和下装」是可以的。"),
      h("div", {}, "· 下拉里带 ", h("code", {text:"★"}), " 的是「本来就在原貌候选池里」的款 —— 选它更接近 A 会穿的东西（但不强制）。"),

// ★ 第四十一轮：原貌编辑器的主体抽出来 —— 全局页与「每套背景」页共用它。
//   host      = {pool:[], by_level:[]} 那个对象（全局那份 / 某套背景那份）
//   levelCount= 要显示几轮（全局看关卡数；背景页看**本局几轮**）
//   scopeKey  = 用来区分「现在在编辑谁」，切页时把选中项归零
function presetEditor(main, host, levelCount, scopeKey){
  if (!host.pool) host.pool = [];
  if (!host.by_level) host.by_level = [];
  // 轮数变了就对齐（多了截掉、少了补 null）
  while (host.by_level.length < levelCount) host.by_level.push(null);
  if (host.by_level.length > levelCount) host.by_level.length = levelCount;
  if (presetScope !== scopeKey){ presetScope = scopeKey; presetSel = 0; }

  const pool = host.pool;
  const byLv = host.by_level;
  const configured = byLv.filter(x => x && x.slots && Object.keys(x.slots).length).length;

  main.append(h("div", {class:"sec"},
    h("div", {class:"sechead"}, h("span", {class:"t", text:"模式"})),
    h("div", {class:"secbody"},
      h("div", {class:"row"},
        h("button", {class:"btn" + (presetMode === "pool" ? " on" : ""),
          onclick:()=>{ presetMode = "pool"; presetSel = 0; renderMain(); }},
          "① 随机池（" + pool.length + " 套）"),
        h("button", {class:"btn" + (presetMode === "by_level" ? " on" : ""),
          onclick:()=>{ presetMode = "by_level"; presetSel = 0; renderMain(); }},
          "② 逐轮指定（" + configured + "/" + byLv.length + " 轮已配）"),
        h("span", {class:"hint", text: (presetSummaryOf(host) === "默认")
          ? "当前：完全走原来的随机抽法" : "当前：" + presetSummaryOf(host)}),
      ))));

  if (presetMode === "pool") renderPresetList(main, pool, "套", false);
  else renderPresetList(main, byLv, "轮", true);
}

// 一套预设的规模摘要（导航角标用全局那份；背景页里用 host 自己那份）
function presetSummaryOf(host){
  const pool = (host.pool || []).length;
  const lv = (host.by_level || []).filter(x => x && x.slots && Object.keys(x.slots).length).length;
  if (!pool && !lv) return "默认";
  const parts = [];
  if (pool) parts.push("池 " + pool + " 套");
  if (lv) parts.push("逐轮 " + lv + " 轮");
  return parts.join(" · ");
}

// 一列「套」：左边选，右边编辑选中的那一套
function renderPresetList(main, arr, unit, byLevel){
  const names = ((story.catalog || {}).slot_names || {});
  const listBox = h("div", {class:"secbody presetlist"});

  arr.forEach((e, i) => {
    const has = !!(e && e.slots && Object.keys(e.slots).length);
    const cnt = has ? Object.keys(e.slots).length : 0;
    const label = byLevel
      ? ("第 " + (i + 1) + " 轮" + (has ? "　" + (e.name || "") : ""))
      : ("套 " + (i + 1) + (e && e.name ? "　" + e.name : ""));
    listBox.append(h("div", {class:"navitem" + (presetSel === i ? " on" : "") + (has ? "" : " dim"),
      onclick:()=>{ presetSel = i; renderMain(); }},
      h("span", {text: label}),
      h("span", {class:"cnt", text: has ? (cnt + " 件") : "不覆写"})));
  });

  if (!byLevel){
    listBox.append(h("div", {class:"row"},
      h("button", {class:"btn", onclick:()=>{
        arr.push({name:"新的一套" + (arr.length + 1), slots:{}});
        presetSel = arr.length - 1; commit("preset_add"); markDirty(); renderAll();
      }}, "+ 加一套"),
      h("button", {class:"btn", onclick:()=>{
        if (!arr.length) { toast("还没有套可复制"); return; }
        const src = arr[presetSel] || {};
        arr.push({name:(src.name || "套") + " 副本", slots: JSON.parse(JSON.stringify(src.slots || {}))});
        presetSel = arr.length - 1; commit("preset_dup"); markDirty(); renderAll();
      }}, "复制当前这套"),
      h("button", {class:"btn danger", onclick:()=>{
        if (arr.length <= 1) { toast("至少留一套"); return; }
        if (!confirm("删掉「" + ((arr[presetSel] || {}).name || ("套 " + (presetSel + 1))) + "」？")) return;
        arr.splice(presetSel, 1); presetSel = Math.max(0, presetSel - 1);
        commit("preset_del"); markDirty(); renderAll();
      }}, "删掉这套"),
    ));
  } else {
    listBox.append(h("div", {class:"row"},
      h("button", {class:"btn", onclick:()=>{
        // 「关掉这一关的覆写」= 置回 null

function renderSection(spec, parentKey){
  const key = parentKey + "/" + spec.key;
  const folded = foldSet.has(key);
  const sec = h("div", {class:"sec" + (folded ? " fold" : "")});
  const body = h("div", {class:"secbody"});

  const count = () => {
    if (spec.kind === "object") return (spec.fields || []).length + " 项";
    if (spec.kind === "objlist") return (spec.arr() || []).length + " 条";
    if (spec.kind === "strlist") return (spec.arr() || []).length + " 条";
    if (spec.kind === "strmap" || spec.kind === "strarrmap") return Object.keys(spec.map() || {}).length + " 项";
    return "";
  };
  const head = h("div", {class:"sechead", onclick:()=>{
      if (foldSet.has(key)) foldSet.delete(key); else foldSet.add(key);
      sec.classList.toggle("fold");
    }},
    h("span", {class:"caret", text:"▾"}),
    h("span", {class:"t", text:spec.title}),
    h("span", {class:"n", text:count()}),
    h("span", {class:"sp"}),
  );
  sec.append(head, body);

  if (spec.kind === "object"){
    // spec.host 用来换「这一节挂在哪个对象上」——
    //   不写就是当前背景（bgOf()），写了就能编 story.rules / story.ui.title 这类旁支。
    //   结局文案挂在背景对象下的 endings 子对象上，靠字段里的 sub:"endings" 指过去。
    const host = spec.host ? spec.host() : bgOf();
    spec.fields.forEach(f => body.append(renderField(f, host, null, key)));
  } else if (spec.kind === "objlist"){
    body.append(renderObjList(spec, key, null));
  } else if (spec.kind === "strlist"){
    body.append(renderStrList(spec, key));
  } else if (spec.kind === "strmap"){
    body.append(renderStrMap(spec, key, false));
  } else if (spec.kind === "strarrmap"){
    body.append(renderStrMap(spec, key, true));
  }
  if (spec.hint) body.append(h("div", {class:"flabel"}, h("span", {class:"hint", text:spec.hint})));
  return sec;
}

// ---------- 字段 ----------
function renderField(spec, obj, itemPath, secKey){
  const wrap = h("div", {class:"field" + (spec.t === "area" ? "" : "")});
  if (spec.label){
    wrap.append(h("div", {class:"flabel"},
      h("span", {text:spec.label}),
      spec.k ? h("span", {class:"k", text:spec.k}) : null,
      spec.hint ? h("span", {class:"hint", text:spec.hint}) : null));
  }
  // spec.sub 用来编辑**嵌套对象**的字段（比如背景里的 companion.name）——
  // 没有它就只能把 companion 整块塞进顶层，结构会走样。
  // 注意：这里只**读**，不建空对象 —— 否则光是渲染就会给缺 companion 的背景
  // 塞一个空 {} 进去，一保存就把脏数据写回 story.json 了。
  const readHost = () => (spec.sub ? (obj && obj[spec.sub]) : obj) || null;
  const writeHost = () => {
    if (!spec.sub) return obj;
    if (!obj) return null;
    if (!obj[spec.sub]) obj[spec.sub] = {};
    return obj[spec.sub];
  };
  const host = readHost();
  const val = host ? host[spec.k] : undefined;

  if (spec.t === "text" || spec.t === "area"){
    const inp = spec.t === "area"
      ? h("textarea", {rows:spec.rows || 3})
      : h("input", {type:"text"});
    inp.value = val == null ? "" : String(val);
    if (spec.ro) { inp.readOnly = true; wrap.classList.add("ro"); }
    inp.addEventListener("input", () => {
      if (spec.ro) return;
      const w = writeHost();
      if (!w) return;
      if (w[spec.k] === inp.value) return;
      w[spec.k] = inp.value; commit("txt:" + (itemPath || "sec") + "." + (spec.sub ? spec.sub + "." : "") + spec.k); markDirty();
      if (spec.k === "name" && !spec.sub && view.kind === "bg") buildNav();
      if (itemPath && spec._onTitle) spec._onTitle();
    });
    wrap.append(inp);
  }
  else if (spec.t === "num"){
    const inp = h("input", {type:"number", step:spec.step || "0.5"});
    if (spec.min != null) inp.min = spec.min;
    // ★ `blankZero`：这个字段的 0 是「没写」的意思（比如反差值要求的「自动」），
    //   那就显示成空框 + 灰字提示，别让一个 0 看起来像「要求 0 分」。
    if (spec.blankDelete){
      // ★ 第四十一轮：`blankDelete` —— 空框 = 「这一项不覆写」（把这个键删掉）。
      //   与 `blankZero` 的区别：blankZero 是「0 就是没写」（比如反差要求的「自动」），
      //   而 blankDelete 是「**没有这个键**才算没写」—— 0 本身是一个有效值
      //   （比如最后一轮的 acceptance_gain 就可能是 0，那是「后面没关卡了」的意思）。
      inp.placeholder = spec.placeholder || "（不覆写 → 用全局）";
      inp.value = (val == null) ? "" : String(val);
    } else if (spec.blankZero){
      inp.placeholder = spec.placeholder || "自动";
      inp.value = (val == null || Number(val) === 0) ? "" : String(val);
    } else {
      inp.value = val == null ? "0" : String(val);
    }
    inp.addEventListener("input", () => {
      const w = writeHost();
      if (!w) return;
      if (spec.blankDelete && String(inp.value).trim() === ""){
        if (spec.k in w){
          delete w[spec.k];
          commit("num:" + (itemPath || "sec") + "." + spec.k); markDirty();
        }
        return;
      }
      w[spec.k] = num(inp.value, 0); commit("num:" + (itemPath || "sec") + "." + (spec.sub ? spec.sub + "." : "") + spec.k); markDirty();
    });
    wrap.append(inp);
  }
  else if (spec.t === "bool"){
    const lab = h("label", {class:"flabel"});
    const cb = h("input", {type:"checkbox"});
    cb.checked = !!val;
    cb.addEventListener("change", () => {
      const w = writeHost();
      if (!w) return;
      w[spec.k] = cb.checked; commit(); markDirty();
    });
    lab.append(cb, h("span", {text:"是"}));
    wrap.append(lab);
  }
  else if (spec.t === "strlist"){
    // 字段级字符串数组（比如 combo_keys / option_letters）——
    // 复用的还是 renderStrList，只是把「数组从哪来」换成 host[k]。
    const w = writeHost();
    const cur = w ? w[spec.k] : undefined;
    if (!Array.isArray(cur)){
      wrap.append(h("div", {class:"empty", text:"（还没有这个列表）"}));
      wrap.append(h("div", {class:"addrow"},
        h("button", {text:"＋ 建立列表", onclick:()=>{
          const ww = writeHost(); if (!ww) return;
          ww[spec.k] = spec.defaults ? spec.defaults.slice() : [""];
          commit(); markDirty(); renderAll();
        }})));
    } else {
      wrap.append(renderStrList({ arr:()=>cur, rows:spec.rows || 1, blank:spec.blank || "" },
        (itemPath || "sec") + "." + (spec.sub ? spec.sub + "." : "") + spec.k));
    }
  }
  else if (spec.t === "select"){
    const sel = h("select");
    const fill = () => {
      const opts = spec.opts ? spec.opts() : [];
      sel.innerHTML = "";
      let found = false;
      opts.forEach(o => {
        const op = h("option", {value:o.v, text:o.l});
        if (String(o.v) === String(val == null ? "" : val)) { op.selected = true; found = true; }
        sel.append(op);
      });
      if (!found && val !== undefined && val !== null){
        const op = h("option", {value:val, text:"⚠ " + val + "（已失效的引用）"});
        op.selected = true; sel.prepend(op);
      }
    };
    fill();
    sel.addEventListener("change", () => {
      const w = writeHost();
      if (!w) return;
      w[spec.k] = sel.value; commit(); markDirty();
      // 选项依赖别的字段（比如同行者选项的 value 依赖 fact）→ 重刷本条目
      if (itemPath && spec._refresh) spec._refresh();
    });
    wrap.append(sel);
  }
  else if (spec.t === "multiselect"){
    // 勾选组：值是**字符串数组**，选项从给好的池子里挑（衣物 id / 标签 / 槽位）。
    //   用它是因为「强制穿哪几件」「缺陷用哪些标签」这类字段手打 id 必错。
    const cur = Array.isArray(val) ? val.slice() : [];
    const write = () => {
      const w = writeHost();
      if (!w) return;
      w[spec.k] = cur.slice();
      commit("ms:" + (itemPath || "sec") + "." + spec.k); markDirty();
      if (itemPath && spec._refresh) spec._refresh();
    };
    const box = h("div", {class:"msbox"});
    const filter = h("input", {type:"text", placeholder:"筛选用（id / 名称）"});
    const list = h("div", {class:"mslist"});
    const opts = spec.opts ? spec.opts() : [];
    const render = () => {
      const q = (filter.value || "").trim().toLowerCase();
      list.innerHTML = "";
      let shown = 0;
      // 已经选中的永远显示（哪怕被筛掉了），否则改不回来
      const all = opts.slice();
      cur.forEach(v => { if (!all.some(o => String(o.v) === String(v))) all.push({v:v, l:"⚠ " + v + "（不在目录里）"}); });
      all.forEach(o => {
        const v = String(o.v);
        const on = cur.some(x => String(x) === v);
        const hay = (v + " " + (o.l || "")).toLowerCase();
        if (!on && q && !hay.includes(q)) return;
        shown++;
        const cb = h("input", {type:"checkbox"});
        cb.checked = on;
        cb.addEventListener("change", () => {
          const i = cur.findIndex(x => String(x) === v);
          if (cb.checked){ if (i < 0) cur.push(v); }
          else if (i >= 0) cur.splice(i, 1);
          write(); render();
        });
        list.append(h("label", {class:"msitem" + (on ? " on" : "")}, cb, h("span", {text:(o.l || v)})));
      });
      if (!shown) list.append(h("div", {class:"empty", text:"（没有匹配的）"}));
    };
    filter.addEventListener("input", render);
    render();
    if (opts.length > 14) box.append(filter);
    box.append(list);
    wrap.append(box);
  }
  else if (spec.t === "objlist"){
    // 嵌套清单：字段本身就是一张小清单（比如「强制穿着」每一关下面的若干条规则）。
    //   直接复用 renderObjList —— 所以嵌套的那一层照样能加 / 删 / 上下移。
    const w = writeHost();
    if (!w) return wrap;
    if (!Array.isArray(w[spec.k])) w[spec.k] = [];
    const arr = w[spec.k];
    wrap.append(renderObjList({
      arr: () => arr,
      fields: spec.fields || [],
      fieldsFor: spec.fieldsFor || null,
      titleOf: spec.titleOf || ((it, i) => "条目 " + (i + 1)),
    }, (itemPath || "sec") + "." + (spec.sub ? spec.sub + "." : "") + spec.k, null));
  }
  return wrap;
}

// ---------- objlist ----------
function renderObjList(spec, path, owner){
  const box = h("div");
  const arr = spec.arr ? spec.arr(owner) : [];
  if (!Array.isArray(arr)) return box;
  if (!arr.length) box.append(h("div", {class:"empty", text:"（空 —— 点下面加一条）"}));

  arr.forEach((item, i) => {
    const key = path + "/" + i;
    const fields = spec.fieldsFor ? spec.fieldsFor(item, i) : spec.fields;
    const itemNode = h("div", {class:"item" + (openSet.has(key) ? "" : " fold"), "data-k":key});

    const titleEl = h("span", {class:"it", text:spec.titleOf ? spec.titleOf(item, i) : ("条目 " + (i + 1))});
    const refreshTitle = () => { titleEl.textContent = spec.titleOf ? spec.titleOf(item, i) : ("条目 " + (i + 1)); };

    const ops = h("div", {class:"ops"});
    if (spec.preview){
      ops.append(h("button", {title:"预览", text:"👁", onclick:(e)=>{
        e.stopPropagation();
        const pv = itemNode.querySelector(".pvhost");
        if (pv.classList.contains("on")){ pv.classList.remove("on"); pv.innerHTML = ""; }
        else { pv.classList.add("on"); pv.innerHTML = ""; pv.append(spec.preview(item, i)); }
      }}));
    }
    ops.append(h("button", {title:"上移", text:"↑", onclick:(e)=>{ e.stopPropagation();
      if (i > 0){ arr.splice(i - 1, 0, arr.splice(i, 1)[0]); commit(); markDirty(); renderAll(); } }}));
    ops.append(h("button", {title:"下移", text:"↓", onclick:(e)=>{ e.stopPropagation();
      if (i < arr.length - 1){ arr.splice(i + 1, 0, arr.splice(i, 1)[0]); commit(); markDirty(); renderAll(); } }}));
    ops.append(h("button", {title:"复制一份", text:"⧉", onclick:(e)=>{ e.stopPropagation();
      arr.splice(i + 1, 0, clone(item)); commit(); markDirty(); renderAll(); }}));
    ops.append(h("button", {class:"warn", title:"删除", text:"✕", onclick:(e)=>{ e.stopPropagation();
      if (!confirm("删除这一条？\n\n" + (spec.titleOf ? spec.titleOf(item, i) : ("条目 " + (i + 1))))) return;
      // ★ 第四十一轮：给 spec 一个「删之前」的钩子 —— 用来做**联动**。
      //   返回 false = 取消这次删除（钩子自己会弹确认 / 报原因）。
      //   典型用法：删掉一轮时，把「只属于那一轮」的题目一并删掉、
      //   把后面几轮的题目整体往前挪一轮（见 bgSections ③）。
      if (spec.onBeforeDelete && spec.onBeforeDelete(i, arr) === false) return;
      arr.splice(i, 1); commit(); markDirty(); renderAll(); }}));

    const head = h("div", {class:"itemhead", onclick:()=>{
      if (openSet.has(key)) openSet.delete(key); else openSet.add(key);
      itemNode.classList.toggle("fold");
    }}, h("span", {class:"caret", text:"▾"}), titleEl, h("span", {class:"sp"}), ops);

    const body = h("div", {class:"itembody"});
    const pvhost = h("div", {class:"pvhost"});
    fields.forEach(f => {
      const sp = Object.assign({}, f);
      sp._refresh = () => { rebuildBody(); refreshTitle(); buildNav(); };
      sp._onTitle = refreshTitle;
      body.append(renderField(sp, item, key, path));
    });
    body.append(pvhost);

    function rebuildBody(){
      const f2 = spec.fieldsFor ? spec.fieldsFor(item, i) : spec.fields;
      body.innerHTML = "";
      f2.forEach(f => {
        const sp = Object.assign({}, f);
        sp._refresh = () => { rebuildBody(); refreshTitle(); buildNav(); };
        sp._onTitle = refreshTitle;
        body.append(renderField(sp, item, key, path));
      });
      body.append(pvhost);
    }

    itemNode.append(head, body);
    box.append(itemNode);
  });

  const addRow = h("div", {class:"addrow"});
  addRow.append(h("button", {text:"＋ 新增一条", onclick:()=>{
    const b = spec.blank ? spec.blank() : {};
    arr.push(b);
    openSet.add(path + "/" + (arr.length - 1));
    commit(); markDirty(); renderAll();
    const el = document.querySelector('[data-k="' + path + "/" + (arr.length - 1) + '"]');
    if (el) el.scrollIntoView({block:"center"});
  }}));
  if (spec.noAdd) addRow.innerHTML = "";
  box.append(addRow);
  return box;
}

// ---------- strlist ----------
function renderStrList(spec, path){
  const box = h("div");
  const arr = spec.arr();
  if (!Array.isArray(arr)) return box;
  if (!arr.length) box.append(h("div", {class:"empty", text:"（空）"}));
  arr.forEach((s, i) => {
    const row = h("div", {class:"item", style:"padding:8px 9px"});
    const ta = h("textarea", {rows:spec.rows || 2});
    ta.value = s == null ? "" : String(s);
    ta.addEventListener("input", () => {
      if (arr[i] === ta.value) return;
      arr[i] = ta.value; commit("txt:" + path + "." + i); markDirty();
    });
    const ops = h("div", {class:"ops", style:"display:flex;gap:4px;margin-top:5px;justify-content:flex-end"});
    ops.append(h("button", {text:"↑", onclick:()=>{ if (i > 0){ arr.splice(i - 1, 0, arr.splice(i, 1)[0]); commit(); markDirty(); renderAll(); } }}));
    ops.append(h("button", {text:"↓", onclick:()=>{ if (i < arr.length - 1){ arr.splice(i + 1, 0, arr.splice(i, 1)[0]); commit(); markDirty(); renderAll(); } }}));
    ops.append(h("button", {class:"warn", text:"✕", onclick:()=>{ if (!confirm("删除这条？")) return; arr.splice(i, 1); commit(); markDirty(); renderAll(); }}));
    row.append(ta, ops);
    box.append(row);
  });
  box.append(h("div", {class:"addrow"},
    h("button", {text:"＋ 新增一条", onclick:()=>{ arr.push(spec.blank || ""); commit(); markDirty(); renderAll(); }})));
  return box;
}

// ---------- strmap / strarrmap ----------
function renderStrMap(spec, path, isArr){
  const box = h("div");
  const map = spec.map();
  const keys = Object.keys(map);
  if (!keys.length) box.append(h("div", {class:"empty", text:"（空）"}));
  keys.forEach(k => {
    const row = h("div", {class:"item", style:"padding:8px 9px"});
    row.append(h("div", {class:"flabel"},
      h("span", {class:"k", text:k}),
      h("span", {class:"hint", text:SLOT_CN[k] ? SLOT_CN[k] : ""})));
    if (isArr){
      const list = h("div");
      (map[k] || []).forEach((s, i) => {
        const r = h("div", {style:"display:flex;gap:6px;margin-bottom:5px;align-items:flex-start"});
        const inp = h("input", {type:"text"});
        inp.value = s == null ? "" : String(s);
        inp.addEventListener("input", () => { map[k][i] = inp.value; commit("txt:" + path + "." + k + "." + i); markDirty(); });
        r.append(inp, h("button", {class:"warn", text:"✕", onclick:()=>{
          map[k].splice(i, 1); commit(); markDirty(); renderAll(); }}));
        list.append(r);
      });
      list.append(h("button", {text:"＋ 来源", onclick:()=>{ (map[k] = map[k] || []).push(""); commit(); markDirty(); renderAll(); }}));
      row.append(list);
    } else {
      const ta = h("textarea", {rows:1});
      ta.value = map[k] == null ? "" : String(map[k]);
      const autosize = () => { ta.style.height = "auto"; ta.style.height = Math.max(32, ta.scrollHeight) + "px"; };
      autosize();
      ta.addEventListener("input", () => {
        map[k] = ta.value; commit("txt:" + path + "." + k); markDirty(); autosize();
        if (k in SLOT_CN && spec.key === "clue_frame" && !ta.value.includes("%s")) ta.style.borderColor = "var(--red)";
        else ta.style.borderColor = "";
      });
      row.append(ta);
    }
    box.append(row);
  });

  const missing = spec.missing ? spec.missing() : [];
  const addRow = h("div", {class:"addrow"});
  if (missing.length){
    addRow.append(h("button", {text:"＋ 补齐缺失的 " + missing.length + " 项", onclick:()=>{
      missing.forEach(k => { map[k] = isArr ? ["来源一", "来源二"] : "「他」"; });
      commit(); markDirty(); renderAll();
    }}));
  }
  // ★★ 第五十四轮：对称于 `missing` 的「多出来的项」提示。
  //   这一条原来挂在校验面板里（每次打开编辑器都刷一行），但它是**数据现状说明**
  //   而不是「你改坏了」—— 出厂数据本身就有 21 条这样的描述。
  //   挪到这一节里显示：信息不丢（就在你编辑这张表的地方），也不再淹没别的问题。
  const extra = spec.extra ? spec.extra() : [];
  if (extra.length){
    addRow.append(h("div", {class:"help", style:"margin-left:10px"},
      h("div", {}, "· 另有 ", h("b", {text:extra.length + " 项是多出来的"}), "："
        + extra.join("、")),
      h("div", {}, "　这些衣服不在原貌候选池里（原貌抽不到它们），所以这几条描述"
        + "**永远用不到**。留着不影响运行 —— 以后把这件衣服加进候选池，它就用上了。")));
  }
  addRow.append(h("button", {text:"＋ 自定义键", onclick:()=>{
    const k = prompt("新键名（英文，例如 neck_scarf）：");
    if (!k) return;
    map[k] = isArr ? ["来源一"] : "「他」"; commit(); markDirty(); renderAll();
  }}));
  box.append(addRow);
  return box;
}
