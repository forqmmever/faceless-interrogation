<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千面人 · 文本编辑器</title>
<style>
:root{
  --bg:#0e1015; --panel:#161a21; --panel2:#1d222c; --panel3:#242a36;
  --line:#2b3240; --line2:#3a4354;
  --fg:#e9edf4; --fg2:#b6becd; --dim:#7c869a;
  --amber:#e6a23c; --red:#f0554f; --ok:#4fc98a; --blue:#5aa9e6; --purple:#a98be0;
  --mono:"Cascadia Mono","Consolas","Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--fg); font:13px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--panel3);border-color:var(--line2)}
button.primary{background:#2c3d2f;border-color:#3f6a48;color:#bff0cf}
button.primary:hover{background:#354a39}
button.warn{background:#3d2b2b;border-color:#6a3f3f;color:#f5c0bd}
button:disabled{opacity:.4;cursor:default}
input,textarea,select{
  font:inherit;color:var(--fg);background:#11141a;border:1px solid var(--line);
  border-radius:6px;padding:5px 8px;width:100%;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--amber);background:#0d1015}
textarea{resize:vertical;line-height:1.65;font-family:inherit}
input[type=number]{font-family:var(--mono)}
input[type=checkbox]{width:auto;accent-color:var(--amber)}
select{cursor:pointer}
::placeholder{color:#5b6376}

/* ---------- 顶栏 ---------- */
#top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-weight:700;letter-spacing:.5px;color:var(--amber);white-space:nowrap}
.brand small{color:var(--dim);font-weight:400;margin-left:6px;letter-spacing:0}
#fileinfo{color:var(--dim);font-size:12px;padding-left:10px;border-left:1px solid var(--line);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fileinfo.dirty{color:var(--amber)}
.spacer{flex:1}

/* ---------- 主体 ---------- */
#body{flex:1;display:flex;min-height:0}
#side{width:280px;flex:0 0 280px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}
#searchbox{padding:8px;border-bottom:1px solid var(--line)}
#nav,#results{overflow:auto;padding:6px}
#nav{flex:1}
.navgroup{margin-bottom:6px}
.navhead{padding:5px 8px;color:var(--dim);font-size:11px;letter-spacing:1px}
.navitem{padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.navitem:hover{background:var(--panel2)}
.navitem.on{background:#2a2417;color:var(--amber);box-shadow:inset 2px 0 0 var(--amber)}
.navitem .cnt{margin-left:auto;color:var(--dim);font-size:11px;font-family:var(--mono)}
.navitem.sub{padding-left:22px;font-size:12px;color:var(--fg2)}
.res{display:block;width:100%;text-align:left;margin-bottom:4px;padding:6px 8px;
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.res:hover{border-color:var(--amber)}
.res .where{color:var(--dim);font-size:11px}
.res .what{color:var(--fg2);font-size:12px;margin-top:2px;word-break:break-all}

#main{flex:1;overflow:auto;padding:14px 18px 60px;min-width:0}
#main h1{font-size:16px;margin:0 0 4px}
#main .sub{color:var(--dim);font-size:12px;margin-bottom:14px}

/* ---------- 区块 ---------- */
.sec{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.sechead{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel2);cursor:pointer}
.sechead:hover{background:var(--panel3)}
.sechead .t{font-weight:600}
.sechead .n{color:var(--dim);font-size:11px;font-family:var(--mono)}
.sechead .sp{flex:1}
.secbody{padding:12px}
.sec.fold .secbody{display:none}
.sec.fold .caret{transform:rotate(-90deg)}
.caret{display:inline-block;transition:transform .12s;color:var(--dim)}

/* ---------- 字段 ---------- */
.field{margin-bottom:11px}
.field:last-child{margin-bottom:0}
.flabel{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;color:var(--fg2);font-size:12px}
.flabel .k{font-family:var(--mono);color:var(--dim);font-size:11px}
.flabel .hint{color:#6b7488;font-size:11px}
.ro{opacity:.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid2>.field{margin-bottom:0}

/* ---------- 条目 ---------- */
.item{border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:8px}
.item.fold .itembody{display:none}
.itemhead{display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:pointer}
.itemhead:hover{background:var(--panel3)}
.itemhead .it{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itemhead .ops{display:flex;gap:3px;flex:0 0 auto}
.itemhead .ops button{padding:2px 6px;font-size:12px;background:transparent;border-color:transparent}
.itemhead .ops button:hover{background:var(--panel3);border-color:var(--line2)}
.itembody{padding:10px 11px 12px;border-top:1px solid var(--line)}
.badge{font-size:11px;padding:1px 6px;border-radius:20px;border:1px solid var(--line2);color:var(--dim);font-family:var(--mono)}
.badge.A{color:#f0a0a0;border-color:#6a3f3f}
.badge.B{color:#a0d8b0;border-color:#3f6a48}
.addrow{margin-top:8px;display:flex;gap:8px}
.empty{color:var(--dim);padding:10px;text-align:center;border:1px dashed var(--line);border-radius:8px}

/* ---------- 预览 ---------- */
.pv{margin-top:10px;border:1px dashed var(--line2);border-radius:8px;background:#0c0f14;padding:11px}
.pv .pt{color:var(--dim);font-size:11px;letter-spacing:1px;margin-bottom:8px}
.pv .who{color:var(--amber);font-weight:600;margin-right:4px}
.pv .opt{padding:6px 9px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);margin-top:5px}
.pv .opt .d{float:right;font-family:var(--mono);font-size:11px;color:var(--dim)}
.pv .opt.danger{border-color:#6a3f3f;background:#2a1c1c}
.pv .opt.ok{border-color:#3f6a48;background:#1b2a20}
.pv .plant{margin-top:8px;padding-left:9px;border-left:2px solid var(--purple);color:var(--fg2);font-size:12px}
.pv .leak{margin-top:8px;padding:7px 9px;border-radius:6px;background:#2a1c1c;border:1px solid #6a3f3f;color:#f5c0bd;font-size:12px}
.phone{max-width:330px;border:1px solid var(--line2);border-radius:14px;background:#0b0e13;padding:10px}
.phone .phead{text-align:center;color:var(--fg2);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}
.bub{max-width:82%;padding:6px 10px;border-radius:12px;margin:5px 0;font-size:12px;word-break:break-word}
.bub.me{margin-left:auto;background:#2c3d2f;border:1px solid #3f6a48}
.bub.them{background:var(--panel3);border:1px solid var(--line2)}
.traits{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--fg2)}

/* ---------- 校验 ---------- */
#issues{margin-bottom:12px}
.issbox{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.isshead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel2);cursor:pointer;font-weight:600}
.isshead.err{color:var(--red)} .isshead.warn{color:var(--amber)} .isshead.good{color:var(--ok)}
.isslist{padding:8px 12px;max-height:280px;overflow:auto}
.iss{display:flex;gap:8px;padding:3px 0;font-size:12px;cursor:pointer;border-radius:4px}
.iss:hover{background:var(--panel2)}
.iss .lv{flex:0 0 42px;font-family:var(--mono);font-size:11px}
.iss .lv.e{color:var(--red)} .iss .lv.w{color:var(--amber)}
.iss .m{color:var(--fg2);word-break:break-word}

/* ---------- 状态栏 ---------- */
#status{flex:0 0 auto;display:flex;gap:14px;align-items:center;padding:5px 12px;background:var(--panel);
  border-top:1px solid var(--line);color:var(--dim);font-size:12px;font-family:var(--mono)}
#toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:#252c38;
  border:1px solid var(--line2);border-radius:8px;padding:9px 16px;opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:99;max-width:80vw;text-align:center}
#toast.on{opacity:1}
.help{padding:12px;color:var(--fg2);font-size:12px;line-height:1.9}
.help code{font-family:var(--mono);background:#11141a;padding:1px 5px;border-radius:4px;color:var(--amber)}
.help b{color:var(--fg)}

/* ---------- 勾选组（衣物 id / 标签 / 槽位多选）---------- */
.msbox{border:1px solid var(--line);border-radius:8px;background:#11141a;padding:8px}
.msbox input[type=text]{width:100%;margin-bottom:6px}
.mslist{max-height:230px;overflow:auto;display:flex;flex-wrap:wrap;gap:4px}
.msitem{display:flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--line);
  border-radius:999px;font-size:12px;cursor:pointer;color:var(--fg2);background:#161a22}
.msitem:hover{border-color:var(--line2);color:var(--fg)}
.msitem.on{border-color:var(--amber);color:var(--fg);background:#241d10}
.msitem input{margin:0}
/* 嵌套清单（每一关下面的若干条规则）往右缩一档，层级一眼看得出 */
.field .sec{margin-left:10px;border-left:2px solid var(--line)}

/* ---------- 第四十轮：服装数值 / 原貌 两个页签的表格 ---------- */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.row:last-child{margin-bottom:0}
.chk{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--fg2);cursor:pointer;user-select:none}
.dim{opacity:.5}
.sec.off{opacity:.62}
.btn.on{background:#2a2417;border-color:var(--amber);color:var(--amber)}
.btn.tiny{padding:1px 7px;font-size:12px;line-height:1.5}
.btn.danger{background:#3d2b2b;border-color:#6a3f3f;color:#f5c0bd}
.btn.danger:hover{background:#4a3434}

/* 表格：物品行 = 4 列，原貌行 = 3 列 */
.irow{display:grid;gap:8px;align-items:center;padding:4px 8px;border-top:1px solid var(--line)}
.irow.items{grid-template-columns:minmax(160px,1fr) 210px 210px 34px}
.irow.picks{grid-template-columns:minmax(140px,200px) 1fr 34px}
.irow.ihead{color:var(--dim);font-size:11px;border-top:0;background:var(--panel2);letter-spacing:.5px;
  position:sticky;top:0;z-index:1}
.irow.changed{background:rgba(230,162,60,.08)}
.irow.changed:hover{background:rgba(230,162,60,.13)}
.iname{display:flex;gap:6px;align-items:baseline;min-width:0;overflow:hidden}
.iname b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iname .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inum,.ipick,.iact{display:flex;gap:6px;align-items:center;min-width:0}
.inum input{width:72px;text-align:right}
.inum .hint,.ipick .hint{font-size:11px;color:var(--dim);white-space:nowrap}
.iact{justify-content:flex-end}
input.in{background:#11141a;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--fg)}
input.in:focus{border-color:var(--amber)}
input.in.sel{}
select.in{padding:3px 7px;width:100%;max-width:420px}
.presetlist .navitem{cursor:pointer}
.presetlist .navitem.dim{opacity:.55}
</style>
</head>
<body>

<header id="top">
  <div class="brand">千面人 · 文本编辑器<small>剧情 / 数值 / 文案 / 结局</small></div>
  <div id="fileinfo">未打开文件</div>
  <div class="spacer"></div>
  <button id="btn-open" title="打开一个 story.json">📂 打开</button>
  <button id="btn-save" class="primary" title="Ctrl+S">💾 保存</button>
  <button id="btn-saveas">另存为…</button>
  <button id="btn-gd" title="导出可粘贴回 ScenarioData.gd 的常量块">📋 回退常量</button>
  <button id="btn-undo" title="Ctrl+Z">↶</button>
  <button id="btn-redo" title="Ctrl+Shift+Z">↷</button>
</header>

<div id="body">
  <aside id="side">
    <div id="searchbox"><input id="search" placeholder="搜索短信 / 对话 / 选项文本…"></div>
    <div id="nav"></div>
    <div id="results"></div>
  </aside>
  <main id="main"></main>
</div>

<footer id="status">
  <span id="st-file">—</span><span id="st-count"></span><span id="st-iss"></span>
</footer>
<div id="toast"></div>
<input type="file" id="fileinput" accept=".json,application/json" style="display:none">

"身份","owner":"B","text":"我是北境香料行的行商，常年往返寒霜港与黑石山脉。"},{"id":"b_birth","topic":"来处","owner":"B","text":"寒霜港东侧旧城区，码头往上数第三条巷子。"},{"id":"b_goods","topic":"货品","owner":"B","text":"丁香、肉桂、肉豆蔻，偶尔捎带些北境的琥珀。"},{"id":"b_scar","topic":"手背的痕迹","owner":"B","text":"幼年在香料工坊帮工，被蒸煮锅的蒸汽烫的。"},{"id":"b_purpose","topic":"此行目的","owner":"B","text":"替东家送样品去公爵府邸，顺路讨去年欠下的货款。"},{"id":"a_signal","topic":"敲门暗号","owner":"A","text":"三长两短敲三下门板 —— 北环码头的接头信号。"},{"id":"a_contact","topic":"上线","owner":"A","text":"「灰隼」是我的上线，只在满月夜的老灯塔见面。"},{"id":"a_cargo","topic":"驮队夹层","owner":"A","text":"夹层里运的是禁运硝石，香料只是幌子。"},{"id":"a_brand","topic":"颈侧的烙印","owner":"A","text":"那是北环帮的入伙烙印，烧红的船锚铁按上去的。"},{"id":"a_debt","topic":"旧账","owner":"A","text":"去年冬天在寒霜港欠了「独眼」三百金，至今没还。"},{"id":"a_tunnel","topic":"密道","owner":"A","text":"黑石山脉北坡有条不走官道的雪洞，只有帮里人知道。"},{"id":"a_boss","topic":"帮里的规矩","owner":"A","text":"货丢了可以，名字漏了不行 —— 这是北环帮唯一一条死规矩。"}],"questions":[{"id":"q_b_birth","level":-1,"speaker":"interrogator","text":"你说你从寒霜港来。旧城区那股鱼腥味，现在还散得掉吗？","card":"b_birth","options":[{"text":"散不掉。码头往上数第三条巷子，一到夏天最难熬。","tone":"correct"},{"text":"鱼腥味？我走的时候那一片早就拆了。","tone":"bluff"},{"text":"这个……我不太想聊家乡的事。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_birth 卡，归属 B）"},{"id":"q_a_brand","level":-1,"speaker":"interrogator","text":"（他忽然前倾，目光钉在你领口）你颈侧那道印子 —— 我好像在哪儿见过。","card":"a_brand","options":[{"text":"那是北环帮的入伙烙印，烧红的船锚铁按上去的。","tone":"leak"},{"text":"胎记，生下来就有。","tone":"bluff"},{"text":"小时候烫的。我不想谈这个。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_brand 卡，归属 A）"},{"id":"q_b_scar","level":-1,"speaker":"interrogator","text":"把手套摘了。你手背上那片疤是怎么来的？","card":"b_scar","options":[{"text":"幼年在香料工坊帮工，被蒸煮锅的蒸汽烫的。","tone":"correct"},{"text":"打猎的时候被火燎了一下。","tone":"bluff"},{"text":"旧伤了，没什么好说的。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_scar 卡，归属 B）"},{"id":"q_a_cargo","level":-1,"speaker":"interrogator","text":"（翻着货单）你这驮队……夹层是做什么用的？","card":"a_cargo","options":[{"text":"夹层里运的是禁运硝石，香料只是幌子。","tone":"leak"},{"text":"防潮的。山里雨水重，香料受不得湿。","tone":"bluff"},{"text":"夹层？我不太清楚，那是东家置办的。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_cargo 卡，归属 A）"},{"id":"q_b_purpose","level":-1,"speaker":"interrogator","text":"这趟进公爵府，你到底是来做什么的？","card":"b_purpose","options":[{"text":"替东家送样品去公爵府邸，顺路讨去年欠下的货款。","tone":"correct"},{"text":"来见一位老朋友，私事。","tone":"bluff"},{"text":"……就是些生意上的往来。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_purpose 卡，归属 B）"},{"id":"q_a_contact","level":-1,"speaker":"interrogator","text":"（压低声音）你在北边，跟谁搭线？","card":"a_contact","options":[{"text":"「灰隼」是我的上线，只在满月夜的老灯塔见面。","tone":"leak"},{"text":"跟几个香料行的掌柜，都是正经买卖。","tone":"bluff"},{"text":"我不明白您在问什么。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_contact 卡，归属 A）"},{"id":"q_b_goods","level":-1,"speaker":"interrogator","text":"你这一车货，都运的什么？","card":"b_goods","options":[{"text":"丁香、肉桂、肉豆蔻，偶尔捎带些北境的琥珀。","tone":"correct"},{"text":"布匹和铁器，都是不值钱的东西。","tone":"bluff"},{"text":"货单上写着，您自己看吧。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_goods 卡，归属 B）"},{"id":"q_a_debt","level":-1,"speaker":"interrogator","text":"去年冬天，你在寒霜港欠了谁的钱？","card":"a_debt","options":[{"text":"欠了「独眼」三百金，至今没还。","tone":"leak"},{"text":"我从不在外头赊账。","tone":"bluff"},{"text":"我不记得有这么回事。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_debt 卡，归属 A）"},{"id":"q_fact_origin_new","level":0,"speaker":"interrogator","text":"你说你从寒霜港来 —— 具体在城里哪一片？","fact":"origin","options":[{"text":"寒霜港东侧旧城区，码头往上数第三条巷子","tone":"version","value":"harbor"},{"text":"黑石山脚下的小镇，离官道不远","tone":"version","value":"inland"},{"text":"北境靠冻原的边地，一年有半年在下雪","tone":"version","value":"north"}],"note":"事实题：本轮新问的「origin」"},{"id":"q_fact_origin_recall","level":-1,"speaker":"interrogator","text":"（他忽然换了个问法）你老家，是在水边还是山里？","fact":"origin","recall":true,"options":[{"text":"寒霜港东侧旧城区，码头往上数第三条巷子","tone":"version","value":"harbor"},{"text":"黑石山脚下的小镇，离官道不远","tone":"version","value":"inland"},{"text":"北境靠冻原的边地，一年有半年在下雪","tone":"version","value":"north"}],"note":"事实题：跨轮复问「origin」（哪一轮复问由运行时决定）"},{"id":"q_fact_goods_new","level":1,"speaker":"interrogator","text":"你这一车都运的什么货？","fact":"goods","options":[{"text":"丁香、肉桂、肉豆蔻，偶尔捎带些北境的琥珀","tone":"version","value":"spice"},{"text":"布匹和铁器，都是不值钱的粗货","tone":"version","value":"cloth"},{"text":"药材为主，还有些南边来的蜜饯","tone":"version","value":"medicine"}],"note":"事实题：本轮新问的「goods」"},{"id":"q_fact_goods_recall","level":-1,"speaker":"interrogator","text":"（翻着货单）香料之外，还捎带别的吗？","fact":"goods","recall":true,"options":[{"text":"丁香、肉桂、肉豆蔻，偶尔捎带些北境的琥珀","tone":"version","value":"spice"},{"text":"布匹和铁器，都是不值钱的粗货","tone":"version","value":"cloth"},{"text":"药材为主，还有些南边来的蜜饯","tone":"version","value":"medicine"}],"note":"事实题：跨轮复问「goods」（哪一轮复问由运行时决定）"},{"id":"q_fact_purpose_new","level":2,"speaker":"interrogator","text":"这趟进关，你是来做什么的？","fact":"purpose","options":[{"text":"替东家送样品，顺路讨去年欠下的货款","tone":"version","value":"deliver"},{"text":"来见一位老朋友，私事","tone":"version","value":"visit"},{"text":"想在这儿找个长期买主，把线铺开","tone":"version","value":"work"}],"note":"事实题：本轮新问的「purpose」"},{"id":"q_fact_purpose_recall","level":-1,"speaker":"interrogator","text":"（合上本子）说重点 —— 你来这儿图什么？","fact":"purpose","recall":true,"options":[{"text":"替东家送样品，顺路讨去年欠下的货款","tone":"version","value":"deliver"},{"text":"来见一位老朋友，私事","tone":"version","value":"visit"},{"text":"想在这儿找个长期买主，把线铺开","tone":"version","value":"work"}],"note":"事实题：跨轮复问「purpose」（哪一轮复问由运行时决定）"},{"id":"q_fact_scar_new","level":3,"speaker":"interrogator","text":"你手背上这片疤，怎么弄的？","fact":"scar","options":[{"text":"幼年在香料工坊帮工，被蒸煮锅的蒸汽烫的","tone":"version","value":"workshop"},{"text":"打猎的时候被火燎了一下","tone":"version","value":"hunt"},{"text":"年轻时候跟人动手，被油灯砸的","tone":"version","value":"fight"}],"note":"事实题：本轮新问的「scar」"},{"id":"q_fact_scar_recall","level":-1,"speaker":"interrogator","text":"（盯着你的手）这印子，是烫的还是划的？","fact":"scar","recall":true,"options":[{"text":"幼年在香料工坊帮工，被蒸煮锅的蒸汽烫的","tone":"version","value":"workshop"},{"text":"打猎的时候被火燎了一下","tone":"version","value":"hunt"},{"text":"年轻时候跟人动手，被油灯砸的","tone":"version","value":"fight"}],"note":"事实题：跨轮复问「scar」（哪一轮复问由运行时决定）"},{"id":"q_companion_origin","level":0,"speaker":"companion","text":"「大人，我这位同伴是黑石山脚那边来的吧？我记得他提过。」","fact":"origin","plant":"审讯官没接话，只是把「黑石山」三个字也写进了册子 —— 现在他手里有两个版本。","options":[{"text":"「你记错了。我从寒霜港来，码头往上第三条巷子。」","tone":"version","suspicion":-2,"value":"harbor"},{"text":"「……对，山脚那边。」","tone":"version","suspicion":16,"value":"inland"},{"text":"「我不太想聊家乡。」","tone":"evade","suspicion":6}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_goods","level":1,"speaker":"companion","text":"「说起来，您那车货 —— 是布匹吧？我记得您说过。」","fact":"goods","plant":"「货单」两个字被他咬得很轻 —— 审讯官翻页的手停了一下。","options":[{"text":"「是香料。丁香、肉桂、肉豆蔻，货单上写着。」","tone":"version","suspicion":-2,"value":"spice"},{"text":"「……也有几匹布。」","tone":"version","suspicion":16,"value":"cloth"},{"text":"「货的事，您看单子就好。」","tone":"evade","suspicion":6}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_purpose","level":2,"speaker":"companion","text":"「您这趟不是来见老朋友的吗？上回您跟我说的。」","fact":"purpose","plant":"审讯官把笔搁下看了你很久 —— 一个跑商的，行程里不该有说不清的部分。","options":[{"text":"「替东家送样品，顺路讨一笔旧账。」","tone":"version","suspicion":-2,"value":"deliver"},{"text":"「……也见个朋友。」","tone":"version","suspicion":16,"value":"visit"},{"text":"「私事，不方便讲。」","tone":"evade","suspicion":6}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_scar","level":3,"speaker":"companion","text":"「您手上那疤，是跟人动手落下的吧？看着就不像烫的。」","fact":"scar","plant":"「不像烫的」—— 这句话被原样记进了册子。他不下结论，只是留了个问号。","options":[{"text":"「幼年在香料工坊帮工，被蒸煮锅的蒸汽烫的。」","tone":"version","suspicion":-2,"value":"workshop"},{"text":"「……年轻时打过一架。」","tone":"version","suspicion":16,"value":"fight"},{"text":"「旧伤，没什么好说的。」","tone":"evade","suspicion":6}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_blind_border_0","level":0,"speaker":"interrogator","text":"上月十一，你在哪处落的脚？","setup":"档案里没有这一天 —— 你也没跟任何人提过。","options":[{"text":"「十一那天我在青石镇的悦来栈歇的，掌柜姓周。」","tone":"made_up"},{"text":"「十一……记不真切了，那阵子一直在赶路。」","tone":"bluff"},{"text":"「您问这个做什么？我得翻翻货单才想得起来。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_border_1","level":1,"speaker":"interrogator","text":"你左腕上那只银镯子，哪儿来的？","setup":"档案里没有镯子 —— 你腕上本来也没戴过。","options":[{"text":"「我娘留下的。出关前她塞给我的。」","tone":"made_up"},{"text":"「旧东西了，早不知道搁哪儿去了。」","tone":"bluff"},{"text":"「您看错了 —— 我不戴那些玩意儿。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_border_2","level":2,"speaker":"interrogator","text":"你这一路上，跟谁搭过伙？","setup":"档案里没写同伴 —— 你一直是一个人走的。","options":[{"text":"「有个姓吴的猎户，同行了三天，到北岔口就分了。」","tone":"made_up"},{"text":"「搭过一两回吧，路上碰见的，名字都没问。」","tone":"bluff"},{"text":"「跑单帮的，谁也不认谁。您问这个做什么？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_border_3","level":3,"speaker":"interrogator","text":"你靴子底下那层泥 —— 是从哪段路上带进来的？","setup":"档案里没有这一条 —— 你自己也说不清，连编都没处编。","options":[{"text":"「一路走一路沾，谁知道是哪段。」","tone":"bluff"},{"text":"「泥就是泥，您还能从泥里看出什么来？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"}],"interference_lines":["「说起来，大人 —— 我这位同伴的左手，好像一直不太方便呢。」","「他上次提到过一件事……啊，没什么，我记错了。」","（他忽然咳嗽了一声，把审讯官的视线引向你的领口）","「您不觉得他说话的腔调，不太像寒霜港那边的人吗？」","（他慢条斯理地把自己那只完好的手放到桌上，正好在你旁边）","「北边来的商人，手上一般不会有那种印子吧？」"],"facts":[{"id":"origin","prompts":["你说你从寒霜港来 —— 具体在城里哪一片？","（他忽然换了个问法）你老家，是在水边还是山里？"],"values":[{"id":"harbor","label":"寒霜港东侧旧城区，码头往上数第三条巷子"},{"id":"inland","label":"黑石山脚下的小镇，离官道不远"},{"id":"north","label":"北境靠冻原的边地，一年有半年在下雪"}]},{"id":"goods","prompts":["你这一车都运的什么货？","（翻着货单）香料之外，还捎带别的吗？"],"values":[{"id":"spice","label":"丁香、肉桂、肉豆蔻，偶尔捎带些北境的琥珀"},{"id":"cloth","label":"布匹和铁器，都是不值钱的粗货"},{"id":"medicine","label":"药材为主，还有些南边来的蜜饯"}]},{"id":"purpose","prompts":["这趟进关，你是来做什么的？","（合上本子）说重点 —— 你来这儿图什么？"],"values":[{"id":"deliver","label":"替东家送样品，顺路讨去年欠下的货款"},{"id":"visit","label":"来见一位老朋友，私事"},{"id":"work","label":"想在这儿找个长期买主，把线铺开"}]},{"id":"scar","prompts":["你手背上这片疤，怎么弄的？","（盯着你的手）这印子，是烫的还是划的？"],"values":[{"id":"workshop","label":"幼年在香料工坊帮工，被蒸煮锅的蒸汽烫的"},{"id":"hunt","label":"打猎的时候被火燎了一下"},{"id":"fight","label":"年轻时候跟人动手，被油灯砸的"}]}],"sms":[{"id":"sms_sister","level":0,"contact":"阿姐","avatar":"👩","reveals":[{"fact":"origin","value":"harbor"}],"messages":[{"me":false,"text":"到哪儿了？娘天天问你什么时候回。"},{"me":true,"text":"刚到关口。东侧旧城区那间房，你替我看着点。"},{"me":false,"text":"码头往上第三条巷子那间？漏雨了，我让人补过。"},{"me":true,"text":"多谢。一到夏天那味儿最难熬，你多开窗。"}]},{"id":"sms_boss","level":1,"contact":"东家·鲁伯","avatar":"🧔","reveals":[{"fact":"goods","value":"spice"}],"messages":[{"me":false,"text":"货备齐了没有？公爵府那边催了三回。"},{"me":true,"text":"齐了。丁香、肉桂、肉豆蔻各三包，琥珀我随身带着。"},{"me":false,"text":"顺道把去年那笔货款要回来，别再让他拖。"},{"me":true,"text":"记着。走黑石山脉那条陆路，二十天能到。"}]},{"id":"sms_hand","level":2,"contact":"同行的伙计·阿岸","avatar":"🧑","reveals":[{"fact":"purpose","value":"deliver"}],"messages":[{"me":false,"text":"到了哨卡少说话。东家交代的，货单只报一半。"},{"me":true,"text":"知道。样品给老兵过一眼，剩下三包走暗格。"},{"me":false,"text":"去年那笔货款呢？他要是不认，你别跟他绕。"},{"me":true,"text":"我就说顺路来讨的，不专门为这个跑一趟。"}]},{"id":"sms_workshop","level":3,"contact":"工坊的老周","avatar":"👴","reveals":[{"fact":"scar","value":"workshop"}],"messages":[{"me":false,"text":"你手上那道疤，阴天还疼不疼？"},{"me":true,"text":"早不疼了。幼年在工坊帮工，蒸汽一扑就是一层皮。"},{"me":false,"text":"那年冬天冷得邪乎，你才七岁吧。"},{"me":true,"text":"别提了。周叔，你保重。"}]}],"companion_sms":[{"id":"c_border_0","level":0,"contact":"车夫·老崔","avatar":"🪶","messages":[{"me":false,"text":"到栅栏了。别抬头。"},{"me":true,"text":"知道。"},{"me":false,"text":"手别抖。你一抖，我就得替你圆。"}]},{"id":"c_border_1","level":1,"contact":"车夫·老崔","avatar":"🪶","messages":[{"me":false,"text":"刚才那句「第三条巷子」，你说得太快了。"},{"me":true,"text":"那要怎么说？"},{"me":false,"text":"慢一点，像在回忆。回忆的人不着急。"}]},{"id":"c_border_2","level":2,"contact":"车夫·老崔","avatar":"🪶","messages":[{"me":false,"text":"他看你的眼神变了。他已经认出你一半。"},{"me":true,"text":"你怎么知道？"},{"me":false,"text":"我认识他比你早。真没起疑的人，不会让你进里屋。"}]},{"id":"c_border_3","level":3,"contact":"车夫·老崔","avatar":"🪶","messages":[{"me":false,"text":"里屋那盏灯亮着。他把册子翻到你那一页了。"},{"me":true,"text":"老崔，你到底站哪边？"},{"me":false,"text":"我站车这边。车得出去，别的我不管。"}]}],"endings":{"recognized_line":"%s抬起头，视线在你脸上停住了。\n\n他看了很久，久到旁边的人都安静下来。然后他放下手里的册子，念出了那个你早就不打算再听见的名字 ——\n\n「怎么是你，%s。」\n\n%s\n\n【潜伏失败 · 一眼认出】","recognized_note":"这一身打扮没能把他记忆里的那个 A 盖住 —— 门还没关上，他就叫出了你的名字。本轮到此为止。","exp n_inn","name":"城镇驿站","venue":"官道旁的三层木楼。楼下马厩，楼上客房，中间是大堂与账房。","intro":"官道旁的三层木楼。\n楼下马厩里还拴着两匹没卸鞍的马，楼上客房大半空着。大堂中点着一盏昼灯，账房的算盘声一下一下，很规律。\n你背着琴箱走进去要一间房，柜台后的驿丞把你上下打量了一遍。\n他说登记簿上要写明来处与去向 —— 顺便，问了你几句题外话。\n\n跟你前后脚进店的还有个背琴的年轻人。他知道你是谁，也知道你在装谁。\n他不帮你，也不拆你 —— 他只是站在柜台旁边，时不时替驿丞，把你刚才的话头再接一句。","interrogator":"驿丞","interrogator_gender":"男","companion":{"name":"琴师·阿武","relation":"同台的琴师","gender":"男","desc":"驿站里跟你搭班卖艺的琴师。他听过你记谱用的暗号，知道你是公会的信使。他不会替你圆谎，只会在驿丞面前提起「你上回可不是这么说的」。"},"cover_role":"流浪琴师","true_role":"刺客公会的信使","true_name":"苏绾","levels":[{"name":"第一轮 · 驿站门房","derived_profile":"一个落魄的卖艺人"},{"name":"第二轮 · 大堂账房","derived_profile":"靠卖唱换宿的琴师"},{"name":"第三轮 · 后院上房","derived_profile":"被某位贵人召见的乐师"},{"name":"第四轮 · 驿丞私室","derived_profile":"天亮就要上路的过客"}],"cards":[{"id":"b_identity","topic":"身份","owner":"B","text":"我是走南闯北的琴师，一把旧琴跟了我十年。"},{"id":"b_birth","topic":"来处","owner":"B","text":"南边的水乡，芦荡边上一个小镇，名字您未必听过。"},{"id":"b_goods","topic":"随身行头","owner":"B","text":"一把七弦琴，一只装换洗衣物的布袋，就这些。"},{"id":"b_scar","topic":"手背的痕迹","owner":"B","text":"早年在码头搬货，被缆绳勒出来的。"},{"id":"b_purpose","topic":"此行目的","owner":"B","text":"听说这儿的驿丞爱听曲，想来讨个落脚的地方。"},{"id":"a_tune","topic":"记谱的暗号","owner":"A","text":"那支《芦荡月》的第三段，其实是「货已到手」的暗号。"},{"id":"a_contact","topic":"派单的人","owner":"A","text":"只认铜牌不认脸。牌子背面刻着三道横纹的就是我的人。"},{"id":"a_case","topic":"琴箱夹层","owner":"A","text":"琴箱夹层里放的是淬了毒的短刃，一共七把。"},{"id":"a_mark","topic":"左腕的旧伤","owner":"A","text":"那是第一次失手留下的 —— 目标的反手刀划的。"},{"id":"a_debt","topic":"欠的命","owner":"A","text":"三年前我放过一个不该放过的人，公会一直记着这笔账。"},{"id":"a_safehouse","topic":"落脚点","owner":"A","text":"城南棺材铺的后院，掌柜姓周，敲三下门框他就明白。"},{"id":"a_rule","topic":"公会的规矩","owner":"A","text":"收钱之前不能问名字，收钱之后不能留活口。"}],"questions":[{"id":"q_b_birth","level":-1,"speaker":"interrogator","text":"你说你从南边水乡来。那边端午的龙舟，是从哪条河下水的？","card":"b_birth","options":[{"text":"芦荡西边那条，叫柳溪。水浅，船得挑小的。","tone":"correct"},{"text":"河名我记不清了，走的时候还小。","tone":"bluff"},{"text":"……家乡的事，我不太想说。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_birth 卡，归属 B）"},{"id":"q_a_mark" on","text":"「您手背那一片，是刀划的吧？缆绳勒不出那种口子。」","fact":"scar","plant":"他没有反驳，只是把「码头」两个字圈了起来。","options":[{"text":"「缆绳勒的。早年在码头搬货。」","tone":"version","suspicion":-2,"value":"rope"},{"text":"「……收网时被刀划了一下。」","tone":"version","suspicion":16,"value":"knife"},{"text":"「旧伤，忘了。」","tone":"evade","suspicion":6}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_blind_inn_0","level":0,"speaker":"interrogator","text":"你上回打这儿过，是哪一年？","setup":"档案里没有你的行踪 —— 驿站的登记簿上也没有你的名字。","options":[{"text":"「三年前，也是这个季节，住的东厢第二间。」","tone":"made_up"},{"text":"「记不清了，我这行当一年到头都在路上。」","tone":"bluff"},{"text":"「驿丞大人，您这儿一天过多少人，还记得住谁？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_inn_1","level":1,"speaker":"interrogator","text":"你琴箱里那把旧琴，是谁给你做的？","setup":"档案里没提过制琴的人 —— 你也不知道。","options":[{"text":"「城南的郑师傅，他专做这种小尺寸的。」","tone":"made_up"},{"text":"「街边买来的，谁做的早忘了。」","tone":"bluff"},{"text":"「一把旧琴罢了，值得您这么问？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_inn_2","level":2,"speaker":"interrogator","text":"前几日在西市，你是不是跟一个戴斗笠的人说过话？","setup":"档案里没有这一段 —— 西市你这几日根本没去过。","options":[{"text":"「是说过两句。他来问路，问的是城隍庙怎么走。」","tone":"made_up"},{"text":"「西市？我这几日一直在驿站里，没出去过。」","tone":"bluff"},{"text":"「戴斗笠的人满街都是，您说的是哪一位？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_inn_3","level":3,"speaker":"interrogator","text":"你袖口那道口子，是跟人动手撕的？","setup":"档案里没有这一条 —— 你自己都没留意过，连编都没处编。","options":[{"text":"「哪儿挂的记不得了，衣裳穿久了总这样。」","tone":"bluff"},{"text":"「一道口子而已 —— 您还想看出什么来？」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"}],"interference_lines":["「大人，我这位同伴的琴，好像从来不让人碰呢。」","「他上回提起过一个姓周的掌柜……啊，没什么，我记错了。」","（他忽然咳了一声，把驿丞的视线引向你的手腕）","「您不觉得他这双手，不太像弹了十年琴的人吗？」","（他慢条斯理地把自己的琴横在桌上，正好在你旁边）","「走南闯北的琴师，身上一般不会带着那种味道吧？」"],"facts":[{"id":"origin","prompts":["你说你从南边水乡来 —— 哪个镇子？","（他换了个问法）你老家靠水还是靠山？"],"values":[{"id":"reed","label":"芦荡边上的柳溪镇，水浅，船得挑小的"},{"id":"mountain","label":"西边山坳里的小村子，一年到头见不着外人"},{"id":"city","label":"府城里，热闹得很，我是在街面上长大的"}]},{"id":"instrument","prompts":["你那把琴，哪儿来的？","（敲了敲琴身）这琴跟着你多久了？"],"values":[{"id":"ma 过 ｜ 前后矛盾 [b]%d[/b] 次\n\n你把 A 藏进了 B 的皮里，一路没有露馅。\n同行者从头到尾没有揭穿你 —— 他只是把你留在了原地。","overlay_level_title":"✅ 第 %d 轮通过","overlay_level_btn":"进入第 %d 轮  ➔","overlay_next_body":"[color=#8a919c]背景[/color]  %s\n[color=#8a919c]你装成[/color]  %s\n\n[color=#f0a83c]下一轮[/color]  %s\n接受度 [b]+%d[/b] → [b]%d[/b]（暴露值上限放宽到 [b]%d[/b]）\n反差值要求提高到 [b]%d[/b]\n\n[color=#8a919c]审讯官还是那个人 —— 他记忆里的「A」没有变，你已经查到的外貌情报也还在。要改的是打扮，不是身份。[/color]"},"questions_schema":"faceless-questions-v1","forced_rules":[],"qte_plan":[],"defects":[],"true_presets":{}},{"id":"ducal_manor","name":"公爵府邸","venue":"内城的深宅。三重门禁、抄手游廊、满院子的白蜡树。","intro":"内城的深宅。\n三重门禁一道比一道查得细，抄手游廊绕了大半个院子，白蜡树的影子被灯笼拉得很长。\n你以新招抄写文书的身份禀了进去，在偏厅等了半个时辰。\n来见你的是府里的执事。他没问你叫什么，先要了你写的一页字。\n\n陪你进来的是同批的文书程九。他知道你是谁，也知道你在装谁。\n他不声张，也不点破 —— 他只负责在执事停顿的地方，替他把下一句接上。","interrogator":"府中的执事","interrogator_gender":"男","companion":{"name":"文书·程九","relation":"同房的文书","gender":"男","desc":"跟你同住角房的抄写文书。他在密写药水的味道里认出了你 —— 知道你是宫廷密探，也知道你抄的是假名。他不点破，只在执事问话时替你把破绽递过去。"},"cover_role":"府里新招的抄写文书","true_role":"宫廷密探","true_name":"陆青梧","levels":[{"name":"第一轮 · 侧门角房","derived_profile":"新来的抄写文书"},{"name":"第二轮 · 文书房","derived_profile":"字迹端正的低等文书"},{"name":"第三轮 · 内庭回廊","derived_profile":"被某位大人点名的近侍"},{"name":"第四轮 · 执事厅","derived_profile":"即将领到腰牌的府中之人"}],"cards":[{"id":"b_identity","topic":"身份","owner":"B","text":"我是府上新招的抄写，管誊录田册和来往信件。"},{"id":"b_birth","topic":"来处","owner":"B","text":"城南书坊街，我家在街尾开了三代人的笔墨铺。"},{"id":"b_goods","topic":"手边的物件","owner":"B","text":"一方砚、三支笔、半卷没抄完的田册。"},{"id":"b_scar","topic":"手背的痕迹","owner":"B","text":"磨墨磨的。常年压着砚台，皮都磨硬了。"},{"id":"b_purpose","topic":"此行目的","owner":"B","text":"执事大人传唤，说是要核对去年的租册。"},{"id":"a_cipher","topic":"密写药水","owner":"A","text":"牛奶写的字，火上一烤就显出来 —— 我给外头递消息就用这个。"},{"id":"a_contact","topic":"接头方式","owner":"A","text":"每隔九日在东角门的第三根廊柱下留一枚铜扣。"},{"id":"a_map","topic":"回廊图","owner":"A","text":"内庭那条少有人走的夹道，直通公爵的书房后窗。"},{"id":"a_mark","topic":"耳后的针孔","owner":"A","text":"那是接密信用的，线从耳后穿过去，藏在发里。"},{"id":"a_debt","topic":"未还的债","owner":"A","text":"去年我卖掉了府里一位老人的行踪，他一直没等到人。"},{"id":"a_poison","topic":"袖中的药","owner":"A","text":"袖口缝着一小包乌头粉，是留给最后那一个人的。"},{"id":"a_rule","topic":"行里的规矩","owner":"A","text":"递出去的消息不许留副本，看过就烧。"}],"questions":[{"id":"q_b_birth","level":-1,"speaker":"interrogator","text":"书坊街尾那家笔墨铺，招牌上写的是什么？","card":"b_birth","options":[{"text":"「三代笔墨」，我爷爷亲手刻的，漆都掉了大半。","tone":"correct"},{"text":"招牌早摘了，那一片去年就拆了。","tone":"bluff"},{"text":"……铺子的事，我不太想提。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_birth 卡，归属 B）"},{"id":"q_a_mark","level":-1,"speaker":"interrogator","text":"（他绕到你身后，忽然停住）你耳后……有个小孔。","card":"a_mark","options":[{"text":"那是接密信用的，线从耳后穿过去，藏在发里。","tone":"leak"},{"text":"小时候生疮，溃了个洞。","tone":"bluff"},{"text":"不知道，可能一直就有吧。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_mark 卡，归属 A）"},{"id":"q_b_scar","level":-1,"speaker":"interrogator","text":"把手摊开。指节上这些硬皮是怎么来的？","card":"b_scar","options":[{"text":"磨墨磨的。常年压着砚台，皮都磨硬了。","tone":"correct"},{"text":"干粗活干的。","tone":"bluff"},{"text":"写字的人，手都这样。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_scar 卡，归属 B）"},{"id":"q_a_cipher","level":-1,"speaker":"interrogator","text":"（把一张白纸凑到烛火上）你觉得，这上头有字吗？","card":"a_cipher","options":[{"text":"牛奶写的字，火上一烤就显出来 —— 我给外头递消息就用这个。","tone":"leak"},{"text":"空白的。您是不是看错了？","tone":"bluff"},{"text":"我……不懂这些门道。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_cipher 卡，归属 A）"},{"id":"q_b_purpose","level":-1,"speaker":"interrogator","text":"执事传你，是为什么事？","card":"b_purpose","options":[{"text":"核对去年的租册，有几处数目对不上。","tone":"correct"},{"text":"说是有人举荐我，让我来听差遣。","tone":"bluff"},{"text":"……大人没细说。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_purpose 卡，归属 B）"},{"id":"q_a_contact","level":-1,"speaker":"interrogator","text":"（压低声音）你在府里，跟谁接头？","card":"a_contact","options":[{"text":"每隔九日在东角门的第三根廊柱下留一枚铜扣。","tone":"leak"},{"text":"跟几位管事，都是公事上的往来。","tone":"bluff"},{"text":"我不明白您的意思。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_contact 卡，归属 A）"},{"id":"q_b_goods","level":-1,"speaker":"interrogator","text":"你身上就带这些？","card":"b_goods","options":[{"text":"一方砚、三支笔、半卷没抄完的田册。","tone":"correct"},{"text":"还有几封没送出去的家书。","tone":"bluff"},{"text":"抄写的人，身上能有什么。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_goods 卡，归属 B）"},{"id":"q_a_rule","level":-1,"speaker":"interrogator","text":"（忽然换了个话题）递出去的信，你留底吗？","card":"a_rule","options":[{"text":"递出去的消息不许留副本，看过就烧。","tone":"leak"},{"text":"当然留底，万一出了岔子好对账。","tone":"bluff"},{"text":"……看是什么信吧。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_rule 卡，归属 A）"},{"id":"q_fact_origin_new","level":0,"speaker":"interrogator","text":"你说你家在城南书坊街 —— 铺子在街口还是街尾？","fact":"origin","options":[{"text":"书坊街街尾，开了三代人的笔墨铺","tone":"version","value":"tail"},{"text":"街口，我爹那一辈才开的，年头不算长","tone":"version","value":"head"},{"text":"不在书坊街，在旧市口那边，铺面很小","tone":"version","value":"market"}],"note":"事实题：本轮新问的「origin」"},{"id":"q_fact_origin_recall","level":-1,"speaker":"interrogator","text":"（他换了个问法）你家那铺子，开了多少年？","fact":"origin","recall":true,"options":[{"text":"书坊街街尾，开了三代人的笔墨铺","tone":"version","value":"tail"},{"text":"街口，我爹那一辈才开的，年头不算长","tone":"version","value":"head"},{"text":"不在书坊街，在旧市口那边，铺面很小","tone":"version","value":"market"}],"note":"事实题：跨轮复问「origin」（哪一轮复问由运行时决定）"},{"id":"q_fact_skill_new","level":1,"speaker":"interrogator","text":"你这手字，跟谁学的？","fact":"skill","options":[{"text":"家里三代做笔墨，自小跟着抄，手是练出来的","tone":"version","value":"family"},{"text":"在城南的义学里练过几年","tone":"version","value":"academy"},{"text":"自己照着旧帖描的，没正经拜过师","tone":"version","value":"self"}],"note":"事实题：本轮新问的「skill」"},{"id":"q_fact_skill_recall","level":-1,"speaker":"interrogator","text":"（翻着你抄的册子）练了多少年了？","fact":"skill","recall":true,"options":[{"text":"家里三代做笔墨，自小跟着抄，手是练出来的","tone":"version","value":"family"},{"text":"在城南的义学里练过几年","tone":"version","value":"academy"},{"text":"自己照着旧帖描的，没正经拜过师","tone":"version","value":"self"}],"note":"事实题：跨轮复问「skill」（哪一轮复问由运行时决定）"},{"id":"q_fact_purpose_new","level":2,"speaker":"interrogator","text":"执事传你，是为什么事？","f ade","suspicion":6}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_purpose","level":2,"speaker":"companion","text":"「听说您是有人举荐才进府的？」","fact":"purpose","plant":"「举荐」两个字写得很轻，但写下来了。","options":[{"text":"「是执事传我来核对租册的。」","tone":"version","suspicion":-2,"value":"ledger"},{"text":"「……是有人举荐。」","tone":"version","suspicion":16,"value":"recommend"},{"text":"「谁说的？」","tone":"evade","suspicion":6}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_companion_scar","level":3,"speaker":"companion","text":"「您这手上的硬皮，是在工地上干出来的吧？」","fact":"scar","plant":"他把你的手看了很久 —— 像是在数，一个抄写的人手上该有几处茧。","options":[{"text":"「磨墨磨的。常年压着砚台。」","tone":"version","suspicion":-2,"value":"ink"},{"text":"「……早年在工地上干过。」","tone":"version","suspicion":16,"value":"labor"},{"text":"「写字的人，手都这样。」","tone":"evade","suspicion":6}],"note":"同行者提问（他的问法是错的，看你能不能顶住）"},{"id":"q_blind_manor_0","level":0,"speaker":"interrogator","text":"你是哪一年入的府？引荐人是谁？","setup":"档案里没有入府记录 —— 名册上也翻不到你的名字。","options":[{"text":"「前年秋天，是账房的刘管事引荐的。」","tone":"made_up"},{"text":"「去年来应募的，具体经谁的手我记不清了。」","tone":"bluff"},{"text":"「名册上应当有，执事大人一查便知。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_manor_1","level":1,"speaker":"interrogator","text":"你住的角房，隔壁那间现在住着谁？","setup":"档案里没有角房的记录 —— 你没留意过隔壁。","options":[{"text":"「住着一位姓陈的老仆，腿脚不太方便。」","tone":"made_up"},{"text":"「隔壁……似乎一直空着，我没怎么留意。」","tone":"bluff"},{"text":"「同房的事我从不多问 —— 府里的规矩。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_manor_2","level":2,"speaker":"interrogator","text":"上月十五的灯会，你在府里还是在街上？","setup":"档案里没有这一天 —— 你也不记得府里办过灯会。","options":[{"text":"「在府里当值，跟着程九抄了一夜的卷宗。」","tone":"made_up"},{"text":"「灯会？我那几日病着，一直在房里。」","tone":"bluff"},{"text":"「日子我记不准。执事大人查当值簿更稳妥。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"},{"id":"q_blind_manor_3","level":3,"speaker":"interrogator","text":"你右手中指上的茧，是握什么磨出来的？","setup":"档案里没有这一条 —— 你自己也没留意过，连编都没处编。","options":[{"text":"「做粗活做出来的，家里早年开过磨坊。」","tone":"bluff"},{"text":"「手上茧子多，哪一处是什么磨的，我自己也分不清。」","tone":"evade"}],"note":"盲区题：档案与短信里都没有，只能按他的脾性选"}],"interference_lines":["「执事大人，我这位同伴的耳朵后面，好像一直不太舒服。」","「他上次提过东角门……啊，没什么，是我记错了。」","（他忽然把手里的笔搁下，声音正好让执事听见）","「您不觉得他握笔的姿势，不太像抄了十年册子的人吗？」","（他慢条斯理地把自己的手摊在桌上，正好在你旁边）","「在府里做抄写的，手背上一般不会留着那种印子吧？」"],"facts":[{"id":"origin","prompts":["你说你家在城南书坊街 —— 铺子在街口还是街尾？","（他换了个问法）你家那铺子，开了多少年？"],"values":[{"id":"tail","label":"书坊街街尾，开了三代人的笔墨铺"},{"id":"head","label":"街口，我爹那一辈才开的，年头不算长"},{"id":"market","label":"不在书坊街，在旧市口那边，铺面很小"}]},{"id":"skill","prompts":["你这手字，跟谁学的？","（翻着你抄的册子）练了多少年了？"],"values":[{"id":"family","label":"家里三代做笔墨，自小跟着抄，手是练出来的"},{"id":"academy","label":"在城南的义学里练过几年"},{"id":"self","label":"自己照着旧帖描的，没正经拜过师"}]},{"id":"purpose","prompts":["执事传你，是为什么事？","（合上册子）说重点，你来府里做什么？"],"values":[{"id":"ledger","label":"核对去年的租册，有几处数目对不上"},{"id":"recommend","label":"有人举荐我，让我来听差遣"},{"id":"errand","label":"替人跑一趟腿，送几封文书"}]},{"id":"scar","prompts":["你指节上这些硬皮，怎么来的？","（看了一眼你的手）不像干粗活的，倒像常年压着什么。"],"values":[{"id":"ink","label":"磨墨磨的，常年压着砚台，皮都磨硬了"},{"id":"labor","label":"早年在工地上干过活，落下的"},{"id":"burn","label":"小时候被炭火烫过一片，一直没好利索"}]}],"sms":[{"id":"sms_mother","level":0,"contact":"娘","avatar":"👵","reveals":[{"fact":"origin","value":"tail"}],"messages":[{"me":false,"text":"铺子今天没开张，风大。"},{"me":true,"text":"娘，别站在门口。街尾那一段最招风。"},{"me":false,"text":"知道。你爷爷刻的招牌还挂着呢 —— 「三代笔墨」，漆都掉了大半。"},{"me":true,"text":"别摘。我在这边抄册子，也是靠这手字吃饭。"}]},{"id":"sms_carver","level":1,"contact":"街口的刻字匠·老穆","avatar":"🧔","reveals":[{"fact":"skill","value":"family"}],"messages":[{"me":false,"text":"你那手字，一看就是从小练的，不是半路学的。"},{"me":true,"text":"家里三代做笔墨，会走路就跟着抄。"},{"me":false,"text":"府里要的是能抄密件的人，师承你得说清楚。"},{"me":true,"text":"照实说就行，家里传的。"}]},{"id":"sms_yan","level":2,"contact":"书坊街·阿砚","avatar":"🧑","reveals":[{"fact":"purpose","value":"ledger"}],"messages":[{"me":false,"text":"执事传你，是为租册的事？"},{"me":true,"text":"嗯。去年的租册有几处数目对不上，让我核对。"},{"me":false,"text":"当心点，府里的账不好碰。"},{"me":true,"text":"我知道。看完就交回去。"}]},{"id":"sms_chen","level":3,"contact":"老掌柜·陈","avatar":"🧓","reveals":[{"fact":"scar","value":"ink"}],"messages":[{"me":false,"text":"手还好使吗？"},{" _goods","topic":"货品","owner":"B","text":"今早三筐鲱鱼、两筐青口，都是近海捞的。"},{"id":"b_scar","topic":"手背的痕迹","owner":"B","text":"收网的时候被缆绳绞的，年年都要添新伤。"},{"id":"b_purpose","topic":"此行目的","owner":"B","text":"送两筐新鲜货给值房的大人尝尝，顺带办通关文书。"},{"id":"a_signal","topic":"灯塔灯语","owner":"A","text":"灯塔亮三下灭两下，就是「今晚可以进港」。"},{"id":"a_contact","topic":"接头的人","owner":"A","text":"只在退潮时见，站在旧船坞第二根桩子边上。"},{"id":"a_cargo","topic":"舱底","owner":"A","text":"舱底隔了一层，装的是南边来的火药，上面压着鱼。"},{"id":"a_mark","topic":"掌心的烫痕","owner":"A","text":"那是船上的炉子翻了，我拿手去挡，留了这块。"},{"id":"a_debt","topic":"欠的抽成","owner":"A","text":"港务那边抽三成，我欠了两个月的没交。"},{"id":"a_channel","topic":"暗水道","owner":"A","text":"灯塔西边那道礁缝，涨潮时能过小船，官船进不去。"},{"id":"a_rule","topic":"船上的规矩","owner":"A","text":"上了船就不问货，问货的会被丢下海。"}],"questions":[{"id":"q_b_birth","level":-1,"speaker":"interrogator","text":"灯塔下头那片棚户，一共几排？","card":"b_birth","options":[{"text":"四排。最靠海那排去年被浪打塌了半边。","tone":"correct"},{"text":"棚户早拆了，我搬走好几年了。","tone":"bluff"},{"text":"……那边的事，我不太想提。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_birth 卡，归属 B）"},{"id":"q_a_mark","level":-1,"speaker":"interrogator","text":"（他忽然抓住你的手翻过来）掌心上这块，不像缆绳绞的。","card":"a_mark","options":[{"text":"那是船上的炉子翻了，我拿手去挡，留了这块。","tone":"leak"},{"text":"小时候玩火烫的。","tone":"bluff"},{"text":"旧伤了，记不清。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_mark 卡，归属 A）"},{"id":"q_b_scar","level":-1,"speaker":"interrogator","text":"手背上这些口子，怎么来的？","card":"b_scar","options":[{"text":"收网的时候被缆绳绞的，年年都要添新伤。","tone":"correct"},{"text":"搬货磕的。","tone":"bluff"},{"text":"干这行的，手上都这样。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 b_scar 卡，归属 B）"},{"id":"q_a_cargo","level":-1,"speaker":"interrogator","text":"（敲了敲筐底）你这筐，底下垫得挺厚。","card":"a_cargo","options":[{"text":"舱底隔了一层，装的是南边来的火药，上面压着鱼。","tone":"leak"},{"text":"怕鱼压坏了，垫点草。","tone":"bluff"},{"text":"筐是船东给的，我没动过。","tone":"evade"},{"text":"","tone":"silence"}],"note":"档案题（来自 a_cargo 卡，归属 A）"},{"id":"q_b_purpose","level":-1,"speaker":"interrogator","text":"你往值房送鱼，是想办什么事 function h(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat(9)) if (kid !== null && kid !== undefined && kid !== false)
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return n;
}
const $ = id => document.getElementById(id);

let toastTimer = null;
function toast(msg, ms){

// ---------- 脏标记 / 撤销 ----------
// 模型：undoStack 里存的是一串「状态」，栈顶 = 当前状态。
// 每次改动**之后**调 commit() 把新状态压栈。
//
// 传了 sig 时，900ms 内的连续同类改动会**替换栈顶**而不是新压一帧 ——
// 否则打一句话就塞进几十帧，撤销变成逐字符（踩过这个坑）。
// 增删 / 上下移这类离散操作不传 sig，每一下都算一步。
const undoStack = [];
const redoStack = [];
let lastSig = "", lastSigT = 0;

function snapshot(){ return JSON.stringify(story); }

function commit(sig){
  const s = snapshot();
  if (undoStack.length && undoStack[undoStack.length - 1] === s) return;
  const now = Date.now();
  const coalesce = sig && sig === lastSig && (now - lastSigT) < 900 && undoStack.length >= 2;
  if (coalesce) undoStack[undoStack.length - 1] = s;
  else { undoStack.push(s); if (undoStack.length > 80) undoStack.shift(); }
  redoStack.length = 0;
  lastSig = sig || ""; lastSigT = now;
}

function markDirty(){
  dirty = true;
  $("fileinfo").classList.add("dirty");
  updateFileInfo();
  scheduleValidate();
}
function undo(){
  if (undoStack.length < 2) { toast("没有可撤销的步骤了"); return; }
  redoStack.push(undoStack.pop());
  story = JSON.parse(undoStack[undoStack.length - 1]);
  lastSig = ""; dirty = true; scheduleValidate(); renderAll();
}
function redo(){
  if (!redoStack.length) { toast("没有可重做的步骤了"); return; }
  const s = redoStack.pop();
  undoStack.push(s);
  story = JSON.parse(s);
  lastSig = ""; dirty = true; scheduleValidate(); renderAll();
}

// ---------- 载入 ----------
// 编辑器要保证几个容器存在，否则输入框写不进去（readHost 拿到 undefined 就直接放弃）。
// 真实 story.json 里都有（DumpStory 一定会写）；这里只是给「手动删过键 / 老版本文件」兜底。
function normalizeStory(o){
  if (!o.rules || typeof o.rules !== "object") o.rules = {};
  if (!o.ui || typeof o.ui !== "object") o.ui = {};
  uiSections().forEach(sec => { if (!o.ui[sec.seg] || typeof o.ui[sec.seg] !== "object") o.ui[sec.seg] = {}; });
  (o.backgrounds || []).forEach(b => { if (!b.endings || typeof b.endings !== "object") b.endings = {}; });
  // 第二十三轮的四段：**不**自动建空数组 —— 缺了就一直缺，游戏会退回出厂兜底。
  // （建了空数组反而危险：`levels: []` 会被当成「一关都没有」。
  //   真要改，就在对应的那一页点「＋加一条」，那时才建。）
  ["levels", "forced_rules", "qte_plan", "defects"].forEach(k => {
    if (o[k] !== undefined && !Array.isArray(o[k])) delete o[k];
  });
  if (!o.catalog || typeof o.catalog !== "object") o.catalog = {items:[], tags:[], slots:[]};
  if (!Array.isArray(o.catalog.items)) o.catalog.items = [];
  if (!Array.isArray(o.catalog.tags)) o.catalog.tags = [];
  return o;
}

function loadStory(obj, name, fromFile){

  lastSig = ""; lastSigT = 0;

// ============================================================
//  第四十一轮：记住「上次把 json 存到哪儿了」
//
//  用户口径：「结果 json 保存的位置应位于编辑器同一目录」。
//
//  ★ 先说清楚浏览器给不了什么：`showSaveFilePicker` **不能**接收一个任意路径
//    （安全沙箱 —— 网页不许指定「写到 D:\...\tools\」）。能合法做到的有两条：
//      ① `showSaveFilePicker` 的 `id` 选项 —— 同一个 id 会记住**上次用过的目录**，
//         下次打开对话框默认就停在那儿；
//      ② 把上次拿到的 fileHandle 存进 IndexedDB —— 关掉页面再打开，
//         按 Ctrl+S 还能直接写回**同一个文件**，连对话框都不弹。
//    两条一起用，实际体验就是「第一次手动选到 tools/ 之后，以后都默认在那一带」。
//  ★ 权限：句柄是持久化的，但读写权限要用户手势才能重新授予 ——
//    所以恢复权限这一步放在「按 Ctrl+S」或点保存时做（那时本身就是手势）。
// ============================================================
const IDB_NAME = "faceless-editor";
const IDB_STORE = "handles";
const PICKER_ID = "faceless-story-json";
var rememberedHandle = null;

function idbOpen(){
  return new Promise((res, rej) => {
    if (typeof indexedDB === "undefined"){ rej(new Error("no indexedDB")); return; }
    const rq = indexedDB.open(IDB_NAME, 1);
    rq.onupgradeneeded = () => { rq.result.createObjectStore(IDB_STORE); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbPut(k, v){
  try {
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, "readwrite");
      tx.objectStore(IDB_STORE).put(v, k);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
    db.close();
  } catch(e){ /* 存不下不影响保存本身 */ }
}
async function idbGet(k){
  try {
    const db = await idbOpen();
    const v = await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, "readonly");
      const rq = tx.objectStore(IDB_STORE).get(k);
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    });
    db.close();
    return v;
  } catch(e){ return null; }
}

// 取出一个「现在能写」的句柄 —— 优先用当前会话的，其次用记忆里的。
// ★ 权限只在用户手势里申请得到，所以这个函数必须从点击 / Ctrl+S 的调用链里进。
async function writableHandle(){
  const cand = fileHandle || rememberedHandle;
  if (!cand) return null;
  try {
    if (cand.queryPermission){
      let p = await cand.queryPermission({mode:"readwrite"});
      if (p !== "granted" && cand.requestPermission)
        p = await cand.requestPermission({mode:"readwrite"});
      if (p !== "granted") return null;
    }
    return cand;
  } catch(e){ return null; }
}

function getSeed(){

}

async function tryFetch(){
  const cands = ["data/story.json", "../data/story.json", "./story.json", "../../data/story.json"];
  for (const u of cands){
    try {
      const r = await fetch(u, {cache:"no-store"});
      if (r.ok) { const j = await r.json(); if (j && j.backgrounds) return {json:j, from:u}; }
    } catch(e){ /* 继续试下一个 */ }
  }
  return null;
}

// ---------- 保存 / 打开 ----------
function toJSON(){ return JSON.stringify(story, null, "\t") + "\n"; }

async function save(asNew){
  const text = toJSON();
  // ★ 第四十一轮：先试「用已有 / 记住的句柄直接写回」—— 连对话框都不弹。
  if (!asNew){
    const h = await writableHandle();
    if (h){
      try {
        const w = await h.createWritable();
        await w.write(text); await w.close();
        fileHandle = h; fileName = h.name || fileName;
        dirty = false; $("fileinfo").classList.remove("dirty"); updateFileInfo();
        toast("已写回 " + fileName); return;
      } catch(e){ /* 句柄失效了 → 落到下面重新挑文件 */ }
    }
  }
  if (window.showSaveFilePicker){
    try {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: fileName || "story.json",
        // ★ `id` = 让浏览器**记住上次用过的目录**（下次默认停在那儿）。
        //   这是「默认定位到 tools/」在浏览器里唯一合规的实现方式。
        id: PICKER_ID,
        types:[{description:"剧情文本 JSON", accept:{"application/json":[".json"]}}]
      });
      fileName = fileHandle.name;
      const w = await fileHandle.createWritable();
      await w.write(text); await w.close();
      dirty = false; $("fileinfo").classList.remove("dirty");
      await idbPut("story", fileHandle);      // ★ 记住它，下次打开页面还能直接写回
      rememberedHandle = fileHandle;
      updateFileInfo();
      toast("已保存到 " + fileName); return;
    } catch(e){
      if (e && e.name === "AbortError") return;
    }
  }
  // 回退：下载（浏览器不给就地写权限时）
  const blob = new Blob([text], {type:"application/json"});
  const a = h("a", {href:URL.createObjectURL(blob), download:"story.json"});
  document.body.append(a); a.click(); a.remove();
  toast("已下载 story.json —— 请覆盖项目里的 data/story.json", 4200);
}

async function openFile(){
  if (window.showOpenFilePicker){
    try {
      const [fh] = await window.showOpenFilePicker({
        types:[{description:"剧情文本 JSON", accept:{"application/json":[".json"]}}]
      });
      const f = await fh.getFile();
      const j = JSON.parse(await f.text());
      fileHandle = fh;
      loadStory(j, fh.name, false);
      toast("已打开 " + fh.name); return;
    } catch(e){
      if (e && e.name === "AbortError") return;
      toast("打不开这个文件：" + (e && e.message ? e.message : e), 4000); return;
    }
  }
  $("fileinput").click();
}

// 目录查询小工具
function catItems(){ return ((story.catalog || {}).items || []); }

const FORCED_MODES = [
  {v:"none",   l:"没有强制要求（这一关想穿什么穿什么）"},
  {v:"random", l:"随机抽 0~2 件高暴露（出厂默认）"},
  {v:"fixed",  l:"用下面写死的规则"},
];

// 一条强制规则长什么样：all = 这几件都要穿；any = 这几件里任选一件
function forcedRuleTitle(r, i){
  const items = r.items || [];

// ============================================================
//  题库（第二十九轮）—— 盘问环节的题目清单
//
//  用户口径：「阶段二的问题我想不再给问题分类，直接让我编辑对问题进行编辑」。
//  所以这里不再有「档案题 / 说法题 / 同行者题 / 盲区题」四个分区，
//  只有一份清单：每道题自己带题面、选项、QTE、抖动、以及每个选项的怀疑值。
//
//  两处最容易看错的地方：
//   · `level` —— -1 = 通用池（每关都可能抽到），0..N = 固定给第 N+1 关。
//     「某关出几道题」= 那关的固定题 + 从通用池补足到 rules.questions_per_level。
//     想精确控制就分配下去，想保留随机就留在通用池。
//   · `tone` —— 选项的语义标签，判定**只看它**，不再看「题目属于哪一类」。
//     `suspicion` 留空 = 用全局默认（照实答看 rules.correct_delta、
//     撒谎/回避按审问官性情现算）；填了就硬覆盖。
// ============================================================
const TONE_OPTS = [
  {v:"correct", l:"照实答（B 的档案 —— 对得上就没事）"},
  {v:"leak",    l:"说漏嘴（只有 A 才知道的事 —— 当场出局）"},
  {v:"version", l:"某个版本（对错看「你之前立过什么说法」）"},
  {v:"bluff",   l:"撒谎（代价按审问官性情现算）"},
  {v:"evade",   l:"回避（同上看性情）"},
  {v:"silence", l:"沉默（代价固定，与性情无关）"},
  {v:"made_up", l:"硬编一个细节（盲区题：编得越细越糟）"},
];
const QUESTION_QTE_OPTS = [
  {v:"auto", l:"自动（★ 只看暴露值：露得越多，这一关被盯住脸的次数越多）"},
  {v:"none", l:"无（这道题什么都不出）"},
  {v:"expression", l:"表情控制（长按空格顶过 60%）"},
  {v:"interference", l:"递话打断（按一下空格）"},
  {v:"combo", l:"组合干扰（依次敲 J → K → L）"},
];
const SPEAKER_OPTS = [
  {v:"interrogator", l:"审讯官"},
  {v:"companion", l:"同行者"},
];
function questionLevelOpts(){
  const n = Math.max((story.levels || []).length, 4);

function pickFactOpts(){

function optionFields(){

    {k:"text", label:"选项文本", t:"area", rows:2,

    {k:"ending", label:"触发什么结局（可空）", t:"text",

    {k:"shake", label:"选完震屏的力度（0 = 不震）", t:"num",

  ];

    {k:"order", label:"出场序号（留空 = 按下面的先后）", t:"num", step:"1", blankDelete:true,

        + "留空就用它在本清单里的位置当序号，所以「一道都不填」= 顺序和现在一样。"
        + "★ 把某一轮需要的题都填满、并填上序号，就能**完全控制那一轮的出题顺序**"
        + "（比这一轮需要几道多填几道也行，多出来的会一起出）。"},
    {k:"speaker", label:"谁在问", t:"select", opts:()=>SPEAKER_OPTS},
    {k:"text", label:"题面", t:"area", rows:2},
    {k:"setup", label:"前置说明（可空）", t:"area", rows:2,
      hint:"盲区题用它交代「档案里没有这件事」。"},
    {k:"card", label:"来源档案卡（可空）", t:"select", opts:pickCardOpts,

    {k:"fact", label:"挂到哪条事实（可空）", t:"select", opts:pickFactOpts,
      hint:"挂了事实 → 选项用「某个版本」时参与跨关一致性检查。"},
    {k:"recall", label:"用作跨关复问", t:"bool",

    {k:"plant", label:"同行者种下的话（可空）", t:"area", rows:2},

    {k:"delay", label:"QTE 几秒后出现", t:"num", sub:"qte", step:"0.5",
      hint:"负数 = 用该类型的出厂默认（表情 2.5 秒 / 递话按间隔公式）。"},
    {k:"prompt", label:"QTE 上方的提示文字（可空）", t:"area", sub:"qte", rows:3,

    {k:"options", label:"选项（判定只看每项的「类型」）", t:"objlist",

// ---------- 搜索索引 ----------
function buildIndex(){
  index = [];
  const add = (v, path, where, what) => index.push({v, path, where, what:String(what || "")});
  (story.backgrounds || []).forEach((b, bi) => {
    const bv = {kind:"bg", index:bi};
    const bn = b.name || b.id;
    add(bv, "intro", bn + " · 开场介绍", b.intro || "");
    (b.levels || []).forEach((l, i) => add(bv, "levels/" + i, bn + " · 关卡" + (i + 1), (l.name || "") + " " + (l.derived_profile || "")));
    (b.cards || []).forEach((c, i) => add(bv, "cards/" + i, bn + " · 档案卡", c.topic + " " + c.text));
    // ★ 第二十九轮：题目改成统一 schema —— 题面在 text，候选回答在 options[]
    (b.questions || []).forEach((q, i) => add(bv, "questions/" + i, bn + " · 盘问题目",
      (q.text || q.q || "") + " " + (q.options || []).map(o => (o.text || "")).join(" ")));
    (b.companion_questions || []).forEach((cq, i) => add(bv, "companion_questions/" + i, bn + " · 同行者提问",
      cq.line + " " + cq.plant + " " + (cq.options || []).map(o => o.text).join(" ")));
    (b.blind_questions || []).forEach((bq, i) => add(bv, "blind_questions/" + i, bn + " · 盲区题",
      bq.q + " " + bq.setup + " " + bq.made_up + " " + bq.bluff + " " + bq.evade));
    (b.facts || []).forEach((f, i) => add(bv, "facts/" + i, bn + " · 事实 " + f.id,
      (f.prompts || []).join(" ") + " " + (f.values || []).map(v => v.label).join(" ")));
    (b.sms || []).forEach((t, i) => add(bv, "sms/" + i, bn + " · 短信 · " + t.contact,
      (t.messages || []).map(m => m.text).join(" ")));
    (b.interference_lines || []).forEach((s, i) => add(bv, "interference_lines/" + i, bn + " · 干扰台词", s));
  });
  (story.traits || []).forEach((t, i) => add({kind:"traits"}, "traits/" + i, "审问者性情 · " + t.name,
    t.tag + " " + t.desc + " " + t.hint + " " + t.bluff_note + " " + t.evade_note +
    " " + (t.memo || "") + " " + (t.like || "") + " " + (t.hate || "")));
  Object.keys(story.item_desc || {}).forEach(k => add({kind:"global"}, "item_desc/" + k, "衣物描述", story.item_desc[k]));
  Object.keys(story.clue_frame || {}).forEach(k => add({kind:"global"}, "clue_frame/" + k, "情报句式", story.clue_frame[k]));
  Object.keys(story.clue_sources || {}).forEach(k => add({kind:"global"}, "clue_sources/" + k, "情报来源", (story.clue_sources[k] || []).join(" ")));
  (story.photo_notes || []).forEach((s, i) => add({kind:"global"}, "photo_notes/" + i, "照片背面", s));

  // 玩法数值 / 界面文案 / 结局文案 —— 路径的第一段必须是区块的 key，
  // 这样 jumpTo 里的「展开这一节」才能对得上（foldSet 用的就是 navKey()/区块key）。
  const R = story.rules || {};
  rulesSections().forEach(sec => (sec.fields || []).forEach(f => {
    const val = R[f.k];
    add({kind:"rules"}, sec.key + "/" + f.k, "数值 · " + stripNum(sec.title) + " · " + (f.label || f.k),
      Array.isArray(val) ? val.join(" ") : String(val == null ? "" : val));
  }));
  const U = story.ui || {};
  uiSections().forEach(sec => (sec.fields || []).forEach(f => {
    const g = U[sec.seg] || {};
    const val = g[f.k];
    add({kind:"ui"}, sec.key + "/" + f.k, "界面文案 · " + stripNum(sec.title) + " · " + (f.label || f.k),
      Array.isArray(val) ? val.join(" ") : String(val == null ? "" : val));
  }));
  (story.backgrounds || []).forEach((b, bi) => {
    const bn = b.name || b.id || ("背景 " + (bi + 1));
    const E = b.endings || {};
    endingsSections().forEach(sec => (sec.fields || []).forEach(f => {
      add({kind:"endings", index:bi}, sec.key + "/" + f.k, bn + " · 结局 · " + (f.label || f.k),
        String(E[f.k] == null ? "" : E[f.k]));
    }));
  });
  // 第二十三轮那四段也要进搜索索引 —— 否则搜「强制」「QTE」找不到东西
  const lv = {kind:"levels"}, fo = {kind:"forced"}, qt = {kind:"qte"}, df = {kind:"defects"};
  (story.levels || []).forEach((l, i) => add(lv, "lv_list/" + i,
    "关卡" + (i + 1) + " · " + (l.name || ""),
    (l.name || "") + " " + (l.derived_profile || "") + " 反差要求 " + (l.contrast_req == null ? "" : l.contrast_req)));
  (story.forced_rules || []).forEach((e, i) => add(fo, "fr_list/" + i,
    "强制穿着 · 第 " + (i + 1) + " 关",
    (e.mode || "") + " " + (e.rules || []).map(r => ((r.items || []).map(id => itemLabel(id)).join("、"))).join(" | ")));
  (story.qte_plan || []).forEach((e, i) => add(qt, "qte_list/" + i,

function jumpTo(e){
  const parts = e.path.split("/");
  const secKey = parts[0];
  go(e.v);
  foldSet.delete(navKey() + "/" + secKey);
  for (let i = 1; i < parts.length; i += 2) openSet.add(navKey() + "/" + secKey + "/" + parts[i]);
  renderAll();
  const target = document.querySelector('[data-k="' + navKey() + "/" + secKey + (parts[1] !== undefined ? "/" + parts[1] : "") + '"]');
  if (target){
    target.scrollIntoView({block:"center"});
    target.style.outline = "2px solid var(--amber)";
    setTimeout(() => target.style.outline = "", 1600);
  }
}

// ★ 第四十一轮：删掉「一轮」时的**联动清理**。
//   用户口径：「删除关卡后只出现在对应关卡的题目也应自动删去」。
//   具体做三件事 ——
//     ① 把「固定给这一轮」的题目删掉（它们只属于这一轮，留着永远不会再出现）
//     ② 把「属于后面几轮」的题目整体往前挪一轮（否则它们同样永远出不来）
//     ③ 原貌预设里「逐轮指定」那一项同样删掉，后面几项往前挪
//   ★ 弹一次确认，把「会牵连到什么」列清楚 —— 这个操作只能靠 Ctrl+Z 撤销。
//   ★ 返回 false = 放弃这次删除（renderObjList 会照做）。
function cascadeDeleteRound(bg, idx){
  const qs = bg.questions || [];
  let doomed = 0, moved = 0;
  qs.forEach(q => {
    const lv = Number(q.level);
    if (lv === idx) doomed++;
    else if (lv > idx) moved++;
  });
  const tp = bg.true_presets || {};
  const byLv = Array.isArray(tp.by_level) ? tp.by_level : [];
  const hasPvHere = !!(byLv[idx] && byLv[idx].slots && Object.keys(byLv[idx].slots).length);
  let pvMoved = 0;
  for (let k = idx + 1; k < byLv.length; k++)
    if (byLv[k] && byLv[k].slots && Object.keys(byLv[k].slots).length) pvMoved++;

  const bits = [];
  if (doomed) bits.push("删掉 " + doomed + " 道只属于这一轮的题目");
  if (moved) bits.push("把 " + moved + " 道属于后面几轮的题目往前挪一轮");
  if (hasPvHere) bits.push("丢掉这一轮的原貌指定");
  if (pvMoved) bits.push("把后面几轮的原貌指定往前挪一轮");
  if (!bits.length) return true;               // 没有牵连，直接删

  if (!confirm("第 " + (idx + 1) + " 轮还有东西挂着：\n\n· " + bits.join("\n· ")
      + "\n\n继续删除这一轮？（删错了可以 Ctrl+Z 撤销）")) return false;

  // ① 题目
  if (bg.questions){
    const keep = [];
    bg.questions.forEach(q => {
      const lv = Number(q.level);
      if (lv === idx) return;                    // 只属于这一轮 → 删掉
      if (lv > idx) q.level = lv - 1;            // 后面的整体往前提一轮
      keep.push(q);
    });
    bg.questions.length = 0;
    for (const q of keep) bg.questions.push(q);
  }
  // ② 原貌预设的「逐轮指定」
  if (Array.isArray(tp.by_level)) tp.by_level.splice(idx, 1);
  return true;
}

function renderAll(){ buildNav(); renderMain(); renderStatus(); }

function renderMain(){
  const main = $("main"); main.innerHTML = "";
  // 校验面板永远挂在最上面 —— 改坏了当场看得见
  main.append(h("div", {id:"issues"}));
  renderIssues();

  if (view.kind === "home") return renderHome(main);
  if (view.kind === "bg"){
    const bg = bgOf();
    main.append(h("h1", {text:"🎬 " + (bg.name || bg.id || "背景")}));
    main.append(h("div", {class:"sub", text:(bg.venue || "") + "　·　审讯官：" + (bg.interrogator || "?") +
      "　·　你装成 " + (bg.cover_role || "?") + "，其实是 " + (bg.true_role || "?") +
      (bg.true_name ? "（" + bg.true_name + "）" : "")}));
    bgSections(bg).forEach(s => main.append(renderSection(s, navKey())));

    // ★ 第四十一轮：本局的流程覆写 —— 说明 + 本局的原貌（可逐轮不同）
    main.append(h("div", {class:"sec"},
      h("div", {class:"sechead"}, h("span", {class:"t", text:"⑦ 本局覆写 · 怎么读"})),
      h("div", {class:"secbody"}, h("div", {class:"help"},
        h("div", {}, "· 这一页里带「", h("b", {text:"⑥ 本局覆写"}), "」的几节，"
          + "**只对这一套背景生效**。每一局开局会随机抽一套背景，"
          + "所以「挂在背景上」就等于「每一局都能有不同的流程配置」。"),
        h("div", {}, "· ", h("b", {text:"一条都不写 = 用全局那套"}), "："
          + "在「🪜 关卡与轮数 / 👗 强制穿着 / ⏱ QTE 计划 / 🩹 身体缺陷 / 🎭 原貌」"
          + "那几页配的是**四套背景共用**的默认值；这里写了就以这里为准。"),
        h("div", {}, "· ", h("b", {text:"③ 本局几轮"}), "："
          + "**写几条就代表这一局打几轮**（想让某套背景只打 3 轮，就只写 3 条）。"
          + "每条里的「接受度 / 反差要求」留空 = 用全局那一轮的数值。"),
        h("div", {}, "· ", h("b", {text:"⑥ 本局覆写 · 原貌"}), "："
          + "可以给**每一轮**指定不同的原貌 —— 切到下一轮时原貌与情报一起换。"
          + "一套里只写几个槽位也算数，没写到的照旧随机抽。"),
        h("div", {}, "· 改坏了不用慌：顶部校验区会当场标红（缺陷 id 重复、"
          + "引用了不存在的衣物、轮数和题目对不上等），", h("code", {text:"Ctrl+Z"}),
          " 也能一路撤销回去。"),
      ))));

    // ★ 这一节的标题由 presetEditor 自己画（它还要显示「模式 / 哪一轮用哪一套」）
    main.append(h("div", {class:"sechead", style:"margin-top:14px"},
      h("span", {class:"t", text:"⑦ 本局覆写 · 原貌（逐轮）"})));
    presetEditor(main, bg.true_presets || (bg.true_presets = {}),
      ((bg.levels || []).length || (story.levels || []).length || 4),
      "bg:" + (bg.id || view.index));
    return;
  }
  if (view.kind === "traits"){
    main.append(h("h1", {text:"🎭 审问者性情"}));

    main.append(h("div", {class:"sub", text:"玩家看得到、但不是剧情的那部分字：按钮、提示条、答完题后的反馈句、玩法说明的每一段。剧情文本（题目 / 短信 / 开场介绍 / 卡司名）在「背景」那几页里。"}));
    main.append(h("div", {class:"sec"},
      h("div", {class:"sechead"}, h("span", {class:"t", text:"带占位符的字段别乱删"})),
      h("div", {class:"secbody"}, h("div", {class:"help"},
        h("div", {}, "· ", h("code", {text:"%s"}), " 是插一句话 / 一个名字，", h("code", {text:"%d"}), " 是插一个数字。"),

      ))));
    uiSections().forEach(s => main.append(renderSection(s, navKey())));

  if (view.kind === "endings"){    const bgs = story.backgrounds || [];

// ============================================================
//  第四十轮 · 服装数值编辑器（暴露度 / 接受度）
//
//  改的是 `story.item_overrides`：只写「与代码内置值不同」的那几件。
//  游戏启动时 ScenarioData 读完 story.json 就调
//  OutfitData.apply_item_overrides() 原地覆盖，所以改完存盘、重启游戏即生效。
//
//  ★ 这里**只开放 exposure 与 acceptance_req 两个字段**。
//    槽位 / 标签 / 贴图改了会让贴图与门控对不上，不在编辑器里放开。
// ============================================================
// 「代码内置值」—— 用来标出「这件被改过」并支持一键还原。
//   ★ 兜底：老版本的 story.json 里没有 base_values 段，此时退回 catalog.items 里
//     那一件的当前值（那种文件里本来也还没有任何覆写，所以两者相等）。
function baseValueOf(id, f){
  const bv = ((story.catalog || {}).base_values || {})[id];
  if (bv && bv[f] !== undefined) return Number(bv[f]);
  const it = catalogItems().find(x => x.id === id);
  return it && it[f] !== undefined ? Number(it[f]) : null;
}
// 当前生效值：覆写写了就用它，否则用内置值
function effValueOf(id, f){
  const ov = ((story.item_overrides || {})[id] || {});
  if (ov[f] !== undefined && ov[f] !== null) return Number(ov[f]);
  const b = baseValueOf(id, f);
  return b === null ? 0 : b;
}
function catalogItems(){ return ((story.catalog || {}).items || []); }

function renderItemsEditor(main){
  main.append(h("h1", {text:"👕 服装数值"}));
  main.append(h("div", {class:"sub", text:"改每一件衣服的**暴露度**与**接受度门槛**。只写「跟代码内置值不同」的那几件 —— 没改过的不会在 story.json 里留痕。"}));

  main.append(h("div", {class:"sec"},
    h("div", {class:"sechead"}, h("span", {class:"t", text:"怎么读"})),
    h("div", {class:"secbody"}, h("div", {class:"help"},
      h("div", {}, "· ", h("b", {text:"暴露度"}), "：这身穿出去有多扎眼。它跟全套其它件的暴露值**相加**，跟「本关上限」比大小。允许 −1 ~ 12。"),
      h("div", {}, "· ", h("b", {text:"接受度"}), "：穿它需要多高的接受度门槛（接受度每关涨，跨局保留）。允许 0 ~ 99。"),
      h("div", {}, "· 灰字是**代码内置值**（scripts/OutfitData.gd 里的 ITEMS_BASE），改过的那一行会标黄，点 ", h("code", {text:"↺"}), " 单独还原。"),
      h("div", {}, "· 顶上的 ", h("code", {text:"↺ 全部还原"}), " 会清空这一页的全部改动。"),
      h("div", {}, "· 改完按 ", h("code", {text:"Ctrl+S"}), " 存盘，重启游戏生效 —— 不需要重烘贴图、不需要重编译。"),
      h("div", {}, "· 下架的槽位（外袍 / 耳饰 / 手套 / 头饰 / 穿环）也列出来，但灰色显示 —— 改了暂时看不出效果，等恢复那一栏就会生效。"),
    ))));

  const ov = story.item_overrides || (story.item_overrides = {});
  const n = overriddenItemCount();
  const bar = h("div", {class:"sec"},
    h("div", {class:"sechead"},
      h("span", {class:"t", text:"改动清单"}),
      h("span", {class:"cnt", text:n + " 件已改"})),
    h("div", {class:"secbody"},
      h("div", {class:"row"},
        h("input", {id:"itemSearch", class:"in", placeholder:"搜物品名 / id …",
          oninput:()=>{ itemFilter.q = $("itemSearch").value.trim().toLowerCase(); renderMain(); }}),
        h("label", {class:"chk"},
          h("input", {type:"checkbox", checked: itemFilter.onlyChanged ? "checked" : null,
            onchange:(e)=>{ itemFilter.onlyChanged = e.target.checked; renderMain(); }}),
          " 只看改过的"),
        n ? h("button", {class:"btn danger", onclick:()=>{
            if (!confirm("把 " + n + " 件服装的改动全部还原成代码内置值？")) return;
            story.item_overrides = {}; commit("items_reset_all"); markDirty(); renderAll();
            toast("已还原全部服装数值");
          }}, "↺ 全部还原") : null,
      )));
  main.append(bar);

  // 按槽位分组渲染
  const slots = ((story.catalog || {}).slots || []);
  const names = ((story.catalog || {}).slot_names || {});
  const disabled = ((story.catalog || {}).disabled_slots || []);
  const manual = ((story.catalog || {}).manual_slots || []);
  const bySlot = {};
  catalogItems().forEach(it => { (bySlot[it.slot] = bySlot[it.slot] || []).push(it); });

  let shown = 0;
  slots.forEach(slot => {
    let list = (bySlot[slot] || []);
    if (itemFilter.onlyChanged) list = list.filter(it => ov[it.id] && Object.keys(ov[it.id]).length);
    if (itemFilter.q){
      const q = itemFilter.q;
      list = list.filter(it => (String(it.name).toLowerCase().includes(q)) || (String(it.id).toLowerCase().includes(q)));
    }
    if (!list.length) return;
    shown += list.length;
    const offNote = disabled.includes(slot) ? " ← 已下架" : (manual.includes(slot) ? " ← 只能手动装备" : "");
    const body = h("div", {class:"secbody"});
    const head = h("div", {class:"irow items ihead"},
      h("span", {class:"iname", text:"物品"}),
      h("span", {class:"inum", text:"暴露度"}),
      h("span", {class:"inum", text:"接受度"}),
      h("span", {class:"iact", text:""}));
    body.append(head);
    list.forEach(it => body.append(itemRow(it, ov)));
    main.append(h("div", {class:"sec" + (disabled.includes(slot) ? " off" : "")},
      h("div", {class:"sechead"},
        h("span", {class:"t", text:(names[slot] || slot)}),
        h("span", {class:"cnt", text:list.length + " 件" + offNote})),
      body));
  });
  if (!shown) main.append(h("div", {class:"sub", text:"（没有匹配的物品）"}));
}

function itemRow(it, ov){
  const id = it.id;
  const changed = !!(ov[id] && Object.keys(ov[id]).length);
  const row = h("div", {class:"irow items" + (changed ? " changed" : "")});
  row.append(h("span", {class:"iname"},
    h("b", {text: it.name || id}),
    h("span", {class:"hint", text:" " + id})));
  ["exposure", "acceptance_req"].forEach(f => {
    const base = baseValueOf(id, f);
    const cur = effValueOf(id, f);
    const cell = h("span", {class:"inum"});
    const inp = h("input", {type:"number", class:"in num", value:String(cur),
      min: f === "exposure" ? "-1" : "0", max: f === "exposure" ? "12" : "99"});
    inp.addEventListener("change", () => {
      const v = parseInt(inp.value, 10);
      if (isNaN(v)) { toast("请输入整数"); renderMain(); return; }
      setItemOverride(id, f, v);
    });
    cell.append(inp);
    if (base !== null && cur !== base){
      cell.append(h("span", {class:"hint", title:"代码内置值 " + base, text:" ⟵ 内置 " + base}));
    }
    row.append(cell);
  });
  // 还原按钮：只在这一行真的改过时才画
  const act = h("span", {class:"iact"});
  if (changed){
    act.append(h("button", {class:"btn tiny", title:"把这一件还原成代码内置值", onclick:()=>{
      delete story.item_overrides[id];
      if (!Object.keys(story.item_overrides).length) story.item_overrides = {};
      commit("item_revert_" + id); markDirty(); renderAll();
    }}, "↺"));
  }
  row.append(act);
  return row;
}

// 写入一件物品的覆写。★ 与内置值相同就**删掉**这个字段 —— 保持 story.json 干净，
// 也保证「没改过的东西不在文件里留痕」这条语义成立。
function setItemOverride(id, field, val){
  const bv = baseValueOf(id, field);
  const ov = story.item_overrides || (story.item_overrides = {});
  const rec = ov[id] || (ov[id] = {});
  if (bv !== null && Number(bv) === Number(val)) delete rec[field];
  else rec[field] = val;
  if (!Object.keys(rec).length) delete ov[id];
  if (!Object.keys(ov).length) story.item_overrides = {};
  commit("item_" + id + "_" + field); markDirty(); renderMain(); renderStatus();
}

// ============================================================
//  第四十轮 · 原貌编辑器
//
//  两块，都写进 `story.true_presets`：
//    · pool     —— 随机池：开局从这几套**整套**里随机抽一套
//    · by_level —— 按关覆写：第 i 关强制换成这一套（没配的关 = 不覆写）
//
//  两块都空 = 完全走原来的「逐槽位从 TRUE_POOL 随机抽」逻辑（默认就是这样）。
//  ★ 一套里**只写几件也算数** —— 没写到的槽位继续按老逻辑随机抽。
//    所以「只想钉死上衣和下装」这种用法是允许的。
// ============================================================
var presetMode = "pool";      // "pool" | "by_level"
var presetSel = 0;            // 当前正在编辑第几套（by_level 模式下 = 第几轮）
// ★ 第四十一轮：原貌编辑器现在有两处入口 —— 全局那套、以及**每套背景**那一套。
//   切页时若 scope 变了就把选中项归零，免得「在背景 B 里选了第 3 套」带到全局页去。
var presetScope = "global";
var itemFilter = { q:"", onlyChanged:false };

function autoSlots(){
  const c = story.catalog || {};
  const dis = c.disabled_slots || [];
  const man = c.manual_slots || [];
  return (c.active_slots || []).filter(s => !man.includes(s) && !dis.includes(s));
}
// 某槽位在该套里可选的物品（下架的槽位没有候选）
function itemsOfSlot(slot, includeDisabled){
  const c = story.catalog || {};
  const dis = c.disabled_slots || [];
  if (!includeDisabled && dis.includes(slot)) return [];
  return catalogItems().filter(it => it.slot === slot);
}
// 这一件在不在「A 的原貌池」里（编辑器给个 ★ 标记）
function inTruePool(slot, id){
  const tp = (((story.catalog || {}).true_pool) || {})[slot] || [];
  return tp.includes(id);
}

// ★ 第四十一轮：原貌编辑器的主体抽出来 —— 全局页与「每套背景」页共用它。
//   host      = {pool:[], by_level:[]} 那个对象（全局那份 / 某套背景那份）
//   levelCount= 要显示几轮（全局看关卡数；背景页看**本局几轮**）
//   scopeKey  = 用来区分「现在在编辑谁」，切页时把选中项归零
function presetEditor(main, host, levelCount, scopeKey){
  if (!host.pool) host.pool = [];
  if (!host.by_level) host.by_level = [];
  // 轮数变了就对齐（多了截掉、少了补 null）
  while (host.by_level.length < levelCount) host.by_level.push(null);
  if (host.by_level.length > levelCount) host.by_level.length = levelCount;
  if (presetScope !== scopeKey){ presetScope = scopeKey; presetSel = 0; }

  const pool = host.pool;
  const byLv = host.by_level;
  const configured = byLv.filter(x => x && x.slots && Object.keys(x.slots).length).length;

  main.append(h("div", {class:"sec"},
    h("div", {class:"sechead"}, h("span", {class:"t", text:"模式"})),
    h("div", {class:"secbody"},
      h("div", {class:"row"},
        h("button", {class:"btn" + (presetMode === "pool" ? " on" : ""),
          onclick:()=>{ presetMode = "pool"; presetSel = 0; renderMain(); }},
          "① 随机池（" + pool.length + " 套）"),
        h("button", {class:"btn" + (presetMode === "by_level" ? " on" : ""),
          onclick:()=>{ presetMode = "by_level"; presetSel = 0; renderMain(); }},
          "② 逐轮指定（" + configured + "/" + byLv.length + " 轮已配）"),
        h("span", {class:"hint", text: (presetSummaryOf(host) === "默认")
          ? "当前：完全走原来的随机抽法" : "当前：" + presetSummaryOf(host)}),
      ))));

  if (presetMode === "pool") renderPresetList(main, pool, "套", false);
  else renderPresetList(main, byLv, "轮", true);
}

// 一套预设的规模摘要（导航角标用全局那份；背景页里用 host 自己那份）
function presetSummaryOf(host){
  const pool = (host.pool || []).length;
  const lv = (host.by_level || []).filter(x => x && x.slots && Object.keys(x.slots).length).length;
  if (!pool && !lv) return "默认";
  const parts = [];
  if (pool) parts.push("池 " + pool + " 套");
  if (lv) parts.push("逐轮 " + lv + " 轮");
  return parts.join(" · ");
}

// 一列「套」：左边选，右边编辑选中的那一套
function renderPresetList(main, arr, unit, byLevel){
  const names = ((story.catalog || {}).slot_names || {});
  const listBox = h("div", {class:"secbody presetlist"});

  arr.forEach((e, i) => {
    const has = !!(e && e.slots && Object.keys(e.slots).length);
    const cnt = has ? Object.keys(e.slots).length : 0;
    const label = byLevel
      ? ("第 " + (i + 1) + " 轮" + (has ? "　" + (e.name || "") : ""))
      : ("套 " + (i + 1) + (e && e.name ? "　" + e.name : ""));
    listBox.append(h("div", {class:"navitem" + (presetSel === i ? " on" : "") + (has ? "" : " dim"),
      onclick:()=>{ presetSel = i; renderMain(); }},
      h("span", {text: label}),
      h("span", {class:"cnt", text: has ? (cnt + " 件") : "不覆写"})));
  });

  if (!byLevel){
    listBox.append(h("div", {class:"row"},
      h("button", {class:"btn", onclick:()=>{
        arr.push({name:"新的一套" + (arr.length + 1), slots:{}});
        presetSel = arr.length - 1; commit("preset_add"); markDirty(); renderAll();
      }}, "+ 加一套"),
      h("button", {class:"btn", onclick:()=>{
        if (!arr.length) { toast("还没有套可复制"); return; }
        const src = arr[presetSel] || {};
        arr.push({name:(src.name || "套") + " 副本", slots: JSON.parse(JSON.stringify(src.slots || {}))});
        presetSel = arr.length - 1; commit("preset_dup"); markDirty(); renderAll();
      }}, "复制当前这套"),
      h("button", {class:"btn danger", onclick:()=>{
        if (arr.length <= 1) { toast("至少留一套"); return; }
        if (!confirm("删掉「" + ((arr[presetSel] || {}).name || ("套 " + (presetSel + 1))) + "」？")) return;
        arr.splice(presetSel, 1); presetSel = Math.max(0, presetSel - 1);
        commit("preset_del"); markDirty(); renderAll();
      }}, "删掉这套"),
    ));
  } else {
    listBox.append(h("div", {class:"row"},
      h("button", {class:"btn", onclick:()=>{
        // 「关掉这一关的覆写」= 置回 null
        arr[presetSel] = null; commit("preset_level_clear"); markDirty(); renderAll();
        toast("第 " + (presetSel + 1) + " 轮改回「不覆写」");
      }}, "这一关改回「不覆写」"),
      h("button", {class:"btn", onclick:()=>{
        if (!arr[presetSel]) arr[presetSel] = {name:"第 " + (presetSel + 1) + " 轮", slots:{}};
        if (!arr[presetSel].slots) arr[presetSel].slots = {};
        // 一键塞满「原貌候选池里的第一件」—— 省得十几个槽位一个个点
        autoSlots().forEach(s => {
          const cand = (itemsOfSlot(s, false));
          const preferred = cand.filter(it => inTruePool(s, it.id));
          const pick = preferred[0] || cand[0];
          if (pick && !arr[presetSel].slots[s]) arr[presetSel].slots[s] = pick.id;
        });
        commit("preset_level_fill"); markDirty(); renderAll();
        toast("已按「原貌候选池」填满这一轮");
      }}, "按原貌池一键填满"),
    ));
  }

  main.append(h("div", {class:"sec"},
    h("div", {class:"sechead"},
      h("span", {class:"t", text: byLevel ? "哪一轮用哪一套" : "随机池里的套"}),
      h("span", {class:"cnt", text: arr.length + " " + unit})),
    listBox));

  // 右半：编辑选中的那一套
  const cur = arr[presetSel];
  if (!cur){
    main.append(h("div", {class:"sub", text: byLevel
      ? "第 " + (presetSel + 1) + " 轮目前是「不覆写」—— 它走随机池（池空则走原来的随机抽法）。点上面的按钮开始配。"
      : "这一套还没内容。"}));
    return;
  }
  if (!cur.slots) cur.slots = {};
  cur.name = cur.name || (byLevel ? ("第 " + (presetSel + 1) + " 关") : ("套 " + (presetSel + 1)));

  const card = h("div", {class:"sec"},
    h("div", {class:"sechead"},
      h("span", {class:"t", text:"名字"}),
      h("span", {class:"cnt", text: Object.keys(cur.slots).length + " / " + autoSlots().length + " 个槽位已指定"})),
    h("div", {class:"secbody"},
      h("div", {class:"row"},
        h("input", {class:"in", value: cur.name, placeholder:"给这一套起个名字（只影响编辑器显示）",
          onchange:(e)=>{ cur.name = e.target.value; commit("preset_name"); markDirty(); renderStatus(); }}),
        h("button", {class:"btn", onclick:()=>{ cur.slots = {}; commit("preset_clear"); markDirty(); renderAll(); }}, "清空这套"),
      )));
  main.append(card);

  const body = h("div", {class:"secbody"});
  body.append(h("div", {class:"irow picks ihead"},
    h("span", {class:"iname", text:"槽位"}),
    h("span", {class:"ipick", text:"这一套里穿什么"}),
    h("span", {class:"iact", text:""})));
  autoSlots().forEach(s => {
    const cand = itemsOfSlot(s, false);
    const sel = cur.slots[s];
    const row = h("div", {class:"irow picks" + (sel !== undefined ? " changed" : "")});
    row.append(h("span", {class:"iname"},
      h("b", {text: names[s] || s}),
      h("span", {class:"hint", text:" " + s})));
    const cell = h("span", {class:"ipick"});
    const opts = [h("option", {value:"", text:"（不指定 → 交给随机）"})];
    cand.forEach(it => opts.push(h("option", {value: it.id, selected: (it.id === sel ? "selected" : null),
      text: (it.name || it.id) + (inTruePool(s, it.id) ? "　★原貌池" : "")})));
    const selEl = h("select", {class:"in sel", onchange:(e)=>{
      const v = e.target.value;
      if (v === "") delete cur.slots[s]; else cur.slots[s] = v;
      commit("preset_slot_" + s); markDirty(); renderMain();
    }}, opts);
    cell.append(selEl);
    row.append(cell);

    const act = h("span", {class:"iact"});
    if (sel !== undefined){
      act.append(h("button", {class:"btn tiny", title:"改成「不指定」", onclick:()=>{
        delete cur.slots[s]; commit("preset_slot_clr"); markDirty(); renderAll();
      }}, "↺"));
    }
    row.append(act);
    body.append(row);
  });
  main.append(h("div", {class:"sec"},
    h("div", {class:"sechead"}, h("span", {class:"t", text:"这一套里穿什么"})),
    body));
}
